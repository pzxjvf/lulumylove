<style>

.menu-title{font-family:'Dancing Script',cursive;font-size:clamp(2.4rem,6vw,4rem);margin-bottom:6px;text-shadow:0 0 20px rgba(255,255,255,.5);text-align:center}
.menu-sub{color:#999;margin-bottom:22px;font-style:italic;text-align:center;max-width:640px}
.stage-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px;width:min(920px,100%)}
.stage-card{padding:16px 10px;background:#1a1a1a;border:3px solid #333;border-radius:10px;cursor:pointer;transition:.3s;text-align:center}

label.hard{color:#ffd166;font-weight:800;font-size:.9rem;cursor:pointer}

#ending h1{font-family:'Dancing Script',cursive;font-size:clamp(2.4rem,7vw,4.4rem);margin:0 0 14px;text-shadow:0 0 25px #c77dff}

@media(max-width:700px){#scene{padding:70px 100px 10px 6px}.inventory{width:76px}.inv-slot{width:52px;height:52px}.room{transform:scale(.7);transform-origin:top center}}

</style>

<body>

<script>
const LS_KEY='enigma_cantinho5_v1';
const DEF=()=>({unlocked:1,frag:{},notes:[],sec:0,hints:0,errors:0,hard:false});
function loadProgress(){try{const d=JSON.parse(localStorage.getItem(LS_KEY));if(d&&d.unlocked)return Object.assign(DEF(),d)}catch(e){}return DEF()}
const S={stage:0,tok:0,inv:[],sel:null,p:loadProgress(),muted:false,hintIdx:0,busy:false,done:false,kp:null};
const saveProgress=()=>{try{localStorage.setItem(LS_KEY,JSON.stringify(S.p))}catch(e){}};
const $id=id=>document.getElementById(id);
const sceneEl=$id('scene'),msgBox=$id('msgBox'),fade=$id('fade');
const $=(s,r=sceneEl)=>r.querySelector(s),$$=(s,r=sceneEl)=>[...r.querySelectorAll(s)];
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=rnd(0,i);[a[i],a[j]]=[a[j],a[i]]}return a}
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toUpperCase();

/* som */
let actx=null,drone=null;
function ac(){if(!actx){try{actx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}return actx}
function tone(f,dur=.15,type='sine',vol=.12,delay=0){
  if(S.muted)return;const c=ac();if(!c)return;if(c.state==='suspended')c.resume();
  const t=c.currentTime+delay,o=c.createOscillator(),g=c.createGain();
  o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur);
}
function startDrone(){const c=ac();if(!c)return;if(c.state==='suspended')c.resume();if(drone)return;const g=c.createGain();g.gain.value=S.muted?0:.025;g.connect(c.destination);[44,66,88.5].forEach(f=>{const o=c.createOscillator();o.type='sine';o.frequency.value=f;o.connect(g);o.start()});drone=g}
const sfx={click:()=>tone(300,.05,'square',.05),pick(){tone(660,.1,'triangle');tone(880,.15,'triangle',.1,.08)},
  ok(){[523,659,784,1047].forEach((f,i)=>tone(f,.25,'triangle',.12,i*.1))},bad(){tone(140,.3,'sawtooth',.1);navigator.vibrate&&navigator.vibrate(80)},
  creak(){tone(90,.5,'sawtooth',.06);tone(120,.4,'sawtooth',.05,.2)}};
function toggleMute(){S.muted=!S.muted;$id('muteBtn').textContent=S.muted?'🔇':'🔊';if(drone)drone.gain.value=S.muted?0:.025}
function burst(n=40){
  const g=$id('game'),w=g.clientWidth/2,h=g.clientHeight/2;
  for(let i=0;i<n;i++){const p=document.createElement('i');p.className='pt';p.style.cssText=`left:${w}px;top:${h}px;background:hsl(${rnd(0,360)},90%,60%)`;g.appendChild(p);
    const a=Math.random()*6.28,d=rnd(120,380);
    p.animate([{transform:'translate(0,0)',opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d+120}px) rotate(540deg)`,opacity:0}],{duration:rnd(800,1400),easing:'ease-out'}).onfinish=()=>p.remove()}
}
function shakeScene(){sceneEl.classList.remove('shake');void sceneEl.offsetWidth;sceneEl.classList.add('shake')}
let msgTimer;
function showMsg(t,ms=3000){msgBox.textContent=t;msgBox.classList.add('show');clearTimeout(msgTimer);msgTimer=setTimeout(()=>msgBox.classList.remove('show'),ms)}
function fail(msg){S.p.errors++;saveProgress();sfx.bad();shakeScene();showMsg(msg)}
function addNote(t){if(!S.p.notes.includes(t)){S.p.notes.push(t);saveProgress()}}
function openModal(html,onMount){const m=$id('modal');m.innerHTML=`<div class="modal-box">${html}<div style="margin-top:16px;text-align:center"><button class="btn" id="mclose">Fechar</button></div></div>`;m.style.display='flex';$id('mclose').onclick=closeModal;if(onMount)onMount(m.querySelector('.modal-box'))}
function closeModal(){$id('modal').style.display='none'}
function showNotebook(){if(!S.stage)return;const n=S.p.notes;openModal('<h2>📓 Caderno</h2>'+(n.length?n.map(t=>`<div class="note-item ${t.startsWith('Fragmento')?'frag':''}">${t}</div>`).join(''):'<div class="note-item">Ainda não há anotações.</div>'))}
addEventListener('keydown',e=>{
  if(e.key==='Escape')closeModal();
  else if(S.kp&&document.activeElement.tagName!=='INPUT'){if(e.key.startsWith('Arrow'))e.preventDefault();S.kp(e.key)}
});

/* inventário */
function addItem(id,icon){if(S.inv.find(i=>i.id===id))return;S.inv.push({id,icon});renderInv();sfx.pick();showMsg('Você obteve: '+id)}
function removeItem(id){S.inv=S.inv.filter(i=>i.id!==id);if(S.sel===id)S.sel=null;renderInv()}
function renderInv(){
  const el=$id('inventory');el.innerHTML='';
  for(let i=0;i<Math.max(4,S.inv.length);i++){
    const it=S.inv[i],d=document.createElement('div');d.className='inv-slot'+(it&&S.sel===it.id?' active':'');
    if(it){d.textContent=it.icon;d.title=it.id;d.onclick=()=>{sfx.click();S.sel=S.sel===it.id?null:it.id;renderInv();if(S.sel)showMsg('Selecionado: '+it.id,1800)}}
    el.appendChild(d);
  }
}

/* menu */
const ICONS=['🔧','💡','⚙️','🚰','🔁','📦','🔀','⛓️','🧰','📐','🔋','🎛️','🏗️','⚠️','📡','🏭','🛞','🔣','🤖','🪝','🔤','🪚','🩺','📝','🚇','🔲','🔠','🎓','🚪'];
function renderMenu(){
  const list=$id('stageList');list.innerHTML='';
  STAGES.forEach((st,i)=>{const n=i+1,locked=n>S.p.unlocked,done=n<S.p.unlocked,c=document.createElement('div');
    c.className='stage-card'+(locked?' locked':'')+(done?' done':'');
    c.innerHTML=`<div class="num">CAPÍTULO ${n}</div><div class="ico">${locked?'🔒':ICONS[i]}</div><div class="name">${st.nome}</div>`;
    if(!locked)c.onclick=()=>startStage(n);list.appendChild(c)});
  $id('hardChk').checked=S.p.hard;
  const cb=$id('contBtn');if(S.p.unlocked>1||S.p.sec>0){cb.style.display='inline-block';cb.textContent=S.p.done?'↻ Rever o capítulo '+STAGES.length:'▶ Continuar do capítulo '+Math.min(S.p.unlocked,STAGES.length)}else cb.style.display='none';
  $id('menuStats').textContent=`Tempo: ${fmt(S.p.sec)} · Dicas usadas: ${S.p.hints} · Erros: ${S.p.errors}`;
}
function continuar(){startStage(Math.min(S.p.unlocked,STAGES.length))}
function openMenu(){S.kp=null;renderMenu();$id('menu').style.display='flex'}
function setHard(v){S.p.hard=v;saveProgress()}
function doReset(){
  const h=S.p.hard;S.p=DEF();S.p.hard=h;S.inv=[];S.sel=null;S.stage=0;S.tok++;S.done=false;S.kp=null;S.hintIdx=0;
  sceneEl.innerHTML='';sceneEl.onpointermove=sceneEl.onpointerdown=null;sceneEl.style.touchAction='';
  $id('chTitle').textContent='';$id('progT').textContent='';$id('bar').firstChild.style.width='0%';renderInv();saveProgress();openMenu();
}
function resetProgress(){openModal('<h2>Reiniciar progresso?</h2><p>Capítulos, tempo, dicas, erros e anotações serão apagados.</p><div style="text-align:center"><button class="btn" id="rsOk">Sim, reiniciar</button></div>',b=>{b.querySelector('#rsOk').onclick=()=>{closeModal();doReset()}})}
function replay(){$id('ending').style.display='none';doReset()}
setInterval(()=>{
  const active=S.stage>0&&$id('menu').style.display==='none'&&$id('ending').style.display!=='flex';
  if(active){S.p.sec++;if(S.p.sec%5===0)saveProgress()}
  $id('timer').textContent='⏱ '+fmt(S.p.sec);
},1000);

async function startStage(n){
  if(S.busy)return;S.busy=true;ac();startDrone();
  try{
    fade.style.opacity=1;await wait(700);
    $id('menu').style.display='none';closeModal();
    S.stage=n;S.tok++;S.sel=null;S.hintIdx=0;S.done=false;S.kp=null;S.inv=[];
    sceneEl.innerHTML='';sceneEl.onpointermove=sceneEl.onpointerdown=null;sceneEl.style.touchAction='';
    const st=STAGES[n-1];
    $id('chTitle').textContent=`Capítulo ${n}: ${st.nome}`;
    $id('progT').textContent=`${n}/${STAGES.length}`;$id('bar').firstChild.style.width=((n-1)/STAGES.length*100)+'%';
    st.build(sceneEl);renderInv();
    $id('inN').textContent=`CAPÍTULO ${n}`;$id('inT').textContent=st.nome;$id('inS').textContent=st.story;
    const it=$id('intro');it.classList.remove('go');void it.offsetWidth;it.classList.add('go');
    fade.style.opacity=0;await wait(2200);it.classList.remove('go');
  }finally{S.busy=false;fade.style.opacity=0}
}
async function completeStage(n,o={}){
  if(S.done)return;S.done=true;
  if(o.frag!=null)S.p.frag[n]=o.frag;if(o.note)addNote(o.note);
  if(S.p.unlocked<n+1&&n<STAGES.length)S.p.unlocked=n+1;
  saveProgress();sfx.ok();burst();$id('bar').firstChild.style.width=(n/STAGES.length*100)+'%';
  await wait(2300);
  if(n<STAGES.length)startStage(n+1);else finish();
}
function showHint(){
  if(!S.stage)return;
  if(S.p.hard){showMsg('Modo Difícil: dicas desativadas.');return}
  const h=STAGES[S.stage-1].hints;S.p.hints++;saveProgress();
  showMsg('💡 '+h[Math.min(S.hintIdx,h.length-1)]+'  (−100 pontos)',5000);S.hintIdx++;
}

/* auxiliares */
const win=(n,msg,o)=>{showMsg(msg);completeStage(n,o)};
const fr=(l,t)=>({frag:l,note:`Fragmento ${t}: ${l}`});
function textQuiz(root,pre,items,done){
  let i=0;
  root.innerHTML=`<div class="paper">${pre}</div><div class="cipher" id="q" style="margin-top:16px"></div><div class="clock-ctrl"><input class="txt" id="a" maxlength="24" placeholder="resposta" autocomplete="off"><button class="btn" id="ok">Responder</button></div><div class="sub" id="qi"></div>`;
  const show=()=>{$('#q').innerHTML=items[i][0];$('#qi').textContent=`Pergunta ${i+1} de ${items.length}`;$('#a').value=''};
  const send=()=>{if(S.done)return;const a=norm($('#a').value);if(items[i][1].includes(a)){sfx.pick();if(++i>=items.length)done();else show()}else fail('Resposta incorreta.')};
  $('#ok').onclick=send;$('#a').onkeydown=e=>{if(e.key==='Enter')send()};show();
}
function pickQuiz(root,pre,rounds,done,cls='opt2'){
  let i=0;
  root.innerHTML=`<div class="paper">${pre}</div><div class="cipher" id="q" style="margin-top:16px"></div><div class="moons" id="o"></div><div class="sub" id="qi"></div>`;
  const show=()=>{const r=rounds[i];$('#q').innerHTML=r.q;$('#qi').textContent=`Rodada ${i+1} de ${rounds.length}`;
    $('#o').innerHTML=shuffle(r.o.map((h,k)=>[h,k===r.a])).map(x=>`<button class="btn ${cls}" data-ok="${x[1]?1:0}">${x[0]}</button>`).join('');
    $$('#o .btn').forEach(b=>b.onclick=()=>{if(S.done)return;sfx.click();if(b.dataset.ok==='1'){sfx.pick();if(++i>=rounds.length)done();else show()}else fail('Não é isso.')})};
  show();
}
function swapGame(root,pre,sol,render,done,cls='',valid){
  let order;do{order=shuffle(sol)}while(valid?valid(order):order.join()===sol.join());
  root.innerHTML=`<div class="paper">${pre}</div><div class="swap ${cls}" id="sw"></div><div class="clock-ctrl"><button class="btn" id="ok">Confirmar ordem</button></div>`;
  let pick=-1;
  const draw=()=>{$('#sw').innerHTML=order.map((k,i)=>`<div class="sitem ${pick===i?'up':''}" data-i="${i}">${render(k)}</div>`).join('');
    $$('.sitem').forEach(el=>el.onclick=()=>{const i=+el.dataset.i;sfx.click();if(pick<0)pick=i;else{if(pick!==i)[order[pick],order[i]]=[order[i],order[pick]];pick=-1}draw()})};
  draw();
  $('#ok').onclick=()=>{if(S.done)return;if(valid?valid(order):order.join()===sol.join())done();else fail('Ainda não está certo.')};
}
function pairGame(root,pre,pairs,done){
  const L=pairs.map((p,i)=>[i,p[0]]),R=shuffle(pairs.map((p,i)=>[i,p[1]])),ok=new Set();let sel=-1;
  root.innerHTML=`<div class="paper">${pre}</div><div class="pairs"><div class="pcol" id="pl"></div><div class="pcol" id="pr"></div></div>`;
  const draw=()=>{
    $('#pl').innerHTML=L.map(([i,h])=>`<button class="btn pb ${ok.has(i)?'okp':''} ${sel===i?'selp':''}" data-i="${i}" ${ok.has(i)?'disabled':''}>${h}</button>`).join('');
    $('#pr').innerHTML=R.map(([i,h])=>`<button class="btn pb ${ok.has(i)?'okp':''}" data-i="${i}" ${ok.has(i)?'disabled':''}>${h}</button>`).join('');
    $$('#pl .pb').forEach(b=>b.onclick=()=>{sfx.click();sel=+b.dataset.i;draw()});
    $$('#pr .pb').forEach(b=>b.onclick=()=>{if(S.done)return;if(sel<0){showMsg('Escolha primeiro algo do lado esquerdo.');return}sfx.click();
      if(+b.dataset.i===sel){ok.add(sel);sel=-1;sfx.pick();draw();if(ok.size===pairs.length)done()}else{sel=-1;fail('Esses dois não combinam.');draw()}});
  };draw();
}

const STAGES=[
/* 1 */
{nome:'A Oficina',story:'Uma oficina trancada por dentro. Não há energia, e a porta só obedece a um painel de interruptores.',

  $('#dr').onclick=()=>openModal('<h2>🔒 Painel da porta</h2><div class="moons" id="lk"></div><div class="clock-ctrl"><button class="btn" id="lkok">Abrir</button></div>',box=>{

    $('#lkok',box).onclick=()=>{if(v.every((x,i)=>x===(p[i]?0:1))){closeModal();$('#dr').classList.add('open');$('#dr').textContent='';sfx.creak();showMsg('A porta se abriu.');completeStage(1)}else fail('A porta não cede.')};

  });
 }},
/* 2 */
{nome:'Portas Lógicas',story:'Um circuito com interruptores e lâmpadas. Só existe uma combinação que acende todas.',
 hints:['E: só vale se os dois lados forem ligados. OU: vale se pelo menos um for. NÃO: inverte.','Teste a combinação e veja quantas lâmpadas acendem.','Procure uma lâmpada que exija poucas condições e fixe os interruptores dela primeiro.'],
 build(root){
  const n=S.p.hard?5:4,Lc=S.p.hard?4:3,V=['A','B','C','D','E'].slice(0,n);
  const lit=()=>{const v={t:'v',v:V[rnd(0,n-1)]};return rnd(0,2)?v:{t:'n',x:v}};
  const gate=()=>({t:rnd(0,1)?'a':'o',x:lit(),y:lit()});
  const form=()=>({t:rnd(0,1)?'a':'o',x:gate(),y:rnd(0,1)?gate():lit()});
  const ev=(f,a)=>f.t==='v'?a[f.v]:f.t==='n'?!ev(f.x,a):f.t==='a'?ev(f.x,a)&&ev(f.y,a):ev(f.x,a)||ev(f.y,a);
  const st=f=>f.t==='v'?f.v:f.t==='n'?'NÃO '+st(f.x):'('+st(f.x)+(f.t==='a'?' E ':' OU ')+st(f.y)+')';
  let F=[],good=false;
  for(let t=0;t<20000&&!good;t++){F=Array.from({length:Lc},form);let sol=0,zero=false;for(let m=0;m<(1<<n);m++){const a={};V.forEach((v,i)=>a[v]=!!((m>>i)&1));if(F.every(f=>ev(f,a))){sol++;if(m===0)zero=true}}good=sol===1&&!zero}
  if(!good)F=V.slice(0,Lc).map(v=>({t:'v',v}));
  const a={};V.forEach(v=>a[v]=false);
  root.innerHTML=`<div class="paper"><b>Quadro de circuitos</b><br>Escolha quais interruptores ficam ligados para acender TODAS as lâmpadas.</div><div class="bl" id="sw"></div><div style="margin-top:12px;display:flex;flex-direction:column;gap:6px;color:#fff;font-weight:800">${F.map((f,i)=>`<div><span class="lamp" id="l${i}"></span> Lâmpada ${i+1} = ${st(f)}</div>`).join('')}</div><div class="clock-ctrl"><button class="btn" id="ok">⚡ Ligar o circuito</button></div>`;
  const dw=()=>{$('#sw').innerHTML=V.map(v=>`<button class="btn sw" data-v="${v}">${v}: ${a[v]?'⬆ ligado':'⬇ desligado'}</button>`).join('');$$('#sw .btn').forEach(b=>b.onclick=()=>{sfx.click();a[b.dataset.v]=!a[b.dataset.v];dw()})};dw();
  $('#ok').onclick=()=>{if(S.done)return;let k=0;F.forEach((f,i)=>{const o=ev(f,a);$('#l'+i).classList.toggle('on',o);if(o)k++});
    if(k===Lc)win(2,'Todas as lâmpadas acenderam.');else fail(`Acenderam ${k} de ${Lc} lâmpadas.`)};
 }},
/* 3 */
{nome:'As Rodas Dentadas',story:'Um mecanismo de rodas dentadas travado. Você precisa prever como cada uma gira.',
 hints:['Rodas que se encostam giram em sentidos opostos.','Siga a cadeia uma roda de cada vez, alternando horário e anti-horário.','Três rodas em triângulo não conseguem girar: cada uma tenta ir contra a outra.'],
 build(root){pickQuiz(root,'<b>Mecanismo</b><br>Pense em como as rodas se empurram.',[
  {q:'<span style="font-size:.95rem;letter-spacing:0;font-family:Nunito">Quatro rodas dentadas em fila: A engrena com B, B com C, C com D. A gira no sentido horário. Quais giram no sentido ANTI-HORÁRIO?</span>',o:['B e D','A e C','B e C','Só D'],a:0},

  {q:'<span style="font-size:.95rem;letter-spacing:0;font-family:Nunito">Uma roda pequena engrena com uma roda grande. No mesmo tempo, qual dá mais voltas?</span>',o:['A pequena','A grande','As duas dão o mesmo número de voltas','Depende da cor'],a:0}],()=>win(3,'O mecanismo destravou.',fr('E','das Rodas')))}},
/* 4 */
{nome:'Os Canos',story:'A água precisa chegar da caixa à torneira, mas todos os canos foram montados virados.',
 hints:['Clique num cano para girá-lo um quarto de volta.','Comece pela entrada, à esquerda, e vá encaixando cano por cano.','Os canos azul-claros já recebem água. Falta ligar o resto até a torneira.'],
 build(root){
  const n=S.p.hard?6:5,D=[[-1,0],[0,1],[1,0],[0,-1]],GL={'02':'║','13':'═','12':'╔','23':'╗','01':'╚','03':'╝'};
  let path=null,cnt=0;
  const dfs=(p,vis)=>{if(++cnt>40000)return false;const[y,x]=p[p.length-1];if(y===n-1&&x===n-1)return p.length>=n*2+1;
    for(const d of shuffle([0,1,2,3])){const ny=y+D[d][0],nx=x+D[d][1],k=ny+','+nx;if(ny<0||nx<0||ny>=n||nx>=n||vis.has(k))continue;vis.add(k);p.push([ny,nx]);if(dfs(p,vis))return true;p.pop();vis.delete(k)}return false};
  for(let t=0;t<60&&!path;t++){cnt=0;const p=[[0,0]];if(dfs(p,new Set(['0,0'])))path=p}
  if(!path){path=[];for(let x=0;x<n;x++)path.push([0,x]);for(let y=1;y<n;y++)path.push([y,n-1])}
  const dirOf=(to,fr_)=>D.findIndex(d=>d[0]===to[0]-fr_[0]&&d[1]===to[1]-fr_[1]);
  const op=Array.from({length:n},()=>Array.from({length:n},()=>{const a=rnd(0,3);let b;do{b=rnd(0,3)}while(b===a);return[a,b]}));
  path.forEach(([y,x],i)=>{op[y][x]=[i===0?3:dirOf(path[i-1],[y,x]),i===path.length-1?1:dirOf(path[i+1],[y,x])]});
  const flow=()=>{const vis=[];let y=0,x=0,from=3;for(let s=0;s<n*n+2;s++){const o=op[y][x];if(!o.includes(from))return{ok:false,vis};vis.push(y*n+x);const ex=o[0]===from?o[1]:o[0],ny=y+D[ex][0],nx=x+D[ex][1];if(ny<0||nx<0||ny>=n||nx>=n)return{ok:y===n-1&&x===n-1&&ex===1,vis};y=ny;x=nx;from=(ex+2)%4}return{ok:false,vis}};
  do{for(let y=0;y<n;y++)for(let x=0;x<n;x++){const r=rnd(0,3);op[y][x]=op[y][x].map(d=>(d+r)%4)}}while(flow().ok);
  root.innerHTML=`<div class="paper"><b>Encanamento</b><br>Gire os canos até a água ligar 💧 à torneira 🚰.</div><div class="mgrid" id="mg" style="grid-template-columns:repeat(${n+2},50px);margin-top:14px"></div>`;
  const draw=()=>{
    const fl=new Set(flow().vis);let h='';
    for(let y=0;y<n;y++){h+=`<div class="pipe" style="background:transparent;border:0;cursor:default">${y===0?'💧':''}</div>`;
      for(let x=0;x<n;x++)h+=`<div class="pipe ${fl.has(y*n+x)?'flow':''}" data-y="${y}" data-x="${x}">${GL[[...op[y][x]].sort().join('')]}</div>`;
      h+=`<div class="pipe" style="background:transparent;border:0;cursor:default">${y===n-1?'🚰':''}</div>`}
    $('#mg').innerHTML=h;
    $$('#mg .pipe[data-y]').forEach(e=>e.onclick=()=>{if(S.done)return;sfx.click();const y=+e.dataset.y,x=+e.dataset.x;op[y][x]=op[y][x].map(d=>(d+1)%4);draw();if(flow().ok)win(4,'A água chegou à torneira.')});
  };draw();
 }},
/* 5 */
{nome:'Máquinas de Estados',story:'Três máquinas com regras próprias. Siga cada comando e diga em que estado ela termina.',

/* 6 */
{nome:'O Armazém',story:'Um armazém lotado. Só você e uma empilhadeira que empurra, mas nunca puxa.',
 hints:['Você só empurra caixas, nunca puxa. Cuidado com caixas coladas na parede.','Pense no caminho antes de empurrar: onde você precisa estar para empurrar cada caixa?','Se errar, use Desfazer ou Reiniciar.'],
 build(root){
  const W=7,H=6,nb=S.p.hard?4:3,DR=[[-1,0],[1,0],[0,-1],[0,1]];
  const mk=()=>{
    const wl=new Set();for(let x=0;x<W;x++){wl.add(x);wl.add((H-1)*W+x)}for(let y=0;y<H;y++){wl.add(y*W);wl.add(y*W+W-1)}
    const inner=[];for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++)inner.push(y*W+x);
    shuffle(inner).slice(0,3).forEach(c=>wl.add(c));
    const free=inner.filter(c=>!wl.has(c)),gs=shuffle(free).slice(0,nb+1),goals=gs.slice(0,nb),bx=new Set(goals);let p=gs[nb];
    for(let st=0;st<300;st++){const d=DR[rnd(0,3)],np=p+d[0]*W+d[1];if(wl.has(np)||bx.has(np))continue;const bc=p-d[0]*W-d[1];if(bx.has(bc)&&Math.random()<.6){bx.delete(bc);bx.add(p)}p=np}
    if(goals.every(g=>bx.has(g)))return null;
    return{wl,bx,goals,p};
  };
  let L=null;for(let t=0;t<400&&!L;t++)L=mk();
  if(!L){const wl=new Set();for(let x=0;x<W;x++){wl.add(x);wl.add((H-1)*W+x)}for(let y=0;y<H;y++){wl.add(y*W);wl.add(y*W+W-1)}L={wl,bx:new Set([2*W+2,2*W+3,2*W+4]),goals:[3*W+2,3*W+3,3*W+4],p:W+1}}
  const{wl,goals}=L;let bx=L.bx,p=L.p;const hist=[],start={bx:new Set(bx),p};
  root.innerHTML=`<div class="paper"><b>Armazém</b><br>Empurre as caixas 📦 até os alvos ⭕ (👷 é você). Só é possível empurrar, nunca puxar.</div><div class="mgrid" id="mg" style="grid-template-columns:repeat(${W},44px);margin-top:12px"></div><div class="clock-ctrl"><button class="btn sm" data-d="2">◀</button><button class="btn sm" data-d="0">▲</button><button class="btn sm" data-d="1">▼</button><button class="btn sm" data-d="3">▶</button><button class="btn sm" id="un">↶ Desfazer</button><button class="btn sm" id="rs">⟲ Reiniciar</button></div><div class="sub" id="mc"></div>`;
  const draw=()=>{$('#mg').innerHTML=[...Array(W*H).keys()].map(c=>`<div class="mcell fx" style="width:44px;height:44px;background:${wl.has(c)?'#3a3a4a':'#c9d6e6'};font-size:1.5rem">${wl.has(c)?'🧱':c===p?'👷':bx.has(c)?(goals.includes(c)?'✅':'📦'):goals.includes(c)?'⭕':''}</div>`).join('');$('#mc').textContent=`Caixas nos alvos: ${goals.filter(g=>bx.has(g)).length} de ${goals.length}`};
  const go=di=>{if(S.done)return;const d=DR[di],t=p+d[0]*W+d[1];if(wl.has(t))return;
    if(bx.has(t)){const t2=t+d[0]*W+d[1];if(wl.has(t2)||bx.has(t2)){tone(120,.1,'square',.06);return}hist.push({bx:new Set(bx),p});bx.delete(t);bx.add(t2);tone(260,.06,'square',.05)}else hist.push({bx:new Set(bx),p});
    p=t;draw();if(goals.every(g=>bx.has(g)))win(6,'Todas as caixas no lugar.',fr('N','do Armazém'))};
  $$('.btn[data-d]').forEach(b=>b.onclick=()=>go(+b.dataset.d));
  $('#un').onclick=()=>{if(S.done||!hist.length)return;const h=hist.pop();bx=h.bx;p=h.p;draw()};
  $('#rs').onclick=()=>{if(S.done)return;bx=new Set(start.bx);p=start.p;hist.length=0;draw()};
  S.kp=k=>{const m={ArrowUp:0,ArrowDown:1,ArrowLeft:2,ArrowRight:3}[k];if(m!=null)go(m)};
  draw();
 }},

{nome:'A Luz Morse',story:'Uma lâmpada pisca no escuro da fábrica. Curtas e longas formam palavras.',

  const W=shuffle(['VOLT','ELO','FIO','CABO','GIRO','EIXO','POLO']).slice(0,S.p.hard?4:3);

  const live=()=>T===S.tok&&!S.done;
  const play=async()=>{if(playing)return;playing=true;await wait(500);
    for(const c of W[i]){for(const s of MC[c]){if(!live()){playing=false;return}$('#lp')?.classList.add('on');tone(600,s==='.'?.2:.6,'sine',.12);await wait(s==='.'?250:700);$('#lp')?.classList.remove('on');await wait(250)}await wait(700)}
    playing=false};
  const show=()=>{$('#qi').textContent=`Palavra ${i+1} de ${W.length}`;$('#a').value='';play()};
  const send=()=>{if(S.done)return;const a=norm($('#a').value);if(a===W[i]){sfx.pick();if(++i>=W.length)win(15,'A mensagem foi recebida.',fr('E','da Luz'));else show()}else fail('Não é essa a palavra.')};
  $('#rp').onclick=play;$('#ok').onclick=send;$('#a').onkeydown=e=>{if(e.key==='Enter')send()};setTimeout(show,300);
 }},

/* 20 */
{nome:'O Guindaste',story:'Uma carga pesada balança no cabo. Segure-a no centro até o carregamento terminar.',
 hints:['Use ◀ e ▶ (ou as setas do teclado).','Toques pequenos e frequentes funcionam melhor que toques fortes.','Corrija antes de chegar perto da borda da zona verde.'],
 build(root){
  const T=S.tok,need=S.p.hard?10:8;let pos=50,vel=0,ok=0;
  root.innerHTML=`<div class="paper"><b>Guindaste</b><br>A carga balança sozinha. Mantenha-a na zona verde por ${need} segundos seguidos.</div><div class="pbar"><div class="pzone" style="left:35%;width:30%"></div><div class="pmark" id="pm" style="left:50%"></div></div><div class="clock-ctrl"><button class="btn" id="bl">◀</button><button class="btn" id="br">▶</button></div><div class="sub" id="gs"></div>`;
  const dir=d=>{if(!S.done)vel+=d*.6};
  $('#bl').onclick=()=>dir(-1);$('#br').onclick=()=>dir(1);
  S.kp=k=>{if(k==='ArrowLeft')dir(-1);else if(k==='ArrowRight')dir(1)};
  const iv=setInterval(()=>{
    if(T!==S.tok||S.done){clearInterval(iv);return}
    vel+=(pos-50)*.0011+(Math.random()-.5)*.12;vel*=.97;pos+=vel;
    if(pos<0||pos>100){pos=50;vel=0;ok=0;fail('A carga caiu! Recomeçando.')}
    else if(pos>=35&&pos<=65)ok+=.04;else ok=0;
    $('#pm').style.left=pos+'%';$('#gs').textContent=`Carga estável: ${ok.toFixed(1)}s de ${need}s`;
    if(ok>=need)win(20,'Carga posicionada com sucesso.');
  },40);
 }},
/* 21 */
{nome:'O Termo Técnico',story:'Uma palavra de cinco letras do vocabulário da oficina. Cada tentativa mostra o quanto você chegou perto.',
 hints:['Verde: letra certa no lugar certo. Amarelo: letra certa no lugar errado. Cinza: não tem.','As palavras são máquinas, peças ou materiais.','Comece com uma palavra com várias vogais.'],
 build(root){
  const W=['MOTOR','CABOS','CANOS','TORNO','VIGAS','POLIA','SOLDA','EIXOS','TUBOS','FORNO','GRUAS','CHAVE'],max=S.p.hard?5:6;let w,rows;
  root.innerHTML=`<div class="paper"><b>Termo técnico</b><br>Adivinhe a palavra de 5 letras. Verde: letra certa no lugar certo. Amarelo: letra certa, lugar errado. Cinza: não tem.</div><div id="tg" style="margin-top:12px"></div><div class="clock-ctrl"><input class="txt" id="a" maxlength="5" placeholder="5 letras" autocomplete="off"><button class="btn" id="ok">Tentar</button></div><div class="sub" id="ti"></div>`;
  const col=(g,w)=>{const r=Array(5).fill('#444'),left=[...w];[...g].forEach((c,i)=>{if(c===w[i]){r[i]='#2a9d8f';left[i]=null}});[...g].forEach((c,i)=>{if(r[i]==='#444'){const k=left.indexOf(c);if(k>=0){r[i]='#fcbf49';left[k]=null}}});return r};
  const draw=()=>{$('#tg').innerHTML=rows.map(g=>{const cs=col(g,w);return `<div class="trow">${[...g].map((c,i)=>`<div class="tl2" style="background:${cs[i]};color:${cs[i]==='#fcbf49'?'#000':'#fff'}">${c}</div>`).join('')}</div>`}).join('');$('#ti').textContent=`Tentativas: ${rows.length} de ${max}`};
  const nw=()=>{w=W[rnd(0,W.length-1)];rows=[];draw()};
  const send=()=>{if(S.done)return;const g=norm($('#a').value);if(g.length!==5){showMsg('Digite 5 letras.');return}$('#a').value='';rows.push(g);draw();
    if(g===w)win(21,'Era '+w+'!',fr('A','do Termo'));else if(rows.length>=max){fail('Acabaram as tentativas. Era '+w+'. Nova palavra.');setTimeout(nw,1200)}};
  $('#ok').onclick=send;$('#a').onkeydown=e=>{if(e.key==='Enter')send()};nw();
 }},
/* 22 */
{nome:'A Ferramenta Certa',story:'Cada serviço pede uma ferramenta. Usar a errada estraga a peça e pode machucar.',
 hints:['Pense no que cada tarefa exige: cortar, apertar, medir, furar.','Medir tensão elétrica pede um instrumento próprio.','O nível de bolha confere se algo está reto.'],
 build(root){pickQuiz(root,'<b>Serviços</b><br>Escolha a ferramenta ideal.',[
  {q:'<span style="font-size:1rem;letter-spacing:0;font-family:Nunito">Para apertar uma porca sextavada:</span>',o:['Chave inglesa','Martelo','Serrote','Régua'],a:0},
  {q:'<span style="font-size:1rem;letter-spacing:0;font-family:Nunito">Para conferir se uma prateleira está reta:</span>',o:['Nível de bolha','Trena','Alicate','Lixa'],a:0},
  {q:'<span style="font-size:1rem;letter-spacing:0;font-family:Nunito">Para furar uma parede:</span>',o:['Furadeira','Serra','Espátula','Esquadro'],a:0},
  {q:'<span style="font-size:1rem;letter-spacing:0;font-family:Nunito">Para cortar um cano de PVC:</span>',o:['Serra de arco','Martelo','Chave de fenda','Pá'],a:0},
  {q:'<span style="font-size:1rem;letter-spacing:0;font-family:Nunito">Para medir a tensão de uma tomada com segurança:</span>',o:['Multímetro','Paquímetro','Prumo','Torquímetro'],a:0}],()=>win(22,'Serviço concluído.'))}},
/* 23 */
{nome:'O Diagnóstico',story:'Defeitos clássicos de casa e de oficina. Todo bom engenheiro começa pelo mais provável.',
 hints:['Leia os sintomas com calma.','Comece pelo defeito mais simples e comum.','Primeiro verifique o que é seu: a lâmpada, a bateria, o vedante.'],
 build(root){pickQuiz(root,'<b>Diagnóstico</b><br>Qual é o defeito mais provável?',[
  {q:'<span style="font-size:1rem;letter-spacing:0;font-family:Nunito">O carro não liga, os faróis estão fracos e o motor só estala.</span>',o:['Bateria fraca','Pneu furado','Falta de água no limpador','Espelho quebrado'],a:0},
  {q:'<span style="font-size:1rem;letter-spacing:0;font-family:Nunito">A torneira da pia pinga, mesmo bem fechada. O que costuma estar gasto?</span>',o:['O vedante (borracha) interno','O cano da rua','A pia inteira','O ralo'],a:0},
  {q:'<span style="font-size:1rem;letter-spacing:0;font-family:Nunito">O ventilador liga, mas as pás não giram e há cheiro de queimado. O que provavelmente queimou?</span>',o:['O motor (as bobinas)','A tomada da casa','O botão de velocidade','As pás'],a:0},
  {q:'<span style="font-size:1rem;letter-spacing:0;font-family:Nunito">A lâmpada da sala não acende, mas as outras da casa funcionam. O que verificar primeiro?</span>',o:['Se a lâmpada queimou','O relógio de luz da rua','O disjuntor geral do prédio','A antena'],a:0}],()=>win(23,'O defeito foi consertado.'))}},
/* 24 */
{nome:'A Cruzadinha Técnica',story:'Palavras cruzadas pintadas na parede da oficina. A coluna dourada revela algo.',
 hints:['Leia as dicas uma por uma. Cada linha tem uma palavra de 5 letras.','Os quadrados dourados estão alinhados na mesma coluna.','Lendo os quadrados dourados de cima para baixo, aparece o nome de uma máquina.'],
 build(root){
  const R=[['MOTOR',2,'Máquina que transforma energia em movimento.'],['CABOS',3,'Fios grossos que levam energia.'],['FERRO',2,'Metal que enferruja quando molhado.'],['CANOS',2,'Tubos por onde passa a água.'],['TORNO',1,'Máquina que gira a peça para cortá-la.']];
  const mk=Math.max(...R.map(r=>r[1]));
  root.innerHTML=`<div class="paper"><b>Cruzadinha</b><br>Cada linha tem 5 letras. Os quadrados dourados estão alinhados na mesma coluna e formam uma palavra.</div><div style="margin-top:12px">${R.map((r,i)=>`<div class="crow"><div class="clue">${r[2]}</div>${'<div style="width:44px"></div>'.repeat(mk-r[1])}${[0,1,2,3,4].map(j=>`<input class="ci ${j===r[1]?'key':''}" maxlength="1" data-i="${i}" data-j="${j}" autocomplete="off">`).join('')}</div>`).join('')}</div><div class="clock-ctrl"><button class="btn" id="ok">Conferir</button></div>`;
  const ins=$$('.ci');
  ins.forEach((el,k)=>{
    el.oninput=()=>{el.value=norm(el.value).slice(0,1);if(el.value&&k<ins.length-1&&ins[k+1].dataset.i===el.dataset.i)ins[k+1].focus()};
    el.onkeydown=e=>{if(e.key==='Backspace'&&!el.value&&k>0&&ins[k-1].dataset.i===el.dataset.i)ins[k-1].focus()};
  });
  $('#ok').onclick=()=>{if(S.done)return;sfx.click();if(R.every((r,i)=>[0,1,2,3,4].map(j=>ins[i*5+j].value).join('')===r[0]))win(24,'A coluna dourada revelou: TORNO.',fr('G','da Cruzadinha'));else fail('Alguma linha está errada.')};
 }},
/* 25 */
{nome:'O Metrô',story:'O mapa do metrô da cidade industrial. Chegar mais rápido é uma questão de engenharia.',
 hints:['Anote em quais linhas cada estação aparece.','Baldeação é trocar de linha numa estação que pertence às duas.','Se uma estação fechou, você não pode passar por ela.'],
 build(root){
  const M='Linha Azul: Alfa — Beta — Gama — Delta.<br>Linha Verde: Gama — Épsilon — Zeta.<br>Linha Vermelha: Beta — Épsilon.';
  pickQuiz(root,`<b>Mapa do metrô</b><br>${M}`,[
   {q:'<span style="font-size:.95rem;letter-spacing:0;font-family:Nunito">De Alfa até Zeta com o MENOR número de baldeações, qual é o caminho?</span>',o:['Azul até Gama, troca para a Verde até Zeta','Azul até Beta, Vermelha até Épsilon, Verde até Zeta','Azul até Delta e depois Verde','Só pela Vermelha'],a:0},
   {q:'<span style="font-size:.95rem;letter-spacing:0;font-family:Nunito">De Beta até Zeta, qual caminho passa pelo MENOR número de trechos entre estações?</span>',o:['Vermelha até Épsilon, troca para a Verde até Zeta','Azul até Gama, troca para a Verde até Zeta','Azul até Delta, depois Verde','Só pela Azul'],a:0},
   {q:'<span style="font-size:.95rem;letter-spacing:0;font-family:Nunito">A estação Gama fechou. Ainda dá para ir de Alfa até Zeta?</span>',o:['Sim: Azul até Beta, Vermelha até Épsilon, Verde até Zeta','Não, Gama é a única ligação','Sim, pela Azul até Delta','Sim, direto pela Verde'],a:0}],()=>win(25,'Você chegou ao destino.'));
 }},
/* 26 */
{nome:'A Placa de Circuito',story:'Uma placa onde as trilhas de cada cor precisam ligar seus dois pontos, sem se cruzar.',
 hints:['Clique num ponto colorido e depois nas casas vizinhas para desenhar a trilha.','Trilhas de cores diferentes não podem se tocar. Clique numa casa da trilha para voltar até ela.','Resolva primeiro as cores com pontos mais próximos das bordas.'],
 build(root){
  const n=S.p.hard?6:5,k=S.p.hard?5:4,CL=['#e63946','#3a86ff','#2a9d8f','#fcbf49','#c77dff'];
  const gen=()=>{
    for(let t=0;t<2000;t++){
      const used=new Set(),ends=[];let bad=false;
      for(let c=0;c<k&&!bad;c++){
        const free=[...Array(n*n).keys()].filter(x=>!used.has(x));let got=false;
        for(let a=0;a<40&&!got;a++){
          let cur=free[rnd(0,free.length-1)];const p=[cur],tmp=new Set([cur]),Ln=rnd(3,6);
          while(p.length<Ln){const y=Math.floor(cur/n),x=cur%n,nb=[[y-1,x],[y+1,x],[y,x-1],[y,x+1]].filter(([a2,b2])=>a2>=0&&b2>=0&&a2<n&&b2<n).map(([a2,b2])=>a2*n+b2).filter(q=>!used.has(q)&&!tmp.has(q));if(!nb.length)break;cur=nb[rnd(0,nb.length-1)];p.push(cur);tmp.add(cur)}
          if(p.length>=3){p.forEach(q=>used.add(q));ends.push([p[0],p[p.length-1]]);got=true}
        }
        if(!got)bad=true;
      }
      if(!bad)return ends;
    }
    return null;
  };
  const ends=gen()||[[0,4],[5,9],[10,14],[15,19]];
  const K=ends.length,paths=ends.map(()=>[]),done=ends.map(()=>false);let active=-1;
  root.innerHTML=`<div class="paper"><b>Placa de circuito</b><br>Ligue os dois pontos de cada cor com uma trilha, sem cruzar as outras.</div><div class="mgrid" id="mg" style="grid-template-columns:repeat(${n},54px);margin-top:14px"></div><div class="sub" id="fs"></div>`;
  const ep=c=>ends.findIndex(e=>e.includes(c)),own=c=>paths.findIndex(p=>p.includes(c));
  const draw=()=>{
    $('#mg').innerHTML=[...Array(n*n).keys()].map(c=>{const o=own(c),e=ep(c);return `<div class="mcell" data-c="${c}" style="width:54px;height:54px;background:${o>=0?CL[o]+'88':'#16385f'};font-size:2rem;color:${e>=0?CL[e]:'#fff'}">${e>=0?'●':''}</div>`}).join('');
    $('#fs').textContent=`Trilhas completas: ${done.filter(Boolean).length} de ${K}`;
    $$('#mg .mcell').forEach(el=>el.onclick=()=>click(+el.dataset.c));
  };
  const click=c=>{
    if(S.done)return;const e=ep(c),o=own(c);
    if(active>=0){
      const P=paths[active],last=P[P.length-1];
      if(c===last)return;
      const adj=Math.abs(Math.floor(c/n)-Math.floor(last/n))+Math.abs(c%n-last%n)===1;
      if(P.includes(c)){P.length=P.indexOf(c)+1;done[active]=false;sfx.click();draw();return}
      if(adj&&o<0&&!(e>=0&&e!==active)){P.push(c);sfx.click();if(e===active){done[active]=true;active=-1;sfx.pick()}draw();if(done.every(Boolean))win(26,'A placa foi montada.',fr('E','da Placa'));return}
    }
    if(e>=0){active=e;paths[e]=[c];done[e]=false;sfx.click();draw();return}
    if(o>=0){active=o;paths[o].length=paths[o].indexOf(c)+1;done[o]=false;sfx.click();draw();return}
    showMsg('Comece por um ponto colorido.');
  };
  draw();
 }},
/* 27 */
{nome:'Peças Embaralhadas',story:'O estoque inteiro caiu no chão e as etiquetas se soltaram. Reorganize as letras de cada peça.',
 hints:['As palavras são peças, máquinas ou termos da oficina.','Separe vogais e consoantes.','Uma delas é o nome de um aparelho que faz a energia mudar de tensão.'],
 build(root){
  const W=shuffle(['ALAVANCA','TURBINA','GERADOR','ROLAMENTO','PARAFUSO','TRANSFORMADOR']).slice(0,S.p.hard?5:4);
  const scr=w=>{let s;do{s=shuffle([...w]).join('')}while(s===w);return[...s].join(' ')};
  textQuiz(root,'<b>Estoque</b><br>Reordene as letras para formar o nome da peça.',W.map(w=>[scr(w),[w]]),()=>win(27,'O estoque foi reorganizado.'));
 }},
/* 28 */
{nome:'O Teste do Engenheiro',story:'A prova final da oficina. Perguntas que um engenheiro responde de olhos fechados.',
 hints:['Pense nas máquinas simples: alavanca, polia, plano inclinado.','Na gangorra, quanto mais longe do apoio, mais força você faz.','Um para-raios oferece um caminho seguro até o solo.'],
 build(root){pickQuiz(root,'<b>Prova final</b><br>Escolha a melhor resposta.',[
  {q:'<span style="font-size:1rem;letter-spacing:0;font-family:Nunito">Qual máquina simples é uma rampa?</span>',o:['Plano inclinado','Alavanca','Polia','Roda e eixo'],a:0},
  {q:'<span style="font-size:1rem;letter-spacing:0;font-family:Nunito">Numa gangorra, para levantar uma pessoa pesada sendo leve, onde você deve sentar?</span>',o:['Longe do apoio','Colado ao apoio','Em cima do apoio','Em qualquer lugar'],a:0},
  {q:'<span style="font-size:1rem;letter-spacing:0;font-family:Nunito">O que uma polia fixa muda?</span>',o:['A direção da força','O peso do objeto','A cor da corda','A gravidade'],a:0},
  {q:'<span style="font-size:1rem;letter-spacing:0;font-family:Nunito">Qual destas fontes de energia NÃO é renovável?</span>',o:['Carvão mineral','Vento','Luz do sol','Água dos rios'],a:0},
  {q:'<span style="font-size:1rem;letter-spacing:0;font-family:Nunito">Para que serve um para-raios?</span>',o:['Levar a descarga elétrica do raio até o solo','Atrair nuvens','Produzir chuva','Esquentar o telhado'],a:0}],()=>win(28,'Aprovado com louvor.',fr('M','do Teste')))}},
/* 29 */
{nome:'A Peça Final',story:'No centro da oficina, uma máquina parada. Falta a peça que faz tudo girar.',
 hints:['Abra o Caderno: há dez fragmentos, cada um com uma letra.','Junte as letras na ordem em que os capítulos apareceram.','É a peça com dentes que transmite movimento, o coração de todo mecanismo.'],
 build(root){
  const code=Object.keys(S.p.frag).map(Number).sort((a,b)=>a-b).map(k=>S.p.frag[k]).join('');
  root.innerHTML=`<div class="paper"><b>A máquina parada</b><br>Cada vitória deixou uma letra no seu Caderno. Junte-as, na ordem em que as achou, e diga o nome da peça que falta.</div><div class="clock-ctrl"><input class="txt" id="a" maxlength="14" placeholder="a peça" autocomplete="off"><button class="btn" id="ok">Instalar</button></div><div class="sub">Abra o Caderno (📓) e leia os fragmentos.</div>`;
  const send=()=>{if(S.done)return;const a=norm($('#a').value);if(a==='ENGRENAGEM'||(code.length===10&&a===code))win(29,'A peça encaixou. A máquina inteira voltou a girar.');else fail('Não é essa a peça.')};
  $('#ok').onclick=send;$('#a').onkeydown=e=>{if(e.key==='Enter')send()};
 }}
];


function finish(){
  S.p.done=true;saveProgress();
  const pts=Math.max(0,8000-S.p.sec*2-S.p.hints*100-S.p.errors*15+(S.p.hard?500:0));
  const rank=pts>=6400?'S':pts>=4800?'A':pts>=2800?'B':'C';
  $id('endText').textContent='A máquina inteira voltou a girar, e a oficina se abriu para o céu. A Parte 5 do Enigma do Cantinho foi resolvida.'+(S.p.hard?' E no Modo Difícil!':'');
  $id('endRank').textContent=rank;
  $id('endStats').textContent=`Tempo ${fmt(S.p.sec)} · Dicas ${S.p.hints} · Erros ${S.p.errors} · ${pts} pontos`;
  $id('ending').style.display='flex';sfx.ok();burst(80);
  setTimeout(()=>[784,988,1175,1568].forEach((f,i)=>tone(f,.5,'triangle',.12,i*.15)),400);
}
renderMenu();
if(location.hash==='#continuar'&&!S.p.done&&(S.p.unlocked>1||S.p.sec>0))continuar();
</script>
