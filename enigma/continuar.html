<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>O Enigma do Cantinho — Continuar</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#1b221a,#000 75%);color:#fff;font-family:system-ui,sans-serif;text-align:center;padding:20px}
h1{font-size:2rem;margin:0 0 8px}
p{color:#aaa;margin:6px 0}
.lista{margin-top:22px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
a{color:#fff;text-decoration:none;border:2px solid #fff;border-radius:30px;padding:8px 16px;font-weight:700;font-size:.9rem}
a:hover{background:#fff;color:#000}
</style>
</head>
<body>
<div>
  <h1>Abrindo o enigma…</h1>
  <p id="m">Procurando onde você parou.</p>
  <div class="lista" id="l"></div>
</div>
<script>
/* Lê o progresso salvo de cada parte e abre direto a parte (e o capítulo) em que a pessoa está. */
const PARTES=[
  {k:'enigma_cantinho_v5',f:'enigma.html',n:'Parte 1'},
  {k:'enigma_cantinho2_v1',f:'enigma2.html',n:'Parte 2'},
  {k:'enigma_cantinho3_v1',f:'enigma3.html',n:'Parte 3'},
  {k:'enigma_cantinho4_v1',f:'enigma4.html',n:'Parte 4'},
  {k:'enigma_cantinho5_v1',f:'enigma5.html',n:'Parte 5'}
];
const ler=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
const temProgresso=d=>!!d&&(d.unlocked>1||d.sec>0);
let alvo=0;
PARTES.forEach((p,i)=>{if(temProgresso(ler(p.k)))alvo=i});
const d=ler(PARTES[alvo].k);
if(d&&d.done&&alvo<PARTES.length-1)alvo++;
const p=PARTES[alvo],pd=ler(p.k);
const retomando=temProgresso(pd)&&!pd.done;
const url=p.f+(retomando?'#continuar':'');
document.getElementById('m').textContent=retomando?'Voltando para a '+p.n+', capítulo '+Math.min(pd.unlocked,29)+'.':'Abrindo a '+p.n+'.';
document.getElementById('l').innerHTML=PARTES.map(x=>'<a href="'+x.f+'">'+x.n+'</a>').join('');
setTimeout(()=>location.replace(url),900);
</script>
</body>
</html>
