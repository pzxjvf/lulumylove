<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ranking do Amor 💜💙</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    min-height: 100%;
    font-family: "Nunito", sans-serif;
    background: linear-gradient(135deg, #ff0055 0%, #4a00e0 100%);
    color: #fff;
    overflow-x: hidden;
    position: relative;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(circle at 20% 20%, rgba(255,255,255,0.15) 0%, transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(255,255,255,0.1) 0%, transparent 40%);
    pointer-events: none;
    z-index: 0;
  }

  .hearts-bg {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
  }
  .hearts-bg span {
    position: absolute;
    font-size: 1.5rem;
    opacity: 0.15;
    animation: float 9s infinite linear;
  }
  @keyframes float {
    0% { transform: translateY(-10%) rotate(0deg); opacity: 0; }
    10% { opacity: 0.18; }
    90% { opacity: 0.18; }
    100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
  }

  .wrap {
    position: relative;
    z-index: 2;
    max-width: 920px;
    margin: 0 auto;
    padding: 30px 20px 60px;
    animation: fadeIn 0.7s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 26px;
    flex-wrap: wrap;
    gap: 12px;
  }
  .voltar {
    background: rgba(255,255,255,0.14);
    border: 2px solid rgba(255,255,255,0.35);
    color: #fff;
    padding: 10px 20px;
    border-radius: 50px;
    font-family: inherit;
    font-weight: 700;
    cursor: pointer;
    transition: 0.2s;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  .voltar:hover { transform: scale(1.04); background: rgba(255,255,255,0.22); }
  .jogar-btn {
    background: linear-gradient(135deg, #ff4081, #7c4dff);
    border: none;
    color: #fff;
    padding: 10px 22px;
    border-radius: 50px;
    font-family: inherit;
    font-weight: 800;
    cursor: pointer;
    transition: 0.2s;
    box-shadow: 0 6px 18px rgba(0,0,0,0.25);
  }
  .jogar-btn:hover { transform: translateY(-2px) scale(1.03); }

  h1 {
    text-align: center;
    font-weight: 900;
    font-size: clamp(1.8rem, 5vw, 2.6rem);
    margin-bottom: 6px;
    text-shadow: 0 2px 12px rgba(0,0,0,0.35);
  }
  .subtitulo {
    text-align: center;
    font-weight: 600;
    opacity: 0.9;
    margin-bottom: 30px;
    font-size: 1rem;
  }

  /* PLACAR VS */
  .placar-vs {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: stretch;
    gap: 18px;
    margin-bottom: 32px;
  }
  .p-card {
    padding: 22px 18px;
    border-radius: 24px;
    background: rgba(255,255,255,0.12);
    border: 3px solid rgba(255,255,255,0.25);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    text-align: center;
    position: relative;
    transition: 0.3s;
    box-shadow: 0 10px 28px rgba(0,0,0,0.22);
  }
  .p-card.lider {
    border-color: #ffd740;
    background: rgba(255,255,255,0.2);
    box-shadow:
      0 0 0 4px rgba(255,215,64,0.28),
      0 14px 34px rgba(0,0,0,0.3),
      inset 0 0 30px rgba(255,215,64,0.15);
    animation: glow 2.4s ease-in-out infinite alternate;
  }
  @keyframes glow {
    from { box-shadow: 0 0 0 4px rgba(255,215,64,0.22), 0 14px 34px rgba(0,0,0,0.3), inset 0 0 20px rgba(255,215,64,0.1); }
    to   { box-shadow: 0 0 0 5px rgba(255,215,64,0.4), 0 18px 44px rgba(0,0,0,0.35), inset 0 0 40px rgba(255,215,64,0.2); }
  }
  .p-card .crown {
    position: absolute;
    top: -18px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 1.9rem;
    filter: drop-shadow(0 3px 6px rgba(0,0,0,0.35));
    animation: bounce 1.4s ease-in-out infinite alternate;
  }
  @keyframes bounce {
    from { transform: translateX(-50%) translateY(0); }
    to { transform: translateX(-50%) translateY(-6px); }
  }
  .p-card .avatar {
    font-size: 3.4rem;
    margin-bottom: 6px;
  }
  .p-card .pnome {
    font-weight: 900;
    font-size: 1.3rem;
    letter-spacing: 0.5px;
  }
  .p-card.lulu .pnome { color: #e1bee7; }
  .p-card.joao .pnome { color: #bbdefb; }
  .p-card .plabel {
    font-size: 0.8rem;
    opacity: 0.85;
    font-weight: 600;
    margin-top: 12px;
    margin-bottom: 2px;
  }
  .p-card .ppts {
    font-weight: 900;
    font-size: clamp(2rem, 5vw, 2.8rem);
    text-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }
  .p-card .pcontagem {
    margin-top: 10px;
    font-size: 0.85rem;
    opacity: 0.85;
  }
  .p-card .pcontagem strong { color: #ffd740; }

  .vs-x {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .vs-x .circle {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: rgba(0,0,0,0.25);
    border: 3px solid rgba(255,255,255,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 900;
    font-size: 1.4rem;
    backdrop-filter: blur(6px);
    box-shadow: 0 8px 22px rgba(0,0,0,0.3);
  }
  .vs-x .circle span {
    background: linear-gradient(135deg, #ffd740, #ff4081);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  /* EMPATE */
  .empate {
    text-align: center;
    margin-bottom: 28px;
    background: rgba(255,215,64,0.18);
    border: 2px solid rgba(255,215,64,0.5);
    color: #fffbe6;
    padding: 10px 18px;
    border-radius: 50px;
    font-weight: 800;
    display: inline-block;
  }
  .empate-wrap { text-align: center; margin-bottom: 20px; }

  /* TÍTULOS SEÇÃO */
  .sec-title {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 900;
    font-size: 1.25rem;
    margin: 28px 4px 14px;
  }
  .sec-title::before, .sec-title::after {
    content: "";
    flex: 1;
    height: 2px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);
  }

  /* GERAL CONQUISTAS */
  .achv-geral {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 14px;
    margin-bottom: 10px;
  }
  .achv-g {
    background: rgba(255,255,255,0.12);
    border: 2px solid rgba(255,255,255,0.2);
    border-radius: 18px;
    padding: 16px 12px;
    text-align: center;
    backdrop-filter: blur(6px);
    transition: 0.25s;
  }
  .achv-g.locked { opacity: 0.55; }
  .achv-g .a-icon {
    font-size: 2.4rem;
    margin-bottom: 6px;
    filter: drop-shadow(0 3px 6px rgba(0,0,0,0.3));
  }
  .achv-g.locked .a-icon { filter: grayscale(1) opacity(0.4); }
  .achv-g .a-nome {
    font-weight: 800;
    font-size: 0.95rem;
    margin-bottom: 3px;
  }
  .achv-g .a-pts {
    font-size: 0.8rem;
    opacity: 0.85;
    margin-bottom: 10px;
  }
  .achv-g .a-quem {
    display: flex;
    gap: 6px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .badge {
    font-size: 0.72rem;
    font-weight: 800;
    padding: 3px 9px;
    border-radius: 50px;
    border: 1.5px solid rgba(255,255,255,0.3);
  }
  .badge.lulu { background: rgba(179,136,255,0.25); border-color: rgba(179,136,255,0.6); }
  .badge.joao { background: rgba(100,181,246,0.25); border-color: rgba(100,181,246,0.6); }
  .badge.lock { background: rgba(0,0,0,0.3); opacity: 0.65; }

  /* CONQUISTAS POR JOGADOR */
  .players-cols {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
  }
  @media (max-width: 620px) {
    .players-cols { grid-template-columns: 1fr; }
    .placar-vs { gap: 10px; }
    .p-card { padding: 16px 10px; }
    .p-card .avatar { font-size: 2.6rem; }
    .vs-x .circle { width: 56px; height: 56px; font-size: 1.1rem; }
  }

  .pcol {
    background: rgba(255,255,255,0.1);
    border-radius: 22px;
    padding: 18px 14px;
    border: 2px solid rgba(255,255,255,0.2);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .pcol-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
    padding-bottom: 10px;
    border-bottom: 2px dashed rgba(255,255,255,0.2);
  }
  .pcol-header .av { font-size: 1.8rem; }
  .pcol-header .nm { font-weight: 900; font-size: 1.15rem; }
  .pcol-header .cnt {
    margin-left: auto;
    font-weight: 800;
    font-size: 0.85rem;
    padding: 4px 10px;
    border-radius: 50px;
    background: rgba(0,0,0,0.25);
  }
  .achv-row {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .achv-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px;
    background: rgba(0,0,0,0.18);
    border-radius: 14px;
    border: 1.5px solid rgba(255,255,255,0.08);
  }
  .achv-item.unlocked {
    background: rgba(255,255,255,0.12);
    border-color: rgba(255,215,64,0.4);
  }
  .achv-item.lulu.unlocked { border-color: rgba(179,136,255,0.6); }
  .achv-item.joao.unlocked { border-color: rgba(100,181,246,0.6); }
  .achv-item .ic {
    font-size: 1.6rem;
    width: 38px;
    text-align: center;
  }
  .achv-item.locked .ic { filter: grayscale(1) opacity(0.4); }
  .achv-item .info { flex: 1; min-width: 0; }
  .achv-item .info .t {
    font-weight: 800;
    font-size: 0.92rem;
  }
  .achv-item .info .s {
    font-size: 0.75rem;
    opacity: 0.8;
  }
  .achv-item .st {
    font-weight: 900;
    font-size: 0.72rem;
    padding: 4px 9px;
    border-radius: 50px;
    background: rgba(0,0,0,0.3);
    white-space: nowrap;
  }
  .achv-item.unlocked .st {
    background: linear-gradient(135deg, #ffd740, #ff8a65);
    color: #3e2723;
  }

  /* AÇÕES */
  .acoes {
    margin-top: 32px;
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 12px;
  }
  .reset-btn {
    background: rgba(0,0,0,0.3);
    border: 2px solid rgba(255,82,82,0.6);
    color: #ffcdd2;
    padding: 10px 20px;
    border-radius: 50px;
    font-family: inherit;
    font-weight: 700;
    cursor: pointer;
    transition: 0.2s;
  }
  .reset-btn:hover {
    background: rgba(255,82,82,0.2);
    transform: scale(1.03);
  }

  /* TOASTS */
  .toasts {
    position: fixed;
    top: 18px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 999;
    display: flex;
    flex-direction: column;
    gap: 8px;
    pointer-events: none;
  }
  .toast {
    background: rgba(0,0,0,0.78);
    border: 1px solid rgba(255,255,255,0.3);
    padding: 10px 20px;
    border-radius: 50px;
    font-weight: 700;
    font-size: 0.9rem;
    animation: tin 0.3s ease, tout 0.4s ease 2.6s forwards;
    box-shadow: 0 8px 20px rgba(0,0,0,0.3);
  }
  @keyframes tin { from { opacity:0; transform: translateY(-10px);} to {opacity:1;transform:translateY(0);} }
  @keyframes tout { to { opacity:0; transform: translateY(-18px);} }
</style>
</head>
<body>

<div class="hearts-bg" id="heartsBg"></div>

<div class="wrap">
  <div class="topbar">
    <button class="voltar" onclick="window.location.href='menu.html'">← Menu</button>
    <div style="display:flex; gap:10px; flex-wrap:wrap;">
      <button class="voltar" style="background:rgba(255,215,64,0.18); border-color:rgba(255,215,64,0.5); color:#ffe082;" onclick="window.location.href='loja.html'">🛒 Ir pra Loja</button>
      <button class="jogar-btn" onclick="window.location.href='jogo/jogo.html'">🎮 Jogar Agora</button>
    </div>
  </div>

  <h1>🏆 Ranking do Amor 🏆</h1>
  <div class="subtitulo">Quem está colecionando mais corações? 💘</div>

  <!-- PLACAR VS -->
  <div class="placar-vs" id="placarVS"></div>
  <div class="empate-wrap" id="empateWrap" style="display:none;">
    <span class="empate">🤝 EMPATE! Vocês dois estão no mesmo nível de amor!</span>
  </div>

  <!-- CONQUISTAS GERAIS -->
  <div class="sec-title">🏅 Geral de Conquistas</div>
  <div class="achv-geral" id="achvGeral"></div>

  <!-- POR JOGADOR -->
  <div class="sec-title">💜💙 Conquistas por Jogador</div>
  <div class="players-cols" id="playersCols"></div>

  <div class="acoes">
    <button class="reset-btn" id="btnReset">🗑️ Zerar Tudo</button>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<script>
  /* ======================
     DADOS (MESMOS DO JOGO)
     ====================== */
  const LS_KEYS = {
    lulu: 'amor_high_lulu',
    joao: 'amor_high_joao',
    achLulu: 'amor_ach_lulu',
    achJoao: 'amor_ach_joao',
    coinsLulu: 'amor_coins_lulu',
    coinsJoao: 'amor_coins_joao',
    valesLulu: 'amor_vales_lulu',
    valesJoao: 'amor_vales_joao',
  };
  const ACHIEVEMENTS = [
    { id: 'a50', pts: 50,   emoji: '🌸', label: '50 pts',  nome: 'Primeiros Passos', desc: 'Os primeiros sinais de amor!' },
    { id: 'a100', pts: 100, emoji: '💌', label: '100 pts', nome: 'Carta de Amor',    desc: 'Uma carta já pode ser escrita 💜' },
    { id: 'a200', pts: 200, emoji: '💜', label: '200 pts', nome: 'Coração Roxo',     desc: 'A sintonia está perfeita!' },
    { id: 'a500', pts: 500, emoji: '🚀', label: '500 pts', nome: 'Muito Amor',       desc: 'Amor decolando nas alturas!' },
    { id: 'a1000', pts: 1000, emoji: '👑', label: '1000 pts', nome: 'Rei do Amor',  desc: 'Vocês são a realeza do amor! 👑' },
  ];

  function getHigh(k) { return parseInt(localStorage.getItem(k) || '0', 10); }
  function getArr(k) {
    try { return JSON.parse(localStorage.getItem(k) || '[]'); } catch { return []; }
  }
  const getAch = getArr;
  function contaVales(arr) {
    return arr.reduce((s,x) => s + (x.usado ? 0 : (x.qtd || 1)), 0);
  }
  function contaValesUsados(arr) {
    return arr.reduce((s,x) => s + (x.usado ? (x.qtd || 1) : 0), 0);
  }
  function toast(msg) {
    const st = document.getElementById('toasts');
    const d = document.createElement('div');
    d.className = 'toast';
    d.textContent = msg;
    st.appendChild(d);
    setTimeout(() => d.remove(), 3100);
  }

  /* Fundo com corações */
  (function makeHearts() {
    const emojis = ['💖','💜','💙','💘','💕','❤️'];
    const bg = document.getElementById('heartsBg');
    for (let i = 0; i < 14; i++) {
      const s = document.createElement('span');
      s.textContent = emojis[i % emojis.length];
      s.style.left = (Math.random()*100) + '%';
      s.style.animationDelay = (Math.random()*9).toFixed(2) + 's';
      s.style.animationDuration = (7 + Math.random()*6).toFixed(2) + 's';
      s.style.fontSize = (1 + Math.random()*1.6).toFixed(2) + 'rem';
      bg.appendChild(s);
    }
  })();

  /* ======================
     RENDER: PLACAR VS
     ====================== */
  function renderPlacar() {
    const hl = getHigh(LS_KEYS.lulu);
    const hj = getHigh(LS_KEYS.joao);
    const acl = getAch(LS_KEYS.achLulu);
    const acj = getAch(LS_KEYS.achJoao);
    const cl = getHigh(LS_KEYS.coinsLulu);
    const cj = getHigh(LS_KEYS.coinsJoao);
    const vl = getArr(LS_KEYS.valesLulu);
    const vj = getArr(LS_KEYS.valesJoao);
    const vlDisp = contaVales(vl);
    const vjDisp = contaVales(vj);

    let lider = null;
    if (hl !== hj) lider = hl > hj ? 'lulu' : 'joao';

    const empateEl = document.getElementById('empateWrap');
    empateEl.style.display = (hl === hj && hl > 0) ? 'block' : 'none';

    const card = (k, nome, emoji, hi, ach, coins, dispVales) => `
      <div class="p-card ${k} ${lider === k ? 'lider' : ''}">
        ${lider === k ? '<span class="crown">👑</span>' : ''}
        <div class="avatar">${emoji}</div>
        <div class="pnome">${nome}</div>
        <div class="plabel">🏆 Recorde</div>
        <div class="ppts">${hi}</div>
        <div class="pcontagem">
          🏅 Conquistas: <strong>${ach.length}/${ACHIEVEMENTS.length}</strong><br>
          💗 Saldo: <strong>${coins}</strong> • 🎁 Vales: <strong>${dispVales}</strong>
        </div>
      </div>
    `;

    document.getElementById('placarVS').innerHTML = `
      ${card('lulu', 'Lulu', '👩‍🦽', hl, acl, cl, vlDisp)}
      <div class="vs-x"><div class="circle"><span>VS</span></div></div>
      ${card('joao', 'João', '🧑', hj, acj, cj, vjDisp)}
    `;
  }

  /* ======================
     RENDER: CONQUISTAS GERAIS
     ====================== */
  function renderAchvGeral() {
    const al = getAch(LS_KEYS.achLulu);
    const aj = getAch(LS_KEYS.achJoao);
    const root = document.getElementById('achvGeral');
    root.innerHTML = '';
    ACHIEVEMENTS.forEach(a => {
      const lulTem = al.includes(a.id);
      const joaTem = aj.includes(a.id);
      const locked = !lulTem && !joaTem;
      const el = document.createElement('div');
      el.className = `achv-g ${locked ? 'locked' : ''}`;

      let badges = '';
      if (lulTem) badges += `<span class="badge lulu">👩‍🦽 Lulu</span>`;
      if (joaTem) badges += `<span class="badge joao">🧑 João</span>`;
      if (locked) badges = `<span class="badge lock">🔒 Ninguém</span>`;

      el.innerHTML = `
        <div class="a-icon">${a.emoji}</div>
        <div class="a-nome">${a.nome}</div>
        <div class="a-pts">${a.pts} pontos • ${a.label}</div>
        <div class="a-quem">${badges}</div>
      `;
      root.appendChild(el);
    });
  }

  /* ======================
     RENDER: POR JOGADOR
     ====================== */
  function coluna(pkey, nome, emoji, achClass) {
    const high = getHigh(LS_KEYS[pkey === 'lulu' ? 'lulu' : 'joao']);
    const ach = getAch(pkey === 'lulu' ? LS_KEYS.achLulu : LS_KEYS.achJoao);
    const coins = getHigh(pkey === 'lulu' ? LS_KEYS.coinsLulu : LS_KEYS.coinsJoao);
    const vales = getArr(pkey === 'lulu' ? LS_KEYS.valesLulu : LS_KEYS.valesJoao);
    const disp = contaVales(vales);
    const usados = contaValesUsados(vales);
    let rows = '';
    ACHIEVEMENTS.forEach(a => {
      const ok = ach.includes(a.id);
      rows += `
        <div class="achv-item ${achClass} ${ok ? 'unlocked' : 'locked'}">
          <div class="ic">${a.emoji}</div>
          <div class="info">
            <div class="t">${a.nome}</div>
            <div class="s">${a.pts} pontos • ${a.desc}</div>
          </div>
          <div class="st">${ok ? '✅ DESBLOQUEADO' : '🔒 ' + a.label}</div>
        </div>
      `;
    });
    return `
      <div class="pcol">
        <div class="pcol-header">
          <span class="av">${emoji}</span>
          <span class="nm">${nome}</span>
          <span class="cnt">🏆 ${high} • 💗 ${coins} • 🎁 ${disp}${usados>0?` / ✅${usados}`:''}</span>
        </div>
        <div class="achv-row">${rows}</div>
      </div>
    `;
  }
  function renderCols() {
    document.getElementById('playersCols').innerHTML =
      coluna('lulu', 'Lulu', '👩‍🦽', 'lulu') +
      coluna('joao', 'João', '🧑', 'joao');
  }

  /* ======================
     RESET
     ====================== */
  document.getElementById('btnReset').onclick = () => {
    if (!confirm('Tem certeza que quer ZERAR TUDO?\nIsso apagará recordes e conquistas de vocês dois!')) return;
    if (!confirm('Tem CERTEZA mesmo? Essa ação não pode ser desfeita! 💔')) return;

    Object.values(LS_KEYS).forEach(k => localStorage.removeItem(k));
    toast('✨ Dados zerados! Agora é começar de novo 💘');
    setTimeout(() => location.reload(), 800);
  };

  renderPlacar();
  renderAchvGeral();
  renderCols();
</script>
