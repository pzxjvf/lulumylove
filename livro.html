<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📖 O Livro da Nossa História</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Dancing+Script:wght@600;700&family=Nunito:wght@400;700&display=swap" rel="stylesheet">

<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(ellipse at top, #3a0ca3 0%, transparent 60%),
      radial-gradient(ellipse at bottom, #7209b7 0%, transparent 60%),
      linear-gradient(135deg, #1a0033 0%, #2d0050 50%, #0a0020 100%);
    font-family: "Cormorant Garamond", serif;
    color: #3a2817;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 15px 40px;
    overflow-x: hidden;
  }

  .top-bar {
    width: 100%;
    max-width: 1000px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    color: #fff;
    font-family: "Nunito", sans-serif;
    z-index: 10;
  }

  .back-btn {
    background: rgba(255,255,255,0.12);
    border: 1.5px solid rgba(255,255,255,0.3);
    color: white;
    padding: 8px 18px;
    border-radius: 25px;
    font-family: "Nunito", sans-serif;
    font-weight: 700;
    cursor: pointer;
    backdrop-filter: blur(10px);
    transition: 0.3s;
  }
  .back-btn:hover {
    background: rgba(255,255,255,0.22);
    transform: scale(1.05);
  }

  .page-indicator {
    background: rgba(255,255,255,0.12);
    border: 1.5px solid rgba(255,255,255,0.3);
    padding: 8px 16px;
    border-radius: 25px;
    font-weight: 700;
    backdrop-filter: blur(10px);
    font-size: 0.9em;
  }

  .book-title {
    text-align: center;
    margin-bottom: 18px;
    z-index: 5;
  }
  .book-title h1 {
    font-family: "Dancing Script", cursive;
    font-size: clamp(2rem, 5vw, 3.2rem);
    margin: 0;
    background: linear-gradient(135deg, #ffd700, #ff9ecf, #c77dff, #ffd700);
    background-size: 300% 300%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: shimmer 4s ease infinite;
    text-shadow: 0 0 30px rgba(199, 125, 255, 0.3);
  }
  .book-title p {
    color: rgba(255,255,255,0.75);
    font-family: "Nunito", sans-serif;
    font-size: 0.95em;
    margin: 5px 0 0;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  @keyframes shimmer {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }

  .book-wrapper {
    perspective: 2000px;
    width: 100%;
    max-width: 1000px;
    display: flex;
    justify-content: center;
  }

  .book {
    width: 100%;
    max-width: 960px;
    min-height: 620px;
    position: relative;
    transform-style: preserve-3d;
    display: flex;
    border-radius: 8px;
    box-shadow:
      0 0 0 2px #4a2c1a,
      0 0 0 5px #6b3f24,
      0 25px 60px rgba(0,0,0,0.6),
      0 15px 30px rgba(0,0,0,0.5),
      inset 0 0 80px rgba(139, 90, 43, 0.1);
    background: #6b3f24;
  }

  .book-spine {
    width: 28px;
    min-height: 620px;
    background: linear-gradient(to right,
      #3a1f10 0%,
      #5a3318 25%,
      #7a4a28 50%,
      #5a3318 75%,
      #3a1f10 100%);
    position: relative;
    box-shadow:
      inset -3px 0 6px rgba(0,0,0,0.5),
      inset 3px 0 6px rgba(255,255,255,0.05);
    z-index: 3;
    flex-shrink: 0;
  }
  .book-spine::before {
    content: "";
    position: absolute;
    top: 30px;
    left: 50%;
    transform: translateX(-50%);
    width: 16px;
    height: 40px;
    background: linear-gradient(180deg, #ffd700, #ff9ecf);
    border-radius: 2px;
    opacity: 0.9;
    box-shadow: 0 2px 5px rgba(0,0,0,0.3);
  }
  .book-spine::after {
    content: "";
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    width: 16px;
    height: 40px;
    background: linear-gradient(180deg, #ff9ecf, #c77dff);
    border-radius: 2px;
    opacity: 0.9;
    box-shadow: 0 2px 5px rgba(0,0,0,0.3);
  }

  .page {
    flex: 1;
    min-height: 620px;
    padding: 45px 50px 60px;
    position: relative;
    overflow-y: auto;
    max-height: 80vh;
  }

  .page-left {
    background:
      linear-gradient(to right,
        rgba(139, 90, 43, 0.08) 0%,
        transparent 5%,
        transparent 95%,
        rgba(139, 90, 43, 0.04) 100%),
      repeating-linear-gradient(
        180deg,
        transparent 0px,
        transparent 31px,
        rgba(139, 90, 43, 0.05) 31px,
        rgba(139, 90, 43, 0.05) 32px
      ),
      radial-gradient(ellipse at 20% 10%, rgba(255, 235, 180, 0.5), transparent 50%),
      radial-gradient(ellipse at 80% 90%, rgba(210, 170, 120, 0.2), transparent 50%),
      linear-gradient(180deg, #fdf6e3 0%, #f5ecd3 50%, #f3e7c9 100%);
    box-shadow: inset 15px 0 25px -15px rgba(0,0,0,0.2);
    border-right: 1px solid rgba(139, 90, 43, 0.15);
  }

  .page-right {
    background:
      linear-gradient(to left,
        rgba(139, 90, 43, 0.08) 0%,
        transparent 5%,
        transparent 95%,
        rgba(139, 90, 43, 0.04) 100%),
      repeating-linear-gradient(
        180deg,
        transparent 0px,
        transparent 31px,
        rgba(139, 90, 43, 0.05) 31px,
        rgba(139, 90, 43, 0.05) 32px
      ),
      radial-gradient(ellipse at 80% 10%, rgba(255, 235, 180, 0.5), transparent 50%),
      radial-gradient(ellipse at 20% 90%, rgba(210, 170, 120, 0.2), transparent 50%),
      linear-gradient(180deg, #fdf6e3 0%, #f5ecd3 50%, #f3e7c9 100%);
    box-shadow: inset -15px 0 25px -15px rgba(0,0,0,0.2);
    border-left: 1px solid rgba(139, 90, 43, 0.15);
  }

  .page::-webkit-scrollbar { width: 6px; }
  .page::-webkit-scrollbar-track { background: transparent; }
  .page::-webkit-scrollbar-thumb {
    background: rgba(139, 90, 43, 0.3);
    border-radius: 3px;
  }

  .page-number {
    position: absolute;
    bottom: 18px;
    font-family: "Cormorant Garamond", serif;
    font-style: italic;
    color: #6b4423;
    font-size: 0.95em;
    opacity: 0.8;
  }
  .page-left .page-number { left: 50px; }
  .page-right .page-number { right: 50px; }

  .page-corner {
    position: absolute;
    width: 40px;
    height: 40px;
    background: linear-gradient(135deg, rgba(0,0,0,0.05) 0%, transparent 50%);
  }
  .page-left .page-corner { top: 0; right: 0; border-top-right-radius: 8px; }
  .page-right .page-corner { top: 0; left: 0; border-top-left-radius: 8px; }

  .toc-entry {
    padding: 14px 18px;
    border-bottom: 1px dashed rgba(107, 68, 35, 0.3);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    cursor: pointer;
    transition: 0.25s;
    border-radius: 6px;
    margin-bottom: 4px;
    position: relative;
  }
  .toc-entry:hover:not(.locked) {
    background: rgba(255, 200, 150, 0.2);
    transform: translateX(4px);
  }

  .toc-entry.unlocked {
    background: linear-gradient(90deg, rgba(199, 125, 255, 0.12), transparent);
    border-left: 3px solid #c77dff;
  }
  .toc-entry.unlocked:hover {
    background: linear-gradient(90deg, rgba(199, 125, 255, 0.22), rgba(255, 158, 207, 0.1));
  }

  .toc-entry.locked {
    opacity: 0.6;
    cursor: not-allowed;
    filter: grayscale(0.3);
  }
  .toc-entry.locked::after {
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      45deg,
      transparent,
      transparent 10px,
      rgba(107, 68, 35, 0.04) 10px,
      rgba(107, 68, 35, 0.04) 20px
    );
    pointer-events: none;
    border-radius: 6px;
  }

  .toc-info { flex: 1; min-width: 0; }

  .toc-chapter {
    font-family: "Nunito", sans-serif;
    font-size: 0.75em;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: #8a5a2b;
    font-weight: 700;
    margin-bottom: 3px;
  }

  .toc-title {
    font-family: "Cormorant Garamond", serif;
    font-size: 1.25em;
    font-weight: 600;
    color: #3a2817;
    line-height: 1.2;
  }

  .toc-date {
    text-align: right;
    flex-shrink: 0;
  }
  .toc-date .date-label {
    font-family: "Nunito", sans-serif;
    font-size: 0.7em;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #8a5a2b;
    font-weight: 700;
  }
  .toc-date .date-value {
    font-family: "Cormorant Garamond", serif;
    font-size: 1.1em;
    font-weight: 600;
    color: #5a3a1a;
  }

  .lock-icon {
    font-size: 1.5em;
    margin-left: 8px;
    flex-shrink: 0;
  }

  .divider-dot {
    width: 6px;
    height: 6px;
    background: #c77dff;
    border-radius: 50%;
    margin: 0 4px;
  }

  .chapter-header {
    text-align: center;
    margin-bottom: 30px;
    padding-bottom: 20px;
    border-bottom: 2px double rgba(107, 68, 35, 0.3);
  }
  .chapter-header .ch-num {
    font-family: "Nunito", sans-serif;
    font-size: 0.75em;
    text-transform: uppercase;
    letter-spacing: 3px;
    color: #c77dff;
    font-weight: 700;
    margin-bottom: 6px;
  }
  .chapter-header h2 {
    font-family: "Dancing Script", cursive;
    font-size: 2.4em;
    margin: 0;
    color: #3a2817;
    line-height: 1.1;
  }
  .chapter-header .ch-date {
    margin-top: 10px;
    font-family: "Cormorant Garamond", serif;
    font-style: italic;
    color: #6b4423;
    font-size: 1.05em;
  }
  .chapter-header .ch-heart {
    margin-top: 12px;
    font-size: 1.3em;
    color: #c77dff;
    letter-spacing: 8px;
  }

  .chapter-content {
    font-family: "Cormorant Garamond", serif;
    font-size: 1.15em;
    line-height: 1.75;
    color: #2e1f10;
  }
  .chapter-content p {
    text-indent: 1.8em;
    margin: 0 0 14px;
    text-align: justify;
  }
  .chapter-content p:first-of-type::first-letter {
    font-family: "Dancing Script", cursive;
    font-size: 3.5em;
    float: left;
    line-height: 0.9;
    padding: 4px 8px 0 0;
    color: #c77dff;
    font-weight: 700;
  }

  .chapter-content .quote {
    border-left: 3px solid #c77dff;
    padding: 8px 20px;
    margin: 20px 0;
    font-style: italic;
    background: rgba(199, 125, 255, 0.08);
    border-radius: 0 8px 8px 0;
    color: #5a3a7a;
  }

  .editor-placeholder {
    font-family: "Nunito", sans-serif;
    background: rgba(199, 125, 255, 0.1);
    border: 2px dashed rgba(199, 125, 255, 0.5);
    padding: 14px 18px;
    border-radius: 12px;
    margin: 20px 0;
    text-align: center;
    font-size: 0.85em;
    color: #7a4a9a;
    cursor: pointer;
    transition: 0.3s;
  }
  .editor-placeholder:hover {
    background: rgba(199, 125, 255, 0.2);
    border-color: #c77dff;
    transform: scale(1.02);
  }

  .edit-area {
    width: 100%;
    min-height: 180px;
    padding: 15px;
    border: 2px solid #c77dff;
    border-radius: 10px;
    background: rgba(255, 250, 240, 0.9);
    font-family: "Cormorant Garamond", serif;
    font-size: 1.1em;
    line-height: 1.7;
    color: #2e1f10;
    resize: vertical;
    outline: none;
    transition: 0.3s;
  }
  .edit-area:focus {
    box-shadow: 0 0 0 3px rgba(199, 125, 255, 0.25);
    border-color: #9d4edd;
  }

  .edit-actions {
    display: flex;
    gap: 10px;
    margin-top: 12px;
    justify-content: flex-end;
  }
  .btn-edit {
    font-family: "Nunito", sans-serif;
    font-weight: 700;
    padding: 8px 18px;
    border-radius: 20px;
    border: none;
    cursor: pointer;
    transition: 0.25s;
    font-size: 0.9em;
  }
  .btn-save {
    background: linear-gradient(135deg, #c77dff, #9d4edd);
    color: white;
    box-shadow: 0 4px 12px rgba(157, 78, 221, 0.4);
  }
  .btn-save:hover { transform: scale(1.05); box-shadow: 0 6px 18px rgba(157, 78, 221, 0.5); }
  .btn-cancel {
    background: rgba(107, 68, 35, 0.1);
    color: #6b4423;
    border: 1.5px solid rgba(107, 68, 35, 0.3);
  }
  .btn-cancel:hover { background: rgba(107, 68, 35, 0.2); }

  .locked-cover {
    position: relative;
    min-height: 400px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
  }
  .locked-big {
    font-size: 5rem;
    margin-bottom: 20px;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.2));
    animation: float 3s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }
  .locked-title {
    font-family: "Dancing Script", cursive;
    font-size: 1.8em;
    color: #5a3a1a;
    margin-bottom: 10px;
  }
  .locked-subtitle {
    font-family: "Nunito", sans-serif;
    font-size: 0.85em;
    color: #8a5a2b;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 16px;
    font-weight: 700;
  }
  .countdown {
    background: linear-gradient(135deg, rgba(199, 125, 255, 0.15), rgba(255, 158, 207, 0.15));
    border: 2px dashed rgba(199, 125, 255, 0.5);
    padding: 16px 24px;
    border-radius: 16px;
    margin-top: 10px;
  }
  .countdown-label {
    font-family: "Nunito", sans-serif;
    font-size: 0.7em;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: #8a5a7a;
    font-weight: 700;
    margin-bottom: 6px;
  }
  .countdown-numbers {
    font-family: "Cormorant Garamond", serif;
    font-size: 1.6em;
    font-weight: 700;
    color: #6b3a9a;
  }
  .countdown-numbers span {
    display: inline-block;
    min-width: 55px;
  }
  .countdown-numbers small {
    display: block;
    font-family: "Nunito", sans-serif;
    font-size: 0.45em;
    color: #8a5a2b;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 700;
  }

  .back-toc {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: "Nunito", sans-serif;
    font-size: 0.8em;
    font-weight: 700;
    color: #c77dff;
    cursor: pointer;
    background: rgba(199, 125, 255, 0.1);
    padding: 6px 14px;
    border-radius: 18px;
    border: 1.5px solid rgba(199, 125, 255, 0.35);
    transition: 0.25s;
    margin-bottom: 15px;
  }
  .back-toc:hover {
    background: rgba(199, 125, 255, 0.2);
    transform: translateX(-3px);
  }

  .dedication {
    text-align: center;
    padding: 20px 0 30px;
  }
  .dedication-text {
    font-family: "Dancing Script", cursive;
    font-size: 1.4em;
    color: #6b4423;
    line-height: 1.5;
    font-style: italic;
  }
  .dedication-sign {
    margin-top: 15px;
    font-family: "Cormorant Garamond", serif;
    font-style: italic;
    color: #8a5a2b;
  }

  .toc-header {
    text-align: center;
    margin-bottom: 25px;
  }
  .toc-header h3 {
    font-family: "Dancing Script", cursive;
    font-size: 2em;
    margin: 0 0 6px;
    color: #3a2817;
  }
  .toc-header .toc-decor {
    color: #c77dff;
    letter-spacing: 10px;
    font-size: 0.9em;
  }

  .nav-arrows {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 12px;
    z-index: 20;
  }
  .nav-arrow {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: linear-gradient(135deg, #c77dff, #9d4edd);
    color: white;
    border: none;
    cursor: pointer;
    font-size: 1.3em;
    box-shadow: 0 6px 18px rgba(157, 78, 221, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: 0.25s;
  }
  .nav-arrow:hover:not(:disabled) { transform: scale(1.1); }
  .nav-arrow:disabled {
    opacity: 0.35;
    cursor: not-allowed;
    box-shadow: none;
  }

  .toast {
    position: fixed;
    top: 30px;
    right: 30px;
    background: linear-gradient(135deg, #38b000, #7b2cbf);
    color: white;
    padding: 14px 24px;
    border-radius: 16px;
    font-family: "Nunito", sans-serif;
    font-weight: 700;
    box-shadow: 0 8px 24px rgba(0,0,0,0.35);
    z-index: 9999;
    animation: toastIn 0.4s ease forwards;
    display: none;
    max-width: 340px;
    line-height: 1.5;
    white-space: pre-line;
  }
  @keyframes toastIn {
    from { opacity: 0; transform: translateX(30px); }
    to { opacity: 1; transform: translateX(0); }
  }
  @keyframes toastOut {
    to { opacity: 0; transform: translateX(30px); }
  }

  .author-badge {
    font-family: "Nunito", sans-serif;
    font-size: 0.75em;
    font-weight: 700;
    background: linear-gradient(135deg, #ffd700, #ff9ecf);
    color: #3a1f50;
    padding: 6px 12px;
    border-radius: 16px;
    cursor: pointer;
    transition: 0.25s;
    border: 1.5px solid rgba(255,255,255,0.4);
    user-select: none;
    white-space: nowrap;
  }
  .author-badge:hover {
    transform: scale(1.06);
    box-shadow: 0 4px 12px rgba(255, 158, 207, 0.5);
  }

  .bookmark-ribbon {
    position: absolute;
    top: -4px;
    right: 32px;
    width: 26px;
    height: 70px;
    background: linear-gradient(180deg, #ff4d6d 0%, #c9184a 100%);
    box-shadow:
      0 2px 6px rgba(201, 24, 74, 0.45),
      inset 0 0 0 1px rgba(255,255,255,0.2);
    z-index: 6;
    cursor: pointer;
    transition: transform 0.35s cubic-bezier(.3,1.5,.6,1), top 0.3s;
  }
  .bookmark-ribbon::before {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: -10px;
    height: 0;
    border-left: 13px solid transparent;
    border-right: 13px solid transparent;
    border-top: 12px solid #c9184a;
  }
  .bookmark-ribbon::after {
    content: "💖";
    position: absolute;
    left: 50%;
    top: 14px;
    transform: translateX(-50%);
    font-size: 0.85em;
    filter: drop-shadow(0 1px 1px rgba(0,0,0,0.2));
  }
  .bookmark-ribbon.retracted {
    top: -66px;
  }
  .bookmark-ribbon:hover:not(.retracted) {
    transform: translateY(-2px) scale(1.03);
  }

  .chapter-content p,
  .chapter-content .quote {
    position: relative;
    transition: background 0.25s, box-shadow 0.25s, transform 0.25s;
    border-radius: 6px;
  }

  .marked-text {
    background: linear-gradient(180deg, rgba(199, 125, 255, 0.18) 0%, rgba(199, 125, 255, 0.38) 100%);
    border-radius: 4px;
    box-shadow: inset 0 -2px 0 0 rgba(157, 78, 221, 0.5);
    padding: 1px 2px;
    color: #2e104a;
    cursor: pointer;
    transition: background 0.2s, box-shadow 0.2s;
    position: relative;
  }
  .marked-text:hover {
    background: linear-gradient(180deg, rgba(199, 125, 255, 0.3) 0%, rgba(199, 125, 255, 0.52) 100%);
    box-shadow: inset 0 -2px 0 0 #7b2cbf, 0 2px 8px rgba(199,125,255,0.25);
  }
  .marked-text::after {
    content: "💖";
    position: absolute;
    top: -10px;
    right: -4px;
    font-size: 0.65em;
    opacity: 0;
    transform: translateY(2px);
    transition: opacity 0.2s, transform 0.2s;
    filter: drop-shadow(0 1px 2px rgba(123, 44, 191, 0.4));
  }
  .marked-text:hover::after {
    opacity: 1;
    transform: translateY(0);
  }

  .mark-tooltip {
    position: fixed;
    z-index: 10000;
    background: linear-gradient(135deg, #c77dff 0%, #9d4edd 50%, #7b2cbf 100%);
    color: white;
    font-family: "Nunito", sans-serif;
    font-weight: 700;
    font-size: 0.82em;
    padding: 10px 18px;
    border-radius: 22px;

<script>
/* =========================================================
   🌟 AREA PARA EDITAR O LIVRO 🌟
   Tudo que for alterado aqui sera publicado para ela quando
   voce subir o site (Netlify). Basta editar e dar deploy!
   =========================================================
   Campos de cada capitulo:
   - num:        "Capitulo I", "Capitulo II"...
   - title:      Titulo bonito do capitulo
   - date:       Data visual (ex: "29 de Janeiro de 2023")
   - unlockDate: Quando desbloqueia ("YYYY-MM-DDTHH:mm:ss")
                 Deixe null para liberar agora
   - unlocked:   true = ja esta liberado | false = cadeado
   - content:    A historia (pule linhas com Enter)
   ========================================================= */

const LIVRO_CONFIG = {
  tituloGeral:  "O Livro da Nossa Historia",
  subtituloGeral: "✨ Cada capitulo, um pedaco do nosso amor ✨",
};

const defaultChapters = [

  /* ========== CAPITULO 1 ========== */
  {
    id: 1,
    num: "Capitulo I",
    title: "O Dia em que Tudo Comecou",
    date: "29 de Janeiro de 2023",
    unlockDate: null,
    unlocked: true,
    content:
`Eu não sabia que aquele domingo seria importante.

Na verdade, eu estava ocupado demais comemorando.

Tinha acabado de chegar da casa da minha irmã e meu time tinha acabado de ser campeão da Supercopa do Brasil. Eu estava eufórico. Daqueles níveis de euforia em que qualquer pessoa razoável provavelmente recomendaria água, alguns minutos de silêncio e, talvez, uma avaliação sobre o quanto de futebol era saudável para um ser humano.

Mas eu não queria água.

Eu queria comemorar.

E, naquele momento, eu sinceramente achava que nada conseguiria deixar aquele domingo melhor.

Eu estava errado.

O celular vibrou.

Era uma mensagem de uma antiga amiga.

Nada muito extraordinário. Pelo menos, não naquele primeiro segundo.

Ela perguntou se eu queria conhecer uma garota.

Uma garota.

Amiga dela.

Eu poderia simplesmente ter respondido que sim ou não, mas havia um pequeno detalhe: eu já sabia quem ela era.

Não conhecia de verdade. Não ainda.

Mas já tinha reparado nela algumas vezes.

E, para ser completamente honesto, ela era facilmente a garota mais bonita do grupo.

Eu já tinha olhado algumas fotos dela, mas ninguém sabia e eu disfarcei bem.

Só que eu não fazia ideia se ela teria qualquer interesse em me conhecer.

Então, quando minha amiga apareceu perguntando se eu queria conhecê-la, minha primeira reação provavelmente foi uma mistura bastante específica de curiosidade, surpresa e aquele pequeno pensamento inconveniente que surge quando alguma coisa que você queria, mas não tinha coragem de admitir que queria, aparece de repente na sua frente.

Foi então que ela perguntou se eu teria algum problema pelo fato de a garota ser cadeirante.

Ela explicou que ela não tinha movimento nos pés.

Na época, nem a própria melhor amiga conseguia explicar direito qual era a condição dela ou quais eram, de fato, as limitações.

E, sinceramente?

Aquilo nunca foi um problema para mim.

Respondi simplesmente:

"Sim. Nunca tive problema com isso."

Era uma resposta simples.

Porque, para mim, realmente era.

Não havia uma grande reflexão por trás. Não havia uma lista mental de motivos. Eu só queria conhecê-la.

Foi então que minha amiga mandou um print.

E foi aí que meu ego resolveu participar da conversa.

No print, ela tinha perguntado quem eu era.

A resposta dela foi:

"Como assim? Ele é bonito pra cacete."

Eu ri.

Mas ri daquele jeito que a gente tenta esconder mesmo quando está sozinho.

Porque, obviamente, eu tinha gostado.

E ela ainda completou, em tom de ameaça:

"Não manda isso pra ele, senão viajo só pra te bater."

Bom...

Ela tinha acabado de me chamar de bonito.

Não era exatamente o momento de questionar os métodos de segurança daquele grupo de amigas.

Minha amiga começou então a contar mais sobre mim.

Falou da minha personalidade, de como eu era, das coisas que eu gostava e, provavelmente, de várias outras informações que eu preferia ter revisado antes que fossem entregues para uma garota que eu queria impressionar.

Em algum momento, ela disse:

"Gosto de pessoas assim."

E talvez tenha sido ali que alguma coisa começou.

Não a história inteira.

Não ainda.

Mas a ponte estava construída.

Só faltava atravessar.

---

Pouco depois, minha amiga me mandou o contato dela.

E eu fiquei olhando para aquele número.

Porque, aparentemente, conseguir o contato da garota que você acha bonita é muito mais fácil do que descobrir o que diabos você deveria escrever depois que consegue.

Eu queria fazer diferente.

Queria chegar de um jeito que ela nunca tivesse visto antes.

function getLastSeenPatch() {
  return localStorage.getItem(PATCH_SEEN_KEY) || "";
}

function markPatchesSeen() {
  if (PATCHES.length > 0) {
    localStorage.setItem(PATCH_SEEN_KEY, PATCHES[0].id);
  }
  updateNewsBadge();
  if (currentView === "toc") renderView();
}

function countNewPatches() {
  const lastSeen = getLastSeenPatch();
  if (!lastSeen) return PATCHES.length;
  return PATCHES.filter(p => p.id !== lastSeen).length;
}

function buildPatchHTML(patch, isLatest) {
  let itemsHTML = "";
  patch.items.forEach(it => {
    itemsHTML += `<li class="${it.type || ""}">${it.text}</li>`;
  });
  const latestCls = isLatest ? " latest" : "";
  return `
    <div class="patch-entry">
      <div class="patch-entry-head">
        <span class="patch-version${latestCls}">${patch.id}</span>
        <span class="patch-date">${patch.date}</span>
        <span class="patch-entry-title">${patch.title}</span>
      </div>
      <ul class="patch-list">
        ${itemsHTML}
      </ul>
    </div>
  `;
}

function openPatchNotes(force = false) {
  const body = document.getElementById("patchBody");
  const overlay = document.getElementById("patchOverlay");
  const badge = document.getElementById("patchNewCount");

  const lastSeen = getLastSeenPatch();
  let firstNewIndex = PATCHES.findIndex(p => p.id === lastSeen);
  if (firstNewIndex === -1) firstNewIndex = PATCHES.length;
  const newCount = firstNewIndex;

  let html = "";
  PATCHES.forEach((p, idx) => {
    html += buildPatchHTML(p, idx < firstNewIndex);
  });

  body.innerHTML = html;
  if (newCount > 0) {
    badge.style.display = "inline-block";
    badge.textContent = newCount === 1 ? "🎉 1 atualização nova!" : `🎉 ${newCount} atualizações novas!`;
  } else {
    badge.style.display = "none";
  }

  overlay.classList.add("open");
  setTimeout(() => {
    body.scrollTop = 0;
  }, 50);
}

function hashStr(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) {
    h = ((h << 5) - h) + s.charCodeAt(i);
    h |= 0;
  }
  return Math.abs(h).toString(36);
}

function findChapterContainer(el) {
  while (el && el !== document.body) {
    if (el.classList && el.classList.contains("chapter-content")) {
      const page = el.closest(".page-left") ? "left" :
                   el.closest(".page-right") ? "right" : null;
      return { container: el, pageSide: page };
    }
    el = el.parentNode;
  }
  return null;
}

function positionTooltip() {
  const sel = window.getSelection();
  const tooltip = document.getElementById("markTooltip");
  if (!sel || sel.isCollapsed || sel.rangeCount === 0) {
    tooltip.style.display = "none";
    tooltip.classList.remove("arrow-bottom", "arrow-top");
    return;
  }

  const range = sel.getRangeAt(0);
  const info = findChapterContainer(range.commonAncestorContainer);
  if (!info) {
    tooltip.style.display = "none";
    tooltip.classList.remove("arrow-bottom", "arrow-top");
    return;
  }

  const text = sel.toString().trim();
  if (text.length < 3) {
    tooltip.style.display = "none";
    tooltip.classList.remove("arrow-bottom", "arrow-top");
    return;
  }

  const rect = range.getBoundingClientRect();
  const scrollY = window.scrollY || document.documentElement.scrollTop;
  const scrollX = window.scrollX || document.documentElement.scrollLeft;
  const vh = Math.max(document.documentElement.clientHeight || 0, window.innerHeight || 0);

  tooltip.style.display = "block";
  const ttRect = tooltip.getBoundingClientRect();

  const GAP = 42;
  let preferBelow = rect.top < 130;
  let top;
  if (preferBelow) {
    top = scrollY + rect.bottom + GAP;
    if (top + ttRect.height > scrollY + vh - 10) {
      top = scrollY + rect.top - ttRect.height - GAP;
      tooltip.classList.remove("arrow-bottom");
      tooltip.classList.add("arrow-top");
    } else {
      tooltip.classList.remove("arrow-top");
      tooltip.classList.add("arrow-bottom");
    }
  } else {
    top = scrollY + rect.top - ttRect.height - GAP;
    if (top < scrollY + 10) {
      top = scrollY + rect.bottom + GAP;
      tooltip.classList.remove("arrow-top");
      tooltip.classList.add("arrow-bottom");
    } else {
      tooltip.classList.remove("arrow-bottom");
      tooltip.classList.add("arrow-top");
    }
  }

  let left = scrollX + rect.left + rect.width / 2 - ttRect.width / 2;
  if (left < scrollX + 8) left = scrollX + 8;
  const vw = Math.max(document.documentElement.clientWidth || 0, window.innerWidth || 0);
  if (left + ttRect.width > scrollX + vw - 8) {
    left = scrollX + vw - ttRect.width - 8;
  }

  tooltip.style.top = top + "px";
  tooltip.style.left = left + "px";
}

function wrapRangeWithMark(range, markId) {
  const span = document.createElement("span");
  span.className = "marked-text";
  span.dataset.markId = markId;
  span.title = "Clique para desmarcar este trecho 💔";
  span.addEventListener("click", (ev) => {
    ev.preventDefault();
    ev.stopPropagation();
    if (confirm("Deseja desmarcar este trecho? 💔")) {
      removeMark(markId);
    }
  });
  try {
    range.surroundContents(span);
    return true;
  } catch (e) {
    try {
      const frag = range.extractContents();
      span.appendChild(frag);
      range.insertNode(span);
      return true;
    } catch (e2) {
      return false;
    }
  }
}

  const ok = wrapRangeWithMark(range, markId);
  if (!ok) {
    showToast("⚠️ Não foi possível marcar este trecho. Tente selecionar apenas o texto, sem passar o mouse sobre títulos ou divisórias.");
    return;
  }

  const list = loadBookmarks();
  list.unshift({
    id: markId,
    chapterId: ch.id,
    chapterNum: ch.num,
    chapterTitle: ch.title,
    pageSide: info.pageSide,
    text: text,
    savedAt: Date.now()
  });
  saveBookmarks(list);
  sel.removeAllRanges();
  const tt = document.getElementById("markTooltip");
  if (tt) tt.style.display = "none";
  showToast("💖 Trecho salvo como uma das suas citações favoritas!");
}

function removeMark(id) {
  const list = loadBookmarks().filter(b => b.id !== id);
  saveBookmarks(list);
  document.querySelectorAll(`span.marked-text[data-mark-id="${CSS.escape(id)}"]`).forEach(span => {
    const parent = span.parentNode;
    while (span.firstChild) parent.insertBefore(span.firstChild, span);
    parent.removeChild(span);
    parent.normalize();
  });
  showToast("💔 Trecho desmarcado");
  if (currentView === "favorites") {
    renderFavoritesView();
  }
}

function clearAllMarks() {
  if (confirm("Tem certeza que quer apagar todos os marcadores? 💔")) {
    const list = loadBookmarks();
    list.forEach(b => {
      document.querySelectorAll(`span.marked-text[data-mark-id="${CSS.escape(b.id)}"]`).forEach(span => {
        const parent = span.parentNode;
        while (span.firstChild) parent.insertBefore(span.firstChild, span);
        parent.removeChild(span);
        parent.normalize();
      });
    });
    saveBookmarks([]);
    showToast("💔 Todos os marcadores foram removidos");
    if (currentView === "favorites") renderFavoritesView();
  }
}

function applySavedHighlightsToContainer(containerEl, chapterId, pageSide) {
  const list = loadBookmarks().filter(b => b.chapterId === chapterId && b.pageSide === pageSide);
  if (list.length === 0) return;
  const walker = document.createTreeWalker(containerEl, NodeFilter.SHOW_TEXT, null);
  const textNodes = [];
  let node;
  while (node = walker.nextNode()) textNodes.push(node);

  list.forEach(mark => {
    const needle = mark.text;
    const needleLen = needle.length;
    let accText = "";
    const nodeOffsets = [];
    textNodes.forEach(tn => {
      if (tn.parentNode && tn.parentNode.classList && tn.parentNode.classList.contains("marked-text")) return;
      const start = accText.length;
      nodeOffsets.push({ tn, start, len: tn.nodeValue.length });
      accText += tn.nodeValue;
    });

    let idx = accText.indexOf(needle);
    while (idx !== -1) {
      const endIdx = idx + needleLen;
      const startNode = nodeOffsets.find(n => n.start <= idx && idx < n.start + n.len);
      const endNode   = nodeOffsets.find(n => n.start <= endIdx && endIdx <= n.start + n.len);
      if (startNode && endNode) {
        const range = document.createRange();
        try {
          range.setStart(startNode.tn, idx - startNode.start);
          if (endIdx === endNode.start + endNode.len) {
            range.setEndAfter(endNode.tn);
          } else {
            range.setEnd(endNode.tn, endIdx - endNode.start);
          }
          wrapRangeWithMark(range, mark.id);
          break;
        } catch (e) {}
      }
      idx = accText.indexOf(needle, idx + 1);
    }
  });
}

function attachUnmarkHandlers() {
  document.querySelectorAll("span.marked-text").forEach(span => {
    if (span.dataset.handlerAttached === "1") return;
    span.dataset.handlerAttached = "1";
    span.addEventListener("click", (ev) => {
      ev.preventDefault();
      ev.stopPropagation();
      const id = span.dataset.markId;
      if (id && confirm("Deseja desmarcar este trecho? 💔")) {
        removeMark(id);
      }
    });
  });
}

function formatContent(text, ch) {
  if (!text) return "";
  const paras = text.split(/\n\n+/).filter(p => p.trim());
  if (paras.length === 0) {
    return `<p>${escapeHtml(text).replace(/\n/g, "<br>")}</p>`;
  }
  return paras.map(p => {
    const clean = p.trim();
    if (clean.startsWith('"') && clean.endsWith('"')) {
      return `<div class="quote">${escapeHtml(clean).replace(/\n/g, "<br>")}</div>`;
    }
    return `<p>${escapeHtml(clean).replace(/\n/g, "<br>")}</p>`;
  }).join("");
}

function splitContent(text) {
  if (!text) return { left: "", right: "" };
  const parts = text.split(/\n---\n/);
  if (parts.length >= 2) {
    return { left: parts[0].trim(), right: parts.slice(1).join("\n---\n").trim() };
  }
  const paras = text.split(/\n\n+/).filter(p => p.trim());
  const mid = Math.max(1, Math.ceil(paras.length / 2));
  return {
    left: paras.slice(0, mid).join("\n\n"),
    right: paras.slice(mid).join("\n\n")
  };
}

function escapeHtml(s) {
  const div = document.createElement("div");
  div.textContent = s;
  return div.innerHTML;
}

function updateNavArrows() {
  const prev = document.getElementById("prevBtn");
  const next = document.getElementById("nextBtn");
  if (currentView === "toc" || currentView === "favorites") {
    prev.disabled = true;
    const nextUnlocked = chapters.find(c => c.unlocked || checkUnlocked(c));
    next.disabled = !nextUnlocked;
  } else {
    const id = parseInt(currentView.split("-")[1]);
    prev.disabled = false;
    const nextCh = chapters.find(c => c.id === id + 1);
    next.disabled = !nextCh || (!nextCh.unlocked && !checkUnlocked(nextCh));
  }
}

function navPrev() {
  if (currentView === "toc") return;
  if (currentView === "favorites") {
    currentView = "toc";
    renderView();
    return;
  }
  const id = parseInt(currentView.split("-")[1]);
  if (id > 1) {
    const prev = chapters.find(c => c.id === id - 1);
    if (prev && (prev.unlocked || checkUnlocked(prev))) {
      currentView = `chapter-${id - 1}`;
    } else {
      currentView = "toc";
    }
  } else {
    currentView = "toc";
  }
  renderView();
  startCountdowns();
}

function navNext() {
  if (currentView === "toc" || currentView === "favorites") {
    const first = chapters.find(c => c.unlocked || checkUnlocked(c));
    if (first) { currentView = `chapter-${first.id}`; renderView(); startCountdowns(); }
    return;
  }
  const id = parseInt(currentView.split("-")[1]);
  const nextCh = chapters.find(c => c.id === id + 1);
  if (nextCh && (nextCh.unlocked || checkUnlocked(nextCh))) {
    currentView = `chapter-${id + 1}`;
    renderView();
    startCountdowns();
  }
}

let countdownInterval = null;
function startCountdowns() {
  if (countdownInterval) clearInterval(countdownInterval);
  const tick = () => {
    chapters.forEach(ch => {
      if (ch.unlocked || checkUnlocked(ch)) return;
      const el = document.getElementById(`countdown-${ch.id}`);
      if (!el) return;
      const now = new Date().getTime();
      const target = new Date(ch.unlockDate).getTime();
      let diff = target - now;
      if (diff <= 0) {
        ch.unlocked = true;
        saveChapters();
        renderView();
        return;
      }
      const d = Math.floor(diff / 86400000); diff -= d * 86400000;
      const h = Math.floor(diff / 3600000); diff -= h * 3600000;
      const m = Math.floor(diff / 60000); diff -= m * 60000;
      const s = Math.floor(diff / 1000);
      el.innerHTML = `
        <span>${String(d).padStart(2,'0')}<small>Dias</small></span>
        <span>${String(h).padStart(2,'0')}<small>Horas</small></span>
        <span>${String(m).padStart(2,'0')}<small>Min</small></span>
        <span>${String(s).padStart(2,'0')}<small>Seg</small></span>
      `;
    });
  };
  tick();
  countdownInterval = setInterval(tick, 1000);
}

renderView();
startCountdowns();
updateNewsBadge();
</script>
</body>
</html>
