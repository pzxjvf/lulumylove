<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio do Amor 💜</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
    <script>
        (function(){ emailjs.init("1nYxrbfEm0rZgBIXk"); })();
    </script>
    <script src="app.js"></script>

    <style>
        body {
            margin: 0;
            background: linear-gradient(135deg, #7a00ff, #00b667);
            font-family: "Nunito", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #fff;
            overflow: hidden;
        }

        /* Barra de Progresso Superior */
        .progress-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 8px;
            background: rgba(255,255,255,0.1);
        }
        #progressBar {
            width: 0%;
            height: 100%;
            background: #38b000;
            transition: 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 15px #38b000;
        }

        #feedbackCard {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(-150px);
            padding: 15px 35px;
            border-radius: 50px;
            font-weight: 800;
            z-index: 100;
            transition: 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            border: 2px solid #fff;
        }
        #feedbackCard.visible { transform: translateX(-50%) translateY(0); }
        .bg-success { background: #38b000; }
        .bg-error { background: #ff0058; }

        .quiz-container {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(20px);
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            width: 85%;
            max-width: 400px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            position: relative;
            transition: all 0.5s ease;
        }

        /* Efeito de brilho ao acertar */
        .quiz-success-glow {
            box-shadow: 0 0 40px rgba(56, 176, 0, 0.6);
            border: 1px solid #38b000;
        }

        .question { font-size: 1.6rem; margin-bottom: 25px; font-weight: 800; }
        .options { display: grid; gap: 15px; }

        .option-btn {
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.5);
            color: #fff;
            padding: 16px;
            border-radius: 18px;
            cursor: pointer;
            font-weight: 700;
            font-size: 1.1rem;
            transition: 0.3s ease;
        }
        .option-btn:hover { background: rgba(255, 255, 255, 0.3); border-color: #fff; }

        .correct-blink { background: #38b000 !important; border-color: #fff !important; transform: scale(1.03); }
        .wrong-blink { background: #ff0058 !important; border-color: #fff !important; }
        
        .shake { animation: shake 0.4s ease-in-out; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-12px); }
            60% { transform: translateX(12px); }
        }

        #reward { display: none; }
        .reward-icon { font-size: 5rem; margin: 20px 0; display: block; }

        #claimBtn {
            margin-top: 25px;
            width: 100%;
            background: #38b000;
            border: none;
            padding: 18px;
            color: white;
            font-weight: 800;
            border-radius: 18px;
            cursor: pointer;
            font-size: 1.2rem;
            transition: 0.4s;
        }
        #claimBtn.claimed { background: #7a00ff; pointer-events: none; }

        .modal {
            position: fixed;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.65);
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.25s ease, visibility 0.25s ease;
            z-index: 200;
        }
        .modal.visible {
            visibility: visible;
            opacity: 1;
        }
        .modal-content {
            background: linear-gradient(180deg, rgba(255,255,255,0.18), rgba(255,255,255,0.08));
            border: 1px solid rgba(169, 50, 255, 0.35);
            backdrop-filter: blur(24px);
            padding: 30px 34px;
            border-radius: 30px;
            text-align: center;
            max-width: 340px;
            width: 92%;
            color: #fff;
            box-shadow: 0 24px 50px rgba(0,0,0,0.35);
            position: relative;
            overflow: hidden;
        }
        .modal-content::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at top right, rgba(255,255,255,0.25), transparent 35%);
            pointer-events: none;
        }
        .modal-content h3 {
            font-size: 1.6rem;
            margin-bottom: 12px;
            letter-spacing: 0.02em;
        }
        .modal-content p {
            font-size: 1.15rem;
            margin-bottom: 24px;
            font-weight: 700;
            line-height: 1.6;
            opacity: 0.95;
        }
        .modal-close-btn {
            background: #ffffff22;
            border: 1px solid rgba(255,255,255,0.45);
            color: #fff;
            padding: 14px 20px;
            border-radius: 18px;
            font-weight: 800;
            cursor: pointer;
            width: 100%;
            transition: background 0.25s ease, transform 0.25s ease;
        }
        .modal-close-btn:hover {
            background: rgba(255,255,255,0.28);
            transform: translateY(-1px);
        }
        .modal.visible .modal-content {
            animation: popIn 0.25s ease;
        }
        @keyframes popIn {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

    </style>
</head>
<body>

<div class="progress-container"><div id="progressBar"></div></div>
<div id="feedbackCard"></div>

<div class="quiz-container" id="quizBox">
    <div id="game">
        <div class="question" id="questionText">Preparada, momo? </div>
        <div class="options" id="optionsBox"></div>
    </div>

    <div id="reward">
        <h2 style="font-size: 2rem; margin-bottom: 5px;">🏅 PERFECT!</h2>
        <p style="opacity: 0.9;">tu completou o quiz com sucesso.</p>
        <span class="reward-icon">🍨</span>
        <p><strong>RECOMPENSA:</strong> Um datezinho eu e tu<br>com sobremesa, pode me cobrar!!</p>
        <button id="claimBtn" onclick="reivindicar()">REIVINDICAR PRÊMIO</button>
    </div>
    <div id="loveModal" class="modal" role="dialog" aria-modal="true">
        <div class="modal-content">
            <p>num ama eu momo??🥺</p>
            <button class="modal-close-btn" onclick="closeLoveModal()">Fechar</button>
        </div>
    </div>
</div>

<script>
    const questions = [
        { q: "Qual a coisa que joão mais gosta de comer?", options: ["Feijão", "Chocolate", "a lulu", "Nada :("], correct: 2 },
        { q: "Qual foi a data do primeiro eu te amo", options: ["01/09/2023", "05/02/2023", "29/04/2024", "18/02/2024"], correct: 0 },
        { q: "Qual jogo que joao e lulu mais gostam de jogar?", options: ["Jogos de misterio", "Minecraft", "Tyne glade", "Ludo"], correct: 1 },
        { q: "é verdade que lulu ama o joão? (espero que sim, mozi :( )", options: ["é verdade", "mentira", "é", "sisi"], correct: [0, 2, 3] },
        { q: "o que acontece se joao nao receber o que ele quer da lulu?", options: ["joao cai duro no chao e morre", "joao vai de base, de silvio santos, de vaxco", "joao fica triste", "joao falece blau no chão"], correct: [0, 1, 2, 3] },
    ];

    const elogios = ["boa, minha diva!!!",];
    const erros = ["CLOSE! Tenta de novo momo!"];

    let currentQ = 0;
    const quizBox = document.getElementById("quizBox");
    const feedbackCard = document.getElementById("feedbackCard");
    const progressBar = document.getElementById("progressBar");

    function showStatus(msg, type) {
        feedbackCard.innerText = msg;
        feedbackCard.className = `visible ${type === 'success' ? 'bg-success' : 'bg-error'}`;
        setTimeout(() => feedbackCard.className = '', 1800);
    }

    function loadQuestion() {
        const q = questions[currentQ];
        document.getElementById("questionText").innerText = q.q;
        const box = document.getElementById("optionsBox");
        box.innerHTML = "";
        progressBar.style.width = (currentQ / questions.length) * 100 + "%";
        
        q.options.forEach((opt, index) => {
            const btn = document.createElement("button");
            btn.className = "option-btn";
            btn.innerText = opt;
            btn.onclick = (e) => checkAnswer(index, e.target);
            box.appendChild(btn);
        });
    }

    function checkAnswer(index, btnElement) {
        const buttons = document.querySelectorAll('.option-btn');
        buttons.forEach(b => b.style.pointerEvents = 'none');

        const correct = questions[currentQ].correct;
        const isCorrect = Array.isArray(correct) ? correct.includes(index) : index === correct;

        if(!isCorrect && currentQ === 3 && index === 1) {
            showLoveModal();
        }

        if(isCorrect) {
            btnElement.classList.add("correct-blink");
            quizBox.classList.add("quiz-success-glow");
            showStatus(elogios[Math.floor(Math.random()*elogios.length)], "success");
            
            currentQ++;
            setTimeout(() => {
                quizBox.classList.remove("quiz-success-glow");
                if(currentQ < questions.length) loadQuestion();
                else showReward();
            }, 1200);
        } else {
            btnElement.classList.add("wrong-blink");
            quizBox.classList.add("shake");
            showStatus(erros[Math.floor(Math.random()*erros.length)], "error");
            
            setTimeout(() => {
                quizBox.classList.remove("shake");
                btnElement.classList.remove("wrong-blink");
                buttons.forEach(b => b.style.pointerEvents = 'auto');
            }, 600);
        }
    }

    function showLoveModal() {
        document.getElementById('loveModal').classList.add('visible');
    }

    function closeLoveModal() {
        document.getElementById('loveModal').classList.remove('visible');
    }

    function showReward() {
        progressBar.style.width = "100%";
        document.getElementById("game").style.display = "none";
        document.getElementById("reward").style.display = "block";
    }

    function reivindicar() {
        const btn = document.getElementById("claimBtn");
        btn.innerText = "PRÊMIO REIVINDICADO! 💜";
        btn.classList.add("claimed");

        const pdfUrl = '../vale_datezinho_lulu.pdf';
        const link = document.createElement('a');
        link.href = pdfUrl;
        link.download = 'vale_datezinho_lulu.pdf';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        
        // Envia o e-mail usando sua função do app.js
        if(typeof avisarEla === "function") {
            avisarEla("🏆 PRÊMIO REIVINDICADO", "A Lulu completou o desafio e já reivindicou o prêmio dela! 🍨");
        }

        // Aguarda 2 segundos para ela ver a confirmação e volta ao menu
        setTimeout(() => {
            window.location.href = '../menu.html';
        }, 2000);
    }

    loadQuestion();
</script>   
</body>
</html>
