<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📖 O Livro da Nossa História</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Dancing+Script:wght@600;700&family=Nunito:wght@400;700&display=swap" rel="stylesheet">

<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    overflow: hidden;
  }
  body {
    min-height: 100vh;
    background:
      radial-gradient(ellipse at top, #3a0ca3 0%, transparent 60%),
      radial-gradient(ellipse at bottom, #7209b7 0%, transparent 60%),
      linear-gradient(135deg, #1a0033 0%, #2d0050 50%, #0a0020 100%);
    font-family: "Cormorant Garamond", serif;
    color: #3a2817;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px 15px 16px;
    overflow: hidden !important;
  }

  .top-bar {
    width: 100%;
    max-width: 1000px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    color: #fff;
    font-family: "Nunito", sans-serif;
    z-index: 10;
  }

  .back-btn {
    background: rgba(255,255,255,0.12);
    border: 1.5px solid rgba(255,255,255,0.3);
    color: white;
    padding: 8px 18px;
    border-radius: 25px;
    font-family: "Nunito", sans-serif;
    font-weight: 700;
    cursor: pointer;
    backdrop-filter: blur(10px);
    transition: 0.3s;
  }
  .back-btn:hover {
    background: rgba(255,255,255,0.22);
    transform: scale(1.05);
  }

  .page-indicator {
    background: rgba(255,255,255,0.12);
    border: 1.5px solid rgba(255,255,255,0.3);
    padding: 8px 16px;
    border-radius: 25px;
    font-weight: 700;
    backdrop-filter: blur(10px);
    font-size: 0.9em;
  }

  .book-title {
    text-align: center;
    margin-bottom: 18px;
    z-index: 5;
  }
  .book-title h1 {
    font-family: "Dancing Script", cursive;
    font-size: clamp(2rem, 5vw, 3.2rem);
    margin: 0;
    background: linear-gradient(135deg, #ffd700, #ff9ecf, #c77dff, #ffd700);
    background-size: 300% 300%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: shimmer 4s ease infinite;
    text-shadow: 0 0 30px rgba(199, 125, 255, 0.3);
  }
  .book-title p {
    color: rgba(255,255,255,0.75);
    font-family: "Nunito", sans-serif;
    font-size: 0.95em;
    margin: 5px 0 0;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  @keyframes shimmer {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }

  .book-wrapper {
    perspective: 2000px;
    width: 100%;
    max-width: 1000px;
    display: flex;
    justify-content: center;
  }

  .book {
    width: 100%;
    max-width: 960px;
    min-height: 620px;
    position: relative;
    transform-style: preserve-3d;
    display: flex;
    border-radius: 8px;
    box-shadow:
      0 0 0 2px #4a2c1a,
      0 0 0 5px #6b3f24,
      0 25px 60px rgba(0,0,0,0.6),
      0 15px 30px rgba(0,0,0,0.5),
      inset 0 0 80px rgba(139, 90, 43, 0.1);
    background: #6b3f24;
  }

  .book-spine {
    width: 28px;
    min-height: 620px;
    background: linear-gradient(to right,
      #3a1f10 0%,
      #5a3318 25%,
      #7a4a28 50%,
      #5a3318 75%,
      #3a1f10 100%);
    position: relative;
    box-shadow:
      inset -3px 0 6px rgba(0,0,0,0.5),
      inset 3px 0 6px rgba(255,255,255,0.05);
    z-index: 3;
    flex-shrink: 0;
  }
  .book-spine::before {
    content: "";
    position: absolute;
    top: 30px;
    left: 50%;
    transform: translateX(-50%);
    width: 16px;
    height: 40px;
    background: linear-gradient(180deg, #ffd700, #ff9ecf);
    border-radius: 2px;
    opacity: 0.9;
    box-shadow: 0 2px 5px rgba(0,0,0,0.3);
  }
  .book-spine::after {
    content: "";
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    width: 16px;
    height: 40px;
    background: linear-gradient(180deg, #ff9ecf, #c77dff);
    border-radius: 2px;
    opacity: 0.9;
    box-shadow: 0 2px 5px rgba(0,0,0,0.3);
  }

  .page {
    flex: 1;
    height: 620px;
    min-height: 620px;
    padding: 45px 50px 95px;
    position: relative;
    overflow: hidden !important;
  }

  .page-left {
    background:
      linear-gradient(to right,
        rgba(139, 90, 43, 0.08) 0%,
        transparent 5%,
        transparent 95%,
        rgba(139, 90, 43, 0.04) 100%),
      repeating-linear-gradient(
        180deg,
        transparent 0px,
        transparent 31px,
        rgba(139, 90, 43, 0.05) 31px,
        rgba(139, 90, 43, 0.05) 32px
      ),
      radial-gradient(ellipse at 20% 10%, rgba(255, 235, 180, 0.5), transparent 50%),
      radial-gradient(ellipse at 80% 90%, rgba(210, 170, 120, 0.2), transparent 50%),
      linear-gradient(180deg, #fdf6e3 0%, #f5ecd3 50%, #f3e7c9 100%);
    box-shadow: inset 15px 0 25px -15px rgba(0,0,0,0.2);
    border-right: 1px solid rgba(139, 90, 43, 0.15);
  }

  .page-right {
    background:
      linear-gradient(to left,
        rgba(139, 90, 43, 0.08) 0%,
        transparent 5%,
        transparent 95%,
        rgba(139, 90, 43, 0.04) 100%),
      repeating-linear-gradient(
        180deg,
        transparent 0px,
        transparent 31px,
        rgba(139, 90, 43, 0.05) 31px,
        rgba(139, 90, 43, 0.05) 32px
      ),
      radial-gradient(ellipse at 80% 10%, rgba(255, 235, 180, 0.5), transparent 50%),
      radial-gradient(ellipse at 20% 90%, rgba(210, 170, 120, 0.2), transparent 50%),
      linear-gradient(180deg, #fdf6e3 0%, #f5ecd3 50%, #f3e7c9 100%);
    box-shadow: inset -15px 0 25px -15px rgba(0,0,0,0.2);
    border-left: 1px solid rgba(139, 90, 43, 0.15);
  }

  .page-number {
    position: absolute;
    bottom: 18px;
    font-family: "Cormorant Garamond", serif;
    font-style: italic;
    color: #6b4423;
    font-size: 0.95em;
    opacity: 0.8;
  }
  .page-left .page-number { left: 50px; }
  .page-right .page-number { right: 50px; }

  .page-corner {
    position: absolute;
    width: 40px;
    height: 40px;
    background: linear-gradient(135deg, rgba(0,0,0,0.05) 0%, transparent 50%);
  }
  .page-left .page-corner { top: 0; right: 0; border-top-right-radius: 8px; }
  .page-right .page-corner { top: 0; left: 0; border-top-left-radius: 8px; }

  .toc-entry {
    padding: 14px 18px;
    border-bottom: 1px dashed rgba(107, 68, 35, 0.3);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    cursor: pointer;
    transition: 0.25s;
    border-radius: 6px;
    margin-bottom: 4px;
    position: relative;
  }
  .toc-entry:hover:not(.locked) {
    background: rgba(255, 200, 150, 0.2);
    transform: translateX(4px);
  }

  .toc-entry.unlocked {
    background: linear-gradient(90deg, rgba(199, 125, 255, 0.12), transparent);
    border-left: 3px solid #c77dff;
  }
  .toc-entry.unlocked:hover {
    background: linear-gradient(90deg, rgba(199, 125, 255, 0.22), rgba(255, 158, 207, 0.1));
  }

  .toc-entry.locked {
    opacity: 0.6;
    cursor: not-allowed;
    filter: grayscale(0.3);
  }
  .toc-entry.locked::after {
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      45deg,
      transparent,
      transparent 10px,
      rgba(107, 68, 35, 0.04) 10px,
      rgba(107, 68, 35, 0.04) 20px
    );
    pointer-events: none;
    border-radius: 6px;
  }

  .toc-info { flex: 1; min-width: 0; }

  .toc-chapter {
    font-family: "Nunito", sans-serif;
    font-size: 0.75em;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: #8a5a2b;
    font-weight: 700;
    margin-bottom: 3px;
  }

  .toc-title {
    font-family: "Cormorant Garamond", serif;
    font-size: 1.25em;
    font-weight: 600;
    color: #3a2817;
    line-height: 1.2;
  }

  .toc-date {
    text-align: right;
    flex-shrink: 0;
  }
  .toc-date .date-label {
    font-family: "Nunito", sans-serif;
    font-size: 0.7em;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #8a5a2b;
    font-weight: 700;
  }
  .toc-date .date-value {
    font-family: "Cormorant Garamond", serif;
    font-size: 1.1em;
    font-weight: 600;
    color: #5a3a1a;
  }

  .lock-icon {
    font-size: 1.5em;
    margin-left: 8px;
    flex-shrink: 0;
  }

  .chapter-header {
    text-align: center;
    margin-bottom: 30px;
    padding-bottom: 20px;
    border-bottom: 2px double rgba(107, 68, 35, 0.3);
  }
  .chapter-header .ch-num {
    font-family: "Nunito", sans-serif;
    font-size: 0.75em;
    text-transform: uppercase;
    letter-spacing: 3px;
    color: #c77dff;
    font-weight: 700;
    margin-bottom: 6px;
  }
  .chapter-header h2 {
    font-family: "Dancing Script", cursive;
    font-size: 1.5em;
    margin: 0;
    color: #3a2817;
    line-height: 1.2;
    word-break: break-word;
  }
  .chapter-header .ch-date {
    margin-top: 10px;
    font-family: "Cormorant Garamond", serif;
    font-style: italic;
    color: #6b4423;
    font-size: 1.05em;
  }
  .chapter-header .ch-heart {
    margin-top: 12px;
    font-size: 1.3em;
    color: #c77dff;
    letter-spacing: 8px;
  }

  .chapter-content {
    font-family: "Cormorant Garamond", serif;
    font-size: 1.15em;
    line-height: 1.55;
    color: #2e1f10;
  }
  .chapter-content p {
    text-indent: 1.8em;
    margin: 0 0 6px;
    text-align: justify;
  }
  /* letra capitular só no primeiro parágrafo do capítulo */
  .chapter-content p.dropcap::first-letter {
    font-family: "Dancing Script", cursive;
    font-size: 3.5em;
    float: left;
    line-height: 0.9;
    padding: 4px 8px 0 0;
    color: #c77dff;
    font-weight: 700;
  }
  /* parágrafo que continua da página anterior: sem recuo */
  .chapter-content p.cont {
    text-indent: 0;
  }

  .chapter-content .quote {
    border-left: 3px solid #c77dff;
    padding: 8px 20px;
    margin: 12px 0;
    font-style: italic;
    background: rgba(199, 125, 255, 0.08);
    border-radius: 0 8px 8px 0;
    color: #5a3a7a;
  }

  .chapter-content .scene-break {
    text-align: center;
    color: #c77dff;
    letter-spacing: 10px;
    font-size: 0.9em;
    margin: 8px 0 10px;
    line-height: 1.2;
  }

  .end-ornament {
    text-align: center;
    padding: 14px 0 0;
    color: #c77dff;
    letter-spacing: 8px;
  }

  .editor-placeholder {
    font-family: "Nunito", sans-serif;
    background: rgba(199, 125, 255, 0.1);
    border: 2px dashed rgba(199, 125, 255, 0.5);
    padding: 14px 18px;
    border-radius: 12px;
    margin: 20px 0;
    text-align: center;
    font-size: 0.85em;
    color: #7a4a9a;
    cursor: pointer;
    transition: 0.3s;
  }
  .editor-placeholder:hover {
    background: rgba(199, 125, 255, 0.2);
    border-color: #c77dff;
    transform: scale(1.02);
  }

  .draft-pill {
    position: fixed;
    left: 30px;
    bottom: 30px;
    z-index: 20;
    font-family: "Nunito", sans-serif;
    font-weight: 700;
    font-size: 0.8em;
    color: white;
    background: rgba(199, 125, 255, 0.25);
    border: 1.5px dashed rgba(255,255,255,0.5);
    padding: 9px 16px;
    border-radius: 20px;
    cursor: pointer;
    backdrop-filter: blur(8px);
    transition: 0.25s;
  }
  .draft-pill:hover { background: rgba(199, 125, 255, 0.45); transform: scale(1.04); }

  .edit-area {
    width: 100%;
    min-height: 180px;
    padding: 15px;
    border: 2px solid #c77dff;
    border-radius: 10px;
    background: rgba(255, 250, 240, 0.9);
    font-family: "Cormorant Garamond", serif;
    font-size: 1.1em;
    line-height: 1.7;
    color: #2e1f10;
    resize: vertical;
    outline: none;
    transition: 0.3s;
  }
  .edit-area:focus {
    box-shadow: 0 0 0 3px rgba(199, 125, 255, 0.25);
    border-color: #9d4edd;
  }

  .edit-actions {
    display: flex;
    gap: 10px;
    margin-top: 12px;
    justify-content: flex-end;
  }
  .btn-edit {
    font-family: "Nunito", sans-serif;
    font-weight: 700;
    padding: 8px 18px;
    border-radius: 20px;
    border: none;
    cursor: pointer;
    transition: 0.25s;
    font-size: 0.9em;
  }
  .btn-save {
    background: linear-gradient(135deg, #c77dff, #9d4edd);
    color: white;
    box-shadow: 0 4px 12px rgba(157, 78, 221, 0.4);
  }
  .btn-save:hover { transform: scale(1.05); box-shadow: 0 6px 18px rgba(157, 78, 221, 0.5); }
  .btn-cancel {
    background: rgba(107, 68, 35, 0.1);
    color: #6b4423;
    border: 1.5px solid rgba(107, 68, 35, 0.3);
  }
  .btn-cancel:hover { background: rgba(107, 68, 35, 0.2); }

  .locked-cover {
    position: relative;
    min-height: 400px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
  }
  .locked-big {
    font-size: 5rem;
    margin-bottom: 20px;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.2));
    animation: float 3s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }
  .locked-title {
    font-family: "Dancing Script", cursive;
    font-size: 1.8em;
    color: #5a3a1a;
    margin-bottom: 10px;
  }
  .locked-subtitle {
    font-family: "Nunito", sans-serif;
    font-size: 0.85em;
    color: #8a5a2b;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 16px;
    font-weight: 700;
  }
  .countdown {
    background: linear-gradient(135deg, rgba(199, 125, 255, 0.15), rgba(255, 158, 207, 0.15));
    border: 2px dashed rgba(199, 125, 255, 0.5);
    padding: 16px 24px;
    border-radius: 16px;
    margin-top: 10px;
  }
  .countdown-label {
    font-family: "Nunito", sans-serif;
    font-size: 0.7em;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: #8a5a7a;
    font-weight: 700;
    margin-bottom: 6px;
  }
  .countdown-numbers {
    font-family: "Cormorant Garamond", serif;
    font-size: 1.6em;
    font-weight: 700;
    color: #6b3a9a;
  }
  .countdown-numbers span {
    display: inline-block;
    min-width: 55px;
  }
  .countdown-numbers small {
    display: block;
    font-family: "Nunito", sans-serif;
    font-size: 0.45em;
    color: #8a5a2b;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 700;
  }

  .back-toc {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: "Nunito", sans-serif;
    font-size: 0.8em;
    font-weight: 700;
    color: #c77dff;
    cursor: pointer;
    background: rgba(199, 125, 255, 0.1);
    padding: 6px 14px;
    border-radius: 18px;
    border: 1.5px solid rgba(199, 125, 255, 0.35);
    transition: 0.25s;
    margin-bottom: 15px;
  }
  .back-toc:hover {
    background: rgba(199, 125, 255, 0.2);
    transform: translateX(-3px);
  }

  .dedication {
    text-align: center;
    padding: 20px 0 30px;
  }
  .dedication-text {
    font-family: "Dancing Script", cursive;
    font-size: 1.4em;
    color: #6b4423;
    line-height: 1.5;
    font-style: italic;
  }
  .dedication-sign {
    margin-top: 15px;
    font-family: "Cormorant Garamond", serif;
    font-style: italic;
    color: #8a5a2b;
  }

  .toc-header {
    text-align: center;
    margin-bottom: 25px;
  }
  .toc-header h3 {
    font-family: "Dancing Script", cursive;
    font-size: 2em;
    margin: 0 0 6px;
    color: #3a2817;
  }
  .toc-header .toc-decor {
    color: #c77dff;
    letter-spacing: 10px;
    font-size: 0.9em;
  }

  .nav-arrows {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 12px;
    z-index: 20;
  }
  .nav-arrow {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: linear-gradient(135deg, #c77dff, #9d4edd);
    color: white;
    border: none;
    cursor: pointer;
    font-size: 1.3em;
    box-shadow: 0 6px 18px rgba(157, 78, 221, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: 0.25s;
  }
  .nav-arrow:hover:not(:disabled) { transform: scale(1.1); }
  .nav-arrow:disabled {
    opacity: 0.35;
    cursor: not-allowed;
    box-shadow: none;
  }

  .toast {
    position: fixed;
    top: 30px;
    right: 30px;
    background: linear-gradient(135deg, #38b000, #7b2cbf);
    color: white;
    padding: 14px 24px;
    border-radius: 16px;
    font-family: "Nunito", sans-serif;
    font-weight: 700;
    box-shadow: 0 8px 24px rgba(0,0,0,0.35);
    z-index: 9999;
    animation: toastIn 0.4s ease forwards;
    display: none;
    max-width: 340px;
    line-height: 1.5;
    white-space: pre-line;
  }
  @keyframes toastIn {
    from { opacity: 0; transform: translateX(30px); }
    to { opacity: 1; transform: translateX(0); }
  }
  @keyframes toastOut {
    to { opacity: 0; transform: translateX(30px); }
  }

  .author-badge {
    font-family: "Nunito", sans-serif;
    font-size: 0.75em;
    font-weight: 700;
    background: linear-gradient(135deg, #ffd700, #ff9ecf);
    color: #3a1f50;
    padding: 6px 12px;
    border-radius: 16px;
    cursor: pointer;
    transition: 0.25s;
    border: 1.5px solid rgba(255,255,255,0.4);
    user-select: none;
    white-space: nowrap;
  }
  .author-badge:hover {
    transform: scale(1.06);
    box-shadow: 0 4px 12px rgba(255, 158, 207, 0.5);
  }

  /* fita marcadora: fica na margem da página, sem cobrir o texto */
  .bookmark-ribbon {
    position: absolute;
    top: -4px;
    right: 12px;
    width: 26px;
    height: 70px;
    background: linear-gradient(180deg, #ff4d6d 0%, #c9184a 100%);
    box-shadow:
      0 2px 6px rgba(201, 24, 74, 0.45),
      inset 0 0 0 1px rgba(255,255,255,0.2);
    z-index: 6;
    cursor: pointer;
    transition: transform 0.35s cubic-bezier(.3,1.5,.6,1), top 0.3s;
  }
  .bookmark-ribbon::before {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: -10px;
    height: 0;
    border-left: 13px solid transparent;
    border-right: 13px solid transparent;
    border-top: 12px solid #c9184a;
  }
  .bookmark-ribbon::after {
    content: "💖";
    position: absolute;
    left: 50%;
    top: 14px;
    transform: translateX(-50%);
    font-size: 0.85em;
    filter: drop-shadow(0 1px 1px rgba(0,0,0,0.2));
  }
  .bookmark-ribbon.retracted {
    top: -66px;
  }
  .bookmark-ribbon:hover:not(.retracted) {
    transform: translateY(-2px) scale(1.03);
  }

  .chapter-content p,
  .chapter-content .quote {
    position: relative;
    transition: background 0.25s, box-shadow 0.25s, transform 0.25s;
    border-radius: 6px;
  }

  .marked-text {
    background: linear-gradient(180deg, rgba(199, 125, 255, 0.18) 0%, rgba(199, 125, 255, 0.38) 100%);
    border-radius: 4px;
    box-shadow: inset 0 -2px 0 0 rgba(157, 78, 221, 0.5);
    padding: 1px 2px;
    color: #2e104a;
    cursor: pointer;
    transition: background 0.2s, box-shadow 0.2s;
    position: relative;
  }
  .marked-text:hover {
    background: linear-gradient(180deg, rgba(199, 125, 255, 0.3) 0%, rgba(199, 125, 255, 0.52) 100%);

/* =========================================================
   🌟 AREA PARA EDITAR O LIVRO 🌟
   Tudo que for alterado aqui sera publicado para ela quando
   voce subir o site (Netlify). Basta editar e dar deploy!
   =========================================================
   Campos de cada capitulo:
   - num:        "Capitulo I", "Capitulo II"...
   - title:      Titulo bonito do capitulo
   - date:       Data visual (ex: "29 de Janeiro de 2023")
   - unlockDate: Quando desbloqueia ("YYYY-MM-DDTHH:mm:ss")
                 Deixe null para liberar agora
   - unlocked:   true = ja esta liberado | false = cadeado
   - content:    A historia (pule linhas com Enter)

   As paginas sao montadas AUTOMATICAMENTE pelo tamanho real
   do texto: nada fica cortado e nao existe scroll.
   Uma linha com apenas --- vira uma divisoria ✦ ✦ ✦ no texto.

const LIVRO_CONFIG = {
  tituloGeral:  "O Livro da Nossa Historia",
  subtituloGeral: "✨ Cada capitulo, um pedaco do nosso amor ✨",
};

const defaultChapters = [

  /* ========== CAPITULO 1 ========== */
  {
    id: 1,
    num: "Capitulo I",
    title: "O Dia em que Tudo Comecou",
    date: "29 de Janeiro de 2023",
    unlockDate: null,
    unlocked: true,
    content:
`Eu não sabia que aquele domingo seria importante.

Na verdade, eu estava ocupado demais comemorando.

Tinha acabado de chegar da casa da minha irmã e meu time tinha acabado de ser campeão da Supercopa do Brasil. Eu estava eufórico. Daqueles níveis de euforia em que qualquer pessoa razoável provavelmente recomendaria água, alguns minutos de silêncio e, talvez, uma avaliação sobre o quanto de futebol era saudável para um ser humano.

Mas eu não queria água.

Eu queria comemorar.

E, naquele momento, eu sinceramente achava que nada conseguiria deixar aquele domingo melhor.

Eu estava errado.

O celular vibrou.

Era uma mensagem de uma antiga amiga.

Nada muito extraordinário. Pelo menos, não naquele primeiro segundo.

Ela perguntou se eu queria conhecer uma garota.

Uma garota.

Amiga dela.

Eu poderia simplesmente ter respondido que sim ou não, mas havia um pequeno detalhe: eu já sabia quem ela era.

Não conhecia de verdade. Não ainda.

Mas já tinha reparado nela algumas vezes.

E, para ser completamente honesto, ela era facilmente a garota mais bonita do grupo.

Eu já tinha olhado algumas fotos dela, mas ninguém sabia e eu disfarcei bem.

Só que eu não fazia ideia se ela teria qualquer interesse em me conhecer.

Então, quando minha amiga apareceu perguntando se eu queria conhecê-la, minha primeira reação provavelmente foi uma mistura bastante específica de curiosidade, surpresa e aquele pequeno pensamento inconveniente que surge quando alguma coisa que você queria, mas não tinha coragem de admitir que queria, aparece de repente na sua frente.

Foi então que ela perguntou se eu teria algum problema pelo fato de a garota ser cadeirante.

Ela explicou que ela não tinha movimento nos pés.

Na época, nem a própria melhor amiga conseguia explicar direito qual era a condição dela ou quais eram, de fato, as limitações.

E, sinceramente?

Aquilo nunca foi um problema para mim.

Respondi simplesmente:

function getLastSeenPatch() {
  return localStorage.getItem(PATCH_SEEN_KEY) || "";
}

function markPatchesSeen() {
  if (PATCHES.length > 0) {
    localStorage.setItem(PATCH_SEEN_KEY, PATCHES[0].id);
  }
  updateNewsBadge();
  if (currentView === "toc") renderView();
}

function countNewPatches() {
  const lastSeen = getLastSeenPatch();
  if (!lastSeen) return PATCHES.length;
  return PATCHES.filter(p => p.id !== lastSeen).length;
}

function buildPatchHTML(patch, isLatest) {
  let itemsHTML = "";
  patch.items.forEach(it => {
    itemsHTML += `<li class="${it.type || ""}">${it.text}</li>`;
  });
  const latestCls = isLatest ? " latest" : "";
  return `
    <div class="patch-entry">
      <div class="patch-entry-head">
        <span class="patch-version${latestCls}">${patch.id}</span>
        <span class="patch-date">${patch.date}</span>
        <span class="patch-entry-title">${patch.title}</span>
      </div>
      <ul class="patch-list">
        ${itemsHTML}
      </ul>
    </div>
  `;
}

function openPatchNotes(force = false) {
  const body = document.getElementById("patchBody");
  const overlay = document.getElementById("patchOverlay");
  const badge = document.getElementById("patchNewCount");

  const lastSeen = getLastSeenPatch();
  let firstNewIndex = PATCHES.findIndex(p => p.id === lastSeen);
  if (firstNewIndex === -1) firstNewIndex = PATCHES.length;
  const newCount = firstNewIndex;

  let html = "";
  PATCHES.forEach((p, idx) => {
    html += buildPatchHTML(p, idx < firstNewIndex);
  });

  body.innerHTML = html;
  if (newCount > 0) {
    badge.style.display = "inline-block";
    badge.textContent = newCount === 1 ? "🎉 1 atualização nova!" : `🎉 ${newCount} atualizações novas!`;
  } else {
    badge.style.display = "none";
  }

  overlay.classList.add("open");
  setTimeout(() => {
    body.scrollTop = 0;
  }, 50);
}

function closePatchNotes(markSeen = true) {
  const overlay = document.getElementById("patchOverlay");
  overlay.classList.remove("open");
  if (markSeen) {
    markPatchesSeen();
  }
}

  if (!dot) return;
  if (count > 0) {
    dot.style.display = "inline-block";
  } else {
    dot.style.display = "none";
  }
}

function hashStr(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) {
    h = ((h << 5) - h) + s.charCodeAt(i);
    h |= 0;
  }
  return Math.abs(h).toString(36);
}

function findChapterContainer(el) {
  while (el && el !== document.body) {
    if (el.classList && el.classList.contains("chapter-content")) {
      const page = el.closest(".page-left") ? "left" :
                   el.closest(".page-right") ? "right" : null;
      return { container: el, pageSide: page };
    }
    el = el.parentNode;
  }
  return null;
}

function getContainerText(containerEl) {
  const walker = document.createTreeWalker(containerEl, NodeFilter.SHOW_TEXT, null);
  let all = "";
  const nodeMap = [];
  let node;
  while (node = walker.nextNode()) {
    if (node.parentNode && node.parentNode.classList && node.parentNode.classList.contains("marked-text")) {
      const pNode = node.parentNode;
      const start = all.length;
      const text = node.nodeValue;
      all += text;
      nodeMap.push({ node, start, end: start + text.length, inside: true, parentEl: pNode });
      continue;
    }
    const start = all.length;
    const text = node.nodeValue;
    all += text;
    nodeMap.push({ node, start, end: start + text.length, inside: false });
  }
  return { fullText: all, nodes: nodeMap };
}

function getRangeInContainer(range, containerEl) {
  const info = getContainerText(containerEl);
  const pre = document.createRange();
  const post = document.createRange();

  let startChar = 0;
  try {
    pre.setStart(containerEl, 0);
    pre.setEnd(range.startContainer, range.startOffset);
    startChar = pre.toString().length;
  } catch (e) {
    const startAnchor = info.nodes.find(n => n.node === range.startContainer);
    if (startAnchor) startChar = startAnchor.start + range.startOffset;
  }

  let endChar = startChar + range.toString().length;
  try {
    post.setStart(containerEl, 0);
    post.setEnd(range.endContainer, range.endOffset);
    endChar = post.toString().length;
  } catch (e) {
    const endAnchor = info.nodes.find(n => n.node === range.endContainer);
    if (endAnchor) endChar = endAnchor.start + range.endOffset;
  }

  const startCtx = info.fullText.slice(Math.max(0, startChar - 60), startChar);
  const endCtx   = info.fullText.slice(endChar, endChar + 60);

  return {
    startChar,
    endChar,
    length: endChar - startChar,
    text: info.fullText.slice(startChar, endChar),
    contextBefore: startCtx,
    contextAfter: endCtx
  };
}

/* Mede o quanto o contexto (texto antes/depois) de uma ocorrência bate com o salvo */
function matchScore(fullText, idx, needleLen, ctxBefore, ctxAfter) {
  let before = 0, after = 0;
  const b = fullText.slice(Math.max(0, idx - 60), idx);
  const cb = ctxBefore || "";
  const minB = Math.min(b.length, cb.length);
  for (let k = 1; k <= minB; k++) {
    if (b.slice(-k) === cb.slice(-k)) before = k; else break;
  }
  const a = fullText.slice(idx + needleLen, idx + needleLen + 60);
  const ca = ctxAfter || "";
  const minA = Math.min(a.length, ca.length);
  for (let k = 0; k < minA; k++) {
    if (a[k] === ca[k]) after = k + 1; else break;
  }
  return { before, after };
}

/* Procura onde um marcador salvo está dentro do texto de uma página */
function locateMark(fullText, mark) {
  const needle = mark.anchor || mark.text;
  if (!needle) return null;
  const cb = mark.contextBefore || "";
  const ca = mark.contextAfter || "";
  const need = Math.min(10, Math.min(8, cb.length) + Math.min(8, ca.length));
  let best = null, from = 0, idx;
  while ((idx = fullText.indexOf(needle, from)) !== -1) {
    const s = matchScore(fullText, idx, needle.length, cb, ca);
    const total = s.before + s.after;
    if (!best || total > best.total) best = { idx, total, len: needle.length };
    from = idx + 1;
  }
  if (!best || best.total < need) return null;
  return best;
}

function wrapCharRangeInContainer(containerEl, startChar, endChar, markId) {
  const info = getContainerText(containerEl);
  if (startChar < 0 || endChar <= startChar || endChar > info.fullText.length) return false;

  let startNode = info.nodes.find(n => n.start <= startChar && startChar < n.end);
  let endNode   = info.nodes.find(n => n.start < endChar && endChar <= n.end);
  if (!startNode || !endNode) return false;

  if (startNode === endNode) {
    const range = document.createRange();
    const offsetStart = startChar - startNode.start;
    const offsetEnd = endChar - endNode.start;
    range.setStart(startNode.node, offsetStart);
    range.setEnd(endNode.node, offsetEnd);
    return wrapRangeWithMark(range, markId);
  }

  const partialNodes = info.nodes.filter(n => n.end > startChar && n.start < endChar && !n.inside);
  if (partialNodes.length === 0) return false;
  let ok = false;

  for (let i = 0; i < partialNodes.length; i++) {
    const infoN = partialNodes[i];
    const range = document.createRange();
    let s, e;
    if (i === 0) {
      s = startChar - infoN.start;
      e = infoN.node.nodeValue.length;
    } else if (i === partialNodes.length - 1) {
      s = 0;
      e = endChar - infoN.start;
    } else {
      s = 0;
      e = infoN.node.nodeValue.length;
    }
    try {
      range.setStart(infoN.node, Math.max(0, s));
      range.setEnd(infoN.node, Math.min(infoN.node.nodeValue.length, Math.max(0, e)));
      if (range.toString().trim().length > 0) {
        if (wrapRangeWithMark(range, markId)) ok = true;
      }
    } catch (e) {}
  }
  return ok;
}

function positionTooltip() {
  const sel = window.getSelection();
  const tooltip = document.getElementById("markTooltip");
  if (!sel || sel.isCollapsed || sel.rangeCount === 0) {
    tooltip.style.display = "none";
    tooltip.classList.remove("arrow-bottom", "arrow-top");
    return;
  }

  const range = sel.getRangeAt(0);
  const info = findChapterContainer(range.commonAncestorContainer);
  if (!info) {
    tooltip.style.display = "none";
    tooltip.classList.remove("arrow-bottom", "arrow-top");
    return;
  }

  const text = sel.toString().trim();
  if (text.length < 3) {
    tooltip.style.display = "none";
    tooltip.classList.remove("arrow-bottom", "arrow-top");
    return;
  }

  const rect = range.getBoundingClientRect();
  const scrollY = window.scrollY || document.documentElement.scrollTop;
  const scrollX = window.scrollX || document.documentElement.scrollLeft;
  const vh = Math.max(document.documentElement.clientHeight || 0, window.innerHeight || 0);

  tooltip.style.display = "block";
  const ttRect = tooltip.getBoundingClientRect();

  const GAP = 42;
  let preferBelow = rect.top < 130;
  let top;
  if (preferBelow) {
    top = scrollY + rect.bottom + GAP;
    if (top + ttRect.height > scrollY + vh - 10) {
      top = scrollY + rect.top - ttRect.height - GAP;
      tooltip.classList.remove("arrow-bottom");
      tooltip.classList.add("arrow-top");
    } else {
      tooltip.classList.remove("arrow-top");
      tooltip.classList.add("arrow-bottom");
    }
  } else {
    top = scrollY + rect.top - ttRect.height - GAP;
    if (top < scrollY + 10) {
      top = scrollY + rect.bottom + GAP;
      tooltip.classList.remove("arrow-top");
      tooltip.classList.add("arrow-bottom");
    } else {
      tooltip.classList.remove("arrow-bottom");
      tooltip.classList.add("arrow-top");
    }
  }

  let left = scrollX + rect.left + rect.width / 2 - ttRect.width / 2;
  if (left < scrollX + 8) left = scrollX + 8;
  const vw = Math.max(document.documentElement.clientWidth || 0, window.innerWidth || 0);
  if (left + ttRect.width > scrollX + vw - 8) {
    left = scrollX + vw - ttRect.width - 8;
  }

  tooltip.style.top = top + "px";
  tooltip.style.left = left + "px";
}

function wrapRangeWithMark(range, markId) {
  try {
    if (!range || range.collapsed || !range.toString().trim()) return false;

    if (range.startContainer === range.endContainer) {
      let container = range.startContainer;
      let safety = 0;
      while (container && safety < 20) {
        if (container.nodeType === 1 && container.classList && container.classList.contains("marked-text")) return false;
        if (container.nodeType === 1 && container.classList && container.classList.contains("chapter-content")) break;
        container = container.parentNode;
        safety++;
      }

      const span = document.createElement("span");
      span.className = "marked-text";
      span.dataset.markId = markId;
      span.title = "Clique para desmarcar este trecho 💔";

      try {
        range.surroundContents(span);
        attachHandlerToSpan(span);
        return true;
      } catch (e) {
        try {
          const frag = range.extractContents();
          span.appendChild(frag);
          range.insertNode(span);
          attachHandlerToSpan(span);
          return true;
        } catch (e2) {
          return false;
        }
      }
    }
  } catch (e) {
    return false;
  }
  return false;
}

function attachHandlerToSpan(span) {
  if (!span || span.dataset.handlerAttached === "1") return;
  span.dataset.handlerAttached = "1";
  span.addEventListener("click", (ev) => {
    ev.preventDefault();
    ev.stopPropagation();
    const id = span.dataset.markId;
    if (id && confirm("Deseja desmarcar este trecho? 💔")) {
      removeMark(id);
    }
  });
}

function markSelectedText() {
  const chId = getCurrentChapterId();
  if (chId == null) return;
  const ch = chapters.find(c => c.id === chId);
  if (!ch) return;

  const sel = window.getSelection();
  if (!sel || sel.isCollapsed || sel.rangeCount === 0) return;
  const range = sel.getRangeAt(0);
  const info = findChapterContainer(range.commonAncestorContainer);
  if (!info) return;

  const text = sel.toString().trim();
  if (text.length < 3) {
    showToast("✏️ Selecione pelo menos algumas palavrinhas para marcar 💖");
    return;
  }

  const containerEl = info.container;
  const side = info.pageSide;
  const pos = getRangeInContainer(range, containerEl);

  const duplicate = loadBookmarks().find(b =>
    b.chapterId === chId &&
    b.text === text &&
    b.contextBefore === pos.contextBefore &&
    b.contextAfter === pos.contextAfter
  );
  if (duplicate) {
    showToast("💝 Este trecho já está marcado!");
    sel.removeAllRanges();
    const tt = document.getElementById("markTooltip");
    if (tt) tt.style.display = "none";
    return;
  }

  const markId = ch.id + ":" + side + ":" + hashStr(text + pos.contextBefore + pos.contextAfter) + ":" + Date.now().toString(36);
  const ok = wrapCharRangeInContainer(containerEl, pos.startChar, pos.endChar, markId);
  if (!ok) {
    showToast("⚠️ Não foi possível marcar este trecho. Tente selecionar apenas o texto, sem passar sobre títulos ou divisórias.");
    return;
  }

  const list = loadBookmarks();
  list.unshift({
    id: markId,
    chapterId: ch.id,
    chapterNum: ch.num,
    chapterTitle: ch.title,
    pageSide: side,
    text: text,
    anchor: pos.text,
    startChar: pos.startChar,
    endChar: pos.endChar,
    length: pos.length,
    contextBefore: pos.contextBefore,
    contextAfter: pos.contextAfter,
    savedAt: Date.now()
  });
  saveBookmarks(list);
  sel.removeAllRanges();
  const tt = document.getElementById("markTooltip");
  if (tt) tt.style.display = "none";
  showToast("💖 Trecho salvo como uma das suas citações favoritas!");
}

function removeMark(id) {
  const list = loadBookmarks().filter(b => b.id !== id);
  saveBookmarks(list);
  document.querySelectorAll(`span.marked-text[data-mark-id="${CSS.escape(id)}"]`).forEach(span => {
    const parent = span.parentNode;
    while (span.firstChild) parent.insertBefore(span.firstChild, span);
    parent.removeChild(span);
    parent.normalize();
  });
  showToast("💔 Trecho desmarcado");
  if (currentView === "favorites") {
    renderFavoritesView();
  }
}

function clearAllMarks() {
  if (confirm("Tem certeza que quer apagar todos os marcadores? 💔")) {
    const list = loadBookmarks();
    list.forEach(b => {
      document.querySelectorAll(`span.marked-text[data-mark-id="${CSS.escape(b.id)}"]`).forEach(span => {
        const parent = span.parentNode;
        while (span.firstChild) parent.insertBefore(span.firstChild, span);
        parent.removeChild(span);
        parent.normalize();
      });
    });
    saveBookmarks([]);
    showToast("💔 Todos os marcadores foram removidos");
    if (currentView === "favorites") renderFavoritesView();
  }
}

/* Reaplica os marca-textos salvos nas duas páginas visíveis do capítulo */
function applySavedHighlights(chapterId) {
  const marks = loadBookmarks().filter(b => b.chapterId === chapterId);
  if (marks.length === 0) return;
  const containers = [
    document.querySelector("#pageLeft .chapter-content"),
    document.querySelector("#pageRight .chapter-content")
  ].filter(Boolean);
  if (containers.length === 0) return;

  const sorted = [...marks].sort((a, b) => (b.anchor || b.text).length - (a.anchor || a.text).length);
  sorted.forEach(mark => {
    let best = null;
    containers.forEach(c => {
      const info = getContainerText(c);
      const r = locateMark(info.fullText, mark);
      if (r && (!best || r.total > best.total)) best = { c, idx: r.idx, len: r.len, total: r.total };
    });
    if (best) wrapCharRangeInContainer(best.c, best.idx, best.idx + best.len, mark.id);
  });
  attachUnmarkHandlers();
}

function attachUnmarkHandlers() {
  document.querySelectorAll("span.marked-text").forEach(span => {
    if (span.dataset.handlerAttached === "1") return;
    span.dataset.handlerAttached = "1";
    span.addEventListener("click", (ev) => {
      ev.preventDefault();
      ev.stopPropagation();
      const id = span.dataset.markId;
      if (id && confirm("Deseja desmarcar este trecho? 💔")) {
        removeMark(id);
      }
    });
  });
}

/* O texto vem sempre do código (para as suas edições chegarem até ela).
   Só o rascunho feito no Modo Autor fica guardado no navegador. */
function loadChapters() {
  let saved = null;
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) saved = JSON.parse(raw);
  } catch (e) {}
  const author = isAuthorMode();
  return defaultChapters.map(dc => {
    let override = null;
    if (Array.isArray(saved)) override = saved.find(s => s && s.id === dc.id);
    return {
      ...dc,
      content: (author && override && override.draft === true && typeof override.content === "string") ? override.content : dc.content,
      unlocked: (override && typeof override.unlocked === "boolean") ? override.unlocked : (dc.unlocked || checkUnlocked(dc))
    };
  });
}

function saveChapters() {
  const author = isAuthorMode();
  localStorage.setItem(STORAGE_KEY, JSON.stringify(
    chapters.map(c => {
      const o = { id: c.id, unlocked: c.unlocked };
      const def = defaultChapters.find(d => d.id === c.id);
      if (author && def && c.content !== def.content) {
        o.content = c.content;
        o.draft = true;
      }
      return o;
    })
  ));
}

function checkUnlocked(ch) {
  if (!ch.unlockDate) return true;
  return new Date() >= new Date(ch.unlockDate);
}

function goBack() {

/* =========================================================
   📐 PAGINAÇÃO PELA ALTURA REAL DO TEXTO
   O texto é medido num elemento invisível com a mesma largura,
   fonte e altura útil da página. Cada página recebe só o que
   cabe, e um parágrafo longo continua na página seguinte
   (quebrando entre palavras). Nada é cortado, sem scroll.
   ========================================================= */
const pageCache = {};

function escapeHtml(s) {
  const div = document.createElement("div");
  div.textContent = s;
  return div.innerHTML;
}

function parseBlocks(text) {
  const norm = (text || "").replace(/\r/g, "").replace(/\n---+\n/g, "\n\n---\n\n");
  const blocks = [];
  norm.split(/\n\n+/).forEach(raw => {
    const t = raw.trim();
    if (!t) return;
    if (/^---+$/.test(t)) { blocks.push({ type: "break" }); return; }
    const isQuote = (t.startsWith('"') && t.endsWith('"')) || t.startsWith('—') || t.startsWith('-');
    blocks.push({ type: isQuote ? "quote" : "p", text: t });
  });
  return blocks;
}

function blockHTML(type, text, opts) {
  opts = opts || {};
  const body = escapeHtml(text).replace(/\n/g, "<br>");
  if (type === "quote") return `<div class="quote">${body}</div>`;
  const cls = [opts.dropcap ? "dropcap" : "", opts.cont ? "cont" : ""].filter(Boolean).join(" ");
  return `<p${cls ? ` class="${cls}"` : ""}>${body}</p>`;
}

function chapterHeaderHTML(ch) {
  const decor = "💕".repeat(5);
  return `<button class="back-toc" onclick="backToTOC()">← Sumário</button>
    <div class="chapter-header">
      <div class="ch-num">${ch.num}</div>
      <h2>${ch.title}</h2>
      <div class="ch-date">— ${ch.date} —</div>
      <div class="ch-heart">${decor}</div>
    </div>`;
}

const END_ORNAMENT = '<div class="end-ornament">✦ ✦ ✦ ✦ ✦</div>';

function paginateText(ch) {
  const page = document.getElementById("pageLeft");
  const cs = getComputedStyle(page);
  const width = page.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const H = page.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - 4;

  const m = document.createElement("div");
  m.style.cssText = `position:absolute;left:-10000px;top:0;width:${width}px;visibility:hidden;pointer-events:none;`;
  document.body.appendChild(m);

  const sides = [];
  let htmlList = [];
  let contentEl = null;

  const mk = html => {
    const t = document.createElement("div");
    t.innerHTML = html;
    return t.firstElementChild;
  };
  const reset = () => {
    m.innerHTML = (sides.length === 0 ? chapterHeaderHTML(ch) : "") + '<div class="chapter-content"></div>';
    contentEl = m.lastElementChild;
    htmlList = [];
  };
  const fits = html => {
    const n = mk(html);
    contentEl.appendChild(n);
    const ok = m.offsetHeight <= H;
    contentEl.removeChild(n);
    return ok;
  };
  const add = html => {
    contentEl.appendChild(mk(html));
    htmlList.push(html);
  };
  const flush = () => {
    sides.push(htmlList.join(""));
    reset();
  };

  reset();
  let first = true;

  parseBlocks(ch.content).forEach(b => {
    if (b.type === "break") {
      if (htmlList.length === 0) return;
      const h = '<div class="scene-break">✦ ✦ ✦</div>';
      if (fits(h)) add(h);
      return;
    }

    let text = b.text;
    let cont = false;
    let guard = 0;
    while (text && guard++ < 1000) {
      const opts = { dropcap: first && b.type === "p" && !cont, cont };
      const whole = blockHTML(b.type, text, opts);

      if (fits(whole)) {
        add(whole);
        if (b.type === "p") first = false;
        text = "";
        break;
      }

      const empty = htmlList.length === 0;

      // citações e parágrafos curtos não são divididos: vão inteiros para a próxima página
      if (b.type === "quote" || text.length < 140) {
        if (empty) { add(whole); if (b.type === "p") first = false; text = ""; break; }
        flush();
        continue;
      }

      // parágrafo longo: acha o maior trecho (em palavras) que ainda cabe
      const words = text.split(" ");
      let lo = 0, hi = words.length - 1;
      while (lo < hi) {
        const mid = Math.ceil((lo + hi) / 2);
        if (fits(blockHTML(b.type, words.slice(0, mid).join(" "), opts))) lo = mid;
        else hi = mid - 1;
      }
      // evita deixar poucas palavras sozinhas na página seguinte
      if (words.length - lo < 4 && words.length - 4 >= 6) lo = words.length - 4;

      if (lo < 1) {
        if (empty) { add(whole); if (b.type === "p") first = false; text = ""; break; }
        flush();
        continue;
      }
      // evita um começo de parágrafo minúsculo no fim da página
      if (lo < 6 && !empty) {
        flush();
        continue;
      }

      add(blockHTML(b.type, words.slice(0, lo).join(" "), opts));
      if (b.type === "p") first = false;
      text = words.slice(lo).join(" ");
      cont = true;
      flush();
    }
  });

  // o enfeite final só aparece se couber na última página (quando ela é a da direita)
  const lastIdx = sides.length;
  let footerOk = true;
  if (lastIdx % 2 === 1) footerOk = fits(END_ORNAMENT);
  sides.push(htmlList.join(""));

  document.body.removeChild(m);
  return { sides, footerOk, totalSpreads: Math.max(1, Math.ceil(sides.length / 2)) };
}

function getPagination(ch) {
  const page = document.getElementById("pageLeft");
  const sig = page.clientWidth + "x" + page.clientHeight + "|" + (fontsReady ? 1 : 0);
  const c = pageCache[ch.id];
  if (c && c.sig === sig && c.content === ch.content) return c.result;
  const result = paginateText(ch);
  pageCache[ch.id] = { sig, content: ch.content, result };
  return result;
}

function chapterStartPage(id) {
  let pages = 0;
  for (const c of chapters) {
    if (c.id >= id) break;
    const unlocked = c.unlocked || checkUnlocked(c);
    const n = unlocked ? getPagination(c).sides.length : 2;
    pages += Math.ceil(n / 2) * 2;
  }
  return 1 + pages;
}

function preloadFonts() {
  if (!document.fonts || !document.fonts.load) return Promise.resolve();
  const specs = [
    '400 18px "Cormorant Garamond"',
    'italic 400 18px "Cormorant Garamond"',
    '600 18px "Cormorant Garamond"',
    '700 18px "Cormorant Garamond"',
    '700 40px "Dancing Script"',
    '600 16px "Dancing Script"',
    '400 14px "Nunito"',
    '700 14px "Nunito"'
  ];
  const loads = specs.map(f => document.fonts.load(f).catch(() => {}));
  return Promise.race([Promise.all(loads), new Promise(r => setTimeout(r, 3000))]);
}

function relayout() {
  Object.keys(pageCache).forEach(k => delete pageCache[k]);
  if (currentView.startsWith("chapter-") && !editingCh1) {
    const id = parseInt(currentView.split("-")[1]);
    const ch = chapters.find(c => c.id === id);
    if (ch && (ch.unlocked || checkUnlocked(ch))) {
      const frac = totalSpreads > 0 ? currentSpread / totalSpreads : 0;
      const pag = getPagination(ch);
      currentSpread = Math.min(pag.totalSpreads - 1, Math.floor(frac * pag.totalSpreads));
    }
  }
  renderView();
}

let resizeTimer = null;
let lastPageSig = "";
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    const p = document.getElementById("pageLeft");
    const sig = p.clientWidth + "x" + p.clientHeight;
    if (sig === lastPageSig) return;
    lastPageSig = sig;
    relayout();
  }, 250);
});

    renderFavoritesView();

    renderChapter(chId);

  updateNavArrows();
  updateDraftPill();

function animateTurn() {
  if (!lastDir) return;
  const dx = lastDir === "next" ? 18 : -18;
  lastDir = null;
  ["leftContent", "rightContent"].forEach(id => {
    const el = document.getElementById(id);
    if (el && el.animate) {
      el.animate(
        [{ opacity: 0, transform: `translateX(${dx}px)` }, { opacity: 1, transform: "translateX(0)" }],
        { duration: 320, easing: "ease-out" }
      );
    }
  });
}

  startCountdowns();
}

  playPageFlipSound("prev");
  lastDir = "prev";
  editingCh1 = false;
  currentView = "toc";
  currentSpread = 0;
  totalSpreads = 1;
  renderView();
}

function renderChapter(id) {
  const ch = chapters.find(c => c.id === id);
  if (!ch) return;
  const isUnlocked = ch.unlocked || checkUnlocked(ch);

  if (!isUnlocked) {
    renderLockedChapter(ch);
    return;
  }

  if (id === 1 && editingCh1 && isAuthorMode()) {
    renderEditor(ch);
    return;
  }

  renderChapterPages(ch);
}

  const id = ch.id;
  const decor = "💕".repeat(5);
  totalSpreads = 1;
  currentSpread = 0;
  const start = chapterStartPage(id);
  document.getElementById("pageLeftNum").textContent = start.toString();
  document.getElementById("pageRightNum").textContent = (start + 1).toString();
  document.getElementById("pageIndicator").textContent = `📖 ${ch.num}`;
  document.getElementById("leftContent").innerHTML = `
    <button class="back-toc" onclick="backToTOC()">← Sumário</button>
    <div class="locked-cover">
      <div class="locked-big">🔐</div>
      <div class="locked-title">${ch.title}</div>
      <div class="locked-subtitle">${ch.num}</div>
      <div class="countdown">
        <div class="countdown-label">Este capítulo desbloqueia em</div>
        <div class="countdown-numbers" id="countdown-${id}">
          <span>--<small>Dias</small></span>
          <span>--<small>Horas</small></span>
          <span>--<small>Min</small></span>
          <span>--<small>Seg</small></span>

function updateNavArrows() {

  if (currentView === "toc" || currentView === "favorites") {

    const nextUnlocked = chapters.find(c => c.unlocked || checkUnlocked(c));
    next.disabled = !nextUnlocked;
    return;
  }
  const id = parseInt(currentView.split("-")[1]);
  const ch = chapters.find(c => c.id === id);
  const unlocked = ch && (ch.unlocked || checkUnlocked(ch));
  if (!unlocked) {
    prev.disabled = id <= 1;
    const nextCh = chapters.find(c => c.id === id + 1);
    next.disabled = !nextCh || (!nextCh.unlocked && !checkUnlocked(nextCh));
    return;
  }
  prev.disabled = (id <= 1 && currentSpread <= 0);
  if (currentSpread > 0) {
    prev.disabled = false;
  } else if (id > 1) {
    const prevCh = chapters.find(c => c.id === id - 1);
    prev.disabled = !(prevCh && (prevCh.unlocked || checkUnlocked(prevCh)));
  }
  if (currentSpread < totalSpreads - 1) {
    next.disabled = false;
  } else {
    const nextCh = chapters.find(c => c.id === id + 1);
    next.disabled = !nextCh || (!nextCh.unlocked && !checkUnlocked(nextCh));
  }
}

/* =========================================================
   🔊 SOM DE VIRAR PÁGINA (MP3 real da pasta efeitos/)
   Usa o áudio real; se não carregar, cai no fallback sintetizado.
   ========================================================= */
const PAGE_FLIP_MP3 = "efeitos/freesound_community-flipping-through-a-bookmp3-14415.mp3";

let audioCtx = null;
let noiseBuf = null;
let mp3Buf = null;
let mp3LoadAttempted = false;
let soundOn = localStorage.getItem(SOUND_KEY) !== "0";

function updateSoundBtn() {
  const b = document.getElementById("soundBtn");
  if (b) {
    b.textContent = soundOn ? "🔊" : "🔇";
    b.title = soundOn ? "Som ao virar a página: ligado" : "Som ao virar a página: desligado";
  }
}

function toggleSound() {
  soundOn = !soundOn;
  localStorage.setItem(SOUND_KEY, soundOn ? "1" : "0");
  updateSoundBtn();
  if (soundOn) playPageFlipSound("next");
}

function getAudio() {
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    audioCtx = new AC();
  }
  if (audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}

function loadMp3() {
  if (mp3LoadAttempted) return;
  mp3LoadAttempted = true;
  const ctx = getAudio();
  if (!ctx) return;
  try {
    fetch(PAGE_FLIP_MP3)
      .then(r => { if (!r.ok) throw new Error("404"); return r.arrayBuffer(); })
      .then(buf => ctx.decodeAudioData(buf))
      .then(decoded => { mp3Buf = decoded; })
      .catch(() => { mp3Buf = null; });
  } catch (e) { mp3Buf = null; }
}

/* tenta carregar o MP3 em background assim que o usuário interagir com a página */
document.addEventListener("click", () => { getAudio(); loadMp3(); }, { once: true });
document.addEventListener("keydown", () => { getAudio(); loadMp3(); }, { once: true });

/* ----- fallback sintetizado (se MP3 não carregar) ----- */
function getNoise(ctx) {
  if (noiseBuf && noiseBuf.sampleRate === ctx.sampleRate) return noiseBuf;
  const len = Math.floor(ctx.sampleRate * 0.8);
  noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let i = 0; i < len; i++) {
    d[i] = Math.random() * 2 - 1;
  }
  return noiseBuf;
}

function playSynthFallback(ctx, t0, direction) {
  const noise = getNoise(ctx);
  const master = ctx.createGain();
  master.gain.value = 0.9;
  const lp = ctx.createBiquadFilter();
  lp.type = "lowpass";
  lp.frequency.value = 8000;
  master.connect(lp);
  lp.connect(ctx.destination);

  const swooshDur = 0.12;
  const swoosh = ctx.createBufferSource();
  swoosh.buffer = noise;
  swoosh.playbackRate.value = direction === "prev"
    ? 1.6 + Math.random() * 0.3
    : 1.3 + Math.random() * 0.25;

  const bpSwoosh = ctx.createBiquadFilter();
  bpSwoosh.type = "bandpass";
  bpSwoosh.Q.value = 1.1;
  bpSwoosh.frequency.setValueAtTime(direction === "prev" ? 4800 : 1800, t0);
  bpSwoosh.frequency.exponentialRampToValueAtTime(
    direction === "prev" ? 1600 : 5200,
    t0 + swooshDur
  );

  const gSwoosh = ctx.createGain();
  gSwoosh.gain.setValueAtTime(0.0001, t0);
  gSwoosh.gain.exponentialRampToValueAtTime(0.42, t0 + 0.012);
  gSwoosh.gain.exponentialRampToValueAtTime(0.25, t0 + 0.04);
  gSwoosh.gain.exponentialRampToValueAtTime(0.0001, t0 + swooshDur);

  swoosh.connect(bpSwoosh);
  bpSwoosh.connect(gSwoosh);
  gSwoosh.connect(master);
  swoosh.start(t0, Math.random() * 0.3, swooshDur + 0.02);
  swoosh.stop(t0 + swooshDur + 0.02);

  const thud = ctx.createBufferSource();
  thud.buffer = noise;
  thud.playbackRate.value = 0.6 + Math.random() * 0.1;

  const bpThud = ctx.createBiquadFilter();
  bpThud.type = "lowpass";
  bpThud.frequency.value = 420;
  bpThud.Q.value = 1.4;

  const gThud = ctx.createGain();
  const tThud = t0 + (direction === "prev" ? 0.02 : 0.05);
  gThud.gain.setValueAtTime(0.0001, tThud);
  gThud.gain.exponentialRampToValueAtTime(0.55, tThud + 0.004);
  gThud.gain.exponentialRampToValueAtTime(0.0001, tThud + 0.09);

  thud.connect(bpThud);
  bpThud.connect(gThud);
  gThud.connect(master);
  thud.start(tThud, 0.1, 0.12);
  thud.stop(tThud + 0.12);

  const crack = ctx.createBufferSource();
  crack.buffer = noise;
  crack.playbackRate.value = 2.4 + Math.random() * 0.4;

  const hpCrack = ctx.createBiquadFilter();
  hpCrack.type = "highpass";
  hpCrack.frequency.value = 2600;

  const bpCrack = ctx.createBiquadFilter();
  bpCrack.type = "bandpass";
  bpCrack.frequency.value = 5800;
  bpCrack.Q.value = 2.2;

  const gCrack = ctx.createGain();
  const tCrack = t0 + (direction === "prev" ? 0.04 : 0.08);
  gCrack.gain.setValueAtTime(0.0001, tCrack);
  gCrack.gain.exponentialRampToValueAtTime(0.35, tCrack + 0.0015);
  gCrack.gain.exponentialRampToValueAtTime(0.0001, tCrack + 0.035);

  crack.connect(hpCrack);
  hpCrack.connect(bpCrack);
  bpCrack.connect(gCrack);
  gCrack.connect(master);
  crack.start(tCrack, 0.02, 0.05);
  crack.stop(tCrack + 0.05);

  const settleDur = 0.08;
  const settle = ctx.createBufferSource();
  settle.buffer = noise;
  settle.playbackRate.value = 0.85 + Math.random() * 0.2;

  const bpSettle = ctx.createBiquadFilter();
  bpSettle.type = "bandpass";
  bpSettle.Q.value = 0.8;
  bpSettle.frequency.value = 2200;

  const gSettle = ctx.createGain();
  const tSettle = tCrack + 0.02;
  gSettle.gain.setValueAtTime(0.0001, tSettle);
  gSettle.gain.exponentialRampToValueAtTime(0.13, tSettle + 0.008);
  gSettle.gain.exponentialRampToValueAtTime(0.0001, tSettle + settleDur);

  settle.connect(bpSettle);
  bpSettle.connect(gSettle);
  gSettle.connect(master);
  settle.start(tSettle, 0.4, settleDur + 0.02);
  settle.stop(tSettle + settleDur + 0.02);
}

function playPageFlipSound(direction) {
  if (!soundOn) return;
  try {
    const ctx = getAudio();
    if (!ctx) return;
    const t0 = ctx.currentTime + 0.003;

    /* MP3 carregado -> toca o áudio real com pitch-shift por direção */
    if (mp3Buf) {
      const src = ctx.createBufferSource();
      src.buffer = mp3Buf;

      /* "próxima" -> normal + pouco mais rápido/agudo
         "anterior" -> um pouco mais lento/grave (sensação de voltar) */
      const base = 1.0;
      src.playbackRate.value = direction === "prev"
        ? base * (0.92 + Math.random() * 0.06)
        : base * (1.0 + Math.random() * 0.08);

      /* pequeno corte no começo para tirar o silêncio inicial do MP3
         e amplifica um pouco caso o arquivo seja baixo */
      const startOffset = 0.05;
      const clipDur = Math.min(0.45, mp3Buf.duration - startOffset);

      const g = ctx.createGain();
      g.gain.value = 1.35;

      /* envelope de saída suave para não ter click no final do clip */
      const tEnd = t0 + clipDur;
      g.gain.setValueAtTime(1.35, Math.max(t0, tEnd - 0.02));
      if (tEnd - 0.02 > t0) {
        g.gain.setValueAtTime(1.35, tEnd - 0.02);
      }
      g.gain.exponentialRampToValueAtTime(0.0001, tEnd);

      src.connect(g);
      g.connect(ctx.destination);

      try {
        src.start(t0, startOffset, clipDur + 0.02);
      } catch (eOld) {
        try { src.start(t0, startOffset); } catch (eFinal) {}
      }
      return;
    }

    /* fallback: sintetizado */
    playSynthFallback(ctx, t0, direction);
  } catch (e) {}
}

function navPrev() {
  if (currentView === "toc") return;
  lastDir = "prev";
  if (currentView === "favorites") {
    playPageFlipSound("prev");
    currentView = "toc";
    renderView();
    return;
  }
  const id = parseInt(currentView.split("-")[1]);
  const ch = chapters.find(c => c.id === id);
  const unlocked = ch && (ch.unlocked || checkUnlocked(ch));
  if (unlocked && currentSpread > 0) {
    playPageFlipSound("prev");
    currentSpread--;
    renderView();
    return;
  }
  playPageFlipSound("prev");
  if (id > 1) {
    const prev = chapters.find(c => c.id === id - 1);
    if (prev && (prev.unlocked || checkUnlocked(prev))) {
      currentView = `chapter-${id - 1}`;
      totalSpreads = getPagination(prev).totalSpreads;
      currentSpread = totalSpreads - 1;
    } else {
      currentView = "toc";
      currentSpread = 0;
      totalSpreads = 1;
    }
  } else {
    currentView = "toc";
    currentSpread = 0;
    totalSpreads = 1;
  }
  renderView();
  startCountdowns();
}

function navNext() {
  lastDir = "next";
  if (currentView === "toc" || currentView === "favorites") {
    const first = chapters.find(c => c.unlocked || checkUnlocked(c));
    if (first) {
      playPageFlipSound("next");
      currentView = `chapter-${first.id}`;
      currentSpread = 0;
      renderView();
      startCountdowns();
    }
    return;
  }
  const id = parseInt(currentView.split("-")[1]);
  const ch = chapters.find(c => c.id === id);
  const unlocked = ch && (ch.unlocked || checkUnlocked(ch));
  if (unlocked && currentSpread < totalSpreads - 1) {
    playPageFlipSound("next");
    currentSpread++;
    renderView();
    return;
  }
  const nextCh = chapters.find(c => c.id === id + 1);
  if (nextCh && (nextCh.unlocked || checkUnlocked(nextCh))) {
    playPageFlipSound("next");
    currentView = `chapter-${id + 1}`;
    currentSpread = 0;
    renderView();
    startCountdowns();
  }
}

document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT") return;
  const selection = window.getSelection();
  if (selection && selection.toString().trim().length > 0) return;
  if (e.key === "ArrowLeft" || e.key === "PageUp" || e.key === "Backspace") {
    e.preventDefault();
    navPrev();
  } else if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " " || e.key === "Enter") {
    e.preventDefault();
    navNext();
  }
});

/* deslizar o dedo para virar a página (celular) */
const INTERACTIVE_SELECTOR = "button, a, textarea, input, .toc-entry, .back-toc, .editor-placeholder, .toc-quick-fav, .clear-fav, .fav-unmark, .bookmark-ribbon, .author-badge, .btn-edit, .edit-area, .fav-card, .nav-arrow, .mark-tooltip";
function attachPageClickHandlers() {
  const book = document.getElementById("book");
  if (!book) return;
  let sx = null, sy = null;
  book.addEventListener("touchstart", (e) => {
    if (e.target.closest(INTERACTIVE_SELECTOR) || e.touches.length !== 1) { sx = null; return; }
    sx = e.touches[0].clientX;
    sy = e.touches[0].clientY;
  }, { passive: true });
  book.addEventListener("touchend", (e) => {
    if (sx === null || e.changedTouches.length !== 1) return;
    const dx = e.changedTouches[0].clientX - sx;
    const dy = e.changedTouches[0].clientY - sy;
    sx = null;
    const sel = window.getSelection();
    if (sel && sel.toString().trim().length > 0) return;
    if (Math.abs(dx) > 60 && Math.abs(dy) < 60) {
      if (dx < 0) navNext(); else navPrev();
    }
  }, { passive: true });
}

let countdownInterval = null;
function startCountdowns() {
  if (countdownInterval) clearInterval(countdownInterval);
  const tick = () => {
    chapters.forEach(ch => {
      if (ch.unlocked || checkUnlocked(ch)) return;
      const el = document.getElementById(`countdown-${ch.id}`);
      if (!el) return;
      const now = new Date().getTime();
      const target = new Date(ch.unlockDate).getTime();
      let diff = target - now;
      if (diff <= 0) {
        ch.unlocked = true;
        saveChapters();
        renderView();
        return;
      }
      const d = Math.floor(diff / 86400000); diff -= d * 86400000;
      const h = Math.floor(diff / 3600000); diff -= h * 3600000;
      const m = Math.floor(diff / 60000); diff -= m * 60000;
      const s = Math.floor(diff / 1000);
      el.innerHTML = `
        <span>${String(d).padStart(2,'0')}<small>Dias</small></span>
        <span>${String(h).padStart(2,'0')}<small>Horas</small></span>
        <span>${String(m).padStart(2,'0')}<small>Min</small></span>
        <span>${String(s).padStart(2,'0')}<small>Seg</small></span>
      `;
    });
  };
  tick();
  countdownInterval = setInterval(tick, 1000);
}

updateSoundBtn();
renderView();
attachPageClickHandlers();
startCountdowns();
updateNewsBadge();
(function () {
  const p = document.getElementById("pageLeft");
  lastPageSig = p.clientWidth + "x" + p.clientHeight;
})();

/* Espera as fontes carregarem antes de paginar (senão a medida sai errada) */
preloadFonts().then(() => {
  fontsReady = true;
  relayout();
});
</script>
</body>
