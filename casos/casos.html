function tone(f,d=.15,t='triangle',dl=0){
 if(muted)return;
 try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();

}
function ambient(fx){
 try{
  if(amb){amb.g.gain.value=0;amb.n.stop();amb=null}

 }catch(e){}
}

const mkcs=i=>({loc:CS[i].L[0].id,o:[],f:[],ch:P.hard?1:3,sel:[],gone:[],over:false,nt:[],nerve:{},told:{},tone:'gentil',combos:[],t0:Date.now(),sec:0});
const loadcs=i=>{const s=P.cs[i];if(!s||s.over)return null;return{...s,o:[...s.o],f:[...s.f],sel:[...s.sel],gone:[...s.gone],nt:[...s.nt],combos:[...s.combos],nerve:{...s.nerve},told:{...s.told}}};
function save(){if(!cs||cs.over)return;cs.sec=Math.floor((Date.now()-cs.t0)/1000);P.cs[cur]={...cs};sv()}
const has=k=>cs.f.includes(k);
const addC=k=>{if(!cs||has(k))return;cs.f.push(k);sPick();toast('🔎 Nova prova: '+CS[cur].C[k]);ev()};
const nt=t=>{if(!cs.nt.includes(t)){cs.nt.push(t);save()}};
const feathers=()=>Object.keys(P.f).length;
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');

}
function reset(){

}

/* ===================== INÍCIO DO CASO ===================== */
function play(i){
 cur=i;
 const c=CS[i];
 const r=loadcs(i);
 if(r){cs=r;return fade(ui)}
 cs=mkcs(i);delete P.cs[i];
 const bad=P.r.slice(0,i).some(x=>x&&x!=='good')||P.w.length>0;
 modal(`<h2>Caso ${i+1}: ${c.n}</h2>
  <div class="say">${T(c.intro)}</div>
  ${bad&&c.intro2?`<div class="say" style="border-color:#ffd166;color:#ffd166"><i>${T(c.intro2)}</i></div>`:''}
  <div class="help">${c.L.length} locais · ${Object.keys(c.P).length} pessoas · ${Object.keys(c.C).length} provas possíveis</div>
  <div style="text-align:center"><button class="btn" id="go">Começar investigação</button><button class="btn" onclick="closeM();menu()">Voltar</button></div>`);
 $('go').onclick=()=>fade(()=>{$('md').style.display='none';save();ui()});
}

function scene(){

 $('ch').innerHTML='Provas '+cs.f.filter(k=>k!=='conf').length+'/'+tot+' · Chances: '+'❤️'.repeat(cs.ch)+'🖤'.repeat(Math.max(0,(P.hard?1:3)-cs.ch));

 $$('#tabs button').forEach(b=>b.onclick=()=>{cs.loc=b.dataset.l;sPop();scene();say('Você entra: '+c.L.find(x=>x.id===cs.loc).nm+'.')});

 const ppl=l.pe.filter(p=>!cs.gone.includes(p)).map(p=>{
   const h=c.P[p];return `<button class="sp2 per" data-p="${p}" style="left:${h.x}%;top:${h.y}%">${h.e}<small>${h.nm}</small></button>`}).join('');
 st.innerHTML=`<div class="wm">${l.ic}</div><div class="ov"></div>${spots}${ppl}<div class="vg"></div>`;
 $$('[data-i]',st).forEach(b=>b.onclick=()=>spot(l,+b.dataset.i));
 $$('[data-p]',st).forEach(b=>b.onclick=()=>talk(b.dataset.p));
 ev();save();
}
function ev(){
 const c=CS[cur];
 $('ev').innerHTML=cs.f.map(k=>`<button class="btn sm ${cs.sel.includes(k)?'sel':''}" data-k="${k}">${c.C[k]}</button>`).join('')||'Nenhuma ainda.';
 $$('#ev button').forEach(b=>b.onclick=()=>{const k=b.dataset.k;
  cs.sel.includes(k)?cs.sel.splice(cs.sel.indexOf(k),1):cs.sel.push(k);sPop();ev();save()});
}

/* ===================== INVESTIGAR OBJETO ===================== */
function spot(l,i){
 const s=l.S[i],key=l.id+i;
 if(s.n&&!has(s.n)){say(s.nr||'Falta algo para entender isso. Continue investigando.');tone(200,.1);shake();return}
 if(s.pz&&!cs.o.includes(key)){puzzle(s,key);return}
 reveal(s,key);
}
function reveal(s,key){
 const first=!cs.o.includes(key);
 if(first)cs.o.push(key);
 tone(450,.1);say(s.r);nt('🔎 '+s.t+': '+s.r);
 if(s.c)addC(s.c);
 if(s.f)feather(s.f);
 cs.fl=1;scene();
}
function feather(ch){
 const first=!P.f[cur];
 P.f[cur]=ch;sv();
 if(first){sDeep();
  modal(`<h2>🪶 Pena do Corvo</h2>
   <div class="say">Uma pena negra, deixada com cuidado, com uma letra escrita a nanquim: <b style="font-size:1.7rem;color:#ffd166">${ch}</b></div>
   <p class="sub">Alguém sabia que você passaria por aqui. Junte as letras dos cinco casos — elas abrem algo no último.</p>
   <div style="text-align:center"><button class="btn" onclick="closeM()">Guardar a pena</button></div>`);
  nt('🪶 Pena do Corvo: letra '+ch);}
}

/* ===================== ENIGMAS ===================== */
function puzzle(s,key){
 const z=s.pz;
 if(z.t==='code'){
  modal(`<h2>${s.e} ${s.t}</h2><p class="sub">${z.q}</p>
   <div style="text-align:center"><input class="inp" id="cd" maxlength="14" autocomplete="off"> <button class="btn" id="ok">Confirmar</button></div>
   <div id="pm" style="text-align:center;color:#ff8f8f;min-height:1.6em;margin-top:6px;font-weight:800"></div>
   <div style="text-align:center"><button class="btn" onclick="closeM()">Voltar</button></div>`);
  const go=()=>{
   if(norm2($('cd').value)===norm2(z.a)){$('md').style.display='none';sOk();reveal(s,key)}
   else{sBad();$('pm').textContent=z.fail?z.fail():'Combinação errada.';shake()}};
  $('ok').onclick=go;$('cd').onkeydown=e=>{if(e.key==='Enter')go()};$('cd').focus();return;
 }
 // ordem
 const items=z.items.map((t,i)=>({t,i}));
 let sh=items.slice(),n=0;
 do{sh.sort(()=>Math.random()-.5);n++}while(n<30&&sh.every((x,i)=>x.i===i));
 let seq=[];
 const draw=()=>{
  modal(`<h2>${s.e} ${s.t}</h2><p class="sub">${z.q}</p>
   <div class="say" style="min-height:52px">${seq.map((x,j)=>`<div>${j+1}. ${x.t}</div>`).join('')||'Toque nos eventos, na ordem correta.'}</div>
   <div class="items">${sh.filter(x=>!seq.includes(x)).map(x=>`<button class="btn mk" data-i="${x.i}">${x.t}</button>`).join('')}</div>
   <div style="text-align:center"><button class="btn" id="rs">Limpar</button><button class="btn" onclick="closeM()">Voltar</button></div>`);
  $$('[data-i]',$('md')).forEach(b=>b.onclick=()=>{
   seq.push(items[+b.dataset.i]);tone(400,.05);
   if(seq.length===items.length){
    if(seq.every((x,j)=>x.i===j)){$('md').style.display='none';sOk();reveal(s,key)}
    else{sBad();seq=[];draw();shake()}
   } else draw();});
  $('rs').onclick=()=>{seq=[];draw()};
 };
 draw();
}

/* ===================== INTERROGATÓRIO ===================== */
const TONES={gentil:['🤝 Gentil','cala a pessoa e ela relaxa'],firme:['🔥 Firme','pressiona mais, mas fecha portas'],empatico:['💗 Empática','abre confissões emocionais']};
function talk(id){
 const c=CS[cur],p=c.P[id];
 if(cs.nerve[id]==null)cs.nerve[id]=0;
 drawTalk(id,'Pode perguntar.','');
}
function drawTalk(id,text,extra){
 const c=CS[cur],p=c.P[id],nerve=cs.nerve[id]||0;
 const topics=p.Q.map((t,i)=>{
  const locked=t.req&&!has(t.req);
  const done=cs.told[id+'_'+i];
  return `<button class="btn mk ${done?'done':''}" ${locked?'disabled':''} data-q="${i}" style="margin:2px 0;border-color:#444">${locked?'🔒 ':''}${done?'✓ ':''}💬 ${t.q}</button>`}).join('');
 const evs=cs.f.filter(k=>k!=='conf').map(k=>`<button class="btn sm" data-k="${k}" style="border-style:dashed;border-color:#777">${c.C[k]}</button>`).join('')||'<div class="sub">Sem provas no inventário.</div>';
 modal(`
  <div class="port">${p.e}</div>
  <h2 style="margin-bottom:4px">${p.nm}</h2>
  <div class="nlab">NÍVEL DE NERVOSISMO — ${nerve}%</div>
  <div class="nerve"><i style="width:${Math.min(100,nerve)}%"></i></div>
  <div class="say" id="tw">${text}</div>
  ${extra?`<div class="help" style="background:#2a1a1a;padding:8px;border-radius:4px;color:#ffd166;margin:8px 0">${extra}</div>`:''}
  <div class="tones" style="border-top:1px solid #333;padding-top:10px">
    ${Object.keys(TONES).map(t=>`<button class="btn sm ${cs.tone===t?'on':''}" data-t="${t}" title="${TONES[t][1]}">${TONES[t][0]}</button>`).join('')}
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:15px">
    <div><b>Perguntas:</b><div style="margin-top:5px">${topics}</div></div>
    <div><b>Apresentar Prova:</b><div class="ev" style="margin-top:5px;display:flex;flex-direction:column;align-items:stretch">${evs}</div></div>
  </div>
  <div style="text-align:center;margin-top:20px;border-top:1px solid #333;padding-top:12px">
    <button class="btn" onclick="closeM()" style="background:#333;border-color:#666">Encerrar interrogatório</button>
  </div>`);
 typeIn($('tw'),text);nt('💬 '+p.nm+': '+text);
 $$('[data-t]',$('md')).forEach(b=>b.onclick=()=>{cs.tone=b.dataset.t;sPop();tone(520,.08);drawTalk(id,text,extra)});
 $$('[data-q]',$('md')).forEach(b=>b.onclick=()=>{
  const i=+b.dataset.q,t=p.Q[i];
  if(t.tone&&cs.tone!==t.tone){
   sBad();drawTalk(id,`${p.nm} se fecha. "Assim não vou falar. Tente outro tom comigo."`,'Essa pergunta pede o tom <b>'+TONES[t.tone][0]+'</b>.');return}
  cs.told[id+'_'+i]=1;save();
  let r=t.a;
  if(t.tone)r=r+' <span style="color:#ffd166;font-size:0.85em;opacity:0.8"> (tom correto)</span>';
  if(t.ev&&!has(t.ev)){addC(t.ev)}
  sPick();drawTalk(id,r,t.note||'');
 });
 $$('[data-k]',$('md')).forEach(b=>b.onclick=()=>pres(id,b.dataset.k));
}
function pres(id,k){
 const c=CS[cur],p=c.P[id],x=p.X&&p.X[k];
 const nerve=cs.nerve[id]||0;
 const mult=cs.tone==='firme'?1.6:cs.tone==='empatico'?1.15:1;
 if(!x){sBad();drawTalk(id,rnd(['Ela dá de ombros: "Isso não prova nada sobre mim."','Nada muda no rosto. Essa prova não pesa aqui.','"Interessante... mas não me diz nada."']));return}
 if(x.need&&nerve<x.need){
  sPop();
  drawTalk(id,x.wait||`${p.nm} respira fundo: "Você está no caminho, mas ainda não tem o bastante pra me apertar."`,
   `Falta pressão: <b>${nerve}%</b> de ${x.need}%. Encontre provas que <i>contradigam</i> a versão dela.`);
  return;
 }
 const gain=Math.round((x.n||14)*mult);
 cs.nerve[id]=Math.min(100,nerve+gain);
 const b=$('md').querySelector('.mb');if(b){b.classList.add('glow');setTimeout(()=>b.classList.remove('glow'),800)}
 if(x.g&&!has(x.g)){addC(x.g)}
 if(x.g==='conf'){sOk()}else{tone(300,.14)}
 nt('⚖️ '+p.nm+' confrontado(a): '+x.a);
 drawTalk(id,x.a,`Pressão: <b>${cs.nerve[id]}%</b>${x.g==='conf'?' · <b style="color:#7CFC00">confissão registrada</b>':''}`);
}

/* ===================== CADERNO ===================== */
function notebook(){
 const c=CS[cur]||null;
 if(!c){modal('<h2>📓 Caderno</h2><p class="sub">Entre em um caso para usar o caderno.</p><div style="text-align:center"><button class="btn" onclick="closeM()">Fechar</button></div>');return}
 modal(`<h2>📓 Caderno — ${c.n}</h2>
  <div class="say">${(cs.nt||[]).map(x=>`<div class="item">${x}</div>`).join('')||'Ainda sem anotações.'}</div>
  <div style="text-align:center"><button class="btn" onclick="closeM()">Fechar</button></div>`);
}

/* ===================== MURAL DE DEDUÇÕES ===================== */
function mural(){
 const c=CS[cur];if(!c)return;
 if(!cs.combos)cs.combos=[];
 const combos=c.combos||[];
 modal(`<h2>🧩 Mural</h2>
  <p class="sub">Selecione <b>duas provas</b> que se cruzam e descubra a dedução que ninguém percebeu.</p>
  <div id="mk1" class="mural">${cs.f.map(k=>`<div class="note" data-k="${k}">${c.C[k]}</div>`).join('')||'Sem provas.'}</div>
  <div id="dsc" class="say" style="border-color:#7CFC00;color:#cfe8b8">Nenhuma dedução ainda.</div>
  <b>Deduções feitas:</b>
  <div class="items">${combos.map(x=>`<div class="item">✔ ${x}</div>`).join('')||'—'}</div>
  <div style="text-align:center"><button class="btn" onclick="closeM()">Fechar</button></div>`);
 let pick=[];
 $$('#mk1 .note').forEach(n=>n.onclick=()=>{
  const k=n.dataset.k;
  if(pick.includes(k)){pick.splice(pick.indexOf(k),1);n.classList.remove('pick');return}
  pick.push(k);n.classList.add('pick');sPop();
  if(pick.length===2){
   const cb=(c.combos||[]).find(x=>(x.a===pick[0]&&x.b===pick[1])||(x.a===pick[1]&&x.b===pick[0]));
   if(cb){
    sOk();
    if(!cs.combos.includes(cb.r))cs.combos.push(cb.r);
    if(cb.c&&!has(cb.c))addC(cb.c);
    nt('🧩 Dedução: '+cb.r);
    $('dsc').innerHTML='<b>✅ '+cb.r+'</b>';
    save();
    setTimeout(()=>{closeM();mural()},900);
   }else{
    sBad();$('dsc').innerHTML='<b>✖ Essas duas peças não formam uma dedução.</b>';shake();
    pick=[];$$('#mk1 .note').forEach(n=>n.classList.remove('pick'));
   }
  }
 });
}

/* ===================== DICA ===================== */
function hint(){
 const c=CS[cur];if(!c||cs.over)return;
 cs.h=(cs.h||0)+1;P.nh++;save();
 if(P.hard){say('💡 O Modo Difícil está ligado: nenhuma dica aqui. Confie no seu caderno.');return}
 for(const l of c.L)for(let i=0;i<l.S.length;i++){
  const s=l.S[i],k=l.id+i;
  if(!cs.o.includes(k)&&(!s.n||has(s.n))){say('💡 Examine melhor: '+l.nm+' — há algo que você ainda não viu.');return}
 }
 for(const l of c.L)for(const p of l.pe)if(!cs.gone.includes(p)){
  const t=(c.P[p].Q||[]).some((q,i)=>!cs.told[p+'_'+i]&&(!q.req||has(q.req)));
  if(t){say('💡 '+c.P[p].nm+' ainda tem algo a dizer. Pergunte ou apresente uma prova.');return}
 }
 say('💡 Você já viu tudo. Use o Mural para cruzar provas e depois acuse.');
}

/* ===================== ACUSAÇÃO ===================== */
function acuse(){
 const c=CS[cur];if(!c||cs.over)return;
 const sus=Object.keys(c.P).filter(s=>!cs.gone.includes(s));
 const mots=c.mot.map((t,i)=>({t,i})).sort(()=>Math.random()-.5);
 modal(`<h2>⚖️ Acusação</h2>
  <p class="sub">Escolha o culpado, o motivo e até três provas que sustentam a acusação. A promotoria rejeita acusações sem lógica.</p>
  <b>Suspeito:</b><div id="sa">${sus.map(s=>`<button class="btn sm" data-s="${s}">${c.P[s].e} ${c.P[s].nm}</button>`).join('')}</div>
  <b>Motivo:</b><div id="ma">${mots.map(m=>`<button class="btn mk" data-m="${m.i}">${m.t}</button>`).join('')}</div>
  <b>Provas (até 3):</b><div class="ev" id="pe">${cs.f.map(k=>`<button class="btn sm" data-k="${k}">${c.C[k]}</button>`).join('')||'Nenhuma.'}</div>
  <div id="am" style="text-align:center;color:#ff8f8f;min-height:1.4em;font-weight:800;margin-top:6px"></div>
  <div style="text-align:center;margin-top:10px"><button class="btn" id="fire" style="background:#c1121f;border-color:#fff">Acusar!</button><button class="btn" onclick="closeM()">Voltar</button></div>`);
 let who=null,mot=null,ps=[];
 $$('#sa button').forEach(b=>b.onclick=()=>{who=b.dataset.s;$$('#sa button').forEach(x=>x.classList.toggle('on',x===b));sPop()});
 $$('#ma button').forEach(b=>b.onclick=()=>{mot=+b.dataset.m;$$('#ma button').forEach(x=>x.classList.toggle('on',x===b));sPop()});
 $$('#pe button').forEach(b=>b.onclick=()=>{const k=b.dataset.k;
  if(ps.includes(k)){ps.splice(ps.indexOf(k),1)}
  else if(ps.length<3){ps.push(k)}else{$('am').textContent='No máximo três provas.';return}
  b.classList.toggle('sel');});
 $('fire').onclick=()=>{
  if(!who||mot===null){$('am').textContent='Escolha o suspeito e o motivo.';return}
  const strong=ps.includes('conf')||c.key.filter(k=>ps.includes(k)).length>=2;
  if(who===c.cul&&mot===0&&strong){closeM();end('good');return}
  cs.ch--;sBad();
  let t;
  if(who!==c.cul){
   t=c.W[who]||`${c.P[who].nm} é detido(a) injustamente.`;
   if(!P.w.includes(c.P[who].nm))P.w.push(c.P[who].nm);
   cs.gone.push(who);
  }else if(mot!==0){
   t='O promotor balança a cabeça: o motivo não fecha com os fatos. O culpado sorri, ganhando tempo.';
  }else{
   t='A promotoria rejeita: as provas não bastam para sustentar a acusação. O culpado ganha tempo.';
  }
  save();
  if(cs.ch<=0){closeM();end('fail',t);return}
  modal(`<h2>Acusação rejeitada</h2><div class="say">${t}</div>
   <p class="sub">${who!==c.cul?c.P[who].nm+' sai da investigação. ':''}Restam ${cs.ch} chance(s).</p>
   <div style="text-align:center"><button class="btn" onclick="closeM()">Voltar à investigação</button></div>`);
 };
}

/* ===================== FIM ===================== */
function end(r,t=''){
 const c=CS[cur];cs.over=true;delete P.cs[cur];
 const stars=Math.max(1,3-(3-cs.ch)-((cs.h||0)>3?1:0));
 if(P.r[cur]!=='good')P.r[cur]=r;
 if(r==='good'){P.s[cur]=Math.max(P.s[cur]||0,stars);sOk()}
 sv();
 if(r!=='good')emitirPenal();
 const last=cur===CS.length-1;
 modal(`<h2>${r==='good'?'Caso encerrado! 🔎':'O culpado escapou'}</h2>
  ${r==='good'?`<div style="text-align:center;font-size:2.1rem">${'⭐'.repeat(stars)}</div>`:''}
  ${t?`<div class="say">${t}</div>`:''}
  <div class="say" style="border-color:${r==='good'?'#7CFC00':'#c1121f'}">${r==='good'?c.ok:c.esc}</div>
  <div class="help">Tempo ${fmt(cs.sec)} · Acusações erradas ${(P.hard?1:3)-cs.ch} · Dicas ${cs.h||0}</div>
  <div style="text-align:center">
   ${last?`<button class="btn" onclick="closeM();finale()">Ver o desfecho final</button>`
        :`<button class="btn" onclick="closeM();play(${cur+1})">Próximo caso →</button>`}
   <button class="btn" onclick="closeM();menu()">Voltar aos casos</button>
  </div>`);
}
function emitirPenal(){/* reservado para expansões */}

function finale(){
 ambient(null);
 const g=P.r.slice(0,5).filter(r=>r==='good').length,w=P.w.length,res=P.r[5]==='good',f=feathers();
 const sc=P.s.reduce((a,b)=>a+(b||0),0);
 const t=g===5&&!w?['Detetive Impecável 🏆','Cinco casos, cinco culpados, nenhum inocente na cadeia.']
  :g>=3?['Justiça Imperfeita ⚖️',`Você resolveu ${g} dos 5 casos${w?', mas '+w+' inocente(s) pagou/pagaram o preço: '+P.w.join(', '):''}. Seu nome é respeitado e temido.`]
  :['A Cidade Sem Fé 🌫️',`Só ${g} dos 5 casos resolvido(s). Culpados soltos e inocentes marcados${w?' ('+P.w.join(', ')+')':''}.`];
 let h='';for(let i=0;i<26;i++)h+=`<span class="ht" style="left:${Math.random()*100}%;animation-duration:${4+Math.random()*5}s;animation-delay:${Math.random()*4}s;font-size:${1+Math.random()*1.4}rem">${['💗','❤️','💘','🪶'][i%4]}</span>`;
 app.innerHTML=h+`<h1>${res?'O Corvo era você 💘':t[0]}</h1>
  <div class="sub">${res?`Parabéns, ${P.nm}: nenhum mistério resiste a você.`:`${t[1]}`}</div>
  ${res?`<div class="big">${MSG}<br><br><b style="color:#ff5d8f">— ${ELE}</b><br><br>${VALE}</div>`:''}
  <div class="stats"><span>🕵️ Casos: ${g}/5${res?' + final':''}</span><span>⭐ ${sc} estrelas</span><span>🪶 ${f}/5 penas</span><span>⚖️ Inocentes acusados: ${w}</span><span>💡 Dicas: ${P.nh}</span></div>
  <div style="text-align:center"><button class="btn" onclick="menu()">Voltar aos casos</button></div>`;
}
menu();
</script></body></html>
