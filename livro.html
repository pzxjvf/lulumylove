<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📖 O Livro da Nossa História</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Dancing+Script:wght@600;700&family=Nunito:wght@400;700&display=swap" rel="stylesheet">

<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(ellipse at top, #3a0ca3 0%, transparent 60%),
      radial-gradient(ellipse at bottom, #7209b7 0%, transparent 60%),
      linear-gradient(135deg, #1a0033 0%, #2d0050 50%, #0a0020 100%);
    font-family: "Cormorant Garamond", serif;
    color: #3a2817;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 15px 40px;
    overflow-x: hidden;
  }

  .top-bar {
    width: 100%;
    max-width: 1000px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    color: #fff;
    font-family: "Nunito", sans-serif;
    z-index: 10;
  }

  .back-btn {
    background: rgba(255,255,255,0.12);
    border: 1.5px solid rgba(255,255,255,0.3);
    color: white;
    padding: 8px 18px;
    border-radius: 25px;
    font-family: "Nunito", sans-serif;
    font-weight: 700;
    cursor: pointer;
    backdrop-filter: blur(10px);
    transition: 0.3s;
  }
  .back-btn:hover {
    background: rgba(255,255,255,0.22);
    transform: scale(1.05);
  }

  .page-indicator {
    background: rgba(255,255,255,0.12);
    border: 1.5px solid rgba(255,255,255,0.3);
    padding: 8px 16px;
    border-radius: 25px;
    font-weight: 700;
    backdrop-filter: blur(10px);
    font-size: 0.9em;
  }

  .book-title {
    text-align: center;
    margin-bottom: 18px;
    z-index: 5;
  }
  .book-title h1 {
    font-family: "Dancing Script", cursive;
    font-size: clamp(2rem, 5vw, 3.2rem);
    margin: 0;
    background: linear-gradient(135deg, #ffd700, #ff9ecf, #c77dff, #ffd700);
    background-size: 300% 300%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: shimmer 4s ease infinite;
    text-shadow: 0 0 30px rgba(199, 125, 255, 0.3);
  }
  .book-title p {
    color: rgba(255,255,255,0.75);
    font-family: "Nunito", sans-serif;
    font-size: 0.95em;
    margin: 5px 0 0;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  @keyframes shimmer {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }

  .book-wrapper {
    perspective: 2000px;
    width: 100%;
    max-width: 1000px;
    display: flex;
    justify-content: center;
  }

  .book {
    width: 100%;
    max-width: 960px;
    min-height: 620px;
    position: relative;
    transform-style: preserve-3d;
    display: flex;
    border-radius: 8px;
    box-shadow:
      0 0 0 2px #4a2c1a,
      0 0 0 5px #6b3f24,
      0 25px 60px rgba(0,0,0,0.6),
      0 15px 30px rgba(0,0,0,0.5),
      inset 0 0 80px rgba(139, 90, 43, 0.1);
    background: #6b3f24;
  }

  .book-spine {
    width: 28px;
    min-height: 620px;
    background: linear-gradient(to right,
      #3a1f10 0%,
      #5a3318 25%,
      #7a4a28 50%,
      #5a3318 75%,
      #3a1f10 100%);
    position: relative;
    box-shadow:
      inset -3px 0 6px rgba(0,0,0,0.5),
      inset 3px 0 6px rgba(255,255,255,0.05);
    z-index: 3;
    flex-shrink: 0;
  }
  .book-spine::before {
    content: "";
    position: absolute;
    top: 30px;
    left: 50%;
    transform: translateX(-50%);
    width: 16px;
    height: 40px;
    background: linear-gradient(180deg, #ffd700, #ff9ecf);
    border-radius: 2px;
    opacity: 0.9;
    box-shadow: 0 2px 5px rgba(0,0,0,0.3);
  }
  .book-spine::after {
    content: "";
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    width: 16px;
    height: 40px;
    background: linear-gradient(180deg, #ff9ecf, #c77dff);
    border-radius: 2px;
    opacity: 0.9;
    box-shadow: 0 2px 5px rgba(0,0,0,0.3);
  }

  .page {
    flex: 1;
    min-height: 620px;
    padding: 45px 50px 60px;
    position: relative;
    overflow-y: auto;
    max-height: 80vh;
  }

  .page-left {
    background:
      linear-gradient(to right,
        rgba(139, 90, 43, 0.08) 0%,
        transparent 5%,
        transparent 95%,
        rgba(139, 90, 43, 0.04) 100%),
      repeating-linear-gradient(
        180deg,
        transparent 0px,
        transparent 31px,
        rgba(139, 90, 43, 0.05) 31px,
        rgba(139, 90, 43, 0.05) 32px
      ),
      radial-gradient(ellipse at 20% 10%, rgba(255, 235, 180, 0.5), transparent 50%),
      radial-gradient(ellipse at 80% 90%, rgba(210, 170, 120, 0.2), transparent 50%),
      linear-gradient(180deg, #fdf6e3 0%, #f5ecd3 50%, #f3e7c9 100%);
    box-shadow: inset 15px 0 25px -15px rgba(0,0,0,0.2);
    border-right: 1px solid rgba(139, 90, 43, 0.15);
  }

  .page-right {
    background:
      linear-gradient(to left,
        rgba(139, 90, 43, 0.08) 0%,
        transparent 5%,
        transparent 95%,
        rgba(139, 90, 43, 0.04) 100%),
      repeating-linear-gradient(
        180deg,
        transparent 0px,
        transparent 31px,
        rgba(139, 90, 43, 0.05) 31px,
        rgba(139, 90, 43, 0.05) 32px
      ),
      radial-gradient(ellipse at 80% 10%, rgba(255, 235, 180, 0.5), transparent 50%),
      radial-gradient(ellipse at 20% 90%, rgba(210, 170, 120, 0.2), transparent 50%),
      linear-gradient(180deg, #fdf6e3 0%, #f5ecd3 50%, #f3e7c9 100%);
    box-shadow: inset -15px 0 25px -15px rgba(0,0,0,0.2);
    border-left: 1px solid rgba(139, 90, 43, 0.15);
  }

  .page::-webkit-scrollbar { width: 6px; }
  .page::-webkit-scrollbar-track { background: transparent; }
  .page::-webkit-scrollbar-thumb {
    background: rgba(139, 90, 43, 0.3);
    border-radius: 3px;
  }

  .page-number {
    position: absolute;
    bottom: 18px;
    font-family: "Cormorant Garamond", serif;
    font-style: italic;
    color: #6b4423;
    font-size: 0.95em;
    opacity: 0.8;
  }
  .page-left .page-number { left: 50px; }
  .page-right .page-number { right: 50px; }

  .page-corner {
    position: absolute;
    width: 40px;
    height: 40px;
    background: linear-gradient(135deg, rgba(0,0,0,0.05) 0%, transparent 50%);
  }
  .page-left .page-corner { top: 0; right: 0; border-top-right-radius: 8px; }
  .page-right .page-corner { top: 0; left: 0; border-top-left-radius: 8px; }

  .toc-entry {
    padding: 14px 18px;
    border-bottom: 1px dashed rgba(107, 68, 35, 0.3);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    cursor: pointer;
    transition: 0.25s;
    border-radius: 6px;
    margin-bottom: 4px;
    position: relative;
  }
  .toc-entry:hover:not(.locked) {
    background: rgba(255, 200, 150, 0.2);
    transform: translateX(4px);
  }

  .toc-entry.unlocked {
    background: linear-gradient(90deg, rgba(199, 125, 255, 0.12), transparent);
    border-left: 3px solid #c77dff;
  }
  .toc-entry.unlocked:hover {
    background: linear-gradient(90deg, rgba(199, 125, 255, 0.22), rgba(255, 158, 207, 0.1));
  }

  .toc-entry.locked {
    opacity: 0.6;
    cursor: not-allowed;
    filter: grayscale(0.3);
  }
  .toc-entry.locked::after {
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      45deg,
      transparent,
      transparent 10px,
      rgba(107, 68, 35, 0.04) 10px,
      rgba(107, 68, 35, 0.04) 20px
    );
    pointer-events: none;
    border-radius: 6px;
  }

  .toc-info { flex: 1; min-width: 0; }

  .toc-chapter {
    font-family: "Nunito", sans-serif;
    font-size: 0.75em;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: #8a5a2b;
    font-weight: 700;
    margin-bottom: 3px;
  }

  .toc-title {
    font-family: "Cormorant Garamond", serif;
    font-size: 1.25em;
    font-weight: 600;
    color: #3a2817;
    line-height: 1.2;
  }

  .toc-date {
    text-align: right;
    flex-shrink: 0;
  }
  .toc-date .date-label {
    font-family: "Nunito", sans-serif;
    font-size: 0.7em;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #8a5a2b;
    font-weight: 700;
  }
  .toc-date .date-value {
    font-family: "Cormorant Garamond", serif;
    font-size: 1.1em;
    font-weight: 600;
    color: #5a3a1a;
  }

  .lock-icon {
    font-size: 1.5em;
    margin-left: 8px;
    flex-shrink: 0;
  }

  .divider-dot {
    width: 6px;
    height: 6px;
    background: #c77dff;
    border-radius: 50%;
    margin: 0 4px;
  }

  .chapter-header {
    text-align: center;
    margin-bottom: 30px;
    padding-bottom: 20px;
    border-bottom: 2px double rgba(107, 68, 35, 0.3);
  }
  .chapter-header .ch-num {
    font-family: "Nunito", sans-serif;
    font-size: 0.75em;
    text-transform: uppercase;
    letter-spacing: 3px;
    color: #c77dff;
    font-weight: 700;
    margin-bottom: 6px;
  }
  .chapter-header h2 {
    font-family: "Dancing Script", cursive;
    font-size: 2.4em;
    margin: 0;
    color: #3a2817;
    line-height: 1.1;
  }
  .chapter-header .ch-date {
    margin-top: 10px;
    font-family: "Cormorant Garamond", serif;
    font-style: italic;
    color: #6b4423;
    font-size: 1.05em;
  }
  .chapter-header .ch-heart {
    margin-top: 12px;
    font-size: 1.3em;
    color: #c77dff;
    letter-spacing: 8px;
  }

  .chapter-content {
    font-family: "Cormorant Garamond", serif;
    font-size: 1.15em;
    line-height: 1.75;
    color: #2e1f10;
  }
  .chapter-content p {
    text-indent: 1.8em;
    margin: 0 0 14px;
    text-align: justify;
  }
  .chapter-content p:first-of-type::first-letter {
    font-family: "Dancing Script", cursive;
    font-size: 3.5em;
    float: left;
    line-height: 0.9;
    padding: 4px 8px 0 0;
    color: #c77dff;
    font-weight: 700;
  }

  .chapter-content .quote {
    border-left: 3px solid #c77dff;
    padding: 8px 20px;
    margin: 20px 0;
    font-style: italic;
    background: rgba(199, 125, 255, 0.08);
    border-radius: 0 8px 8px 0;
    color: #5a3a7a;
  }

  .editor-placeholder {
    font-family: "Nunito", sans-serif;
    background: rgba(199, 125, 255, 0.1);
    border: 2px dashed rgba(199, 125, 255, 0.5);
    padding: 14px 18px;
    border-radius: 12px;
    margin: 20px 0;
    text-align: center;
    font-size: 0.85em;
    color: #7a4a9a;
    cursor: pointer;
    transition: 0.3s;
  }
  .editor-placeholder:hover {
    background: rgba(199, 125, 255, 0.2);
    border-color: #c77dff;
    transform: scale(1.02);
  }

  .edit-area {
    width: 100%;
    min-height: 180px;
    padding: 15px;
    border: 2px solid #c77dff;
    border-radius: 10px;
    background: rgba(255, 250, 240, 0.9);
    font-family: "Cormorant Garamond", serif;
    font-size: 1.1em;
    line-height: 1.7;
    color: #2e1f10;
    resize: vertical;
    outline: none;
    transition: 0.3s;
  }
  .edit-area:focus {
    box-shadow: 0 0 0 3px rgba(199, 125, 255, 0.25);
    border-color: #9d4edd;
  }

  .edit-actions {
    display: flex;
    gap: 10px;
    margin-top: 12px;
    justify-content: flex-end;
  }
  .btn-edit {
    font-family: "Nunito", sans-serif;
    font-weight: 700;
    padding: 8px 18px;
    border-radius: 20px;
    border: none;
    cursor: pointer;
    transition: 0.25s;
    font-size: 0.9em;
  }
  .btn-save {
    background: linear-gradient(135deg, #c77dff, #9d4edd);
    color: white;
    box-shadow: 0 4px 12px rgba(157, 78, 221, 0.4);
  }
  .btn-save:hover { transform: scale(1.05); box-shadow: 0 6px 18px rgba(157, 78, 221, 0.5); }
  .btn-cancel {
    background: rgba(107, 68, 35, 0.1);
    color: #6b4423;
    border: 1.5px solid rgba(107, 68, 35, 0.3);
  }
  .btn-cancel:hover { background: rgba(107, 68, 35, 0.2); }

  .locked-cover {
    position: relative;
    min-height: 400px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
  }
  .locked-big {
    font-size: 5rem;
    margin-bottom: 20px;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.2));
    animation: float 3s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }
  .locked-title {
    font-family: "Dancing Script", cursive;
    font-size: 1.8em;
    color: #5a3a1a;
    margin-bottom: 10px;
  }
  .locked-subtitle {
    font-family: "Nunito", sans-serif;
    font-size: 0.85em;
    color: #8a5a2b;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 16px;
    font-weight: 700;
  }
  .countdown {
    background: linear-gradient(135deg, rgba(199, 125, 255, 0.15), rgba(255, 158, 207, 0.15));
    border: 2px dashed rgba(199, 125, 255, 0.5);
    padding: 16px 24px;
    border-radius: 16px;
    margin-top: 10px;
  }
  .countdown-label {
    font-family: "Nunito", sans-serif;
    font-size: 0.7em;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: #8a5a7a;
    font-weight: 700;
    margin-bottom: 6px;
  }
  .countdown-numbers {
    font-family: "Cormorant Garamond", serif;
    font-size: 1.6em;
    font-weight: 700;
    color: #6b3a9a;
  }
  .countdown-numbers span {
    display: inline-block;
    min-width: 55px;
  }
  .countdown-numbers small {
    display: block;
    font-family: "Nunito", sans-serif;
    font-size: 0.45em;
    color: #8a5a2b;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 700;
  }

  .back-toc {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: "Nunito", sans-serif;
    font-size: 0.8em;
    font-weight: 700;
    color: #c77dff;
    cursor: pointer;
    background: rgba(199, 125, 255, 0.1);
    padding: 6px 14px;
    border-radius: 18px;
    border: 1.5px solid rgba(199, 125, 255, 0.35);
    transition: 0.25s;
    margin-bottom: 15px;
  }
  .back-toc:hover {
    background: rgba(199, 125, 255, 0.2);
    transform: translateX(-3px);
  }

  .dedication {
    text-align: center;
    padding: 20px 0 30px;
  }
  .dedication-text {
    font-family: "Dancing Script", cursive;
    font-size: 1.4em;
    color: #6b4423;
    line-height: 1.5;
    font-style: italic;
  }
  .dedication-sign {
    margin-top: 15px;
    font-family: "Cormorant Garamond", serif;
    font-style: italic;
    color: #8a5a2b;
  }

  .toc-header {
    text-align: center;
    margin-bottom: 25px;
  }
  .toc-header h3 {
    font-family: "Dancing Script", cursive;
    font-size: 2em;
    margin: 0 0 6px;
    color: #3a2817;
  }
  .toc-header .toc-decor {
    color: #c77dff;
    letter-spacing: 10px;
    font-size: 0.9em;
  }

  .nav-arrows {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 12px;
    z-index: 20;
  }
  .nav-arrow {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: linear-gradient(135deg, #c77dff, #9d4edd);
    color: white;
    border: none;
    cursor: pointer;
    font-size: 1.3em;
    box-shadow: 0 6px 18px rgba(157, 78, 221, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: 0.25s;
  }
  .nav-arrow:hover:not(:disabled) { transform: scale(1.1); }
  .nav-arrow:disabled {
    opacity: 0.35;
    cursor: not-allowed;
    box-shadow: none;
  }

  .toast {
    position: fixed;
    top: 30px;
    right: 30px;
    background: linear-gradient(135deg, #38b000, #7b2cbf);
    color: white;
    padding: 14px 24px;
    border-radius: 16px;
    font-family: "Nunito", sans-serif;
    font-weight: 700;
    box-shadow: 0 8px 24px rgba(0,0,0,0.35);
    z-index: 9999;
    animation: toastIn 0.4s ease forwards;
    display: none;
    max-width: 340px;
    line-height: 1.5;
    white-space: pre-line;
  }
  @keyframes toastIn {
    from { opacity: 0; transform: translateX(30px); }
    to { opacity: 1; transform: translateX(0); }
  }
  @keyframes toastOut {
    to { opacity: 0; transform: translateX(30px); }
  }

  .author-badge {
    font-family: "Nunito", sans-serif;
    font-size: 0.75em;
    font-weight: 700;
    background: linear-gradient(135deg, #ffd700, #ff9ecf);
    color: #3a1f50;
    padding: 6px 12px;
    border-radius: 16px;
    cursor: pointer;
    transition: 0.25s;
    border: 1.5px solid rgba(255,255,255,0.4);
    user-select: none;
    white-space: nowrap;
  }
  .author-badge:hover {
    transform: scale(1.06);
    box-shadow: 0 4px 12px rgba(255, 158, 207, 0.5);
  }

  @media (max-width: 768px) {
    .book { flex-direction: column; max-width: 100%; }
    .book-spine { width: 100%; min-height: 22px; }
    .book-spine::before, .book-spine::after { display: none; }
    .page { min-height: auto; padding: 28px 22px 70px; max-height: none; overflow: visible; }
    .page-left, .page-right { box-shadow: none; border: none; }
    .page-left { border-bottom: 1px solid rgba(139, 90, 43, 0.15); }
    .page-number { display: none; }
    .book-title h1 { font-size: 2.2rem; }
    .chapter-header h2 { font-size: 1.8em; }
    .chapter-content { font-size: 1.05em; }
    .toc-title { font-size: 1.1em; }
    .nav-arrows { bottom: 15px; }
  }
</style>
</head>
<body>

<div class="top-bar">
  <button class="back-btn" onclick="goBack()">← Voltar</button>
  <div class="page-indicator" id="pageIndicator">📖 Sumário</div>
  <div style="width:95px; display:flex; justify-content:flex-end;" id="authorSlot"></div>
</div>

<div class="book-title">
  <h1>O Livro da Nossa História</h1>
  <p>✨ Cada capítulo, um pedaço do nosso amor ✨</p>
</div>

<div class="book-wrapper">
  <div class="book" id="book">
    <div class="book-spine"></div>

    <div class="page page-left" id="pageLeft">
      <div class="page-corner"></div>
      <div id="leftContent"></div>
      <div class="page-number" id="pageLeftNum">i</div>
    </div>

    <div class="page page-right" id="pageRight">
      <div class="page-corner"></div>
      <div id="rightContent"></div>
      <div class="page-number" id="pageRightNum">ii</div>
    </div>
  </div>
</div>

<div class="nav-arrows" id="navArrows">
  <button class="nav-arrow" id="prevBtn" onclick="navPrev()" title="Anterior">‹</button>
  <button class="nav-arrow" id="nextBtn" onclick="navNext()" title="Próximo">›</button>
</div>

<div class="toast" id="toast">💾 Salvo com sucesso!</div>

<script>
/* =========================================================
   🌟 AREA PARA EDITAR O LIVRO 🌟
   Tudo que for alterado aqui sera publicado para ela quando
   voce subir o site (Netlify). Basta editar e dar deploy!
   =========================================================
   Campos de cada capitulo:
   - num:        "Capitulo I", "Capitulo II"...
   - title:      Titulo bonito do capitulo
   - date:       Data visual (ex: "29 de Janeiro de 2023")
   - unlockDate: Quando desbloqueia ("YYYY-MM-DDTHH:mm:ss")
                 Deixe null para liberar agora
   - unlocked:   true = ja esta liberado | false = cadeado
   - content:    A historia (pule linhas com Enter)
   ========================================================= */

const LIVRO_CONFIG = {
  tituloGeral:  "O Livro da Nossa Historia",
  subtituloGeral: "✨ Cada capitulo, um pedaco do nosso amor ✨",
};

const defaultChapters = [

  /* ========== CAPITULO 1 ========== */

const STORAGE_KEY = "livro_capitulos_v1";
const AUTHOR_STORAGE_KEY = "livro_modo_autor_v1";

let chapters = loadChapters();
let currentView = "toc";
let editingCh1 = false;

function isAuthorMode() {
  const params = new URLSearchParams(window.location.search);
  if (params.get("modo") === "autor" || params.get("autor") === "1") {
    localStorage.setItem(AUTHOR_STORAGE_KEY, "1");
    return true;
  }
  return localStorage.getItem(AUTHOR_STORAGE_KEY) === "1";
}

function loadChapters() {
  return defaultChapters.map(dc => ({
    ...dc,
    unlocked: dc.unlocked || checkUnlocked(dc)
  }));
}

function saveChapters() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(
    chapters.map(c => ({ id: c.id, unlocked: c.unlocked }))
  ));
}

function checkUnlocked(ch) {
  if (!ch.unlockDate) return true;
  return new Date() >= new Date(ch.unlockDate);
}

function goBack() {
  window.location.href = "menu.html";
}

function renderView() {
  updateAuthorBadge();
  if (currentView === "toc") {
    renderTOC();
    document.getElementById("pageIndicator").textContent = "📖 Sumário";
  } else {
    const chId = parseInt(currentView.split("-")[1]);
    renderChapter(chId);
  }
  updateNavArrows();
}

function updateAuthorBadge() {
  const slot = document.getElementById("authorSlot");
  if (!slot) return;
  if (isAuthorMode()) {
    slot.innerHTML = `<div class="author-badge" onclick="exitAuthorMode()" title="Clique para sair do modo autor (visualizar como ela vai ver)">✍️ Modo Autor</div>`;
  } else {
    slot.innerHTML = "";
  }
}

function exitAuthorMode() {
  localStorage.removeItem(AUTHOR_STORAGE_KEY);
  editingCh1 = false;
  renderView();
  showToast("💜 Saiu do Modo Autor.\nAgora voce esta vendo exatamente como ela vai ver! ✨");
}

function startEdit() {
  if (!isAuthorMode()) return;
  editingCh1 = true;
  renderView();
  setTimeout(() => {
    const ta = document.getElementById("ch1editor");
    if (ta) ta.focus();
  }, 100);
}

function cancelEdit() {
  if (!isAuthorMode()) return;
  editingCh1 = false;
  renderView();
}

function saveEdit() {
  if (!isAuthorMode()) return;
  const ta = document.getElementById("ch1editor");
  if (!ta) return;
  chapters[0].content = ta.value;
  editingCh1 = false;
  renderView();
  showToast("💾 Rascunho salvo! Copie o texto e cole no arquivo livro.html para publicar para ela 💜");
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.style.display = "block";
  t.style.animation = "toastIn 0.4s ease forwards";
  setTimeout(() => {
    t.style.animation = "toastOut 0.4s ease forwards";
    setTimeout(() => { t.style.display = "none"; t.style.animation = ""; }, 400);
  }, 3800);
}

function formatContent(text) {
  if (!text) return "";
  const paras = text.split(/\n\n+/).filter(p => p.trim());
  if (paras.length === 0) {
    return `<p>${escapeHtml(text).replace(/\n/g, "<br>")}</p>`;
  }
  return paras.map(p => {
    if (p.startsWith('"') && p.endsWith('"')) {
      return `<div class="quote">${escapeHtml(p).replace(/\n/g, "<br>")}</div>`;
    }
    return `<p>${escapeHtml(p).replace(/\n/g, "<br>")}</p>`;
  }).join("");
}

function splitContent(text) {
  if (!text) return { left: "", right: "" };
  const parts = text.split(/\n---\n/);
  if (parts.length >= 2) {
    return { left: parts[0].trim(), right: parts.slice(1).join("\n---\n").trim() };
  }
  const paras = text.split(/\n\n+/).filter(p => p.trim());
  const mid = Math.max(1, Math.ceil(paras.length / 2));
  return {
    left: paras.slice(0, mid).join("\n\n"),
    right: paras.slice(mid).join("\n\n")
  };
}

function escapeHtml(s) {
  const div = document.createElement("div");
  div.textContent = s;
  return div.innerHTML;
}

function updateNavArrows() {
  const prev = document.getElementById("prevBtn");
  const next = document.getElementById("nextBtn");
  if (currentView === "toc") {
    prev.disabled = true;
    const nextUnlocked = chapters.find(c => c.unlocked || checkUnlocked(c));
    next.disabled = !nextUnlocked;
  } else {
    const id = parseInt(currentView.split("-")[1]);
    prev.disabled = false;
    const nextCh = chapters.find(c => c.id === id + 1);
    next.disabled = !nextCh || (!nextCh.unlocked && !checkUnlocked(nextCh));
  }
}

function navPrev() {
  if (currentView === "toc") return;
  const id = parseInt(currentView.split("-")[1]);
  if (id > 1) {
    const prev = chapters.find(c => c.id === id - 1);
    if (prev && (prev.unlocked || checkUnlocked(prev))) {
      currentView = `chapter-${id - 1}`;
    } else {
      currentView = "toc";
    }
  } else {
    currentView = "toc";
  }
  renderView();
  startCountdowns();
}

function navNext() {
  if (currentView === "toc") {
    const first = chapters.find(c => c.unlocked || checkUnlocked(c));
    if (first) { currentView = `chapter-${first.id}`; renderView(); startCountdowns(); }
    return;
  }
  const id = parseInt(currentView.split("-")[1]);
  const nextCh = chapters.find(c => c.id === id + 1);
  if (nextCh && (nextCh.unlocked || checkUnlocked(nextCh))) {
    currentView = `chapter-${id + 1}`;
    renderView();
    startCountdowns();
  }
}

let countdownInterval = null;
function startCountdowns() {
  if (countdownInterval) clearInterval(countdownInterval);
  const tick = () => {
    chapters.forEach(ch => {
      if (ch.unlocked || checkUnlocked(ch)) return;
      const el = document.getElementById(`countdown-${ch.id}`);
      if (!el) return;
      const now = new Date().getTime();
      const target = new Date(ch.unlockDate).getTime();
      let diff = target - now;
      if (diff <= 0) {
        ch.unlocked = true;
        saveChapters();
        renderView();
        return;
      }
      const d = Math.floor(diff / 86400000); diff -= d * 86400000;
      const h = Math.floor(diff / 3600000); diff -= h * 3600000;
      const m = Math.floor(diff / 60000); diff -= m * 60000;
      const s = Math.floor(diff / 1000);
      el.innerHTML = `
        <span>${String(d).padStart(2,'0')}<small>Dias</small></span>
        <span>${String(h).padStart(2,'0')}<small>Horas</small></span>
        <span>${String(m).padStart(2,'0')}<small>Min</small></span>
        <span>${String(s).padStart(2,'0')}<small>Seg</small></span>
      `;
    });
  };
  tick();
  countdownInterval = setInterval(tick, 1000);
}

renderView();
startCountdowns();
</script>
</body>
</html>
