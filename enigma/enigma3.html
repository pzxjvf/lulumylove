<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>O Enigma do Cantinho III — O Observatório 🔭</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
<style>
:root{--wall:#26304a;--paper:#e0c9a6}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#0a0a0a;font-family:'Nunito',sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
button,select{font-family:inherit}
#game{position:fixed;inset:0;background:var(--wall);border:14px solid #000;overflow:hidden}
.vignette{position:absolute;inset:0;background:radial-gradient(circle,transparent 25%,rgba(0,0,0,.55) 70%,rgba(0,0,0,.9) 100%);pointer-events:none;z-index:100}
.hand-drawn{filter:url(#rough-edge)}
#scene{position:absolute;inset:0;padding:70px 120px 20px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:auto}
#scene.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
@keyframes bob{50%{transform:translateY(-6px)}}
.title{position:absolute;top:50px;left:0;right:110px;text-align:center;color:rgba(255,255,255,.45);font-family:'Dancing Script',cursive;font-size:clamp(1.5rem,3.6vw,2.6rem);pointer-events:none;z-index:60}
.sub{margin-top:18px;color:#fff;font-family:'Dancing Script',cursive;font-size:clamp(1.1rem,2.2vw,1.6rem);text-align:center;max-width:85%}
.paper{background:var(--paper);color:#000;border:3px solid #000;padding:12px 18px;font-weight:800;font-size:.95rem;line-height:1.5;box-shadow:6px 6px 0 rgba(0,0,0,.35);transform:rotate(-1deg);max-width:min(560px,80vw)}
.paper b{font-family:'Dancing Script',cursive;font-size:1.3rem}
.topbar{position:absolute;top:14px;left:14px;right:14px;display:flex;gap:10px;z-index:400;align-items:center;flex-wrap:wrap}
.pill{color:#fff;text-decoration:none;font-weight:800;border:2px solid #fff;padding:8px 16px;border-radius:30px;background:rgba(0,0,0,.5);cursor:pointer;font-size:.9rem;transition:.25s}
.pill:hover{background:#fff;color:#000}
.spacer{flex:1}
#timer,#prog{color:#fff;font-weight:800;font-family:monospace;background:rgba(0,0,0,.5);padding:6px 12px;border-radius:20px;border:2px solid #555}
#prog{display:flex;align-items:center;gap:8px}
#bar{width:90px;height:8px;background:#222;border-radius:4px;overflow:hidden}
#bar i{display:block;height:100%;background:linear-gradient(90deg,#3a86ff,#c77dff);transition:width .6s}
.inventory{position:absolute;right:16px;top:50%;transform:translateY(-50%);width:88px;background:rgba(0,0,0,.85);border:4px solid #000;border-radius:10px;display:flex;flex-direction:column;padding:12px 10px;gap:10px;z-index:200;max-height:80vh;overflow:auto}
.inv-slot{width:62px;height:62px;flex:none;background:#222;border:3px solid #444;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:1.9rem;cursor:pointer}
.inv-slot.active{border-color:#fff;background:#333;box-shadow:0 0 15px rgba(255,255,255,.35)}
.room{position:relative;width:min(860px,calc(100vw - 180px));height:min(500px,62vh)}
.gdn{position:absolute;cursor:pointer;line-height:1;transition:filter .2s,left .25s,top .25s}
.gdn:hover{filter:brightness(1.25)}
.gate{position:absolute;right:2%;bottom:0;width:170px;height:310px;border:6px solid #000;background:repeating-linear-gradient(90deg,#1a1a1a 0 10px,transparent 10px 26px),rgba(0,0,0,.25);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:3rem;transition:transform .9s;transform-origin:right}
.gate.open{transform:perspective(500px) rotateY(-70deg)}
.moons{display:flex;gap:14px;margin-top:20px;flex-wrap:wrap;justify-content:center}
.btn{background:#222;color:#fff;border:3px solid #000;padding:10px 16px;font-weight:800;font-size:1rem;cursor:pointer;border-radius:6px}
.btn:hover{background:#444}
.btn:disabled{opacity:.45;cursor:default}
.btn.sm{padding:8px 12px;min-width:44px}
.bigopt{font-size:2.2rem;padding:6px 16px}
.opt2{font-size:1rem;padding:10px 14px;max-width:270px}
.clock-ctrl{display:flex;gap:8px;margin-top:14px;align-items:center;flex-wrap:wrap;justify-content:center}
.cipher{font-family:monospace;font-size:1.3rem;color:#c77dff;background:#000;border:3px solid #333;padding:10px 16px;letter-spacing:3px;text-align:center;max-width:92%;word-break:break-word}
.txt{background:#000;color:#fff;border:3px solid #333;padding:10px 14px;font-size:1.1rem;font-weight:800;text-transform:uppercase;text-align:center;outline:none;width:200px;user-select:text;-webkit-user-select:text}
.sel{background:#000;color:#fff;border:3px solid #333;padding:8px 12px;font-weight:800;font-size:1rem}
.swap{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:16px}
.swap.col{flex-direction:column;align-items:stretch;max-width:420px;margin-left:auto;margin-right:auto}
.sitem{min-width:70px;padding:10px;background:#222;border:4px solid #000;border-radius:8px;cursor:pointer;color:#fff;font-weight:800;text-align:center;transition:transform .2s;display:flex;align-items:center;justify-content:center;gap:10px}
.sitem.up{transform:translateY(-12px);box-shadow:0 0 14px #fff}
.pairs{display:flex;gap:30px;margin-top:16px}
.pcol{display:flex;flex-direction:column;gap:8px}
.pb{min-width:150px;font-size:1.05rem}
.okp{background:#2a6a2a;color:#fff;opacity:.7}
.selp{outline:3px solid #fff}
.cell{width:56px;height:56px;background:#222;border:3px solid #000;color:#fff;font-size:1.7rem;font-weight:800;display:flex;align-items:center;justify-content:center;cursor:pointer}
.cell.fix{background:#4a3a22;cursor:default}
.mcell{width:46px;height:46px;background:#222;border:3px solid #000;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.5rem}
.mcell.on{background:#c77dff;box-shadow:0 0 12px #7b2cbf}
.mcell.fx{cursor:default}
.mgrid{display:grid;gap:3px;background:#000;padding:6px;border:6px solid #000}
.dark{position:absolute;inset:0;z-index:50;pointer-events:none;background:radial-gradient(circle at var(--x,50%) var(--y,50%),transparent 0,transparent 26px,rgba(0,0,0,.99) 90px)}
.uvhint{position:absolute;bottom:24px;left:0;right:110px;text-align:center;color:#fff;z-index:120;font-style:italic;font-family:'Dancing Script';font-size:1.4rem}
.tubes{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:16px}
.tube{width:54px;height:190px;border:5px solid #000;border-radius:0 0 26px 26px;background:rgba(0,0,0,.4);display:flex;flex-direction:column-reverse;cursor:pointer;overflow:hidden}
.tube.sel{box-shadow:0 0 16px #fff}
.tl{height:25%;border-top:2px solid #000}
.keys{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.pkey{width:76px;height:140px;border:5px solid #000;border-radius:0 0 12px 12px;cursor:pointer;opacity:.75;box-shadow:0 8px 0 rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;font-size:1.8rem;padding-bottom:8px}
.pkey.lit{opacity:1;filter:brightness(1.6);transform:translateY(6px);box-shadow:0 2px 0 rgba(0,0,0,.4)}
.dots{margin-top:16px;display:flex;gap:8px}
.dot{width:14px;height:14px;border-radius:50%;border:3px solid #fff}
.dot.f{background:#fff}
.mm{display:flex;flex-direction:column;align-items:center;gap:10px}
.mm-hist{background:rgba(0,0,0,.55);border:3px solid #000;padding:10px 16px;min-width:300px;height:170px;overflow:auto;font-family:monospace;color:#fff;font-size:1.2rem}
.mm-row{display:flex;justify-content:space-between;gap:20px;letter-spacing:4px}
.pg{color:#7CFC00}.pw{color:#ffd166}
.mm-cur{font-size:1.8rem;background:#000;border:3px solid #333;padding:4px 20px;letter-spacing:8px;min-width:200px;text-align:center;color:#555}
.mm-keys{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.message-box{position:absolute;bottom:34px;left:50%;transform:translateX(-50%);background:#000;color:#fff;padding:12px 24px;border:3px solid #fff;font-size:1.3rem;z-index:500;opacity:0;transition:.3s;pointer-events:none;font-family:'Dancing Script',cursive;max-width:80vw;text-align:center}
.message-box.show{opacity:1}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:1100;display:none;align-items:center;justify-content:center;padding:20px}
.modal-box{background:#1a1a1a;border:4px solid #fff;border-radius:10px;padding:22px;color:#fff;max-width:520px;width:100%;max-height:85vh;overflow:auto}
.modal-box h2{margin:0 0 12px;font-family:'Dancing Script',cursive;font-size:2rem}
.note-item{padding:8px 0;border-bottom:1px solid #333;font-size:.95rem;line-height:1.45}
.note-item.frag{color:#ffd166;font-weight:800}
#intro{position:fixed;inset:0;z-index:1800;background:#000;display:none;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;padding:30px;pointer-events:none}
#intro .n{color:#c77dff;letter-spacing:4px;font-weight:800}
#intro h1{font-family:'Dancing Script',cursive;font-size:clamp(2.6rem,8vw,5rem);margin:6px 0}
#intro p{color:#bbb;font-style:italic;max-width:520px;font-size:1.1rem}
#intro.go{display:flex;animation:intro 2.2s forwards}
@keyframes intro{0%{opacity:0}18%,75%{opacity:1}100%{opacity:0}}
.pt{position:absolute;width:9px;height:9px;border-radius:2px;z-index:600;pointer-events:none}
#menu{position:fixed;inset:0;background:radial-gradient(circle,#1a2238,#000 75%);z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;padding:20px;overflow:auto}
.menu-title{font-family:'Dancing Script',cursive;font-size:clamp(2.4rem,6vw,4rem);margin-bottom:6px;text-shadow:0 0 20px rgba(255,255,255,.5);text-align:center}
.menu-sub{color:#999;margin-bottom:22px;font-style:italic;text-align:center;max-width:640px}
.stage-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px;width:min(920px,100%)}
.stage-card{padding:16px 10px;background:#1a1a1a;border:3px solid #333;border-radius:10px;cursor:pointer;transition:.3s;text-align:center}
.stage-card:hover:not(.locked){border-color:#fff;transform:translateY(-6px);background:#222}
.stage-card.locked{opacity:.3;cursor:not-allowed}
.stage-card.done{border-color:#c77dff}
.stage-card .num{font-size:.7rem;color:#888;letter-spacing:2px}
.stage-card .ico{font-size:1.7rem;margin:6px 0}
.stage-card .name{font-size:1rem;font-weight:800}
.menu-foot{margin-top:24px;display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:center}
.menu-stats{margin-top:16px;color:#aaa;font-size:.9rem}
label.hard{color:#ffd166;font-weight:800;font-size:.9rem;cursor:pointer}
.fade{position:fixed;inset:0;background:#000;z-index:2000;pointer-events:none;opacity:0;transition:.7s}
#ending{position:fixed;inset:0;z-index:1500;background:radial-gradient(circle,#1a2238,#000);display:none;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;padding:30px}
#ending h1{font-family:'Dancing Script',cursive;font-size:clamp(2.4rem,7vw,4.4rem);margin:0 0 14px;text-shadow:0 0 25px #c77dff}
#ending p{max-width:600px;font-size:1.15rem;line-height:1.6}
.rank{font-size:5rem;font-weight:800;color:#ffd166;text-shadow:0 0 20px #ffd166;margin:6px 0}
@media(max-width:700px){#scene{padding:70px 100px 10px 6px}.inventory{width:76px}.inv-slot{width:52px;height:52px}.room{transform:scale(.7);transform-origin:top center}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<svg style="display:none"><filter id="rough-edge"><feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2"/></filter></svg>
<div class="fade" id="fade"></div>
<div id="intro"><div class="n" id="inN"></div><h1 id="inT"></h1><p id="inS"></p></div>
<div id="menu">
  <div class="menu-title">O Enigma do Cantinho III</div>
  <div class="menu-sub">O Observatório. Do alto da colina, o céu esconde o último segredo. Vinte e nove enigmas, sem contas: só lógica, memória, palavras e olhos atentos.</div>
  <button class="pill" id="contBtn" onclick="continuar()" style="display:none;margin-bottom:16px;font-size:1rem"></button>
  <div class="stage-list" id="stageList"></div>
  <div class="menu-foot">
    <a href="enigma2.html" class="pill">← Parte 2</a>
    <a href="../jogos_hub.html" class="pill">Sair</a>
    <a href="enigma4.html" class="pill">Parte 4 →</a>
    <label class="hard"><input type="checkbox" id="hardChk" onchange="setHard(this.checked)"> Modo Difícil (sem dicas, desafios maiores)</label>
    <button class="pill" onclick="resetProgress()">Reiniciar progresso</button>
  </div>
  <div class="menu-stats" id="menuStats"></div>
</div>
<div id="game">
  <div class="vignette"></div>
  <div class="topbar">
    <button class="pill" onclick="openMenu()">☰ Capítulos</button>
    <button class="pill" onclick="showNotebook()">📓 Caderno</button>
    <button class="pill" onclick="showHint()">💡 Dica</button>
    <div class="spacer"></div>
    <div id="prog"><span id="progT"></span><div id="bar"><i></i></div></div>
    <div id="timer">⏱ 00:00</div>
    <button class="pill" id="muteBtn" onclick="toggleMute()">🔊</button>
  </div>
  <div class="title" id="chTitle"></div>
  <div class="message-box" id="msgBox"></div>
  <div class="inventory" id="inventory"></div>
  <div id="scene"></div>
</div>
<div id="modal"></div>
<div id="ending">
  <h1>O céu se abriu!</h1>
  <p id="endText"></p>
  <div class="rank" id="endRank"></div>
  <p id="endStats" style="color:#aaa;font-size:1rem"></p>
  <div style="margin-top:26px;display:flex;gap:12px;flex-wrap:wrap;justify-content:center">
    <a class="pill" href="enigma2.html">← Parte 2</a>
    <button class="pill" onclick="location.href='../jogos_hub.html'">Voltar ao hub</button>
    <button class="pill" onclick="replay()">Jogar de novo</button>
    <button class="pill" onclick="location.href='enigma4.html'">Parte 4 →</button>
  </div>
</div>

<script>
const LS_KEY='enigma_cantinho3_v1';
const DEF=()=>({unlocked:1,frag:{},notes:[],sec:0,hints:0,errors:0,hard:false});
function loadProgress(){try{const d=JSON.parse(localStorage.getItem(LS_KEY));if(d&&d.unlocked)return Object.assign(DEF(),d)}catch(e){}return DEF()}
const S={stage:0,tok:0,inv:[],sel:null,p:loadProgress(),muted:false,hintIdx:0,busy:false,done:false,kp:null};
const saveProgress=()=>{try{localStorage.setItem(LS_KEY,JSON.stringify(S.p))}catch(e){}};
const $id=id=>document.getElementById(id);
const sceneEl=$id('scene'),msgBox=$id('msgBox'),fade=$id('fade');
const $=(s,r=sceneEl)=>r.querySelector(s),$$=(s,r=sceneEl)=>[...r.querySelectorAll(s)];
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=rnd(0,i);[a[i],a[j]]=[a[j],a[i]]}return a}
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toUpperCase();

/* som */
let actx=null,drone=null;
function ac(){if(!actx){try{actx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}return actx}
function tone(f,dur=.15,type='sine',vol=.12,delay=0){
  if(S.muted)return;const c=ac();if(!c)return;if(c.state==='suspended')c.resume();
  const t=c.currentTime+delay,o=c.createOscillator(),g=c.createGain();
  o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur);
}
function startDrone(){const c=ac();if(!c)return;if(c.state==='suspended')c.resume();if(drone)return;const g=c.createGain();g.gain.value=S.muted?0:.025;g.connect(c.destination);[44,66,88.5].forEach(f=>{const o=c.createOscillator();o.type='sine';o.frequency.value=f;o.connect(g);o.start()});drone=g}
const sfx={click:()=>tone(300,.05,'square',.05),pick(){tone(660,.1,'triangle');tone(880,.15,'triangle',.1,.08)},
  ok(){[523,659,784,1047].forEach((f,i)=>tone(f,.25,'triangle',.12,i*.1))},bad(){tone(140,.3,'sawtooth',.1);navigator.vibrate&&navigator.vibrate(80)},
  creak(){tone(90,.5,'sawtooth',.06);tone(120,.4,'sawtooth',.05,.2)}};
function toggleMute(){S.muted=!S.muted;$id('muteBtn').textContent=S.muted?'🔇':'🔊';if(drone)drone.gain.value=S.muted?0:.025}
function burst(n=40){
  const g=$id('game'),w=g.clientWidth/2,h=g.clientHeight/2;
  for(let i=0;i<n;i++){const p=document.createElement('i');p.className='pt';p.style.cssText=`left:${w}px;top:${h}px;background:hsl(${rnd(0,360)},90%,60%)`;g.appendChild(p);
    const a=Math.random()*6.28,d=rnd(120,380);
    p.animate([{transform:'translate(0,0)',opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d+120}px) rotate(540deg)`,opacity:0}],{duration:rnd(800,1400),easing:'ease-out'}).onfinish=()=>p.remove()}
}
function shakeScene(){sceneEl.classList.remove('shake');void sceneEl.offsetWidth;sceneEl.classList.add('shake')}
let msgTimer;
function showMsg(t,ms=3000){msgBox.textContent=t;msgBox.classList.add('show');clearTimeout(msgTimer);msgTimer=setTimeout(()=>msgBox.classList.remove('show'),ms)}
function fail(msg){S.p.errors++;saveProgress();sfx.bad();shakeScene();showMsg(msg)}
function addNote(t){if(!S.p.notes.includes(t)){S.p.notes.push(t);saveProgress()}}
function openModal(html,onMount){const m=$id('modal');m.innerHTML=`<div class="modal-box">${html}<div style="margin-top:16px;text-align:center"><button class="btn" id="mclose">Fechar</button></div></div>`;m.style.display='flex';$id('mclose').onclick=closeModal;if(onMount)onMount(m.querySelector('.modal-box'))}
function closeModal(){$id('modal').style.display='none'}
function showNotebook(){if(!S.stage)return;const n=S.p.notes;openModal('<h2>📓 Caderno</h2>'+(n.length?n.map(t=>`<div class="note-item ${t.startsWith('Fragmento')?'frag':''}">${t}</div>`).join(''):'<div class="note-item">Ainda não há anotações.</div>'))}
addEventListener('keydown',e=>{
  if(e.key==='Escape')closeModal();
  else if(S.kp&&document.activeElement.tagName!=='INPUT'){if(e.key.startsWith('Arrow'))e.preventDefault();S.kp(e.key)}
});

/* inventário */
function addItem(id,icon){if(S.inv.find(i=>i.id===id))return;S.inv.push({id,icon});renderInv();sfx.pick();showMsg('Você obteve: '+id)}
function removeItem(id){S.inv=S.inv.filter(i=>i.id!==id);if(S.sel===id)S.sel=null;renderInv()}
function renderInv(){
  const el=$id('inventory');el.innerHTML='';
  for(let i=0;i<Math.max(4,S.inv.length);i++){
    const it=S.inv[i],d=document.createElement('div');d.className='inv-slot'+(it&&S.sel===it.id?' active':'');
    if(it){d.textContent=it.icon;d.title=it.id;d.onclick=()=>{sfx.click();S.sel=S.sel===it.id?null:it.id;renderInv();if(S.sel)showMsg('Selecionado: '+it.id,1800)}}
    el.appendChild(d);
  }
}

/* menu */
const ICONS=['🔭','🧩','🐘','🔤','🌗','🔐','🪞','🔡','🀄','🛠️','👻','🧙','🔦','🔄','🧪','🔔','📜','🔳','🕵️','🐾','🪐','🎨','🧠','🧊','📚','🗂️','👁️','🛡️','🌑'];
function renderMenu(){
  const list=$id('stageList');list.innerHTML='';
  STAGES.forEach((st,i)=>{const n=i+1,locked=n>S.p.unlocked,done=n<S.p.unlocked,c=document.createElement('div');
    c.className='stage-card'+(locked?' locked':'')+(done?' done':'');
    c.innerHTML=`<div class="num">CAPÍTULO ${n}</div><div class="ico">${locked?'🔒':ICONS[i]}</div><div class="name">${st.nome}</div>`;
    if(!locked)c.onclick=()=>startStage(n);list.appendChild(c)});
  $id('hardChk').checked=S.p.hard;
  const cb=$id('contBtn');if(S.p.unlocked>1||S.p.sec>0){cb.style.display='inline-block';cb.textContent=S.p.done?'↻ Rever o capítulo '+STAGES.length:'▶ Continuar do capítulo '+Math.min(S.p.unlocked,STAGES.length)}else cb.style.display='none';
  $id('menuStats').textContent=`Tempo: ${fmt(S.p.sec)} · Dicas usadas: ${S.p.hints} · Erros: ${S.p.errors}`;
}
function continuar(){startStage(Math.min(S.p.unlocked,STAGES.length))}
function openMenu(){S.kp=null;renderMenu();$id('menu').style.display='flex'}
function setHard(v){S.p.hard=v;saveProgress()}
function doReset(){
  const h=S.p.hard;S.p=DEF();S.p.hard=h;S.inv=[];S.sel=null;S.stage=0;S.tok++;S.done=false;S.kp=null;S.hintIdx=0;
  sceneEl.innerHTML='';sceneEl.onpointermove=sceneEl.onpointerdown=null;sceneEl.style.touchAction='';
  $id('chTitle').textContent='';$id('progT').textContent='';$id('bar').firstChild.style.width='0%';renderInv();saveProgress();openMenu();
}
function resetProgress(){openModal('<h2>Reiniciar progresso?</h2><p>Capítulos, tempo, dicas, erros e anotações serão apagados.</p><div style="text-align:center"><button class="btn" id="rsOk">Sim, reiniciar</button></div>',b=>{b.querySelector('#rsOk').onclick=()=>{closeModal();doReset()}})}
function replay(){$id('ending').style.display='none';doReset()}
setInterval(()=>{
  const active=S.stage>0&&$id('menu').style.display==='none'&&$id('ending').style.display!=='flex';
  if(active){S.p.sec++;if(S.p.sec%5===0)saveProgress()}
  $id('timer').textContent='⏱ '+fmt(S.p.sec);
},1000);

async function startStage(n){
  if(S.busy)return;S.busy=true;ac();startDrone();
  try{
    fade.style.opacity=1;await wait(700);
    $id('menu').style.display='none';closeModal();
    S.stage=n;S.tok++;S.sel=null;S.hintIdx=0;S.done=false;S.kp=null;S.inv=[];
    sceneEl.innerHTML='';sceneEl.onpointermove=sceneEl.onpointerdown=null;sceneEl.style.touchAction='';
    const st=STAGES[n-1];
    $id('chTitle').textContent=`Capítulo ${n}: ${st.nome}`;
    $id('progT').textContent=`${n}/${STAGES.length}`;$id('bar').firstChild.style.width=((n-1)/STAGES.length*100)+'%';
    st.build(sceneEl);renderInv();
    $id('inN').textContent=`CAPÍTULO ${n}`;$id('inT').textContent=st.nome;$id('inS').textContent=st.story;
    const it=$id('intro');it.classList.remove('go');void it.offsetWidth;it.classList.add('go');
    fade.style.opacity=0;await wait(2200);it.classList.remove('go');
  }finally{S.busy=false;fade.style.opacity=0}
}
async function completeStage(n,o={}){
  if(S.done)return;S.done=true;
  if(o.frag!=null)S.p.frag[n]=o.frag;if(o.note)addNote(o.note);
  if(S.p.unlocked<n+1&&n<STAGES.length)S.p.unlocked=n+1;
  saveProgress();sfx.ok();burst();$id('bar').firstChild.style.width=(n/STAGES.length*100)+'%';
  await wait(2300);
  if(n<STAGES.length)startStage(n+1);else finish();
}
function showHint(){
  if(!S.stage)return;
  if(S.p.hard){showMsg('Modo Difícil: dicas desativadas.');return}
  const h=STAGES[S.stage-1].hints;S.p.hints++;saveProgress();
  showMsg('💡 '+h[Math.min(S.hintIdx,h.length-1)]+'  (−100 pontos)',5000);S.hintIdx++;
}

/* auxiliares */
const win=(n,msg,o)=>{showMsg(msg);completeStage(n,o)};
const fr=(l,t)=>({frag:l,note:`Fragmento ${t}: ${l}`});
function textQuiz(root,pre,items,done){
  let i=0;
  root.innerHTML=`<div class="paper">${pre}</div><div class="cipher" id="q" style="margin-top:16px"></div><div class="clock-ctrl"><input class="txt" id="a" maxlength="24" placeholder="resposta" autocomplete="off"><button class="btn" id="ok">Responder</button></div><div class="sub" id="qi"></div>`;
  const show=()=>{$('#q').innerHTML=items[i][0];$('#qi').textContent=`Pergunta ${i+1} de ${items.length}`;$('#a').value=''};
  const send=()=>{if(S.done)return;const a=norm($('#a').value);if(items[i][1].includes(a)){sfx.pick();if(++i>=items.length)done();else show()}else fail('Resposta incorreta.')};
  $('#ok').onclick=send;$('#a').onkeydown=e=>{if(e.key==='Enter')send()};show();
}
function pickQuiz(root,pre,rounds,done,cls='opt2'){
  let i=0;
  root.innerHTML=`<div class="paper">${pre}</div><div class="cipher" id="q" style="margin-top:16px"></div><div class="moons" id="o"></div><div class="sub" id="qi"></div>`;
  const show=()=>{const r=rounds[i];$('#q').innerHTML=r.q;$('#qi').textContent=`Rodada ${i+1} de ${rounds.length}`;
    $('#o').innerHTML=shuffle(r.o.map((h,k)=>[h,k===r.a])).map(x=>`<button class="btn ${cls}" data-ok="${x[1]?1:0}">${x[0]}</button>`).join('');
    $$('#o .btn').forEach(b=>b.onclick=()=>{if(S.done)return;sfx.click();if(b.dataset.ok==='1'){sfx.pick();if(++i>=rounds.length)done();else show()}else fail('Não é isso.')})};
  show();
}
function swapGame(root,pre,sol,render,done,cls='',valid){
  let order;do{order=shuffle(sol)}while(valid?valid(order):order.join()===sol.join());
  root.innerHTML=`<div class="paper">${pre}</div><div class="swap ${cls}" id="sw"></div><div class="clock-ctrl"><button class="btn" id="ok">Confirmar ordem</button></div>`;
  let pick=-1;
  const draw=()=>{$('#sw').innerHTML=order.map((k,i)=>`<div class="sitem ${pick===i?'up':''}" data-i="${i}">${render(k)}</div>`).join('');
    $$('.sitem').forEach(el=>el.onclick=()=>{const i=+el.dataset.i;sfx.click();if(pick<0)pick=i;else{if(pick!==i)[order[pick],order[i]]=[order[i],order[pick]];pick=-1}draw()})};
  draw();
  $('#ok').onclick=()=>{if(S.done)return;if(valid?valid(order):order.join()===sol.join())done();else fail('Ainda não está certo.')};
}
function pairGame(root,pre,pairs,done){
  const L=pairs.map((p,i)=>[i,p[0]]),R=shuffle(pairs.map((p,i)=>[i,p[1]])),ok=new Set();let sel=-1;
  root.innerHTML=`<div class="paper">${pre}</div><div class="pairs"><div class="pcol" id="pl"></div><div class="pcol" id="pr"></div></div>`;
  const draw=()=>{
    $('#pl').innerHTML=L.map(([i,h])=>`<button class="btn pb ${ok.has(i)?'okp':''} ${sel===i?'selp':''}" data-i="${i}" ${ok.has(i)?'disabled':''}>${h}</button>`).join('');
    $('#pr').innerHTML=R.map(([i,h])=>`<button class="btn pb ${ok.has(i)?'okp':''}" data-i="${i}" ${ok.has(i)?'disabled':''}>${h}</button>`).join('');
    $$('#pl .pb').forEach(b=>b.onclick=()=>{sfx.click();sel=+b.dataset.i;draw()});
    $$('#pr .pb').forEach(b=>b.onclick=()=>{if(S.done)return;if(sel<0){showMsg('Escolha primeiro algo do lado esquerdo.');return}sfx.click();
      if(+b.dataset.i===sel){ok.add(sel);sel=-1;sfx.pick();draw();if(ok.size===pairs.length)done()}else{sel=-1;fail('Esses dois não combinam.');draw()}});
  };draw();
}

 build(root){
  const code=Object.keys(S.p.frag).map(Number).sort((a,b)=>a-b).map(k=>S.p.frag[k]).join('');
  root.innerHTML=`<div class="paper"><b>O último portão</b><br>Cada vitória deixou uma letra no seu Caderno. Junte-as na ordem em que as achou e diga o nome do fenômeno que cobre o Sol.</div><div class="clock-ctrl"><input class="txt" id="a" maxlength="12" placeholder="o nome" autocomplete="off"><button class="btn" id="ok">Abrir</button></div><div class="sub">Abra o Caderno (📓) e leia os fragmentos.</div>`;
  const send=()=>{if(S.done)return;const a=norm($('#a').value);if(a==='ECLIPSE'||(code.length===7&&a===code))win(29,'O céu se abriu por inteiro.');else fail('Não é esse o nome.')};
  $('#ok').onclick=send;$('#a').onkeydown=e=>{if(e.key==='Enter')send()};
 }}
];

function finish(){
  S.p.done=true;saveProgress();
  const pts=Math.max(0,8000-S.p.sec*2-S.p.hints*100-S.p.errors*15+(S.p.hard?500:0));
  const rank=pts>=6400?'S':pts>=4800?'A':pts>=2800?'B':'C';
  $id('endText').textContent='A cúpula se abriu e o céu inteiro apareceu. A Parte 3 do Enigma do Cantinho foi resolvida.'+(S.p.hard?' E no Modo Difícil!':'');
  $id('endRank').textContent=rank;
  $id('endStats').textContent=`Tempo ${fmt(S.p.sec)} · Dicas ${S.p.hints} · Erros ${S.p.errors} · ${pts} pontos`;
  $id('ending').style.display='flex';sfx.ok();burst(80);
  setTimeout(()=>[784,988,1175,1568].forEach((f,i)=>tone(f,.5,'triangle',.12,i*.15)),400);
}
renderMenu();
if(location.hash==='#continuar'&&!S.p.done&&(S.p.unlocked>1||S.p.sec>0))continuar();
</script>
</body>
</html>
