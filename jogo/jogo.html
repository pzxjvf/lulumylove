<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lulu's Adventure 💜</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #ff0055, #4a00e0);
            font-family: 'Nunito', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            padding: 0;
        }

        .game-wrapper {
            text-align: center;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .game-title {
            color: white;
            font-size: 3rem;
            font-weight: 900;
            margin-bottom: 20px;
            text-shadow: 0 4px 20px rgba(0,0,0,0.3);
            display: none;
        }

        .game-container {
            position: relative;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            border-radius: 0;
            overflow: hidden;
            border: none;
            background: white;
            width: 100%;
            height: 100%;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(74, 0, 224, 0.95);
            backdrop-filter: blur(15px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            transition: all 0.3s ease;
            padding: 30px;
            overflow-y: auto;
        }

        .overlay h2 {
            font-size: 2.8rem;
            margin-bottom: 10px;
            font-weight: 900;
            text-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .overlay p {
            font-size: 1.2rem;
            margin-bottom: 25px;
            font-weight: 600;
            opacity: 0.95;
            line-height: 1.5;
        }

        .player-select {
            display: flex;
            gap: 25px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .player-card {
            background: rgba(255,255,255,0.15);
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 25px;
            padding: 25px 35px;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 160px;
        }

        .player-card:hover {
            transform: translateY(-5px) scale(1.05);
            background: rgba(255,255,255,0.25);
            border-color: #ffeb3b;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .player-card.selected {
            border-color: #ffeb3b;
            background: rgba(255, 235, 59, 0.2);
            box-shadow: 0 0 30px rgba(255, 235, 59, 0.5);
        }

        .player-avatar {
            font-size: 4rem;
            margin-bottom: 10px;
        }

        .player-name {
            font-size: 1.5rem;
            font-weight: 800;
        }

        .player-record {
            font-size: 0.95rem;
            opacity: 0.85;
            margin-top: 5px;
            font-weight: 700;
        }

        .btn {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border: none;
            padding: 18px 50px;
            border-radius: 50px;
            font-weight: 800;
            font-size: 1.1rem;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(245, 87, 108, 0.5);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-family: 'Nunito', sans-serif;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 15px 40px rgba(245, 87, 108, 0.6);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            box-shadow: 0 10px 30px rgba(118, 75, 162, 0.5);
            margin-top: 15px;
        }

        .stats-bar {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            z-index: 10;
        }

        .stat {
            background: rgba(74, 0, 224, 0.75);
            backdrop-filter: blur(10px);
            padding: 10px 20px;
            border-radius: 15px;
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 900;
        }

        .stat-label {
            font-size: 0.75rem;
            opacity: 0.9;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .current-player-tag {
            background: rgba(255, 235, 59, 0.95);
            color: #4a00e0;
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: 900;
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 10;
            font-size: 0.9rem;
            display: none;
        }

        .achievements-unlocked {
            background: rgba(255,255,255,0.12);
            border-radius: 20px;
            padding: 20px 25px;
            margin: 20px 0;
            max-width: 450px;
            width: 100%;
        }

        .achievements-unlocked h3 {
            font-size: 1.2rem;
            font-weight: 800;
            margin-bottom: 15px;
            color: #ffeb3b;
        }

        .achievement-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 15px;
            background: rgba(255,255,255,0.08);
            border-radius: 12px;
            margin-bottom: 8px;
            text-align: left;
        }

        .achievement-item.new {
            background: rgba(255, 235, 59, 0.2);
            border: 1px solid #ffeb3b;
            animation: pulseAchievement 1.5s infinite;
        }

        @keyframes pulseAchievement {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255, 235, 59, 0.4); }
            50% { box-shadow: 0 0 0 8px rgba(255, 235, 59, 0); }
        }

        .achievement-icon {
            font-size: 1.8rem;
        }

        .achievement-info {
            flex: 1;
        }

        .achievement-title {
            font-weight: 800;
            font-size: 0.95rem;
        }

        .achievement-desc {
            font-size: 0.8rem;
            opacity: 0.85;
        }

        .back-link {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 20;
            color: white;
            text-decoration: none;
            background: rgba(0,0,0,0.3);
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.85rem;
            transition: all 0.3s;
        }

        .back-link:hover {
            background: rgba(0,0,0,0.5);
            transform: scale(1.05);
        }

        .scores-compare {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin: 15px 0;
            flex-wrap: wrap;
        }

        .score-card {
            background: rgba(255,255,255,0.1);
            padding: 15px 25px;
            border-radius: 15px;
            min-width: 120px;
        }

        .score-card.winner {
            background: rgba(255, 235, 59, 0.2);
            border: 2px solid #ffeb3b;
        }

        .score-label {
            font-size: 0.85rem;
            font-weight: 700;
            opacity: 0.85;
        }

        .score-value {
            font-size: 1.8rem;
            font-weight: 900;
        }
    </style>
</head>
<body>

<a href="../menu.html" class="back-link">← Voltar</a>

<div class="game-wrapper">
    <h1 class="game-title">💜 Lulu's Adventure 💜</h1>
    <div class="game-container">
        <canvas id="gameCanvas" width="900" height="500"></canvas>
        
        <div class="current-player-tag" id="currentPlayerTag">Jogando como: Lulu 💜</div>

        <div class="overlay" id="gameOverlay">
            <h2 id="overlayTitle">💜 Lulu's Adventure 💜</h2>
            <p id="overlaySub">Quem vai jogar hoje?</p>
            
            <div class="player-select" id="playerSelect">
                <div class="player-card" data-player="lulu" onclick="selectPlayer('lulu')">
                    <div class="player-avatar">👩‍🦽</div>
                    <div class="player-name">Lulu 💜</div>
                    <div class="player-record" id="luluRecord">Recorde: 0</div>
                </div>
                <div class="player-card" data-player="joao" onclick="selectPlayer('joao')">
                    <div class="player-avatar">🧑</div>
                    <div class="player-name">João 💙</div>
                    <div class="player-record" id="joaoRecord">Recorde: 0</div>
                </div>
            </div>

            <div id="gameOverSection" style="display: none; width: 100%; max-width: 500px;">
                <div class="scores-compare">
                    <div class="score-card" id="luluScoreCard">
                        <div class="score-label">🏆 Lulu</div>
                        <div class="score-value" id="luluFinalScore">0</div>
                    </div>
                    <div class="score-card" id="joaoScoreCard">
                        <div class="score-label">🏆 João</div>
                        <div class="score-value" id="joaoFinalScore">0</div>
                    </div>
                </div>

                <div class="achievements-unlocked" id="achievementsList" style="display: none;">
                    <h3>🎖️ Conquistas</h3>
                    <div id="achievementsContent"></div>
                </div>
            </div>

            <button class="btn" id="startBtn" onclick="startOrReset()" disabled>JOGAR</button>
            <button class="btn btn-secondary" id="changePlayerBtn" onclick="showPlayerSelect()" style="display: none;">Trocar de Jogador</button>
        </div>
    </div>
    <div class="stats-bar" id="statsBar">
        <div class="stat">
            <div class="stat-value" id="currentScore">0</div>
            <div class="stat-label">PONTUAÇÃO</div>
        </div>
        <div class="stat">
            <div class="stat-value" id="currentLevel">1</div>
            <div class="stat-label">NÍVEL</div>
        </div>
        <div class="stat">
            <div class="stat-value" id="highScore">0</div>
            <div class="stat-label">SEU RECORDE</div>
        </div>
    </div>
</div>

<script>
    const ACHIEVEMENTS = [
        { id: 'first_steps', points: 50, icon: '🌸', title: 'Primeiros Passos', desc: 'Atingiu 50 pontos — uma foto especial desbloqueada!' },
        { id: 'half_way', points: 100, icon: '💌', title: 'Cupom do Amor', desc: 'Atingiu 100 pontos — cupom especial desbloqueado!' },
        { id: 'true_love', points: 200, icon: '💜', title: 'Amor de Verdade', desc: 'Atingiu 200 pontos — carta secreta desbloqueada!' },
        { id: 'unstoppable', points: 500, icon: '🚀', title: 'Imparável', desc: 'Atingiu 500 pontos — você é incrível!' },
        { id: 'legendary', points: 1000, icon: '👑', title: 'Lendário', desc: 'Atingiu 1000 pontos — é o/a melhor de todos!' }
    ];

    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const overlay = document.getElementById("gameOverlay");
    const overlayTitle = document.getElementById("overlayTitle");
    const overlaySub = document.getElementById("overlaySub");
    const currentScoreEl = document.getElementById("currentScore");
    const currentLevelEl = document.getElementById("currentLevel");
    const highScoreEl = document.getElementById("highScore");
    const statsBar = document.getElementById('statsBar');
    const currentPlayerTag = document.getElementById('currentPlayerTag');
    const playerSelect = document.getElementById('playerSelect');
    const startBtn = document.getElementById('startBtn');
    const changePlayerBtn = document.getElementById('changePlayerBtn');
    const gameOverSection = document.getElementById('gameOverSection');

    let selectedPlayer = null;
    let gameActive = false;
    let score = 0;
    let level = 1;
    statsBar.style.display = 'none';

    let gravity, floorY, gameSpeed;
    let spawnTimer = 0;
    let coinSpawnTimer = 0;
    let powerupSpawnTimer = 0;
    let cloudSpawnTimer = 0;
    let isInvincible = false;
    let invincibleTimer = 0;

    let clouds = [];
    let particles = [];
    let coins = [];
    let obstacles = [];
    let powerups = [];
    let grassBlades = [];
    let bgElements = [];

    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
    
    function playSound(frequency, duration, type = 'sine') {
        try {
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            oscillator.frequency.value = frequency;
            oscillator.type = type;
            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration);
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + duration);
        } catch(e) {}
    }

    function playJumpSound() {
        playSound(500, 0.1, 'square');
        setTimeout(() => playSound(700, 0.1, 'square'), 50);
    }

    function playCoinSound() {
        playSound(800, 0.1, 'sine');
        setTimeout(() => playSound(1000, 0.15, 'sine'), 50);
    }

    function playPowerupSound() {
        for (let i = 0; i < 5; i++) {
            setTimeout(() => playSound(400 + i * 200, 0.1, 'sine'), i * 50);
        }
    }

    function playAchievementSound() {
        const notes = [523, 659, 784, 1047];
        notes.forEach((f, i) => setTimeout(() => playSound(f, 0.2, 'triangle'), i * 100));
    }

    // --- STORAGE / LEADERBOARD ---
    function getPlayerData(player) {
        const data = localStorage.getItem('gameData_' + player);
        return data ? JSON.parse(data) : { highScore: 0, achievements: [], gamesPlayed: 0 };
    }

    function savePlayerData(player, data) {
        localStorage.setItem('gameData_' + player, JSON.stringify(data));
    }

    function refreshRecordDisplay() {
        const luluData = getPlayerData('lulu');
        const joaoData = getPlayerData('joao');
        document.getElementById('luluRecord').textContent = 'Recorde: ' + luluData.highScore;
        document.getElementById('joaoRecord').textContent = 'Recorde: ' + joaoData.highScore;
    }

    function selectPlayer(player) {
        selectedPlayer = player;
        document.querySelectorAll('.player-card').forEach(c => c.classList.remove('selected'));
        document.querySelector(`[data-player="${player}"]`).classList.add('selected');
        startBtn.disabled = false;
        const data = getPlayerData(player);
        highScoreEl.textContent = data.highScore;
        currentPlayerTag.textContent = 'Jogando como: ' + (player === 'lulu' ? 'Lulu 💜' : 'João 💙');
    }

    function showPlayerSelect() {
        selectedPlayer = null;
        playerSelect.style.display = 'flex';
        gameOverSection.style.display = 'none';
        changePlayerBtn.style.display = 'none';
        startBtn.textContent = 'JOGAR';
        startBtn.disabled = true;
        document.querySelectorAll('.player-card').forEach(c => c.classList.remove('selected'));
        overlayTitle.textContent = '💜 Lulu\'s Adventure 💜';
        overlaySub.textContent = 'Quem vai jogar hoje?';
        overlay.style.display = 'flex';
    }

    refreshRecordDisplay();

    // --- CLASSES DO JOGO ---

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        gravity = 0.7 * (canvas.height / 500);
        floorY = canvas.height * 0.8;
        gameSpeed = 6 * (canvas.width / 900);
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    class BGElement {
        constructor() {
            this.x = canvas.width + Math.random() * 200;
            this.y = canvas.height * 0.55 + Math.random() * (canvas.height * 0.15);
            this.speed = 1 + Math.random() * 2;
            this.type = Math.random() > 0.5 ? 'tree' : 'bush';
            this.size = 30 + Math.random() * 40;
        }
        draw() {
            if (this.type === 'tree') {
                ctx.fillStyle = '#8d6e63';
                ctx.fillRect(this.x - 5, this.y, 10, this.size * 0.5);
                ctx.fillStyle = '#4caf50';
                ctx.beginPath();
                ctx.arc(this.x, this.y - 10, this.size * 0.4, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(this.x - 15, this.y, this.size * 0.3, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(this.x + 15, this.y, this.size * 0.3, 0, Math.PI * 2);
                ctx.fill();
            } else {
                ctx.fillStyle = '#66bb6a';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size * 0.3, 0, Math.PI * 2);
                ctx.arc(this.x - 12, this.y + 5, this.size * 0.25, 0, Math.PI * 2);
                ctx.arc(this.x + 12, this.y + 5, this.size * 0.25, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        update() {
            this.x -= this.speed * (canvas.width / 900);
        }
    }

    class Cloud {
        constructor() {
            this.x = canvas.width + Math.random() * 300;
            this.y = 40 + Math.random() * (canvas.height * 0.2);
            this.speed = 0.5 + Math.random() * 1.5;
            this.size = 40 + Math.random() * 50;
        }
        draw() {
            ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size * 0.5, 0, Math.PI * 2);
            ctx.arc(this.x + this.size * 0.4, this.y - this.size * 0.1, this.size * 0.4, 0, Math.PI * 2);
            ctx.arc(this.x + this.size * 0.8, this.y, this.size * 0.35, 0, Math.PI * 2);
            ctx.arc(this.x + this.size * 0.4, this.y + this.size * 0.15, this.size * 0.3, 0, Math.PI * 2);
            ctx.fill();
        }
        update() {
            this.x -= this.speed;
        }
    }

    class GrassBlade {
        constructor(x) {
            this.x = x;
            this.y = floorY;
            this.height = 12 + Math.random() * 18;
            this.sway = Math.random() * Math.PI * 2;
            this.swaySpeed = 0.04 + Math.random() * 0.06;
        }
        draw() {
            ctx.strokeStyle = '#7cb342';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(this.x, this.y);
            ctx.quadraticCurveTo(
                this.x + Math.sin(this.sway) * 6, 
                this.y - this.height/2, 
                this.x + Math.sin(this.sway) * 10, 
                this.y - this.height
            );
            ctx.stroke();
        }
        update() {
            this.sway += this.swaySpeed;
        }
    }

    class Particle {
        constructor(x, y, color) {
            this.x = x;
            this.y = y;
            this.velocityX = (Math.random() - 0.5) * 10;
            this.velocityY = (Math.random() - 0.5) * 10 - 5;
            this.size = 3 + Math.random() * 6;
            this.color = color;
            this.life = 1;
            this.decay = 0.02 + Math.random() * 0.02;
        }
        draw() {
            ctx.globalAlpha = this.life;
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1;
        }
        update() {
            this.x += this.velocityX;
            this.y += this.velocityY;
            this.velocityY += 0.2;
            this.life -= this.decay;
        }
    }

    class Coin {
        constructor() {
            this.x = canvas.width;
            this.y = floorY - 70 - Math.random() * 100;
            this.radius = 15;
            this.angle = 0;
            this.bobOffset = Math.random() * Math.PI * 2;
        }
        draw() {
            const bobY = Math.sin(this.bobOffset + this.angle) * 5;
            ctx.save();
            ctx.translate(this.x, this.y + bobY);
            
            ctx.shadowColor = '#ffd700';
            ctx.shadowBlur = 15;
            
            ctx.fillStyle = '#ffd700';
            ctx.strokeStyle = '#ffaa00';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            
            ctx.fillStyle = '#ffaa00';
            ctx.font = 'bold 14px Nunito';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('★', 0, 0);
            
            ctx.shadowBlur = 0;
            ctx.restore();
        }
        update() {
            this.x -= gameSpeed;
            this.angle += 0.12;
        }
    }

    class Powerup {
        constructor() {
            this.x = canvas.width;
            this.y = floorY - 90 - Math.random() * 80;
            this.size = 25;
            this.angle = 0;
            this.type = Math.random() > 0.5 ? 'star' : 'heart';
            this.bobOffset = Math.random() * Math.PI * 2;
        }
        draw() {
            const bobY = Math.sin(this.bobOffset + this.angle) * 8;
            ctx.save();
            ctx.translate(this.x, this.y + bobY);
            ctx.rotate(this.angle);
            
            if (this.type === 'star') {
                ctx.shadowColor = '#00bcd4';
                ctx.shadowBlur = 20;
                ctx.fillStyle = '#00bcd4';
                drawStar(0, 0, 5, this.size, this.size / 2);
            } else {
                ctx.shadowColor = '#e91e63';
                ctx.shadowBlur = 20;
                ctx.fillStyle = '#e91e63';
                drawHeart(0, 0, this.size);
            }
            
            ctx.shadowBlur = 0;
            ctx.restore();
        }
        update() {
            this.x -= gameSpeed;
            this.angle += 0.08;
        }
    }

    function drawStar(cx, cy, spikes, outerRadius, innerRadius) {
        let rot = Math.PI / 2 * 3;
        let x = cx;
        let y = cy;
        const step = Math.PI / spikes;
        ctx.beginPath();
        ctx.moveTo(cx, cy - outerRadius);
        for (let i = 0; i < spikes; i++) {
            x = cx + Math.cos(rot) * outerRadius;
            y = cy + Math.sin(rot) * outerRadius;
            ctx.lineTo(x, y);
            rot += step;
            x = cx + Math.cos(rot) * innerRadius;
            y = cy + Math.sin(rot) * innerRadius;
            ctx.lineTo(x, y);
            rot += step;
        }
        ctx.lineTo(cx, cy - outerRadius);
        ctx.closePath();
        ctx.fill();
    }

    function drawHeart(cx, cy, size) {
        ctx.beginPath();
        ctx.moveTo(cx, cy - size * 0.3);
        ctx.bezierCurveTo(cx + size, cy - size, cx + size, cy + size * 0.3, cx, cy + size);
        ctx.bezierCurveTo(cx - size, cy + size * 0.3, cx - size, cy - size, cx, cy - size * 0.3);
        ctx.closePath();
        ctx.fill();
    }

    class Obstacle {
        constructor() {
            const rand = Math.random();
            if (rand < 0.35) {
                this.type = 'rock';
                this.width = 30 + Math.random() * 30;
                this.height = 25 + Math.random() * 35;
            } else if (rand < 0.7) {
                this.type = 'box';
                this.width = 35 + Math.random() * 25;
                this.height = 40 + Math.random() * 30;
            } else {
                this.type = 'cactus';
                this.width = 30 + Math.random() * 20;
                this.height = 50 + Math.random() * 30;
            }
            this.x = canvas.width;
            this.y = floorY - this.height;
        }
        draw() {
            if (this.type === 'rock') {
                ctx.fillStyle = '#78909c';
                ctx.strokeStyle = '#546e7a';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(this.x, this.y + this.height);
                ctx.lineTo(this.x + this.width * 0.2, this.y + this.height * 0.3);
                ctx.lineTo(this.x + this.width * 0.5, this.y);
                ctx.lineTo(this.x + this.width * 0.8, this.y + this.height * 0.2);
                ctx.lineTo(this.x + this.width, this.y + this.height);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
            } else if (this.type === 'box') {
                ctx.fillStyle = '#8d6e63';
                ctx.strokeStyle = '#5d4037';
                ctx.lineWidth = 3;
                ctx.fillRect(this.x, this.y, this.width, this.height);
                ctx.strokeRect(this.x, this.y, this.width, this.height);
                ctx.strokeStyle = '#6d4c41';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(this.x, this.y + this.height * 0.35);
                ctx.lineTo(this.x + this.width, this.y + this.height * 0.35);
                ctx.moveTo(this.x, this.y + this.height * 0.65);
                ctx.lineTo(this.x + this.width, this.y + this.height * 0.65);
                ctx.stroke();
            } else {
                ctx.fillStyle = '#4caf50';
                ctx.strokeStyle = '#2e7d32';
                ctx.lineWidth = 3;
                ctx.fillRect(this.x + this.width * 0.35, this.y + this.height * 0.3, this.width * 0.3, this.height * 0.7);
                ctx.strokeRect(this.x + this.width * 0.35, this.y + this.height * 0.3, this.width * 0.3, this.height * 0.7);
                ctx.fillRect(this.x, this.y + this.height * 0.4, this.width * 0.35, this.width * 0.25);
                ctx.strokeRect(this.x, this.y + this.height * 0.4, this.width * 0.35, this.width * 0.25);
                ctx.fillRect(this.x + this.width * 0.65, this.y + this.height * 0.5, this.width * 0.35, this.width * 0.25);
                ctx.strokeRect(this.x + this.width * 0.65, this.y + this.height * 0.5, this.width * 0.35, this.width * 0.25);
            }
        }
        update() {
            this.x -= gameSpeed;
        }
    }

    // --- PERSONAGEM PRINCIPAL ---
    const player = {
        x: 100,
        y: 0,
        width: 90,
        height: 100,
        velocityY: 0,
        isJumping: false,
        wheelAngle: 0,
        
        draw() {
            ctx.save();
            
            if (isInvincible && Math.floor(Date.now() / 100) % 2 === 0) {
                ctx.globalAlpha = 0.5;
            }
            
            this.wheelAngle += gameActive ? 0.35 : 0;
            
            const cx = this.x + this.width / 2;
            const baseY = this.y;
            const playerColor = selectedPlayer === 'joao' ? '#2196f3' : '#9c27b0';
            const playerColorDark = selectedPlayer === 'joao' ? '#1565c0' : '#7b1fa2';
            const hairColor = selectedPlayer === 'joao' ? '#3e2723' : '#2d1b4e';
            
            ctx.fillStyle = '#1a1a1a';
            ctx.strokeStyle = '#616161';
            ctx.lineWidth = 5;
            ctx.beginPath();
            ctx.arc(cx - 28, baseY + 70, 25, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(cx + 28, baseY + 70, 25, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            
            ctx.save();
            ctx.translate(cx - 28, baseY + 70);
            ctx.rotate(this.wheelAngle);
            ctx.strokeStyle = '#9e9e9e';
            ctx.lineWidth = 3;
            for (let i = 0; i < 8; i++) {
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(18, 0);
                ctx.stroke();
                ctx.rotate(Math.PI / 4);
            }
            ctx.restore();
            ctx.save();
            ctx.translate(cx + 28, baseY + 70);
            ctx.rotate(this.wheelAngle);
            ctx.strokeStyle = '#9e9e9e';
            ctx.lineWidth = 3;
            for (let i = 0; i < 8; i++) {
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(18, 0);
                ctx.stroke();
                ctx.rotate(Math.PI / 4);
            }
            ctx.restore();
            
            ctx.fillStyle = playerColorDark;
            ctx.beginPath();
            ctx.arc(cx - 28, baseY + 70, 8, 0, Math.PI * 2);
            ctx.arc(cx + 28, baseY + 70, 8, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.strokeStyle = '#424242';
            ctx.fillStyle = '#616161';
            ctx.lineWidth = 6;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            
            ctx.beginPath();
            ctx.moveTo(cx - 25, baseY + 45);
            ctx.lineTo(cx - 28, baseY + 70);
            ctx.moveTo(cx + 25, baseY + 45);
            ctx.lineTo(cx + 28, baseY + 70);
            ctx.stroke();
            
            ctx.fillStyle = playerColor;
            ctx.fillRect(cx - 25, baseY + 40, 50, 12);
            ctx.strokeRect(cx - 25, baseY + 40, 50, 12);
            
            ctx.fillRect(cx - 25, baseY + 15, 8, 30);
            ctx.strokeRect(cx - 25, baseY + 15, 8, 30);
            ctx.fillRect(cx + 17, baseY + 15, 8, 30);
            ctx.strokeRect(cx + 17, baseY + 15, 8, 30);
            ctx.fillRect(cx - 25, baseY + 15, 50, 8);
            ctx.strokeRect(cx - 25, baseY + 15, 50, 8);
            
            ctx.fillStyle = '#e0e0e0';
            ctx.fillRect(cx - 32, baseY + 35, 10, 20);
            ctx.fillRect(cx + 22, baseY + 35, 10, 20);
            
            ctx.fillStyle = '#424242';
            ctx.beginPath();
            ctx.arc(cx - 10, baseY + 85, 10, 0, Math.PI * 2);
            ctx.arc(cx + 10, baseY + 85, 10, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = playerColor;
            ctx.strokeStyle = playerColorDark;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(cx - 18, baseY + 28);
            ctx.lineTo(cx - 15, baseY + 50);
            ctx.lineTo(cx + 15, baseY + 50);
            ctx.lineTo(cx + 18, baseY + 28);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            
            ctx.fillStyle = hairColor;
            ctx.beginPath();
            ctx.arc(cx, baseY + 8, 16, 0, Math.PI * 2);
            ctx.fill();
            if (selectedPlayer === 'lulu') {
                ctx.beginPath();
                ctx.moveTo(cx - 16, baseY + 12);
                ctx.quadraticCurveTo(cx - 20, baseY + 30, cx - 18, baseY + 45);
                ctx.lineTo(cx + 18, baseY + 45);
                ctx.quadraticCurveTo(cx + 20, baseY + 30, cx + 16, baseY + 12);
                ctx.closePath();
                ctx.fill();
            }
            
            ctx.fillStyle = '#fdebd0';
            ctx.strokeStyle = '#d4a373';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(cx, baseY + 12, 14, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            
            if (selectedPlayer === 'lulu') {
                ctx.fillStyle = hairColor;
                ctx.beginPath();
                ctx.arc(cx, baseY + 7, 14, Math.PI, 2 * Math.PI);
                ctx.fill();
            }
            
            ctx.fillStyle = '#2d3436';
            ctx.beginPath();
            ctx.arc(cx - 5, baseY + 12, 3, 0, Math.PI * 2);
            ctx.arc(cx + 5, baseY + 12, 3, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = 'rgba(255, 182, 193, 0.5)';
            ctx.beginPath();
            ctx.arc(cx - 10, baseY + 15, 4, 0, Math.PI * 2);
            ctx.arc(cx + 10, baseY + 15, 4, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.strokeStyle = '#d4a373';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(cx, baseY + 14, 6, 0.1 * Math.PI, 0.9 * Math.PI);
            ctx.stroke();
            
            ctx.fillStyle = '#fdebd0';
            ctx.fillRect(cx - 28, baseY + 28, 8, 22);
            ctx.fillRect(cx + 20, baseY + 28, 8, 22);
            
            ctx.restore();
        },
        
        jump() {
            if (!this.isJumping) {
                this.velocityY = -18 * (canvas.height / 500);
                this.isJumping = true;
                playJumpSound();
                for (let i = 0; i < 15; i++) {
                    particles.push(new Particle(this.x + this.width/2 - 28, this.y + 70, selectedPlayer === 'joao' ? '#bbdefb' : '#e1bee7'));
                    particles.push(new Particle(this.x + this.width/2 + 28, this.y + 70, selectedPlayer === 'joao' ? '#bbdefb' : '#e1bee7'));
                }
            }
        },
        
        update() {
            this.y += this.velocityY;
            this.velocityY += gravity;
            
            if (this.y >= floorY - this.height) {
                this.y = floorY - this.height;
                this.velocityY = 0;
                this.isJumping = false;
            }
        }
    };

    // --- FUNÇÕES DO JOGO ---

    function createCollectParticles(x, y, colors) {
        for (let i = 0; i < 20; i++) {
            particles.push(new Particle(x, y, colors[Math.floor(Math.random() * colors.length)]));
        }
    }

    function startOrReset() {
        if (!selectedPlayer) return;
        obstacles = [];
        coins = [];
        powerups = [];
        particles = [];
        clouds = [];
        grassBlades = [];
        bgElements = [];
        score = 0;
        level = 1;
        gameSpeed = 6 * (canvas.width / 900);
        spawnTimer = 0;
        coinSpawnTimer = 0;
        powerupSpawnTimer = 0;
        cloudSpawnTimer = 0;
        isInvincible = false;
        invincibleTimer = 0;
        player.y = floorY - player.height;
        player.velocityY = 0;
        gameActive = true;
        overlay.style.display = 'none';
        statsBar.style.display = 'flex';
        currentPlayerTag.style.display = 'block';
        
        currentScoreEl.textContent = score;
        currentLevelEl.textContent = level;
        
        for (let i = 0; i < 6; i++) {
            const cloud = new Cloud();
            cloud.x = Math.random() * canvas.width;
            clouds.push(cloud);
        }
        
        const grassCount = Math.floor(canvas.width / 9);
        for (let i = 0; i < grassCount; i++) {
            grassBlades.push(new GrassBlade(i * 9 + Math.random() * 5));
        }
        
        for (let i = 0; i < 8; i++) {
            const bg = new BGElement();
            bg.x = Math.random() * canvas.width;
            bgElements.push(bg);
        }
    }

    function checkAchievements(currentScore, prevScore, playerData) {
        const newlyUnlocked = [];
        ACHIEVEMENTS.forEach(ach => {
            if (currentScore >= ach.points && prevScore < ach.points) {
                if (!playerData.achievements.includes(ach.id)) {
                    playerData.achievements.push(ach.id);
                    newlyUnlocked.push(ach);
                    playAchievementSound();
                }
            }
        });
        return newlyUnlocked;
    }

    function gameOver() {
        gameActive = false;
        
        const playerData = getPlayerData(selectedPlayer);
        const prevHighScore = playerData.highScore;
        const newlyUnlocked = checkAchievements(score, 0, playerData);
        
        let beatRecord = false;
        if (score > prevHighScore) {
            playerData.highScore = score;
            beatRecord = true;
        }
        playerData.gamesPlayed = (playerData.gamesPlayed || 0) + 1;
        savePlayerData(selectedPlayer, playerData);
        
        const luluData = getPlayerData('lulu');
        const joaoData = getPlayerData('joao');
        highScoreEl.textContent = playerData.highScore;
        
        playerSelect.style.display = 'none';
        gameOverSection.style.display = 'block';
        changePlayerBtn.style.display = 'inline-block';
        startBtn.textContent = 'JOGAR NOVAMENTE';
        
        document.getElementById('luluFinalScore').textContent = luluData.highScore;
        document.getElementById('joaoFinalScore').textContent = joaoData.highScore;
        
        const luluCard = document.getElementById('luluScoreCard');
        const joaoCard = document.getElementById('joaoScoreCard');
        luluCard.classList.remove('winner');
        joaoCard.classList.remove('winner');
        
        if (luluData.highScore > joaoData.highScore) {
            luluCard.classList.add('winner');
        } else if (joaoData.highScore > luluData.highScore) {
            joaoCard.classList.add('winner');
        } else {
            luluCard.classList.add('winner');
            joaoCard.classList.add('winner');
        }
        
        const allAchievementsUnlocked = [];
        playerData.achievements.forEach(achId => {
            const ach = ACHIEVEMENTS.find(a => a.id === achId);
            if (ach) {
                const isNew = newlyUnlocked.some(n => n.id === achId);
                allAchievementsUnlocked.push({ ...ach, isNew });
            }
        });
        
        const achListEl = document.getElementById('achievementsList');
        const achContentEl = document.getElementById('achievementsContent');
        
        if (allAchievementsUnlocked.length > 0) {
            achListEl.style.display = 'block';
            achContentEl.innerHTML = allAchievementsUnlocked.map(ach => `
                <div class="achievement-item ${ach.isNew ? 'new' : ''}">
                    <div class="achievement-icon">${ach.icon}</div>
                    <div class="achievement-info">
                        <div class="achievement-title">${ach.title} ${ach.isNew ? '✨ NOVO!' : ''}</div>
                        <div class="achievement-desc">${ach.desc}</div>
                    </div>
                </div>
            `).join('');
        } else {
            achListEl.style.display = 'none';
        }
        
        if (beatRecord) {
            overlayTitle.textContent = '🎉 NOVO RECORDE! 🎉';
            overlaySub.innerHTML = `Parabéns, <strong>${selectedPlayer === 'lulu' ? 'Lulu' : 'João'}</strong>! <br>Pontuação: <strong>${score}</strong> | Nível: <strong>${level}</strong>`;
        } else {
            overlayTitle.textContent = 'Fim de Jogo! 💜';
            overlaySub.innerHTML = `Pontuação: <strong>${score}</strong> | Nível: <strong>${level}</strong><br>Seu recorde: <strong>${playerData.highScore}</strong>`;
        }
        
        refreshRecordDisplay();
        overlay.style.display = 'flex';
    }

    function checkCollision(rect1, rect2) {
        return rect1.x < rect2.x + rect2.width &&
               rect1.x + rect1.width > rect2.x &&
               rect1.y < rect2.y + rect2.height &&
               rect1.y + rect1.height > rect2.y;
    }

    let sunAngle = 0;
    
    function drawSun() {
        sunAngle += 0.003;
        const sunX = canvas.width - 100;
        const sunY = 80;
        
        ctx.save();
        ctx.translate(sunX, sunY);
        ctx.rotate(sunAngle);
        
        ctx.strokeStyle = 'rgba(255, 235, 59, 0.5)';
        ctx.lineWidth = 4;
        for (let i = 0; i < 16; i++) {
            ctx.beginPath();
            ctx.moveTo(50, 0);
            ctx.lineTo(75, 0);
            ctx.stroke();
            ctx.rotate(Math.PI / 8);
        }
        ctx.restore();
        
        ctx.fillStyle = '#fff59d';
        ctx.beginPath();
        ctx.arc(sunX, sunY, 40, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ffee58';
        ctx.beginPath();
        ctx.arc(sunX, sunY, 32, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ffeb3b';
        ctx.beginPath();
        ctx.arc(sunX, sunY, 24, 0, Math.PI * 2);
        ctx.fill();
    }

    function gameLoop() {
        const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
        gradient.addColorStop(0, '#87ceeb');
        gradient.addColorStop(0.6, '#b2ebf2');
        gradient.addColorStop(1, '#e0f7fa');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        drawSun();
        
        for (let i = bgElements.length - 1; i >= 0; i--) {
            if (gameActive) {
                bgElements[i].update();
            }
            bgElements[i].draw();
            if (bgElements[i].x + 100 < 0) {
                bgElements.splice(i, 1);
            }
        }
        
        for (let i = clouds.length - 1; i >= 0; i--) {
            if (gameActive) {
                clouds[i].update();
            }
            clouds[i].draw();
            if (clouds[i].x + clouds[i].size < 0) {
                clouds.splice(i, 1);
            }
        }
        
        ctx.fillStyle = '#8bc34a';
        ctx.fillRect(0, floorY, canvas.width, canvas.height - floorY);
        
        ctx.fillStyle = '#7cb342';
        ctx.fillRect(0, floorY, canvas.width, 15);
        
        for (let i = 0; i < grassBlades.length; i++) {
            if (gameActive) {
                grassBlades[i].update();
            }
            grassBlades[i].draw();
        }
        
        ctx.strokeStyle = '#689f38';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(0, floorY);
        ctx.lineTo(canvas.width, floorY);
        ctx.stroke();
        
        if (gameActive) {
            cloudSpawnTimer--;
            if (cloudSpawnTimer <= 0) {
                clouds.push(new Cloud());
                cloudSpawnTimer = 150 + Math.random() * 250;
            }
            
            if (Math.random() < 0.02) {
                const bg = new BGElement();
                bgElements.push(bg);
            }
            
            player.update();
            
            spawnTimer--;
            if (spawnTimer <= 0) {
                obstacles.push(new Obstacle());
                spawnTimer = Math.max(60, 120 - level * 10) + Math.random() * 80;
            }
            
            coinSpawnTimer--;
            if (coinSpawnTimer <= 0) {
                coins.push(new Coin());
                coinSpawnTimer = 60 + Math.random() * 100;
            }
            
            powerupSpawnTimer--;
            if (powerupSpawnTimer <= 0) {
                powerups.push(new Powerup());
                powerupSpawnTimer = 300 + Math.random() * 300;
            }
            
            score++;
            currentScoreEl.textContent = score;
            
            if (score > 0 && score % 500 === 0) {
                level++;
                gameSpeed += 0.8 * (canvas.width / 900);
                currentLevelEl.textContent = level;
                for (let i = 0; i < 30; i++) {
                    particles.push(new Particle(canvas.width / 2, canvas.height / 2, '#ffd700'));
                }
            }
            
            if (isInvincible) {
                invincibleTimer--;
                if (invincibleTimer <= 0) {
                    isInvincible = false;
                }
            }
        }
        
        for (let i = coins.length - 1; i >= 0; i--) {
            if (gameActive) {
                coins[i].update();
            }
            coins[i].draw();
            
            const dx = player.x + player.width/2 - coins[i].x;
            const dy = player.y + player.height/2 - coins[i].y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            if (distance < 35 && gameActive) {
                playCoinSound();
                createCollectParticles(coins[i].x, coins[i].y, ['#ffd700', '#ffaa00', '#ff8c00', '#fff']);
                score += 25;
                coins.splice(i, 1);
                continue;
            }
            
            if (coins[i].x + 30 < 0) {
                coins.splice(i, 1);
            }
        }
        
        for (let i = powerups.length - 1; i >= 0; i--) {
            if (gameActive) {
                powerups[i].update();
            }
            powerups[i].draw();
            
            const dx = player.x + player.width/2 - powerups[i].x;
            const dy = player.y + player.height/2 - powerups[i].y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            if (distance < 40 && gameActive) {
                playPowerupSound();
                if (powerups[i].type === 'star') {
                    isInvincible = true;
                    invincibleTimer = 180;
                    createCollectParticles(powerups[i].x, powerups[i].y, ['#00bcd4', '#00acc1', '#0097a7', '#fff']);
                } else {
                    score += 100;
                    createCollectParticles(powerups[i].x, powerups[i].y, ['#e91e63', '#f48fb1', '#f8bbd9', '#fff']);
                }
                powerups.splice(i, 1);
                continue;
            }
            
            if (powerups[i].x + 40 < 0) {
                powerups.splice(i, 1);
            }
        }
        
        player.draw();
        
        for (let i = obstacles.length - 1; i >= 0; i--) {
            if (gameActive) {
                obstacles[i].update();
            }
            obstacles[i].draw();
            
            if (!isInvincible && checkCollision(
                { x: player.x + 20, y: player.y + 25, width: player.width - 40, height: player.height - 30 },
                { x: obstacles[i].x, y: obstacles[i].y, width: obstacles[i].width, height: obstacles[i].height }
            )) {
                gameOver();
            }
            
            if (obstacles[i].x + obstacles[i].width < 0) {
                obstacles.splice(i, 1);
                if (gameActive) {
                    score += 10;
                }
            }
        }
        
        for (let i = particles.length - 1; i >= 0; i--) {
            particles[i].update();
            particles[i].draw();
            if (particles[i].life <= 0) {
                particles.splice(i, 1);
            }
        }
        
        requestAnimationFrame(gameLoop);
    }

    // --- CONTROLES ---
    window.addEventListener('keydown', (e) => {
        if (e.code === 'Space' || e.code === 'ArrowUp') {
            e.preventDefault();
            if (gameActive) {
                player.jump();
            }
        }
    });

    canvas.addEventListener('click', () => {
        if (gameActive) {
            player.jump();
        }
    });

    canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (gameActive) {
            player.jump();
        }
    });

    gameLoop();
</script>
