<!DOCTYPE html>
<html lang="pt-br">

<style>
:root{--pl:#3f1d38;--pl2:#6b2d5c;--bd:#ffd9ec;--sh:#f3cfe3}
*{box-sizing:border-box}
body{margin:0;height:100dvh;overflow:hidden;display:flex;flex-direction:column;font-family:Nunito,sans-serif;color:var(--pl);background:linear-gradient(160deg,#ffe6f2,#f4e6ff 55%,#e6f7ff);user-select:none;-webkit-user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
body.n{background:linear-gradient(160deg,#3a2a5c,#241a44 60%,#1b2347)}
.top{display:flex;align-items:center;gap:6px;padding:6px 10px;flex-wrap:wrap}
.top h1{font-family:"Dancing Script",cursive;font-size:1.55rem;margin:0;flex:1;text-align:center;color:var(--pl2);min-width:110px}
body.n .top h1{color:#ffd9ec}
.b{position:relative;background:#fff;border:2px solid var(--bd);border-radius:999px;padding:0 12px;min-height:44px;min-width:44px;font:800 .85rem Nunito,sans-serif;color:var(--pl);box-shadow:0 3px 0 var(--sh);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap}
.b:active{transform:translateY(2px);box-shadow:0 1px 0 var(--sh)}
.b[data-n]:not([data-n="0"])::after{content:attr(data-n);position:absolute;top:-5px;right:-4px;background:#e0245e;color:#fff;border-radius:99px;font-size:.65rem;padding:1px 6px;border:2px solid #fff}
#bg{animation:pula 1.1s ease-in-out infinite}
@keyframes pula{50%{transform:translateY(-3px) scale(1.08)}}
.rw{flex:1;min-height:0;padding:2px 6px;position:relative}
#svg{width:100%;height:100%;display:block;touch-action:none}
#zi{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:8px;z-index:5}
.zb{width:46px;height:46px;border-radius:14px;border:2px solid var(--bd);background:#fff;color:var(--pl);font:900 1.15rem Nunito,sans-serif;cursor:pointer;box-shadow:0 3px 0 var(--sh);display:flex;align-items:center;justify-content:center}
.zb:active{transform:translateY(2px);box-shadow:0 1px 0 var(--sh)}
#pad{position:absolute;left:8px;bottom:8px;display:grid;grid-template-columns:repeat(3,42px);grid-template-rows:repeat(3,42px);gap:4px;z-index:5;opacity:.94}
#pad .pb{border:2px solid var(--bd);background:#fff;color:var(--pl);border-radius:12px;font:900 1rem Nunito,sans-serif;cursor:pointer;box-shadow:0 3px 0 var(--sh);display:flex;align-items:center;justify-content:center;padding:0;line-height:1}
#pad .pb:active{transform:translateY(2px);box-shadow:0 1px 0 var(--sh)}
#pad .pb.sp{visibility:hidden}
#rot{position:absolute;right:8px;bottom:8px;z-index:5;display:flex;flex-direction:column;align-items:center;gap:7px;background:rgba(255,255,255,.72);border-radius:16px;padding:6px 8px}
#rot .rr{display:flex;gap:6px}
#rot .zb{width:44px;height:44px;font-size:1.25rem}
#rc{width:132px;height:32px;accent-color:#6b2d5c;cursor:pointer;margin:0}
#cor{display:none;position:fixed;left:50%;bottom:10px;transform:translateX(-50%);z-index:70;background:#fff;border:2px solid var(--bd);border-radius:18px;padding:10px 12px;box-shadow:0 12px 30px rgba(80,30,70,.32);max-width:96vw;max-height:56dvh;overflow-y:auto}
#cor.a{display:block}
#cor .r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sw{width:38px;height:38px;border-radius:12px;border:2px solid #fff;box-shadow:0 0 0 2px #ecd2e4;cursor:pointer;padding:0}
.sw.on{box-shadow:0 0 0 3px var(--pl2)}
#cor input[type=color]{width:58px;height:44px;border:2px solid var(--bd);border-radius:12px;background:#fff;padding:2px;cursor:pointer}
#cor input[type=text]{min-height:44px;border:2px solid var(--bd);border-radius:12px;padding:8px 10px;font:800 .85rem Nunito,sans-serif;color:var(--pl);width:128px}
#bar{display:none;gap:6px;justify-content:center;align-items:center;padding:4px 8px;flex-wrap:wrap}
#bar.on{display:flex}
#girar{display:flex;align-items:center;gap:6px;background:#fff;border:2px solid var(--bd);border-radius:999px;padding:2px 8px;box-shadow:0 3px 0 var(--sh)}
#gr{width:118px;height:30px;accent-color:#6b2d5c;cursor:pointer;margin:0}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:6px 10px 2px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:2px solid var(--bd);background:#fff;color:var(--pl);border-radius:14px;padding:9px 14px;min-height:44px;font:800 .84rem Nunito,sans-serif;box-shadow:0 3px 0 var(--sh);cursor:pointer;white-space:nowrap}
.tab.on{background:var(--pl2);color:#fff;border-color:var(--pl2);box-shadow:0 3px 0 #401a38}
.tabswrap{position:relative;display:flex;align-items:center}
.tabswrap .tabs{flex:1;min-width:0;scroll-behavior:smooth}
.tabarrow{flex:0 0 auto;width:40px;height:44px;margin:6px 4px 0;border:2px solid var(--bd);border-radius:14px;background:#fff;color:var(--pl2);font:900 1.6rem/1 Nunito,sans-serif;cursor:pointer;box-shadow:0 3px 0 var(--sh);display:flex;align-items:center;justify-content:center;padding:0}
.tabarrow:active{transform:translateY(2px);box-shadow:0 1px 0 var(--sh)}
.tabarrow[hidden]{display:none}
.subtabs{display:flex;gap:6px;overflow-x:auto;padding:0 10px 2px;scrollbar-width:none}
.subtabs::-webkit-scrollbar{display:none}
.subtabs:empty{display:none}
.stab{flex:0 0 auto;border:2px solid var(--bd);background:#fff;color:var(--pl);border-radius:12px;padding:0 12px;min-height:38px;font:800 .78rem Nunito,sans-serif;box-shadow:0 3px 0 var(--sh);cursor:pointer;white-space:nowrap}
.stab.on{background:var(--pl);color:#fff;border-color:var(--pl);box-shadow:0 3px 0 #2a1226}
.sh{height:min(27vh,230px);overflow-y:auto;padding:8px 10px 12px;touch-action:pan-y}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.ic{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;min-height:92px;border:2px solid var(--bd);background:#fff;border-radius:16px;font-family:inherit;color:var(--pl);box-shadow:0 3px 0 var(--sh);cursor:pointer}
.ic:active{transform:translateY(2px)}
.ic.no{opacity:.5}
.ic svg{width:70px;height:54px}
.ic i{position:absolute;top:-6px;right:-6px;background:#06d6a0;color:#fff;font:900 .66rem Nunito;border-radius:99px;padding:1px 7px;border:2px solid #fff}
.nn{font-size:.68rem;font-weight:800;text-align:center;line-height:1.15}
.pp{font-size:.68rem;font-weight:900;color:var(--pl2)}
.grp{background:#fff;border:2px solid var(--bd);border-radius:16px;padding:10px 12px;margin-bottom:10px;box-shadow:0 3px 0 var(--sh)}
.grp h4{margin:0 0 8px;font-size:.9rem}
.op{display:flex;gap:8px;flex-wrap:wrap}
.cor{width:44px;height:44px;border-radius:12px;border:3px solid #fff;box-shadow:0 0 0 2px #ecd2e4;cursor:pointer}
.cor.on,.cb.on{box-shadow:0 0 0 3px var(--pl2)}
.cb{border:2px solid #e9cbe0;background:#fff;color:var(--pl);border-radius:12px;padding:10px 14px;min-height:44px;font:800 .85rem Nunito;cursor:pointer}
.cb.on{background:var(--pl2);color:#fff}
.cb:disabled{opacity:.5}
.modal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(63,29,56,.5)}
.modal.a{display:flex}
.cx{width:100%;max-width:440px;max-height:88dvh;overflow-y:auto;background:#fffaf3;border-radius:22px;padding:18px;box-shadow:0 20px 50px rgba(40,10,40,.4)}
.cx h3{font-family:"Dancing Script",cursive;font-size:1.8rem;margin:0 0 6px;color:var(--pl2);text-align:center}
.ms{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:9px 0;border-bottom:1px dashed #ecd2e4;font-size:.88rem;font-weight:800}
.ms.ok{opacity:.55}
.ms .go{flex:0 0 auto;border:0;border-radius:12px;padding:10px 14px;min-height:44px;font:900 .82rem Nunito;color:#fff;background:linear-gradient(180deg,#8a3d76,#5b2450);cursor:pointer}
.ms .go:disabled{background:#d9c6d3}
.st{text-align:center;font-size:1.3rem;margin:4px 0 10px}
.dc{font-size:.78rem;text-align:center;opacity:.8}
#toasts{position:fixed;left:50%;top:64px;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--pl2);color:#fff;font-weight:800;font-size:.88rem;padding:10px 18px;border-radius:99px;box-shadow:0 8px 20px rgba(80,30,70,.35);animation:tin .25s,tout .3s 2.1s forwards;max-width:92vw;text-align:center}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
@keyframes tout{to{opacity:0;transform:translateY(-8px)}}
@keyframes hop{40%{transform:translateY(-9px)}}
@keyframes bob{50%{transform:translateY(-2px)}}
.hop{animation:hop .5s}
.idle{animation:bob 2.4s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
const $=id=>document.getElementById(id),svg=$('svg');
let PR=false; /* POOL ainda não existe: evita erro de inicialização */
const KC='amor_coins_lulu',KS='amor_quarto_v4',KG='amor_quarto_mimo';
const gi=k=>{try{return parseInt(localStorage.getItem(k)||'0',10)||0}catch(e){return 0}};
let coins=gi(KC);
const setCoins=v=>{coins=v;try{localStorage.setItem(KC,String(v))}catch(e){}$('saldo').textContent=coins};
function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;$('toasts').appendChild(d);setTimeout(()=>d.remove(),2500)}
let AC=null,mudo=false;
function beep(f,d,t,v){if(mudo)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime;o.type=t||'triangle';o.frequency.value=f;g.gain.setValueAtTime(v||.05,n);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g);g.connect(AC.destination);o.start(n);o.stop(n+d+.02)}catch(e){}}
const sOk=()=>beep(880,.06),sNo=()=>beep(220,.14),sBuy=()=>{beep(900,.07,'square');setTimeout(()=>beep(1200,.1,'square'),70);setTimeout(()=>beep(1500,.14,'square'),150)};

/* ---------- geometria isométrica ---------- */
const WH=150,PAL=['#ff9ec4','#b79cff','#7fd8be','#7ec8ff','#ffd166','#ff8a7a','#d9c3ad'];
let ROT=0,CO=1,SI=0,CX=0,CY=0,THUMB=false;
const setRot=deg=>{ROT=((deg%360)+360)%360;const r=ROT*Math.PI/180;CO=Math.cos(r);SI=Math.sin(r)};
const rw=(x,y)=>{const dx=x-CX,dy=y-CY;return[dx*CO-dy*SI+CX,dx*SI+dy*CO+CY]};
const P=(x,y,z)=>{if(THUMB)return[(x-y)*32,(x+y)*16-z];const[rx,ry]=rw(x,y);return[(rx-ry)*32,(rx+ry)*16-z]};
function sh(hex,f){const n=parseInt(hex.slice(1),16),c=[n>>16,n>>8&255,n&255].map(v=>Math.round(f<1?v*f:v+(255-v)*(f-1)));return'#'+c.map(v=>v.toString(16).padStart(2,'0')).join('')}
const pl=(a,f)=>'<polygon points="'+a.map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join(' ')+'" fill="'+f+'" stroke="rgba(60,20,60,.18)" stroke-width=".6" stroke-linejoin="round"/>';
/* normal da face (mundo) girada pela visão: a face só aparece se aponta para a câmera */
const vn=(nx,ny)=>THUMB?[nx,ny]:[nx*CO-ny*SI,nx*SI+ny*CO];
const shF=(rx,ry)=>.71+.09*Math.max(-1,Math.min(1,ry-rx));
function box(gx,gy,x,y,z,w,d,h,c){const X=gx+x,Y=gy+y,T=z+h;let o='';
  const fc=[[0,-1,X,Y,X+w,Y],[1,0,X+w,Y,X+w,Y+d],[0,1,X+w,Y+d,X,Y+d],[-1,0,X,Y+d,X,Y]];
  for(const f of fc){const r=vn(f[0],f[1]);if(r[0]+r[1]<=1e-6)continue;
    o+=pl([P(f[2],f[3],z),P(f[4],f[5],z),P(f[4],f[5],T),P(f[2],f[3],T)],sh(c,shF(r[0],r[1])))}
  return o+pl([P(X,Y,T),P(X+w,Y,T),P(X+w,Y+d,T),P(X,Y+d,T)],c)}
function boxR(gx,gy,x,y,z,w,d,h,c,R,ca,sa){const T=z+h,lo=[[x,y],[x+w,y],[x+w,y+d],[x,y+d]].map(q=>R(q[0],q[1]));
  const NX=[0,1,0,-1],NY=[-1,0,1,0],fs=[];
  for(let i=0;i<4;i++){const nx=NX[i]*ca-NY[i]*sa,ny=NX[i]*sa+NY[i]*ca,rn=vn(nx,ny);if(rn[0]+rn[1]<=1e-6)continue;
    const A=lo[i],B=lo[(i+1)%4],f=shF(rn[0],rn[1]),dep=(A[0]+B[0]+A[1]+B[1])/2;
    fs.push([dep,pl([P(gx+A[0],gy+A[1],z),P(gx+B[0],gy+B[1],z),P(gx+B[0],gy+B[1],T),P(gx+A[0],gy+A[1],T)],sh(c,f))])}
  fs.sort((p,q)=>p[0]-q[0]);
  return fs.map(f=>f[1]).join('')+pl([P(gx+lo[0][0],gy+lo[0][1],T),P(gx+lo[1][0],gy+lo[1][1],T),P(gx+lo[2][0],gy+lo[2][1],T),P(gx+lo[3][0],gy+lo[3][1],T)],c)}
function spr(it,gx,gy,ang,col,st,z0){const m=col||PAL[0];z0=z0||0;let o='';
/* ordena as peças de um item girado, de trás para frente */
function ordena(it,gx,gy,R){
  const E=1e-4,n=it.b.length;
  const inf=it.b.map(b=>{const x=b[0],y=b[1],w=b[3],d=b[4];
    const cs=[[x,y],[x+w,y],[x+w,y+d],[x,y+d]].map(q=>{const r=R(q[0],q[1]),wx=gx+r[0],wy=gy+r[1];return THUMB?[wx,wy]:rw(wx,wy)});
    const ax=[];for(let k=0;k<2;k++){const dx=cs[k+1][0]-cs[k][0],dy=cs[k+1][1]-cs[k][1],l=Math.hypot(dx,dy)||1;ax.push([dx/l,dy/l])}
    return{b,cs,ax,z0:b[2],z1:b[2]+b[5],s:(cs[0][0]+cs[2][0]+cs[0][1]+cs[2][1])/2}});
  const pr=(P,u)=>{let lo=1e9,hi=-1e9;for(const q of P.cs){const v=q[0]*u[0]+q[1]*u[1];if(v<lo)lo=v;if(v>hi)hi=v}return[lo,hi]};
  const cmp=(A,B)=>{let r=0;
    for(const u of A.ax.concat(B.ax)){const k=u[0]+u[1];if(Math.abs(k)<1e-3)continue;
      const a=pr(A,u),b=pr(B,u);let s;
      if(a[1]<=b[0]+E)s=k>0?-1:1;
      else if(b[1]<=a[0]+E)s=k>0?1:-1;
      else continue;
      if(r&&r!==s)return 0;r=s}
    if(r)return r;
    if(A.z1<=B.z0+E)return -1;
    if(B.z1<=A.z0+E)return 1;
    return 0};
  const adj=inf.map(()=>[]),ind=inf.map(()=>0);
  for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){const c=cmp(inf[i],inf[j]);
    if(c<0){adj[i].push(j);ind[j]++}else if(c>0){adj[j].push(i);ind[i]++}}
  const lt=(i,j)=>(inf[i].s-inf[j].s)||(inf[i].z0-inf[j].z0);
  const done=[],out=[];
  while(out.length<n){let p=-1;
    for(let i=0;i<n;i++)if(!done[i]&&ind[i]<=0&&(p<0||lt(i,p)<0))p=i;
    if(p<0)for(let i=0;i<n;i++)if(!done[i]&&(p<0||lt(i,p)<0))p=i; /* ciclo: usa o centro */
    done[p]=1;out.push(inf[p].b);adj[p].forEach(j=>ind[j]--)}
  return out}
  const a=((ang||0)%360+360)%360;
  const vr=!THUMB&&(((ROT%360)+360)%360)!==0;
  if(!a&&!vr){for(const b of it.b){let[x,y,z,w,d,h,c]=b;
    o+=box(gx,gy,x,y,z+z0,w,d,h,c===0?m:c===1?sh(m,1.25):c==='S'?(st?'#7ad7f0':'#242436'):c)}
    return o}
  const ca=Math.cos(a*Math.PI/180),sa=Math.sin(a*Math.PI/180),cx=it.w/2,cy=it.d/2;
  const R=(x,y)=>{const dx=x-cx,dy=y-cy;return[cx+dx*ca-dy*sa,cy+dx*sa+dy*ca]};
  const bs=ordena(it,gx,gy,R);
  for(const b of bs){let[x,y,z,w,d,h,c]=b;
    o+=boxR(gx,gy,x,y,z+z0,w,d,h,c===0?m:c===1?sh(m,1.25):c==='S'?(st?'#7ad7f0':'#242436'):c,R,ca,sa)}
  return o}

    const p=S.placed[k],it=IT[p.i],c=rw(p.x+it.w/2,p.y+it.d/2);return[c[0]+c[1],c[0],n]};
  /* quem decide a hora de desenhar:

  let p;
  if(it.wall){p={i:id,wall:'R',u:.5,v:70};fixW(p);let t=0;while(S.placed.some(q=>IT[q.i].wall&&q.wall===p.wall&&Math.abs(q.u-p.u)<it.w&&Math.abs(q.v-p.v)<it.h)&&t++<40){p.u+=.5;if(p.u>wallMax(p)-it.w){p.u=.5;p.wall=p.wall==='R'?'L':'R';p.v=p.v>=100?60:p.v+20}fixW(p)}}
  else{const v=vaga(it);if(!v){sNo();toast('Não cabe mais nada. Que tal ampliar o quarto?');return}p={i:id,x:v[0],y:v[1],ci:it.def||0,z:0,ang:0,ord:0,el:0}}
  S.placed.push(p);sel=S.placed.length-1;sOk();after();shelf()}
function guarda(){const p=S.placed[sel];if(!p)return;S.placed.splice(sel,1);sel=-1;sOk();fechaCor();reflow();after();shelf()}
function mexe(){const p=S.placed[sel];if(!p)return;const it=IT[p.i];
  if(it.luz||it.tv){p.on=p.on===0?1:0;beep(p.on===0?600:1200,.1,'sine')}else beep(it.sound||800,.12,'sine',.06);
  save();render();const g=svg.querySelector('[data-ix="'+sel+'"]');if(g&&(it.pet||it.sound)){g.classList.add('hop');setTimeout(()=>g.classList.remove('hop'),520)}
  const n=pronta();if(n>an)toast('🎯 Missão cumprida!');an=n}
/* profundidade: manda o item pra frente ou pra trás do que divide o mesmo apoio */
function ordemItem(d){const p=S.placed[sel];if(!p||IT[p.i].wall)return;
  p.ord=Math.max(-6,Math.min(6,(p.ord||0)+d));
  save();render();
  toast(d>0?('🔜 '+IT[p.i].n+' ficou na frente'):('🔙 '+IT[p.i].n+' ficou atrás'))}
/* altura livre: levanta ou abaixa o item no ar (por cima do apoio) */
function elevarItem(d){const p=S.placed[sel];if(!p||IT[p.i].wall)return;
  p.el=Math.max(0,Math.min(145,(p.el||0)+d));
  reflow();save();render();
  toast(p.el===0?('⬇️ '+IT[p.i].n+' voltou pro chão'):(d>0?('⬆️ '+IT[p.i].n+' subiu'):('⬇️ '+IT[p.i].n+' desceu')))}
$('bar').addEventListener('click',e=>{const a=e.target.closest('[data-a]');if(!a)return;const k=a.dataset.a;
  if(k==='x')return guarda();if(k==='ok'){sel=-1;return render()}if(!S.placed[sel])return;
  if(k==='i')return mexe();
  if(k==='at')return ordemItem(-1);
  if(k==='fr')return ordemItem(1);
  if(k==='up')return elevarItem(5);
  if(k==='dn')return elevarItem(-5);
  if(k==='c')return cor()});
/* girar livremente: slider + botões ⟲ ⟳ */
function girarItem(delta){const p=S.placed[sel];if(!p||IT[p.i].wall)return;
  const a=((p.ang||0)+delta)%360;propoeAng(a)}
function propoeAng(a){const p=S.placed[sel];if(!p)return;const it=IT[p.i];
  a=((a%360)+360)%360;const old=p.ang||0;p.ang=a;
  clampIn(p);
  if(encaixa){const zc=it.rug?0:baseAt(sel,p.x,p.y,it,a);
    if(!livre(sel,p.x,p.y,it,a,!!it.rug,zc,hOf(it))){p.ang=old;sNo();return}}
  reflow();sOk();save();render();
  const gr=$('gr');if(gr&&document.activeElement!==gr)gr.value=String(Math.round(a))}
$('brl').addEventListener('click',()=>girarItem(-15));
$('brr').addEventListener('click',()=>girarItem(15));
const grEl=$('gr');
if(grEl)grEl.addEventListener('input',()=>{const p=S.placed[sel];if(!p)return;propoeAng(+grEl.value)});

/* arrastar e soltar */
function pt(e){const q=svg.createSVGPoint();q.x=e.clientX;q.y=e.clientY;const r=q.matrixTransform(svg.getScreenCTM().inverse());return[r.x,r.y]}
const unr=(rx,ry)=>{const dx=rx-CX,dy=ry-CY;return[dx*CO+dy*SI+CX,-dx*SI+dy*CO+CY]};
const g2=(x,y)=>{const[rx,ry]=[(y/16+x/32)/2,(y/16-x/32)/2];return unr(rx,ry)};
/* descobre em qual parede (e onde) caiu o toque, considerando a rotação atual */
function uvWall(x,y){let best=null;
  ['R','L','E2','E3'].forEach(k=>{const wm=WALLT[k];if(!wm||Math.abs(wm.sx)<.5)return;const[A,dir,len]=edgeOf(k);
    const u=(x-wm.px)/wm.sx;if(u<-.5||u>len+.5)return;const v=wm.py+wm.sy*u-y;const dd=Math.abs(u-len/2);
    if(!best||dd<best.dd)best={wall:k,u,v,dd}});
  return best}
let panD0=null;
svg.addEventListener('pointerdown',e=>{
  const g=e.target.closest('[data-ix]');
  if(!g){dr=null;panD0={x:e.clientX,y:e.clientY,px:panX,py:panY,m:0};try{svg.setPointerCapture(e.pointerId)}catch(_){}return}
  panD0=null;
  const ix=+g.dataset.ix,p=S.placed[ix],it=IT[p.i],c=pt(e);
  if(ix!==sel)fechaCor();
  sel=ix;
  if(it.wall){const q=uvWall(c[0],c[1])||{wall:p.wall,u:p.u,v:p.v};dr={ix,wall:q.wall,a:p.u-q.u,b:p.v-q.v}}
  else{const q=g2(c[0],c[1]);const a0=rad(p.ang),c0=Math.cos(a0),s0=Math.sin(a0),pcx=p.x+it.w/2,pcy=p.y+it.d/2;
    dr={ix,a:p.x-q[0],b:p.y-q[1],kids:[]};
    if(!it.rug)S.placed.forEach((qq,j)=>{if(j===ix||IT[qq.i].wall||!(qq.z>0))return;const t=IT[qq.i];
      if(supAt(j,qq.x,qq.y,t,qq.ang).j!==ix)return;
      const ccx=qq.x+t.w/2,ccy=qq.y+t.d/2,dx=ccx-pcx,dy=ccy-pcy;
      dr.kids.push({j,lx:dx*c0+dy*s0,ly:-dx*s0+dy*c0,ao:((qq.ang||0)-(p.ang||0))%360})})}
  dr.m=0;try{svg.setPointerCapture(e.pointerId)}catch(_){}render()});
svg.addEventListener('pointermove',e=>{
  if(panD0){const dx=e.clientX-panD0.x,dy=e.clientY-panD0.y;
    if(!panD0.m&&Math.abs(dx)<7&&Math.abs(dy)<7)return;panD0.m=1;
    const vb=svg.viewBox.baseVal,sx=(vb.width||1)/Math.max(1,svg.clientWidth),sy=(vb.height||1)/Math.max(1,svg.clientHeight);
    panX=panD0.px+dx*sx;panY=panD0.py+dy*sy;clampPan();render();return}
  if(!dr)return;const p=S.placed[dr.ix],it=IT[p.i],c=pt(e);
  if(it.wall){const q=uvWall(c[0],c[1]);if(!q)return;p.wall=q.wall;p.u=q.u+dr.a;p.v=q.v+dr.b;fixW(p)}
  else{const q=g2(c[0],c[1]);let nx=q[0]+dr.a,ny=q[1]+dr.b;
    if(encaixa){nx=Math.round(nx);ny=Math.round(ny);
      if(nx===p.x&&ny===p.y)return;
      const zc=it.rug?0:baseAt(dr.ix,nx,ny,it,p.ang);
      if(!livre(dr.ix,nx,ny,it,p.ang,!!it.rug,zc,hOf(it)))return;
      p.x=nx;p.y=ny}
    else{const M=0.6;nx=Math.max(-M,Math.min(nx,S.w+M-it.w));ny=Math.max(-M,Math.min(ny,S.d+M-it.d));if(nx===p.x&&ny===p.y)return;p.x=nx;p.y=ny;clampIn(p)}
    if(dr.kids&&dr.kids.length){const a=rad(p.ang),ca=Math.cos(a),sa=Math.sin(a),pcx=p.x+it.w/2,pcy=p.y+it.d/2;
      dr.kids.forEach(k=>{const qq=S.placed[k.j];if(!qq)return;const t=IT[qq.i];
        const ccx=pcx+k.lx*ca-k.ly*sa,ccy=pcy+k.lx*sa+k.ly*ca;
        qq.ang=(((p.ang||0)+k.ao)%360+360)%360;qq.x=ccx-t.w/2;qq.y=ccy-t.d/2;clampIn(qq)})}
    reflow()}
  dr.m=1;render()});
const solta=()=>{
  if(panD0){if(panD0.m){BANK.panX=panX;BANK.panY=panY;save()}else{sel=-1;fechaCor();render()}panD0=null}
  if(dr&&dr.m){sOk();save()}dr=null};
const cancela=()=>{if(panD0){if(panD0.m){BANK.panX=panX;BANK.panY=panY;save()}panD0=null}if(dr&&dr.m){sOk();save()}dr=null};
svg.addEventListener('pointerup',solta);svg.addEventListener('pointercancel',cancela);
svg.addEventListener('wheel',e=>{e.preventDefault();const k=e.deltaY<0?1.2:1/1.2;
  zoom=Math.min(2.6,Math.max(.7,Math.round(zoom*k*100)/100));BANK.zoom=zoom;save();render()},{passive:false});

/* abas, prateleira e estilo */
$('tabs').addEventListener('click',e=>{const b=e.target.closest('.tab');if(b){tab=b.dataset.c;subTab='all';shelf()}});
$('subtabs').addEventListener('click',e=>{const b=e.target.closest('.stab');if(b){subTab=b.dataset.sb;shelf()}});
$('sh').addEventListener('click',e=>{const t=e.target,q=s=>t.closest(s);
  if(q('[data-id]'))return poe(q('[data-id]').dataset.id);
  if(q('[data-q]')){qRen=-1;return quartos()}
  if(q('[data-r]')){qRen=BANK.cur;return quartos()}
  if(q('[data-w]')){S.wall=q('[data-w]').dataset.w;save();render();return estilo()}
  if(q('[data-s]')){S.strp=S.strp?0:1;save();render();return estilo()}
  if(q('[data-f]')){S.floor=q('[data-f]').dataset.f;save();render();return estilo()}
  const rs=(dw,dd)=>{const w=Math.min(QMAX,Math.max(QMIN,S.w+dw)),d=Math.min(QMAX,Math.max(QMIN,S.d+dd));if(w===S.w&&d===S.d)return sNo();S.w=w;S.d=d;caber();sOk();save();render();return estilo()};
  if(q('[data-wm]'))return rs(-1,0);if(q('[data-wp]'))return rs(1,0);if(q('[data-dm]'))return rs(0,-1);if(q('[data-dp]'))return rs(0,1);
  if(q('[data-x]')){if(!S.placed.length)return toast('O quarto já está vazio.');S.placed=[];sel=-1;save();render();toast('Quarto arrumadinho ✨')}});

/* missões */
function modal(h){$('modal').innerHTML='<div class="cx">'+h+'</div>';$('modal').classList.add('a')}
function fecha(){$('modal').classList.remove('a');$('modal').innerHTML=''}
function missoes(){const s=stars();
  modal('<h3>Nosso cantinho</h3><div class="st">'+'⭐'.repeat(s)+'☆'.repeat(5-s)+'</div><p class="dc">As estrelas crescem com a quantidade de itens e a variedade de categorias. Cada quarto tem seus próprios desafios!</p>'
  +S.ms.map(i=>{const m=POOL[i],ok=!!S.m[i],can=!ok&&m[2]();return'<div class="ms'+(ok?' ok':'')+'"><span>'+(ok?'✅ ':'')+m[0]+'</span><button class="go" data-m="'+i+'"'+(can?'':' disabled')+'>'+(ok?'Pego':'💗 '+m[1])+'</button></div>'}).join('')
  +'<div style="text-align:center;margin-top:12px"><button class="b" data-fecha="1">Fechar</button></div>')}
$('modal').addEventListener('click',e=>{
  if(e.target===$('modal')||e.target.closest('[data-fecha]'))return fecha();
  const q=s=>e.target.closest(s);
  if(q('[data-qe]')){qE=q('[data-qe]').dataset.qe;return quartos()}
  if(q('[data-nq]')){const el=$('qN');const n=(el&&el.value.trim())||('Quarto '+(BANK.rooms.length+1));const i=BANK.rooms.length,t=TEMAS[i%TEMAS.length];const nq=criaQ(n,qE,i);nq.wall=WALLS[t[0]];nq.floor=t[1];BANK.rooms.push(nq);save();sBuy();return abrirQuarto(i)}
  if(q('[data-ab]'))return abrirQuarto(+q('[data-ab]').dataset.ab);
  if(q('[data-rn]')){qRen=+q('[data-rn]').dataset.rn;return quartos()}
  if(q('[data-rk]')){const i=+q('[data-rk]').dataset.rk,el=$('qR'),v=el&&el.value.trim();if(v)BANK.rooms[i].nome=v;qRen=-1;save();render();return quartos()}
  if(q('[data-dl]')){const i=+q('[data-dl]').dataset.dl;if(BANK.rooms.length<2)return;if(!confirm('Apagar o quarto "'+BANK.rooms[i].nome+'"? Tudo que tem dentro dele vai sumir.'))return;BANK.rooms.splice(i,1);if(BANK.cur>=BANK.rooms.length)BANK.cur=BANK.rooms.length-1;S=BANK.rooms[BANK.cur];sel=-1;save();render();shelf();an=pronta();qRen=-1;return quartos()}
  const g=q('[data-m]');if(!g)return;const i=+g.dataset.m,m=POOL[i];
  if(!m||S.m[i]||!m[2]())return;S.m[i]=1;setCoins(coins+m[1]);save();sBuy();toast('💗 +'+m[1]+' corações!');an=pronta();render();shelf();missoes()});
$('bm').addEventListener('click',missoes);
$('br').addEventListener('click',()=>{qRen=-1;quartos()});

/* foto */
function foto(){sel=-1;render();
  const s=svg.cloneNode(true),vb=svg.viewBox.baseVal,W=Math.round(vb.width*3),H=Math.round(vb.height*3);
  s.setAttribute('width',W);s.setAttribute('height',H);s.removeAttribute('id');
  const img=new Image();
  img.onload=()=>{const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');g.fillStyle=S.night?'#241a44':'#fff3fa';g.fillRect(0,0,W,H);g.drawImage(img,0,0,W,H);
    c.toBlob(b=>{if(!b)return toast('Não consegui gerar a foto.');const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='nosso-quartinho.png';document.body.appendChild(a);a.click();a.remove();BANK.photo=true;save();after();toast('📷 Foto salva!')})};
  img.onerror=()=>toast('Não consegui gerar a foto.');
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(new XMLSerializer().serializeToString(s))}
$('bf').addEventListener('click',foto);
$('bn').addEventListener('click',()=>{S.night=!S.night;after();if(tab==='est')estilo()});
$('bs').addEventListener('click',()=>{mudo=!mudo;$('bs').textContent=mudo?'🔇':'🔊'});

/* ---------- cor livre ---------- */
const PALX=['#ff9ec4','#ff6fa5','#e0245e','#ff5a5f','#ff8a7a','#ffb703','#ffd166','#ffe08a','#c8f08f','#7fd8be','#06d6a0','#2ec4b6','#7ec8ff','#4aa3ff','#3a6ff7','#7a5cff','#b79cff','#c77dff','#ff7ad9','#f2a5ff','#ffd9ec','#d9c3ad','#c8935c','#a9744f','#6b4a3a','#ffffff','#e8e8f0','#9aa1ad','#3f1d38','#242436'];
const normHex=v=>{v=String(v||'').trim();if(!v)return null;if(v[0]!=='#')v='#'+v;if(/^#[0-9a-f]{3}$/i.test(v))v='#'+v[1]+v[1]+v[2]+v[2]+v[3]+v[3];return/^#[0-9a-f]{6}$/i.test(v)?v.toLowerCase():null};
function fechaCor(){const c=$('cor');if(!c)return;c.classList.remove('a');c.innerHTML=''}
function cor(){
  const p=S.placed[sel];if(!p)return fechaCor();
  const it=IT[p.i],cur=icol(p);
  $('cor').innerHTML='<div class="r" style="justify-content:space-between;margin-bottom:8px"><b style="font-size:.92rem">🎨 '+escn(it.n)+'</b><button class="cb" data-cx="1" style="min-height:38px;padding:6px 12px">✖️</button></div>'
   +'<div class="r">'+PALX.map(c=>'<button class="sw'+(c.toLowerCase()===cur.toLowerCase()?' on':'')+'" data-cc="'+c+'" style="background:'+c+'" aria-label="Cor '+c+'"></button>').join('')+'</div>'
   +'<div class="r" style="margin-top:10px"><input type="color" id="cin" value="'+cur+'" aria-label="Escolher cor"><input type="text" id="chex" placeholder="#ff88cc" aria-label="Colar cor"><button class="cb" data-ck="1">Usar</button><button class="cb" data-cp="1">↩️ Original</button></div>';
  $('cor').classList.add('a')}
$('cor').addEventListener('click',e=>{const g=s=>e.target.closest(s);
  if(g('[data-cx]'))return fechaCor();
  const p=S.placed[sel];if(!p)return fechaCor();
  if(g('[data-cc]')){p.cc=g('[data-cc]').dataset.cc;sOk();save();render();return cor()}
  if(g('[data-cp]')){delete p.cc;sOk();save();render();return cor()}
  if(g('[data-ck]')){const v=normHex($('chex')&&$('chex').value);if(!v)return toast('Cor inválida. Ex: #ff88cc');p.cc=v;sOk();save();render();cor();toast('🎨 Cor aplicada!')}});
$('cor').addEventListener('input',e=>{if(e.target.id!=='cin')return;const p=S.placed[sel];if(!p)return;p.cc=e.target.value;save();render()});

/* ---------- encaixe e zoom ---------- */
function updK(){const b=$('bk');if(!b)return;b.textContent=encaixa?'🧲':'🕊️';b.style.background=encaixa?'':'#f0e2ff';b.style.borderColor=encaixa?'':'#c77dff'}
$('bk').addEventListener('click',()=>{encaixa=!encaixa;BANK.snap=encaixa;updK();save();toast(encaixa?'🧲 Encaixando na grade':'🕊️ Solto! Arraste onde quiser')});
$('zi').addEventListener('click',e=>{const b=e.target.closest('[data-z]');if(!b)return;const k=b.dataset.z;
  zoom=k==='0'?1:Math.min(2.6,Math.max(.7,Math.round((zoom+(k==='+'?.2:-.2))*10)/10));
  BANK.zoom=zoom;save();render()});

/* ---------- navegar: setas (mover a visão) e girar ---------- */
function sinc(){const r=$('rc');if(r)r.value=String(Math.round(BANK.rot||0)%360)}
function panTo(nx,ny){panX=nx;panY=ny;clampPan();BANK.panX=panX;BANK.panY=panY;save();render()}
function gira(d){BANK.rot=((d%360)+360)%360;save();sinc();render()}
$('pad').addEventListener('click',e=>{const b=e.target.closest('[data-p]');if(!b)return;const p=b.dataset.p,st=72;
  if(p==='u')panTo(panX,panY+st);else if(p==='d')panTo(panX,panY-st);
  else if(p==='l')panTo(panX+st,panY);else if(p==='r')panTo(panX-st,panY);
  else if(p==='r0')panTo(0,0);sOk()});
$('rot').addEventListener('click',e=>{const b=e.target.closest('[data-rot]');if(!b)return;gira((BANK.rot||0)+(+b.dataset.rot));sOk()});
$('rc').addEventListener('input',e=>{BANK.rot=+e.target.value;save();render()});

/* mimo diário */
const hoje=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
function mimo(){let g;try{g=localStorage.getItem(KG)}catch(e){}$('bg').style.display=g===hoje()?'none':''}
$('bg').addEventListener('click',()=>{setCoins(coins+25);try{localStorage.setItem(KG,hoje())}catch(e){}sBuy();toast('💝 Mimo do dia! +25 corações');mimo();shelf()});
/* setas das categorias */
(function(){
  const sc=$('tabs'),L=$('tl'),R=$('tr');
  function upd(){
    L.hidden=sc.scrollLeft<=4;
    R.hidden=sc.scrollLeft+sc.clientWidth>=sc.scrollWidth-4;
  }
  L.addEventListener('click',()=>sc.scrollBy({left:-Math.max(200,sc.clientWidth*.7),behavior:'smooth'}));
  R.addEventListener('click',()=>sc.scrollBy({left:Math.max(200,sc.clientWidth*.7),behavior:'smooth'}));
  sc.addEventListener('scroll',upd);
  window.addEventListener('resize',upd);
  /* rolar com a rodinha do mouse na horizontal */
  sc.addEventListener('wheel',e=>{if(e.deltaY){e.preventDefault();sc.scrollLeft+=e.deltaY}},{passive:false});
  /* as abas são recriadas a cada clique: reatualiza as setas */
  new MutationObserver(()=>{
    const on=sc.querySelector('.tab.on');
    if(on)on.scrollIntoView({block:'nearest',inline:'nearest'});
    upd();
  }).observe(sc,{childList:true});
  setTimeout(upd,0);
})();
updK();setCoins(coins);sinc();render();shelf();mimo();an=pronta();
setTimeout(()=>toast('Toque num item: 🎨 muda a cor e 🧲/🕊️ deixa ele solto ou encaixado.'),700);
</script>
</body>
</html>
