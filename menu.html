<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cantinho da Gente 💖</title>

<!-- Fonte Opção B -->
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;700;800&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.js">
<style>
    body {
        margin: 0;
        background: linear-gradient(135deg, #ff0055, #4a00e0);
        font-family: "Nunito", sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        color: #fff;
        overflow: hidden;
        position: relative;
        animation: fadeIn 1s ease-in-out;
    }

    /* Chuva de corações no fundo */
    body::before {
        content: "❤️";
        position: absolute;
        font-size: 2rem;
        opacity: 0.15;
        animation: floatHearts 6s infinite linear;
        left: 10%;
        top: -10%;
    }
    body::after {
        content: "💜";
        position: absolute;
        font-size: 1.5rem;
        opacity: 0.15;
        animation: floatHearts 8s infinite linear;
        right: 15%;
        top: -10%;
        animation-delay: 2s;
    }

    @keyframes floatHearts {
        0% { transform: translateY(-10%) rotate(0deg); opacity: 0; }
        10% { opacity: 0.15; }
        90% { opacity: 0.15; }
        100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
    }

    .container {
        text-align: center;
        z-index: 10;
    }

    h1 {
        font-weight: 800;
        font-size: 2.6rem;
        margin-bottom: 35px;
        text-shadow: 0 0 12px rgba(255,255,255,0.6);
        letter-spacing: 1px;
    }

    .cards {
        display: flex;
        gap: 25px;
        justify-content: center;
        flex-wrap: wrap;
        max-width: 900px;
    }

    .card {
        width: 140px;
        height: 140px;
        background: rgba(255,255,255,0.12);
        backdrop-filter: blur(12px);
        border-radius: 22px;
        border: 2px solid rgba(255,255,255,0.25);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        font-weight: 700;
        cursor: pointer;
        transition: 0.3s ease;
        text-shadow: 0 0 10px rgba(255,255,255,0.3);
    }

    .card:hover {
        transform: scale(1.12);
        background: rgba(255,255,255,0.22);
        box-shadow: 0 8px 25px rgba(0,0,0,0.25);
    }

    /* Card Especial Pulsando */
    .card-special {
        border-color: #ffeb3b;
        animation: pulse 2s infinite alternate;
    }
    @keyframes pulse {
        from { box-shadow: 0 0 10px rgba(255, 235, 59, 0.3); }
        to { box-shadow: 0 0 25px rgba(255, 235, 59, 0.7); transform: scale(1.02); }
    }

    .icon {
        font-size: 2.6rem;
        margin-bottom: 8px;
    }

    @keyframes fadeIn {
        0% { opacity: 0; transform: translateY(20px); }
        100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes popIn { from { opacity: 0; transform: scale(0.6); } }

    /* ====== Botão de Novidades (Patch Notes) ====== */
    .news-btn {
        position: fixed;
        top: 22px;
        right: 22px;
        z-index: 50;
        background: linear-gradient(135deg, #ffd166, #ef476f 50%, #c77dff 100%);
        color: white;
        border: 1.5px solid rgba(255,255,255,0.35);
        border-radius: 24px;
        padding: 9px 18px;
        font-family: "Nunito", sans-serif;
        font-weight: 800;
        font-size: 0.82em;
        letter-spacing: 0.6px;
        cursor: pointer;
        box-shadow: 0 10px 26px rgba(90, 20, 100, 0.45), 0 4px 10px rgba(0,0,0,0.15);
        transition: transform 0.2s, box-shadow 0.2s;
        display: flex;
        align-items: center;
        gap: 9px;
        user-select: none;
    }
    .news-btn:hover {
        transform: translateY(-2px) scale(1.03);
        box-shadow: 0 14px 34px rgba(90, 20, 100, 0.55);
    }
    .news-dot {
        width: 10px;
        height: 10px;
        background: #fff;
        border-radius: 50%;
        animation: pulse-dot 1.3s ease-in-out infinite;
        box-shadow: 0 0 0 3px rgba(255,255,255,0.3);
    }
    @keyframes pulse-dot {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.4); opacity: 0.75; }
    }

    /* ====== Modal de Patch Notes ====== */
    .patch-overlay {
        position: fixed;
        inset: 0;
        background: radial-gradient(circle at center, rgba(60, 15, 90, 0.75), rgba(10, 0, 30, 0.92));
        backdrop-filter: blur(14px);
        z-index: 20000;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 24px;
        animation: fadeIn 0.4s ease;
    }
    .patch-overlay.open {
        display: flex;
    }
    .patch-modal {
        background: linear-gradient(160deg, #fff9ed 0%, #ffeaf5 45%, #f3e4ff 100%);
        border: 2.5px solid rgba(199, 125, 255, 0.4);
        border-radius: 28px;
        max-width: 660px;
        width: 100%;
        max-height: 86vh;
        box-shadow:
            0 35px 90px rgba(70, 10, 110, 0.55),
            inset 0 0 0 1px rgba(255,255,255,0.65);
        display: flex;
        flex-direction: column;
        position: relative;
        animation: patchPop 0.55s cubic-bezier(.2,1.3,.5,1) both;
        overflow: hidden;
    }
    @keyframes patchPop {
        from { opacity: 0; transform: scale(0.82) translateY(22px); }
        to   { opacity: 1; transform: scale(1)    translateY(0);    }
    }
    .patch-header {
        padding: 28px 30px 22px 30px;
        text-align: center;
        background: linear-gradient(135deg, rgba(239, 71, 111, 0.14), rgba(199, 125, 255, 0.22));
        border-bottom: 2px dashed rgba(199,125,255,0.32);
        position: relative;
    }
    .patch-close {
        position: absolute;
        top: 16px;
        right: 18px;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: rgba(255,255,255,0.75);
        border: 1.5px solid rgba(199,125,255,0.3);
        font-size: 1.15em;
        cursor: pointer;
        transition: 0.22s;
        color: #7b2cbf;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .patch-close:hover {
        background: #ef476f;
        color: white;
        border-color: #ef476f;
        transform: rotate(90deg);
    }
    .patch-icon {
        font-size: 3.1em;
        filter: drop-shadow(0 5px 12px rgba(199,125,255,0.4));
        margin-bottom: 4px;
    }
    .patch-title {
        font-family: "Dancing Script", cursive;
        font-size: 2.35em;
        color: #5a1f8a;
        line-height: 1.1;
        background: linear-gradient(135deg, #ef476f, #9d4edd);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        font-weight: 700;
    }
    .patch-subtitle {
        font-family: "Nunito", sans-serif;
        font-size: 0.82em;
        font-weight: 700;
        letter-spacing: 3.5px;
        text-transform: uppercase;
        color: #a06cd5;
        margin-top: 6px;
        opacity: 0.88;
    }
    .patch-new-count {
        display: inline-block;
        margin-top: 12px;
        padding: 5px 16px;
        background: linear-gradient(135deg, #ef476f, #c9184a);
        color: white;
        font-family: "Nunito", sans-serif;
        font-weight: 800;
        font-size: 0.72em;
        letter-spacing: 1.2px;
        border-radius: 14px;
        box-shadow: 0 5px 14px rgba(201, 24, 74, 0.42);
    }

    .patch-body {
        padding: 24px 28px;
        overflow-y: auto;
        scrollbar-width: thin;
        scrollbar-color: rgba(199,125,255,0.45) transparent;
    }
    .patch-body::-webkit-scrollbar { width: 8px; }
    .patch-body::-webkit-scrollbar-thumb {
        background: rgba(199,125,255,0.5);
        border-radius: 8px;
    }

    .patch-entry {
        margin-bottom: 26px;
    }
    .patch-entry:last-child { margin-bottom: 0; }
    .patch-entry-head {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1.5px dashed rgba(160, 108, 213, 0.32);
        flex-wrap: wrap;
    }
    .patch-version {
        font-family: "Nunito", sans-serif;
        font-weight: 800;
        font-size: 0.82em;
        background: linear-gradient(135deg, #9d4edd, #7b2cbf);
        color: white;
        padding: 5px 14px;
        border-radius: 12px;
        letter-spacing: 0.6px;
        box-shadow: 0 4px 12px rgba(157, 78, 221, 0.38);
    }
    .patch-version.latest::after {
        content: " NOVO";
        margin-left: 8px;
        background: #ef476f;
        font-size: 0.74em;
        padding: 2px 9px;
        border-radius: 9px;
        letter-spacing: 1px;
        animation: pulse-dot 1.45s ease-in-out infinite;
    }
    .patch-date {
        font-family: "Nunito", sans-serif;
        font-size: 0.78em;
        font-weight: 700;
        color: #8a5a2b;
        letter-spacing: 0.6px;
    }
    .patch-entry-title {
        font-family: "Dancing Script", cursive;
        font-size: 1.55em;
        color: #3a1f5a;
        line-height: 1.1;
        margin-left: auto;
    }

    .patch-list {
        list-style: none;
        padding: 0;
        margin: 0;
    }
    .patch-list li {
        padding: 11px 16px 11px 44px;
        position: relative;
        margin-bottom: 7px;
        background: rgba(255,255,255,0.75);
        border-radius: 14px;
        border-left: 3.5px solid #c77dff;
        font-family: "Nunito", sans-serif;
        font-size: 0.9em;
        line-height: 1.55;
        color: #2e1f10;
        transition: transform 0.22s, background 0.22s;
    }
    .patch-list li:hover {
        transform: translateX(4px);
        background: rgba(199, 125, 255, 0.11);
    }
    .patch-list li::before {
        content: "💖";
        position: absolute;
        left: 13px;
        top: 50%;
        transform: translateY(-50%);
        font-size: 0.95em;
        filter: drop-shadow(0 1px 2px rgba(199,125,255,0.3));
    }
    .patch-list li.feat::before { content: "✨"; }
    .patch-list li.chapter::before { content: "📖"; }
    .patch-list li.chapter { border-left-color: #ef476f; }
    .patch-list li.fix::before { content: "🛠️"; }
    .patch-list li.fix { border-left-color: #ffd166; }
    .patch-list li.game::before { content: "🎮"; }
    .patch-list li.game { border-left-color: #06d6a0; }
    .patch-list li.update::before { content: "🚀"; }
    .patch-list li.update { border-left-color: #118ab2; }

    .patch-footer {
        padding: 18px 28px 26px 28px;
        background: linear-gradient(180deg, transparent, rgba(199, 125, 255, 0.14));
        border-top: 2px dashed rgba(199,125,255,0.28);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
    }
    .patch-btn-ok {
        width: 100%;
        padding: 15px 28px;
        border: none;
        border-radius: 20px;
        background: linear-gradient(135deg, #ef476f 0%, #c9184a 38%, #9d4edd 100%);
        color: white;
        font-family: "Nunito", sans-serif;
        font-weight: 800;
        font-size: 0.98em;
        letter-spacing: 1px;
        cursor: pointer;
        box-shadow: 0 12px 30px rgba(157, 78, 221, 0.45);
        transition: transform 0.22s, box-shadow 0.22s;
    }
    .patch-btn-ok:hover {
        transform: translateY(-2px);
        box-shadow: 0 16px 36px rgba(157, 78, 221, 0.58);
    }
    .patch-note {
        font-family: "Dancing Script", cursive;
        color: #5a1f8a;
        font-size: 1.28em;
        text-align: center;
        line-height: 1.4;
    }

    @keyframes fadeIn { from {opacity:0;} to {opacity:1;} }

    @media (max-width: 600px) {
        h1 { font-size: 1.9rem; }
        .card { width: 110px; height: 110px; }
        .icon { font-size: 2.1rem; }
        .patch-title { font-size: 1.9em; }
        .patch-entry-title { margin-left: 0; font-size: 1.35em; }
        .news-btn { top: 12px; right: 12px; padding: 7px 13px; font-size: 0.75em; }
    }
</style>
</head>

<body>

<div class="container">
    <h1>💜 Nosso Cantinho 💜</h1>

    <div class="cards">
        <div class="card" onclick="openPage('memorias.html')">
            <div class="icon">📸</div>
            <span>Memórias</span>
        </div>


        <div class="card" onclick="openPage('cartinhas.html')">
            <div class="icon">💌</div>
            <span>Cartinhas</span>
        </div>

        <div class="card" onclick="openPage('trilha.html')">
            <div class="icon">🎧</div>
            <span>Músicas</span>
        </div>

        <div class="card" onclick="openPage('quiz/quiz.html')">
            <div class="icon">💎</div>
            <span>Quiz</span>
        </div>

        <div class="card" onclick="openPage('jogo/jogo.html')">
            <div class="icon">🎮</div>
            <span>Jogo</span>
        </div>

        <div class="card" onclick="openPage('loja.html')">
            <div class="icon">🛒</div>
            <span>Loja</span>
        </div>

        <!-- <div class="card card-special" onclick="openPage('ranking.html')">
            <div class="icon">🏆</div>
            <span>Ranking</span>
        </div> -->

        <div class="card" onclick="openPage('loja.html')">
            <div class="icon">🎁</div>
            <span>Vale</span>
        </div>


        <div class="card card-special" onclick="openPage('livro.html')">
            <div class="icon">📖</div>
            <span>Nosso Livro</span>
        </div>
    </div>
</div>

<!-- Botão de Novidades (canto superior direito) -->
<button class="news-btn" id="newsBtn" onclick="openPatchNotes(true)">
  <span class="news-dot" id="newsDot"></span>
  <span>📰 Novidades do Cantinho</span>
</button>

<!-- Modal de Patch Notes -->
<div class="patch-overlay" id="patchOverlay">
  <div class="patch-modal">
    <button class="patch-close" onclick="closePatchNotes()">✕</button>
    <div class="patch-header">
      <div class="patch-icon">💕🏠</div>
      <div class="patch-title">Novidades do Nosso Cantinho</div>
      <div class="patch-subtitle">Tudo o que chegou de novo por aqui</div>
      <div class="patch-new-count" id="patchNewCount">1 atualização nova</div>
    </div>
    <div class="patch-body" id="patchBody">
    </div>
    <div class="patch-footer">
      <div class="patch-note">
        "Cada nova atualização é um pedacinho do nosso amor<br>ficando cada vez mais completo." 💕
      </div>
      <button class="patch-btn-ok" onclick="closePatchNotes(true)">💝 Li tudo! Vamos explorar o cantinho</button>
    </div>
  </div>
</div>

<script>
/* =========================================================
   📰 PATCH NOTES GLOBAL DO CANTINHO
   Atualizações de QUALQUER coisa do projeto entram aqui!
   Ordem: o item 0 é sempre o mais novo.
   ========================================================= */
const PATCHES = [
  {
    id: "v2.1.0",
    date: "08 de Outubro de 2026",
    title: "Som de Virar Página + Novidades no Menu 💖",
    latest: true,
    items: [
      { type: "update",  text: "📰 <b>Painel de Novidades no Menu</b>: agora todas as atualizações do cantinho aparecem direto na tela inicial! Você recebe um aviso sempre que tiver algo novo para ver 💜" },
      { type: "feat",    text: "🔊 <b>Som de virar página realista no Livro</b>: agora o livro toca um áudio de folhear página toda vez que você usa as setas, voltar tem som diferente de avançar!" },
      { type: "fix",     text: "🛠️ Ajustes finos no volume e timing do som para ficar perfeito, sem clicks no começo/fim do áudio." }
    ]
  },
  {
    id: "v2.0.0",
    date: "07 de Outubro de 2026",
    title: "Capítulo II + Marcadores no Livro",
    latest: false,
    items: [
      { type: "chapter", text: "📖 Capítulo II liberado — <b>O Começo de Tudo</b> (30 de Janeiro de 2023): a manhã após a primeira conversa, a pesquisa sobre CMT, a brincadeira dos números e o famoso 'estou perto de ter um crush'...!" },
      { type: "feat",    text: "✨ <b>Sistema de marcadores de texto</b>: no livro, selecione qualquer trecho com o mouse e clique no botão 💖 roxo, o trecho fica marcado como marca-texto realista permanente." },
      { type: "feat",    text: "💖 Página <b>Minhas Citações Favoritas</b>: todos os trechos marcados ficam salvos em uma página especial, com referência de qual capítulo e página." },
      { type: "feat",    text: "🎀 <b>Marcador físico</b> de fita vermelha aparece saindo do topo do livro sempre que você tem marcações salvas, clique na fita para abrir suas citações favoritas." }
    ]
  },
  {
    id: "v1.0.0",
    date: "01 de Outubro de 2026",
    title: "Lançamento do Cantinho 💜",
    latest: false,
    items: [
      { type: "update",  text: "🚀 <b>Lançamento oficial do Nosso Cantinho</b>: o menu inicial com todos os cantinhos especiais ficou disponível, Memórias, Cartinhas, Músicas, Quiz, Jogo, Loja e Nosso Livro!" },
      { type: "chapter", text: "📖 Capítulo I do Livro liberado <b>O Dia em que Tudo Começou</b> (29 de Janeiro de 2023): a história do domingo de futebol, da mensagem da amiga e do primeiro 'oioi'." },
      { type: "feat",    text: "🎮 <b>Jogo da Lulu</b>: jogo interativo da Lulu personagem principal, eventos e lojinha de itens!" },
      { type: "feat",    text: "🛒 <b>Loja de itens</b> para personalizar a experiência do jogo e colecionar mimos 💝" },
      { type: "feat",    text: "📜 <b>Modo Autor</b> no livro: o escritor da história pode editar rascunhos locais sem publicar antes de estar pronto." }
    ]
  }
];

const PATCH_SEEN_KEY = "cantinho_patch_seen_v1";

/* ====== Funções do Patch Notes ====== */
function getLastSeenPatch() {
  return localStorage.getItem(PATCH_SEEN_KEY) || "";
}

function markPatchesSeen() {
  if (PATCHES.length > 0) {
    localStorage.setItem(PATCH_SEEN_KEY, PATCHES[0].id);
  }
  updateNewsBadge();
}

function countNewPatches() {
  const lastSeen = getLastSeenPatch();
  if (!lastSeen) return PATCHES.length;
  return PATCHES.filter(p => p.id !== lastSeen).length;
}

function buildPatchHTML(patch, isLatest) {
  let itemsHTML = "";
  patch.items.forEach(it => {
    itemsHTML += `<li class="${it.type || ""}">${it.text}</li>`;
  });
  const latestCls = isLatest ? " latest" : "";
  return `
    <div class="patch-entry">
      <div class="patch-entry-head">
        <span class="patch-version${latestCls}">${patch.id}</span>
        <span class="patch-date">${patch.date}</span>
        <span class="patch-entry-title">${patch.title}</span>
      </div>
      <ul class="patch-list">
        ${itemsHTML}
      </ul>
    </div>
  `;
}

function openPatchNotes(force = false) {
  const body = document.getElementById("patchBody");
  const overlay = document.getElementById("patchOverlay");
  const badge = document.getElementById("patchNewCount");

  const lastSeen = getLastSeenPatch();
  let firstNewIndex = PATCHES.findIndex(p => p.id === lastSeen);
  if (firstNewIndex === -1) firstNewIndex = PATCHES.length;
  const newCount = firstNewIndex;

  let html = "";
  PATCHES.forEach((p, idx) => {
    html += buildPatchHTML(p, idx < firstNewIndex);
  });

  body.innerHTML = html;
  if (newCount > 0) {
    badge.style.display = "inline-block";
    badge.textContent = newCount === 1
      ? "🎉 1 atualização nova!"
      : `🎉 ${newCount} atualizações novas!`;
  } else {
    badge.style.display = "none";
  }

  overlay.classList.add("open");
  setTimeout(() => {
    body.scrollTop = 0;
  }, 60);
}

function closePatchNotes(markSeen = true) {
  const overlay = document.getElementById("patchOverlay");
  overlay.classList.remove("open");
  if (markSeen) {
    markPatchesSeen();
  }
}

function updateNewsBadge() {
  const dot = document.getElementById("newsDot");
  const count = countNewPatches();
  if (!dot) return;
  if (count > 0) {
    dot.style.display = "inline-block";
  } else {
    dot.style.display = "none";
  }
}

/* ====== Navegação ====== */
function openPage(page) {
    window.location.href = page;
}

/* ====== Init: Auto-open se tiver patch novo ====== */
(function initPatch() {
  updateNewsBadge();
  const novos = countNewPatches();
  if (novos > 0) {
    setTimeout(() => openPatchNotes(false), 650);
  }
})();

/* Clicar fora do modal fecha (mas não marca como lido) */
document.getElementById("patchOverlay").addEventListener("click", function(e){
  if (e.target === this) closePatchNotes(false);
});
</script>

</body>
</html>
