<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Nosso Jardim 🌙</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet"><style>
:root{--bg:#10142a;--pn:#fff3dc;--ink:#2b1f3a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10142a}}
:root[data-theme="dark"]{--bg:#10142a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);font:400 17px 'VT323',system-ui,sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated}
.b{background:var(--pn);border:3px solid var(--ink);border-radius:8px;box-shadow:0 3px 0 var(--ink)}
#hud{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:8px;padding:4px 9px;line-height:1.5;pointer-events:none}
#tb{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:8px;display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;max-width:60vw}
button{font:inherit;color:var(--ink);background:#efe3ff;border:3px solid var(--ink);border-radius:7px;box-shadow:0 3px 0 var(--ink);padding:5px 9px;cursor:pointer}
button:active{transform:translateY(2px)}
button.on{background:#ffd166}
#hb{position:fixed;bottom:calc(8px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:flex;gap:4px;padding:4px;max-width:96vw;overflow-x:auto;scrollbar-width:none}
#hb::-webkit-scrollbar{display:none}
.sl{width:46px;height:46px;font-size:20px;position:relative;display:flex;align-items:center;justify-content:center;border:3px solid var(--ink);border-radius:6px;background:#fff;cursor:pointer;flex:0 0 auto}
.sl.on{background:#ffd166;transform:translateY(-4px)}.sl small{position:absolute;right:2px;bottom:-1px;font-size:10px}
#js{position:fixed;left:14px;bottom:calc(96px + env(safe-area-inset-bottom,0px));width:110px;height:110px;border-radius:50%;background:#ffffff2e;border:3px solid #ffffff66;display:none;z-index:4;touch-action:none}
#kn{position:absolute;left:32px;top:32px;width:46px;height:46px;border-radius:50%;background:#ffffffe0;border:3px solid var(--ink);box-shadow:0 3px 0 #0003;pointer-events:none}
#ab{position:fixed;right:16px;bottom:calc(150px + env(safe-area-inset-bottom,0px));width:72px;height:72px;border-radius:50%;font-size:24px;display:none;background:#8a4fd6;color:#fff;z-index:4;box-shadow:0 4px 0 #4a2a7a}
#zoom{position:fixed;right:10px;bottom:calc(76px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px}
#zoom button{width:42px;height:42px;font-size:20px;padding:0;background:#fff3dc}
#movehint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));padding:6px 10px;pointer-events:none;font-size:11px;white-space:nowrap}
@media (pointer:coarse){#js{display:block}#ab{display:block}}
#dg{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom,0px));width:min(560px,94vw);padding:10px 14px;display:none;z-index:5}
#dg p{margin:4px 0 6px}#dg i{float:right}#dg button{margin-right:6px}
#pn{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#0008;padding:12px;z-index:9}
#pn>div{width:min(460px,100%);max-height:88vh;overflow:auto;padding:14px;touch-action:pan-y}
.r{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:6px 0}
.sw{width:30px;height:30px;padding:0;border-radius:50%}.sw.on{outline:3px solid #ffd166;outline-offset:1px}.op.on{background:#ffd166}
#ts{position:fixed;top:calc(60px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);padding:6px 12px;opacity:0;transition:.25s;pointer-events:none;text-align:center;z-index:6;max-width:92vw}
input{font:inherit;padding:6px;border:3px solid var(--ink);border-radius:6px;width:100%;user-select:text;-webkit-user-select:text}
#pv{width:100%;image-rendering:pixelated;background:#7fb96a;border-radius:6px}
.bar{display:block;height:8px;background:#3a2a5a;border-radius:5px;overflow:hidden;margin-top:4px;width:150px;max-width:46vw}
.bar i{display:block;height:100%;background:#7ee081}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:4px 0}
.mb{width:100%;text-align:left;font-size:15px}
h3{margin:12px 0 6px;font-family:'Press Start 2P',monospace;font-size:11px;line-height:1.5;color:#4a2f6a}
</style></head><body>
<canvas id="c"></canvas><div id="hud" class="b"></div><div id="tb"><button data-a="menu" title="Menu">☰</button><button data-a="inv">🎒</button><button data-a="qs">📜</button><button data-a="cl">👗</button><button data-a="pet">🐾</button><button data-a="prog">📈</button><button id="bbtn" data-a="bd">🔨</button><button data-a="music">🎵</button><button data-a="snd">🔊</button></div><div id="ts" class="b"></div><div id="dg" class="b"></div><div id="hb" class="b"></div><div id="js"><div id="kn"></div></div><button id="ab">A</button><div id="zoom"><button id="zin" aria-label="Aproximar">＋</button><button id="zout" aria-label="Afastar">－</button></div><div id="movehint" class="b">Toque/clique no chão para andar · toque num objeto para interagir</div><div id="pn"><div class="b"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.4/howler.min.js"></script>
<script src="js/util.js"></script>
<script src="js/data.js"></script>
<script src="js/sprites.js"></script>
<script src="js/character.js"></script>
<script src="js/world.js"></script>
<script src="js/state.js"></script>
<script src="js/econ.js"></script>
<script src="js/farm.js"></script>
<script src="js/animals.js"></script>
<script src="js/fishing.js"></script>
<script src="js/mine.js"></script>
<script src="js/prog.js"></script>
<script src="js/npc.js"></script>
<script src="js/ui.js"></script>
<script src="js/game.js"></script>
</body></html>
