const criaQ=(nome,emoji,tema)=>({nome:nome||'Meu quartinho',emoji:emoji||'🏠',tema:tema||0,w:QINI,d:QINI,wall:WALLS[0],strp:1,floor:'madeira',night:false,placed:[],owned:{},m:{}});
const LIMPA=q=>{q=q||{};q.placed=(q.placed||[]).filter(p=>p&&IT[p.i]);q.owned=q.owned||{};q.m=q.m||{};

function livre(ix,x,y,w,d,rug){if(x<0||y<0||x+w>S.w||y+d>S.d)return false;
  return!S.placed.some((q,j)=>{const t=IT[q.i];if(j===ix||t.wall||!!t.rug!==rug)return false;const[a,b]=dims(q);return x<q.x+a&&q.x<x+w&&y<q.y+b&&q.y<y+d})}
function vaga(it){let best=null,bd=1e9;for(let y=0;y<=S.d-it.d;y++)for(let x=0;x<=S.w-it.w;x++)if(livre(-1,x,y,it.w,it.d,!!it.rug)){const k=Math.abs(x+it.w/2-S.w/2)+Math.abs(y+it.d/2-S.d/2);if(k<bd){bd=k;best=[x,y]}}return best}
function fixW(p){const t=IT[p.i];p.u=Math.min(wallMax(p)-t.w,Math.max(0,Math.round(p.u*2)/2));p.v=Math.min(WH-t.h-8,Math.max(8,Math.round(p.v/4)*4))}

function wallG(it,p,extra){const s=p.wall==='L'?-32:32;return'<g data-ix="'+extra+'"><g transform="matrix('+s+',16,0,-1,0,0)"><g transform="translate('+p.u+','+p.v+')">'+it.f(S.night,p.on!==0)+'</g></g></g>'}
function bg(){
  const LW=S.w*32,LH=S.w*16,LD=S.d*32,DH=S.d*16,f=FLR[S.floor]||FLR.madeira;let h='';
  h+=pl([[0,0],[LW,LH],[LW,LH-WH],[0,-WH]],S.wall)+pl([[0,0],[-LD,DH],[-LD,DH-WH],[0,-WH]],sh(S.wall,.88));
  if(S.strp){for(let k=0;k<S.w;k++)h+='<g transform="matrix(32,16,0,-1,0,0)"><rect x="'+(k+.5)+'" width=".5" height="'+WH+'" fill="rgba(255,255,255,.4)"/></g>';
    for(let k=0;k<S.d;k++)h+='<g transform="matrix(-32,16,0,-1,0,0)"><rect x="'+(k+.5)+'" width=".5" height="'+WH+'" fill="rgba(255,255,255,.4)"/></g>'}
  h+='<g transform="matrix(32,16,0,-1,0,0)"><rect width="'+S.w+'" height="7" fill="rgba(0,0,0,.14)"/></g><g transform="matrix(-32,16,0,-1,0,0)"><rect width="'+S.d+'" height="7" fill="rgba(0,0,0,.2)"/></g>';
  for(let x=0;x<S.w;x++)for(let y=0;y<S.d;y++){const k=S.floor==='xadrez'||S.floor==='grama'?x+y:x;h+=pl([P(x,y,0),P(x+1,y,0),P(x+1,y+1,0),P(x,y+1,0)],k%2?f[1]:f[2])}
  return h}
function render(){
  const SW=S.w,SD=S.d,LW=SW*32,LH=SW*16,LD=SD*32,DH=SD*16;
  svg.setAttribute('viewBox',[-LD-14,-WH-14,(SW+SD)*32+28,(SW+SD)*16+WH+28].join(' '));
  let h='<defs><radialGradient id="gl"><stop offset="0" stop-color="#ffe6a0" stop-opacity=".9"/><stop offset="1" stop-color="#ffe6a0" stop-opacity="0"/></radialGradient></defs>'+bg();
  const fl=[],wl=[];S.placed.forEach((p,i)=>(IT[p.i].wall?wl:fl).push(i));
  const rugs=fl.filter(i=>IT[S.placed[i].i].rug),oth=fl.filter(i=>!IT[S.placed[i].i].rug);
  const key=i=>{const p=S.placed[i],[w,d]=dims(p);return[p.x+w+p.y+d,p.x]};
  oth.sort((a,b)=>{const A=key(a),B=key(b);return A[0]-B[0]||A[1]-B[1]});
  const sp=i=>{const p=S.placed[i],it=IT[p.i],[w,d]=dims(p),on=p.on!==0;
    return'<g data-ix="'+i+'"'+(it.pet?' class="idle"':'')+'>'+spr(it,p.x,p.y,p.r,p.ci,on)+'</g>'};
  const foot=i=>{const p=S.placed[i],[w,d]=dims(p);return'<polygon points="'+[P(p.x,p.y,0),P(p.x+w,p.y,0),P(p.x+w,p.y+d,0),P(p.x,p.y+d,0)].map(q=>q.join(',')).join(' ')+'" fill="rgba(255,255,255,.3)" stroke="#6b2d5c" stroke-width="1.6" stroke-dasharray="5 3" pointer-events="none"/>'};
  rugs.forEach(i=>h+=sp(i));
  if(sel>=0&&S.placed[sel]&&!IT[S.placed[sel].i].wall)h+=foot(sel);
  wl.forEach(i=>{const p=S.placed[i],it=IT[p.i];h+=wallG(it,p,i);
    if(i===sel){const s=p.wall==='L'?-32:32,c=[[0,0],[it.w,0],[it.w,it.h],[0,it.h]].map(q=>[s*(p.u+q[0]),16*(p.u+q[0])-(p.v+q[1])].join(','));h+='<polygon points="'+c.join(' ')+'" fill="none" stroke="#6b2d5c" stroke-width="1.6" stroke-dasharray="5 3" pointer-events="none"/>'}});
  oth.forEach(i=>h+=sp(i));
  if(S.night){const far=P(SW,SD,0);h+='<polygon pointer-events="none" points="0,'+-WH+' '+LW+','+(LH-WH)+' '+LW+','+LH+' '+far[0]+','+far[1]+' '+(-LD)+','+DH+' '+(-LD)+','+(DH-WH)+'" fill="#1a1040" opacity=".5"/>';
    S.placed.forEach(p=>{const it=IT[p.i];if(!it.luz||p.on===0)return;let c;
      if(it.wall){const s=p.wall==='L'?-32:32,u=p.u+it.w/2;c=[s*u,16*u-(p.v+it.h/2)]}else{const[w,d]=dims(p);c=P(p.x+w/2,p.y+d/2,it.gh||30)}

  if(tab==='est')return estilo();
  $('sh').innerHTML='<div class="g">'+LST.filter(i=>i.c===tab).sort((a,b)=>a.p-b.p).map(i=>{const q=S.owned[i.id]||0,no=i.p>0&&!q&&coins<i.p;
    return'<button class="ic'+(no?' no':'')+'" data-id="'+i.id+'">'+(q?'<i>x'+q+'</i>':'')+thumb(i)+'<span class="nn">'+i.n+'</span><span class="pp">'+(i.p?'💗 '+i.p:'grátis')+'</span></button>'}).join('')+'</div>'}
function estilo(){
  const bWm='<button class="cb" data-wm="1" aria-label="Diminuir largura"'+(S.w<=QMIN?' disabled':'')+'>➖</button>';
  const bWp='<button class="cb" data-wp="1" aria-label="Aumentar largura"'+(S.w>=QMAX?' disabled':'')+'>➕</button>';
  const bDm='<button class="cb" data-dm="1" aria-label="Diminuir comprimento"'+(S.d<=QMIN?' disabled':'')+'>➖</button>';
  const bDp='<button class="cb" data-dp="1" aria-label="Aumentar comprimento"'+(S.d>=QMAX?' disabled':'')+'>➕</button>';
  $('sh').innerHTML='<div class="grp"><h4>'+S.emoji+' '+escn(S.nome)+'</h4><div class="op"><button class="cb" data-q="1">🏠 Trocar / criar quarto</button><button class="cb" data-r="1">✏️ Renomear</button></div></div>'
  +'<div class="grp"><h4>🎨 Parede</h4><div class="op">'+WALLS.map(c=>'<button class="cor'+(c===S.wall?' on':'')+'" data-w="'+c+'" style="background:'+c+'" aria-label="Cor da parede"></button>').join('')+'<button class="cb'+(S.strp?' on':'')+'" data-s="1">Listras</button></div></div>'
  +'<div class="grp"><h4>🪵 Chão</h4><div class="op">'+Object.keys(FLR).map(k=>'<button class="cb'+(k===S.floor?' on':'')+'" data-f="'+k+'">'+FLR[k][0]+'</button>').join('')+'</div></div>'
  +'<div class="grp"><h4>📐 Forma do quarto</h4>'
  +'<div style="display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap">'
  +'<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><span class="dc">↔️ Largura</span><div style="display:flex;gap:8px">'+bWm+bWp+'</div></div>'
  +'<div style="display:flex;align-items:center;justify-content:center;min-width:96px">'+mini(S.w,S.d,84)+'</div>'
  +'<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><span class="dc">↕️ Comprimento</span><div style="display:flex;gap:8px">'+bDm+bDp+'</div></div>'
  +'</div><p class="dc" style="margin:8px 0 0">Deixe o quarto do jeitinho que você quiser 🥰 É de graça!</p></div>'
  +'<div class="grp"><h4>🧹 Arrumar</h4><div class="op"><button class="cb" data-x="1">Guardar todos os itens</button></div></div>'}

/* ---------- quartos ---------- */
let qE='🛏️',qRen=-1;
const escn=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const EMOJIS=['🛏️','🛋️','🍳','🛁','📚','🎮','🎨','🎵','🌿','🧸','🌙','☀️','🏡','🐰','✨','🌸','🧁','🪴'];
const TEMAS=[[0,'madeira'],[1,'carpete'],[2,'ladrilho'],[3,'escura'],[4,'grama'],[5,'xadrez'],[6,'madeira'],[7,'carpete']];
function abrirQuarto(i){if(!BANK.rooms[i])return;BANK.cur=i;S=BANK.rooms[i];sel=-1;save();render();shelf();an=pronta();fecha();toast(S.emoji+' '+S.nome)}
function quartos(){
  const linhas=BANK.rooms.map((q,i)=>{
    if(qRen===i)return'<div class="ms"><input id="qR" maxlength="18" value="'+escn(q.nome)+'" style="flex:1;min-width:0;min-height:44px;border:2px solid var(--bd);border-radius:12px;padding:8px 10px;font:800 .86rem Nunito;color:var(--pl)"><button class="go" data-rk="'+i+'">OK</button></div>';
    return'<div class="ms'+(i===BANK.cur?' ok':'')+'"><span style="min-width:0;display:flex;align-items:center;gap:8px">'+mini(q.w,q.d,30)+'<span>'+q.emoji+' '+escn(q.nome)+'<br><span class="dc">'+q.placed.length+' itens · '+estrelas(q)+'⭐</span></span></span>'
      +'<span style="display:flex;gap:6px;flex:0 0 auto">'
      +'<button class="go" data-ab="'+i+'">'+(i===BANK.cur?'Aberto':'Abrir')+'</button>'
      +'<button class="go" data-rn="'+i+'" style="background:#8a6d76">✏️</button>'
      +(BANK.rooms.length>1?'<button class="go" data-dl="'+i+'" style="background:#c23b5e">🗑️</button>':'')
      +'</span></div>'}).join('');
  modal('<h3>Nossos quartos</h3><p class="dc">Toque em <b>Abrir</b> para decorar. Você pode ter quantos quartos quiser e voltar em cada um quando quiser!</p>'+linhas
   +'<div class="grp" style="margin-top:12px"><h4>➕ Criar novo quarto</h4>'
   +'<div class="op" style="margin-bottom:8px">'+EMOJIS.map(e=>'<button class="cb'+(qE===e?' on':'')+'" data-qe="'+e+'">'+e+'</button>').join('')+'</div>'
   +'<input id="qN" maxlength="18" placeholder="Nome do quarto" value="Quarto '+(BANK.rooms.length+1)+'" style="width:100%;min-height:46px;border:2px solid var(--bd);border-radius:14px;padding:10px 12px;font:800 .9rem Nunito;color:var(--pl);background:#fff">'
   +'<div class="op" style="margin-top:8px"><button class="cb on" data-nq="1">✨ Criar quarto</button><button class="b" data-fecha="1">Fechar</button></div></div>')}

/* ---------- ações ---------- */
let an=0;function after(){save();render();const n=pronta();if(n>an)toast('🎯 Missão cumprida! Toque no 🎯 para pegar o prêmio.');an=n}
function poe(id){
  const it=IT[id];
  if(it.p>0){if((S.owned[id]||0)>0)S.owned[id]--;else if(coins>=it.p){setCoins(coins-it.p);sBuy();toast('💗 '+it.n+' é seu!')}else{sNo();toast('Faltam corações 💗. Jogue um pouco e volte!');return}}
  let p;
  if(it.wall){p={i:id,wall:'R',u:.5,v:70};fixW(p);let t=0;while(S.placed.some(q=>IT[q.i].wall&&q.wall===p.wall&&Math.abs(q.u-p.u)<it.w&&Math.abs(q.v-p.v)<it.h)&&t++<40){p.u+=.5;if(p.u>wallMax(p)-it.w){p.u=.5;p.wall=p.wall==='R'?'L':'R';p.v=p.v>=100?60:p.v+20}fixW(p)}}
  else{const v=vaga(it);if(!v){if(it.p>0)S.owned[id]=(S.owned[id]||0)+1;sNo();toast('Não cabe mais nada. Que tal ampliar o quarto?');shelf();return}p={i:id,x:v[0],y:v[1],ci:it.def||0}}
  S.placed.push(p);sel=S.placed.length-1;sOk();after();shelf()}
function guarda(){const p=S.placed[sel];if(!p)return;if(IT[p.i].p>0)S.owned[p.i]=(S.owned[p.i]||0)+1;S.placed.splice(sel,1);sel=-1;sOk();after();shelf()}
function mexe(){const p=S.placed[sel];if(!p)return;const it=IT[p.i];
  if(it.luz||it.tv){p.on=p.on===0?1:0;beep(p.on===0?600:1200,.1,'sine')}else beep(it.sound||800,.12,'sine',.06);
  save();render();const g=svg.querySelector('[data-ix="'+sel+'"]');if(g&&(it.pet||it.sound)){g.classList.add('hop');setTimeout(()=>g.classList.remove('hop'),520)}
  const n=pronta();if(n>an)toast('🎯 Missão cumprida!');an=n}
$('bar').addEventListener('click',e=>{const a=e.target.closest('[data-a]');if(!a)return;const k=a.dataset.a,p=S.placed[sel];
  if(k==='x')return guarda();if(k==='ok'){sel=-1;return render()}if(!p)return;
  if(k==='i')return mexe();
  if(k==='c')p.ci=((p.ci||0)+1)%PAL.length;
  if(k==='r'){p.r=!p.r;const[w,d]=dims(p);if(!livre(sel,p.x,p.y,w,d,!!IT[p.i].rug)){const x=Math.max(0,Math.min(p.x,S.w-w)),y=Math.max(0,Math.min(p.y,S.d-d));if(livre(sel,x,y,w,d,!!IT[p.i].rug)){p.x=x;p.y=y}else{p.r=!p.r;sNo();return}}}
  sOk();save();render()});

/* arrastar e soltar */
function pt(e){const q=svg.createSVGPoint();q.x=e.clientX;q.y=e.clientY;const r=q.matrixTransform(svg.getScreenCTM().inverse());return[r.x,r.y]}
const g2=(x,y)=>[(y/16+x/32)/2,(y/16-x/32)/2];
svg.addEventListener('pointerdown',e=>{
  const g=e.target.closest('[data-ix]');if(!g){sel=-1;render();return}
  const ix=+g.dataset.ix,p=S.placed[ix],it=IT[p.i],c=pt(e);sel=ix;
  if(it.wall){const u=Math.abs(c[0])/32;dr={ix,a:p.u-u,b:p.v-(u*16-c[1])}}else{const q=g2(c[0],c[1]);dr={ix,a:p.x-q[0],b:p.y-q[1]}}
  dr.m=0;try{svg.setPointerCapture(e.pointerId)}catch(_){}render()});
svg.addEventListener('pointermove',e=>{
  if(!dr)return;const p=S.placed[dr.ix],it=IT[p.i],c=pt(e);
  if(it.wall){const u=Math.abs(c[0])/32;p.wall=c[0]<0?'L':'R';p.u=u+dr.a;p.v=u*16-c[1]+dr.b;fixW(p)}
  else{const q=g2(c[0],c[1]),nx=Math.round(q[0]+dr.a),ny=Math.round(q[1]+dr.b),[w,d]=dims(p);
    if((nx!==p.x||ny!==p.y)&&livre(dr.ix,nx,ny,w,d,!!it.rug)){p.x=nx;p.y=ny}else return}
  dr.m=1;render()});
const solta=()=>{if(dr&&dr.m){sOk();save()}dr=null};
svg.addEventListener('pointerup',solta);svg.addEventListener('pointercancel',solta);

/* abas, prateleira e estilo */
$('tabs').addEventListener('click',e=>{const b=e.target.closest('.tab');if(b){tab=b.dataset.c;shelf()}});
$('sh').addEventListener('click',e=>{const t=e.target,q=s=>t.closest(s);
  if(q('[data-id]'))return poe(q('[data-id]').dataset.id);
  if(q('[data-q]')){qRen=-1;return quartos()}
  if(q('[data-r]')){qRen=BANK.cur;return quartos()}
  if(q('[data-w]')){S.wall=q('[data-w]').dataset.w;save();render();return estilo()}
  if(q('[data-s]')){S.strp=S.strp?0:1;save();render();return estilo()}
  if(q('[data-f]')){S.floor=q('[data-f]').dataset.f;save();render();return estilo()}
  const rs=(dw,dd)=>{const w=Math.min(QMAX,Math.max(QMIN,S.w+dw)),d=Math.min(QMAX,Math.max(QMIN,S.d+dd));if(w===S.w&&d===S.d)return sNo();S.w=w;S.d=d;caber();sOk();save();render();return estilo()};
  if(q('[data-wm]'))return rs(-1,0);if(q('[data-wp]'))return rs(1,0);if(q('[data-dm]'))return rs(0,-1);if(q('[data-dp]'))return rs(0,1);
  if(q('[data-x]')){if(!S.placed.length)return toast('O quarto já está vazio.');S.placed.forEach(p=>{if(IT[p.i].p>0)S.owned[p.i]=(S.owned[p.i]||0)+1});S.placed=[];sel=-1;save();render();toast('Quarto arrumadinho ✨ Tudo foi pro seu baú.')}});

/* missões */
function modal(h){$('modal').innerHTML='<div class="cx">'+h+'</div>';$('modal').classList.add('a')}
function fecha(){$('modal').classList.remove('a');$('modal').innerHTML=''}
function missoes(){const s=stars();
  modal('<h3>Nosso cantinho</h3><div class="st">'+'⭐'.repeat(s)+'☆'.repeat(5-s)+'</div><p class="dc">As estrelas crescem com a quantidade de itens e a variedade de categorias. Quartos maiores pedem mais decoração.</p>'
  +MS.map((m,i)=>{const ok=!!BANK.m[i],can=!ok&&m[2]();return'<div class="ms'+(ok?' ok':'')+'"><span>'+(ok?'✅ ':'')+m[0]+'</span><button class="go" data-m="'+i+'"'+(can?'':' disabled')+'>'+(ok?'Pego':'💗 '+m[1])+'</button></div>'}).join('')
  +'<div style="text-align:center;margin-top:12px"><button class="b" data-fecha="1">Fechar</button></div>')}
$('modal').addEventListener('click',e=>{
  if(e.target===$('modal')||e.target.closest('[data-fecha]'))return fecha();
  const q=s=>e.target.closest(s);
  if(q('[data-qe]')){qE=q('[data-qe]').dataset.qe;return quartos()}
  if(q('[data-nq]')){const el=$('qN');const n=(el&&el.value.trim())||('Quarto '+(BANK.rooms.length+1));const i=BANK.rooms.length,t=TEMAS[i%TEMAS.length];const nq=criaQ(n,qE,i);nq.wall=WALLS[t[0]];nq.floor=t[1];BANK.rooms.push(nq);save();sBuy();return abrirQuarto(i)}
  if(q('[data-ab]'))return abrirQuarto(+q('[data-ab]').dataset.ab);
  if(q('[data-rn]')){qRen=+q('[data-rn]').dataset.rn;return quartos()}
  if(q('[data-rk]')){const i=+q('[data-rk]').dataset.rk,el=$('qR'),v=el&&el.value.trim();if(v)BANK.rooms[i].nome=v;qRen=-1;save();render();return quartos()}
  if(q('[data-dl]')){const i=+q('[data-dl]').dataset.dl;if(BANK.rooms.length<2)return;if(!confirm('Apagar o quarto "'+BANK.rooms[i].nome+'"? Os itens comprados voltam pro baú.'))return;const velho=BANK.rooms[i];velho.placed.forEach(p=>{if(IT[p.i].p>0)BANK.rooms[0].owned[p.i]=(BANK.rooms[0].owned[p.i]||0)+1});BANK.rooms.splice(i,1);if(BANK.cur>=BANK.rooms.length)BANK.cur=BANK.rooms.length-1;S=BANK.rooms[BANK.cur];sel=-1;save();render();shelf();an=pronta();qRen=-1;return quartos()}
  const g=q('[data-m]');if(!g)return;const i=+g.dataset.m,m=MS[i];
  if(!m||BANK.m[i]||!m[2]())return;BANK.m[i]=1;setCoins(coins+m[1]);save();sBuy();toast('💗 +'+m[1]+' corações!');an=pronta();render();shelf();missoes()});
$('bm').addEventListener('click',missoes);
$('br').addEventListener('click',()=>{qRen=-1;quartos()});

/* foto */
function foto(){sel=-1;render();
  const s=svg.cloneNode(true),vb=svg.viewBox.baseVal,W=Math.round(vb.width*3),H=Math.round(vb.height*3);
  s.setAttribute('width',W);s.setAttribute('height',H);s.removeAttribute('id');
  const img=new Image();
  img.onload=()=>{const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');g.fillStyle=S.night?'#241a44':'#fff3fa';g.fillRect(0,0,W,H);g.drawImage(img,0,0,W,H);
    c.toBlob(b=>{if(!b)return toast('Não consegui gerar a foto.');const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='nosso-quartinho.png';document.body.appendChild(a);a.click();a.remove();BANK.photo=true;save();after();toast('📷 Foto salva!')})};
  img.onerror=()=>toast('Não consegui gerar a foto.');
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(new XMLSerializer().serializeToString(s))}
$('bf').addEventListener('click',foto);
$('bn').addEventListener('click',()=>{S.night=!S.night;after();if(tab==='est')estilo()});
$('bs').addEventListener('click',()=>{mudo=!mudo;$('bs').textContent=mudo?'🔇':'🔊'});

/* mimo diário */
const hoje=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
function mimo(){let g;try{g=localStorage.getItem(KG)}catch(e){}$('bg').style.display=g===hoje()?'none':''}
$('bg').addEventListener('click',()=>{setCoins(coins+25);try{localStorage.setItem(KG,hoje())}catch(e){}sBuy();toast('💝 Mimo do dia! +25 corações');mimo();shelf()});

setCoins(coins);render();shelf();mimo();an=pronta();
setTimeout(()=>toast('Arraste os móveis para mover. Toque num item para mexer nele.'),600);
</script>
</body>
</html>
