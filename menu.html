<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cantinho da Gente 💖</title>

<!-- Fonte Opção B -->
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.js">
<style>
    body {
        margin: 0;
        background: linear-gradient(135deg, #ff0055, #4a00e0);
        font-family: "Nunito", sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        color: #fff;
        overflow: hidden;
        position: relative;
        animation: fadeIn 1s ease-in-out;
    }

    /* Chuva de corações no fundo */
    body::before {
        content: "❤️";
        position: absolute;
        font-size: 2rem;
        opacity: 0.15;
        animation: floatHearts 6s infinite linear;
        left: 10%;
        top: -10%;
    }
    body::after {
        content: "💜";
        position: absolute;
        font-size: 1.5rem;
        opacity: 0.15;
        animation: floatHearts 8s infinite linear;
        right: 15%;
        top: -10%;
        animation-delay: 2s;
    }

    @keyframes floatHearts {
        0% { transform: translateY(-10%) rotate(0deg); opacity: 0; }
        10% { opacity: 0.15; }
        90% { opacity: 0.15; }
        100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
    }

    .container {
        text-align: center;
        z-index: 10;
    }

    h1 {
        font-weight: 800;
        font-size: 2.6rem;
        margin-bottom: 35px;
        text-shadow: 0 0 12px rgba(255,255,255,0.6);
        letter-spacing: 1px;
    }

    .cards {
        display: flex;
        gap: 25px;
        justify-content: center;
        flex-wrap: wrap;
        max-width: 600px;
    }

    .card {
        width: 140px;
        height: 140px;
        background: rgba(255,255,255,0.12);
        backdrop-filter: blur(12px);
        border-radius: 22px;
        border: 2px solid rgba(255,255,255,0.25);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        font-weight: 700;
        cursor: pointer;
        transition: 0.3s ease;
        text-shadow: 0 0 10px rgba(255,255,255,0.3);
    }

    .card:hover {
        transform: scale(1.12);
        background: rgba(255,255,255,0.22);
        box-shadow: 0 8px 25px rgba(0,0,0,0.25);
    }

    /* Card Especial Pulsando */
    .card-special {
        border-color: #ffeb3b;
        animation: pulse 2s infinite alternate;
    }
    @keyframes pulse {
        from { box-shadow: 0 0 10px rgba(255, 235, 59, 0.3); }
        to { box-shadow: 0 0 25px rgba(255, 235, 59, 0.7); transform: scale(1.02); }
    }

    .icon {
        font-size: 2.6rem;
        margin-bottom: 8px;
    }

    @keyframes fadeIn {
        0% { opacity: 0; transform: translateY(20px); }
        100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes popIn { from { opacity: 0; transform: scale(0.6); } }
</style>
</head>

<body>

<div class="container">
    <h1>� Nosso Cantinho 💜</h1>

    <div class="cards">
        <div class="card" onclick="openPage('memorias.html')">
            <div class="icon">📸</div>
            <span>Memórias</span>
        </div>

        <div class="card" onclick="openPage('cartinhas.html')">
            <div class="icon">💌</div>
            <span>Cartinhas</span>
        </div>

        <div class="card" onclick="openPage('trilha.html')">
            <div class="icon">🎧</div>
            <span>Músicas</span>
        </div>

        <div class="card" onclick="openPage('quiz/quiz.html')">
            <div class="icon">💎</div>
            <span>Quiz</span>
        </div>

   
    </div>
</div>

<script>
function openPage(page) {
    window.location.href = page;
}
</script>

</body>
</html>
