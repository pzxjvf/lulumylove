<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ranking do Casal 💜</title>

<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<style>
    body {
        margin: 0;
        background: linear-gradient(135deg, #ff0055, #4a00e0);
        font-family: "Nunito", sans-serif;
        min-height: 100vh;
        color: #fff;
        padding: 30px 20px;
        position: relative;
        overflow-x: hidden;
    }

    body::before {
        content: "❤️";
        position: fixed;
        font-size: 2rem;
        opacity: 0.12;
        animation: floatHearts 7s infinite linear;
        left: 10%;
        top: -10%;
        z-index: 0;
    }
    body::after {
        content: "💜";
        position: fixed;
        font-size: 1.5rem;
        opacity: 0.12;
        animation: floatHearts 9s infinite linear;
        right: 15%;
        top: -10%;
        animation-delay: 3s;
        z-index: 0;
    }

    @keyframes floatHearts {
        0% { transform: translateY(-10%) rotate(0deg); opacity: 0; }
        10% { opacity: 0.12; }
        90% { opacity: 0.12; }
        100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
    }

    .container {
        max-width: 900px;
        margin: 0 auto;
        position: relative;
        z-index: 10;
    }

    .back-link {
        display: inline-block;
        color: white;
        text-decoration: none;
        background: rgba(255,255,255,0.15);
        backdrop-filter: blur(10px);
        padding: 10px 22px;
        border-radius: 30px;
        font-weight: 700;
        font-size: 0.95rem;
        transition: all 0.3s;
        border: 1px solid rgba(255,255,255,0.2);
        margin-bottom: 25px;
    }
    .back-link:hover {
        transform: translateY(-2px) scale(1.03);
        background: rgba(255,255,255,0.25);
    }

    h1 {
        font-weight: 900;
        font-size: 2.6rem;
        text-align: center;
        margin-bottom: 10px;
        text-shadow: 0 4px 15px rgba(0,0,0,0.3);
        letter-spacing: 1px;
    }

    .subtitle {
        text-align: center;
        font-size: 1.1rem;
        opacity: 0.9;
        font-weight: 600;
        margin-bottom: 35px;
    }

    .versus-section {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        gap: 20px;
        align-items: center;
        margin-bottom: 35px;
    }

    .player-card {
        background: rgba(255,255,255,0.12);
        backdrop-filter: blur(15px);
        border-radius: 28px;
        padding: 28px 22px;
        border: 2px solid rgba(255,255,255,0.2);
        text-align: center;
        transition: all 0.3s;
    }

    .player-card.winner {
        border-color: #ffeb3b;
        box-shadow: 0 0 40px rgba(255, 235, 59, 0.35);
        background: rgba(255, 235, 59, 0.1);
        transform: scale(1.02);
    }

    .player-card.tie {
        border-color: #ffeb3b;
        box-shadow: 0 0 30px rgba(255, 235, 59, 0.25);
    }

    .player-avatar-big {
        font-size: 5rem;
        margin-bottom: 10px;
    }

    .player-name-big {
        font-size: 1.8rem;
        font-weight: 900;
        margin-bottom: 5px;
    }

    .player-score-big {
        font-size: 3.5rem;
        font-weight: 900;
        color: #ffeb3b;
        text-shadow: 0 0 20px rgba(255, 235, 59, 0.5);
        line-height: 1;
        margin: 12px 0;
    }

    .player-meta {
        font-size: 0.9rem;
        opacity: 0.85;
        font-weight: 600;
        line-height: 1.6;
    }

    .vs-badge {
        background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        width: 80px;
        height: 80px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.8rem;
        font-weight: 900;
        box-shadow: 0 8px 25px rgba(245, 87, 108, 0.5);
        animation: pulseVS 2s infinite;
    }

    @keyframes pulseVS {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.08); }
    }

    .section-title {
        font-size: 1.5rem;
        font-weight: 800;
        margin: 30px 0 18px;
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .achievements-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 15px;
        margin-bottom: 30px;
    }

    .achievement-card {
        background: rgba(255,255,255,0.1);
        backdrop-filter: blur(10px);
        border-radius: 20px;
        padding: 18px;
        border: 2px solid rgba(255,255,255,0.15);
        display: flex;
        gap: 14px;
        align-items: center;
        transition: all 0.3s;
    }

    .achievement-card.locked {
        opacity: 0.45;
        filter: grayscale(0.8);
    }

    .achievement-card.unlocked {
        border-color: rgba(255, 235, 59, 0.5);
        background: rgba(255, 235, 59, 0.08);
    }

    .achievement-icon-big {
        font-size: 2.8rem;
        flex-shrink: 0;
    }

    .achievement-info {
        flex: 1;
    }

    .achievement-title {
        font-weight: 800;
        font-size: 1rem;
        margin-bottom: 4px;
    }

    .achievement-desc {
        font-size: 0.82rem;
        opacity: 0.85;
        line-height: 1.4;
    }

    .achievement-req {
        font-size: 0.75rem;
        opacity: 0.7;
        margin-top: 6px;
        font-weight: 700;
    }

    .players-achievements {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-bottom: 40px;
    }

    .pa-section {
        background: rgba(255,255,255,0.08);
        border-radius: 22px;
        padding: 22px;
        border: 1px solid rgba(255,255,255,0.15);
    }

    .pa-title {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 1.2rem;
        font-weight: 800;
        margin-bottom: 15px;
    }

    .pa-count {
        background: rgba(255, 235, 59, 0.25);
        color: #ffeb3b;
        padding: 3px 12px;
        border-radius: 15px;
        font-size: 0.85rem;
        font-weight: 900;
    }

    .pa-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .pa-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 14px;
        background: rgba(255,255,255,0.08);
        border-radius: 12px;
        font-size: 0.9rem;
    }

    .pa-item .icon {
        font-size: 1.3rem;
    }

    .pa-empty {
        opacity: 0.6;
        font-style: italic;
        font-size: 0.88rem;
        padding: 15px;
        text-align: center;
    }

    .reset-btn {
        display: block;
        margin: 30px auto 0;
        background: rgba(255,255,255,0.1);
        border: 1px solid rgba(255,255,255,0.2);
        color: white;
        padding: 12px 28px;
        border-radius: 25px;
        font-family: inherit;
        font-weight: 700;
        font-size: 0.9rem;
        cursor: pointer;
        transition: all 0.3s;
    }
    .reset-btn:hover {
        background: rgba(255, 82, 82, 0.3);
        border-color: #ff5252;
        transform: scale(1.03);
    }

    @media (max-width: 600px) {
        .versus-section {
            grid-template-columns: 1fr;
        }
        .vs-badge {
            justify-self: center;
            width: 65px;
            height: 65px;
            font-size: 1.4rem;
        }
        .players-achievements {
            grid-template-columns: 1fr;
        }
        .player-score-big {
            font-size: 2.8rem;
        }
        h1 {
            font-size: 2rem;
        }
    }
</style>
</head>
<body>

<div class="container">
    <a href="menu.html" class="back-link">← Voltar ao Menu</a>

    <h1>🏆 Ranking do Casal</h1>
    <p class="subtitle">Quem está ganhando essa competição saudável? 💜</p>

    <div class="versus-section">
        <div class="player-card" id="luluCard">
            <div class="player-avatar-big">👩‍🦽</div>
            <div class="player-name-big">Lulu</div>
            <div class="player-score-big" id="luluScore">0</div>
            <div class="player-meta" id="luluMeta">
                0 partidas jogadas<br>
                0 conquistas desbloqueadas
            </div>
        </div>

        <div class="vs-badge">VS</div>

        <div class="player-card" id="joaoCard">
            <div class="player-avatar-big">🧑</div>
            <div class="player-name-big">João</div>
            <div class="player-score-big" id="joaoScore">0</div>
            <div class="player-meta" id="joaoMeta">
                0 partidas jogadas<br>
                0 conquistas desbloqueadas
            </div>
        </div>
    </div>

    <div class="section-title">🎖️ Todas as Conquistas</div>
    <div class="achievements-grid" id="allAchievements"></div>

    <div class="section-title">✨ Conquistas por Jogador</div>
    <div class="players-achievements">
        <div class="pa-section">
            <div class="pa-title">
                💜 Lulu
                <span class="pa-count" id="luluAchCount">0</span>
            </div>
            <div class="pa-list" id="luluAchList"></div>
        </div>
        <div class="pa-section">
            <div class="pa-title">
                💙 João
                <span class="pa-count" id="joaoAchCount">0</span>
            </div>
            <div class="pa-list" id="joaoAchList"></div>
        </div>
    </div>

    <button class="reset-btn" onclick="resetAll()">🗑️ Resetar Dados do Jogo</button>
</div>

<script>
    const ACHIEVEMENTS = [
        { id: 'first_steps', points: 50, icon: '🌸', title: 'Primeiros Passos', desc: 'Uma foto especial desbloqueada!' },
        { id: 'half_way', points: 100, icon: '💌', title: 'Cupom do Amor', desc: 'Cupom especial desbloqueado!' },
        { id: 'true_love', points: 200, icon: '💜', title: 'Amor de Verdade', desc: 'Carta secreta desbloqueada!' },
        { id: 'unstoppable', points: 500, icon: '🚀', title: 'Imparável', desc: 'Você é incrível!' },
        { id: 'legendary', points: 1000, icon: '👑', title: 'Lendário', desc: 'É o/a melhor de todos!' }
    ];

    function getPlayerData(player) {
        const data = localStorage.getItem('gameData_' + player);
        return data ? JSON.parse(data) : { highScore: 0, achievements: [], gamesPlayed: 0 };
    }

    function savePlayerData(player, data) {
        localStorage.setItem('gameData_' + player, JSON.stringify(data));
    }

    function render() {
        const luluData = getPlayerData('lulu');
        const joaoData = getPlayerData('joao');

        document.getElementById('luluScore').textContent = luluData.highScore;
        document.getElementById('joaoScore').textContent = joaoData.highScore;

        document.getElementById('luluMeta').innerHTML = `
            ${luluData.gamesPlayed || 0} partidas jogadas<br>
            ${luluData.achievements.length} conquistas desbloqueadas
        `;
        document.getElementById('joaoMeta').innerHTML = `
            ${joaoData.gamesPlayed || 0} partidas jogadas<br>
            ${joaoData.achievements.length} conquistas desbloqueadas
        `;

        const luluCard = document.getElementById('luluCard');
        const joaoCard = document.getElementById('joaoCard');
        luluCard.classList.remove('winner', 'tie');
        joaoCard.classList.remove('winner', 'tie');

        if (luluData.highScore > joaoData.highScore) {
            luluCard.classList.add('winner');
        } else if (joaoData.highScore > luluData.highScore) {
            joaoCard.classList.add('winner');
        } else if (luluData.highScore > 0) {
            luluCard.classList.add('tie');
            joaoCard.classList.add('tie');
        }

        const allAchEl = document.getElementById('allAchievements');
        allAchEl.innerHTML = ACHIEVEMENTS.map(ach => {
            const unlockedLulu = luluData.achievements.includes(ach.id);
            const unlockedJoao = joaoData.achievements.includes(ach.id);
            const unlocked = unlockedLulu || unlockedJoao;
            return `
                <div class="achievement-card ${unlocked ? 'unlocked' : 'locked'}">
                    <div class="achievement-icon-big">${unlocked ? ach.icon : '🔒'}</div>
                    <div class="achievement-info">
                        <div class="achievement-title">${ach.title}</div>
                        <div class="achievement-desc">${ach.desc}</div>
                        <div class="achievement-req">${ach.points} pontos necessários</div>
                        ${unlockedLulu ? '<div style="margin-top:6px;font-size:0.75rem;color:#e1bee7;font-weight:800;">💜 Lulu conquistou</div>' : ''}
                        ${unlockedJoao ? '<div style="margin-top:4px;font-size:0.75rem;color:#bbdefb;font-weight:800;">💙 João conquistou</div>' : ''}
                    </div>
                </div>
            `;
        }).join('');

        function renderPlayerAch(player, listId, countId, data) {
            const list = document.getElementById(listId);
            const count = document.getElementById(countId);
            const achs = data.achievements.map(id => ACHIEVEMENTS.find(a => a.id === id)).filter(Boolean);
            count.textContent = achs.length;
            if (achs.length === 0) {
                list.innerHTML = `<div class="pa-empty">Jogue para desbloquear conquistas! ✨</div>`;
            } else {
                list.innerHTML = achs.map(a => `
                    <div class="pa-item">
                        <span class="icon">${a.icon}</span>
                        <span style="font-weight:700;">${a.title}</span>
                    </div>
                `).join('');
            }
        }

        renderPlayerAch('lulu', 'luluAchList', 'luluAchCount', luluData);
        renderPlayerAch('joao', 'joaoAchList', 'joaoAchCount', joaoData);
    }

    function resetAll() {
        if (confirm('Tem certeza que quer apagar TODOS os recordes e conquistas?')) {
            localStorage.removeItem('gameData_lulu');
            localStorage.removeItem('gameData_joao');
            localStorage.removeItem('luluHighScore');
            render();
            alert('Dados resetados! 💜');
        }
    }

    render();
</script>

</body>
</html>
